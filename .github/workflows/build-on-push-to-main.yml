name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # semantic version tags, e.g. v1.2.3
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  DOTNET_VERSION: '10.0.x'
  PROJECT: 'AdHocAgent.csproj'
  NAME: 'AdHocAgent'

jobs:
  build:
    name: Publish ${{ matrix.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Framework-dependent apphosts cross-publish fine, so every target is built on one
        # cheap runner instead of a 3-OS matrix. (AdHocAgent hosts Roslyn → no trim/AOT; its
        # users are .NET devs who already have the runtime, so framework-dependent is right.)
        rid: [ linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64 ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Per-RID native launcher (AdHocAgent / AdHocAgent.exe) + portable DLLs.
      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained false
          -p:UseAppHost=true
          -o publish

      - name: Package
        run: cd publish && zip -r "../${{ env.NAME }}-${{ matrix.rid }}.zip" .
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.NAME }}-${{ matrix.rid }}
          path: ${{ env.NAME }}-${{ matrix.rid }}.zip
          retention-days: 7

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only this job may create the release
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect zips + checksums
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          ( cd dist && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
