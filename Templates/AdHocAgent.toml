# The settings of AdHocAgent. AdHocAgent looks for this file only beside its executable.
# Each setting is one line: key = "value". A line starting with # is a comment.

# =============================== Your personal volatile UUID ===============================
# PersonalVolatileUUID - the UUID AdHocAgent logs in with. To store the UUID you received:
#     AdHocAgent <your volatile UUID>
# The server replaces it from time to time, and AdHocAgent writes the new one here.
# Keep this file: it is the only place that holds your current UUID.
#
# PreviousVolatileUUID - the UUID the last change replaced. If the server rejects the current one, re-apply it:
#     AdHocAgent <the PreviousVolatileUUID>

# =============================== Your editor ===============================================
# A click on a place in the Observer opens your editor there. Uncomment the two lines of your editor and
# write the path to its executable. In show_code_args, <path to file>, <line number> and <char number>
# are replaced by the place clicked.

# JetBrains IntelliJ IDEA - Rider and the other JetBrains IDEs take the same arguments: rider64.exe, ...
# https://www.jetbrains.com/help/idea/opening-files-from-command-line.html
# macOS: "/Applications/IntelliJ IDEA.app/Contents/MacOS/idea"    Linux: "<IDEA folder>/bin/idea.sh"
# show_code_exe = "C:/Program Files/JetBrains/IntelliJ IDEA/bin/idea64.exe"
# show_code_args = "--line <line number> <path to file>"

# VS Code
# https://code.visualstudio.com/docs/editor/command-line
# macOS: "/Applications/Visual Studio Code.app/Contents/Resources/app/bin/code"    Linux: "/usr/bin/code"
# show_code_exe = "C:/Users/<you>/AppData/Local/Programs/Microsoft VS Code/Code.exe"
# show_code_args = "--goto <path to file>:<line number>:<char number>"


# =============================== Formatting the generated code =============================
# A deployment formats the received code of each language by the formatter below, before anything is copied.
# Each value is a command line, as the formatter takes it; the agent puts the files of its language into it:
#   FILES      - all of them in one run, as many as a command line takes: 'gofmt -w FILES'
#   FILE_PATH  - one run a file, for a formatter that takes one: 'astyle --style=allman FILE_PATH'
#   neither    - the command runs once, as it is, in the received folder, where InCS/MyHost is the folder of that
#                host: 'dotnet format whitespace --folder "InCS/MyHost"'
# These are widely used formatters, called by name, as when they are on the PATH. A formatter elsewhere: write its
# full path in double quotes, '"C:/Program Files/LLVM/bin/clang-format.exe" -i ... FILES'. A formatter that is not
# installed is skipped with a warning: its files go as they came. format_xx = '' leaves a language unformatted.
# The values are literal strings, in single quotes: double quotes inside them go to the formatter as they are.
# The generated code names its types by their full paths, hence the wide lines.

# Java, C#, C++, C: clang-format - https://releases.llvm.org/download.html
format_java  = 'clang-format -i -style="{ColumnLimit: 0, IndentWidth: 4, TabWidth: 4, UseTab: Never, BreakBeforeBraces: Allman, IndentCaseLabels: true, AllowShortBlocksOnASingleLine: false, SpacesInLineCommentPrefix: {Minimum: 0, Maximum: 0}}" FILES'
format_cs    = 'clang-format -i -style="{ColumnLimit: 0, IndentWidth: 4, TabWidth: 4, UseTab: Never, BreakBeforeBraces: Allman, IndentCaseLabels: true, AllowShortBlocksOnASingleLine: false, SpacesInLineCommentPrefix: {Minimum: 0, Maximum: 0}}" FILES'
format_cpp   = 'clang-format -i -style="{ColumnLimit: 0, IndentWidth: 4, TabWidth: 4, UseTab: Never, BreakBeforeBraces: Allman, IndentCaseLabels: true, AllowShortBlocksOnASingleLine: false, SpacesInLineCommentPrefix: {Minimum: 0, Maximum: 0}}" FILES'
format_c     = 'clang-format -i -style="{ColumnLimit: 0, IndentWidth: 4, TabWidth: 4, UseTab: Never, BreakBeforeBraces: Allman, IndentCaseLabels: true, AllowShortBlocksOnASingleLine: false, SpacesInLineCommentPrefix: {Minimum: 0, Maximum: 0}}" FILES'

# TypeScript: prettier - npm install -g prettier
format_ts    = 'prettier --write --tab-width 4 --bracket-spacing false --print-width 999 FILES'

# Rust: rustfmt - comes with Rust ( rustup )
format_rs    = 'rustfmt --edition 2021 --config max_width=200 FILES'

# Go: gofmt - comes with Go
format_go    = 'gofmt -w FILES'

# Python: ruff - pip install ruff
format_py    = 'ruff format --line-length 200 FILES'

# Dart: dart format - comes with Dart and Flutter
format_dart  = 'dart format --page-width 200 FILES'

# Swift: swift-format - comes with Swift 6
format_swift = 'swift-format format -i --configuration "{\"lineLength\": 200, \"indentation\": {\"spaces\": 4}}" FILES'
