<text x="125" y="201" font-size="12" fill="#e8eaed" text-anchor="middle">checked by your IDE</text>
<text x="125" y="221" font-size="12" fill="#e8eaed" text-anchor="middle">packs · hosts · connections</text>
<rect x="246" y="96" width="170" height="156" rx="8" fill="#333536" stroke="#8c9198" stroke-width="1.8"/>
