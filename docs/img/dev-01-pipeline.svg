<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="title desc">
<title id="title">The AdHoc pipeline: from your description to the generator in the cloud and back into your projects</title>
<desc id="desc">Your machine on the left, the AdHoc cloud on the right. Top row, left to right, towards the server: 1 MyProtocol.cs, your description in plain C#; 2 AdHocAgent compiles and checks it, writes the numbers tables back into the file, and uploads the description with your UUID. 3 The generator in the cloud produces and tests code for every host in each of its languages. Bottom row, right to left, back from the server: 4 the received folder, a folder per language and per host with gen, lib and demo; 5 deployment routes the files into your folders, keeps your code by smart merge and makes backups; 6 your projects build hosts from gen, lib and your code. A dashed arrow from your projects back to the description: when the description changes, steps 2 to 5 run again. Below, at runtime, the hosts exchange packs as bytes over a connection.</desc>
