<text x="331" y="142" font-size="12" fill="#9aa0a6" text-anchor="middle">上传前检查</text>
<text x="331" y="181" font-size="12" fill="#e8eaed" text-anchor="middle">编译 (Roslyn)</text>
<text x="331" y="201" font-size="12" fill="#e8eaed" text-anchor="middle">检查 AdHoc 规则</text>
<text x="331" y="221" font-size="12" fill="#e8eaed" text-anchor="middle">遇到第一个错误即停止</text>
