<text x="656" y="182" font-size="12" fill="#9aa0a6">Each loop handles one event at a time, to</text>
<text x="656" y="198" font-size="12" fill="#9aa0a6">completion; the two loops can run on</text>
<text x="656" y="214" font-size="12" fill="#9aa0a6">different threads. A handler that blocks</text>
<text x="656" y="230" font-size="12" fill="#9aa0a6">stalls its loop.</text>
<text x="490" y="564" font-size="12.5" fill="#e8eaed" text-anchor="middle">Resident memory on this path: 2 buffers per connection + small serializer/parser state, whatever the pack size.</text>
<text x="490" y="582" font-size="12" fill="#9aa0a6" text-anchor="middle">Extra: concrete pack objects, guaranteed-delivery journal, codec contexts.</text>
