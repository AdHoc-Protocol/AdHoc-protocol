<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" role="img" aria-labelledby="title desc">
<title id="title">One host at runtime: your code, the generated code, the runtime library and its two buffers</title>
<desc id="desc">Your code calls send(pack), which only puts the pack into the sending queue. In the transmit loop, whenever the socket can take bytes, the transport asks the Transmitter to fill the send buffer with Read(buffer), and the Transmitter writes the id and fields of the head pack into it. In the receive loop, the socket fills the receive buffer, the transport hands it to the Receiver with Write(buffer), the Receiver dispatches by pack id and the handler consumes fields in place, then the actor state and your code in #region injection points run. On the wire one pack travels as buffer-sized chunks to the peer host. Resident memory is two buffers per connection plus small parser state, whatever the pack size.</desc>
