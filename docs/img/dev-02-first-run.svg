<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="title desc">
<title id="title">Getting started: five steps from your UUID to the first deployed code</title>
<desc id="desc">Top row, left to right: step 2, AdHocAgent followed by your UUID stores it as PersonalVolatileUUID in AdHocAgent.toml beside AdHocAgent; step 4, AdHocAgent with no arguments writes the template MyProtocolDescription.cs into the current folder, overwriting a file of that name; step 5, you compose your protocol in your IDE: packs and their fields, hosts and their languages, connections, states and branches. Down the right side to the bottom row, right to left: step 6, AdHocAgent .\MyProtocolDescription.cs adds the numbers tables to the description, fills the received folder MyProtocolDescription with .description, InCS, InJAVA and InTS host folders, writes MyProtocolDescription.md and stops; a bare file name without a directory part is taken for a UUID and nothing is generated. Step 7: after a route and ⛔ marks are added to the .md file, AdHocAgent .\MyProtocolDescription.md copies gen, lib and LICENSE-GRANT.md into D:\Projects\server\protocol.</desc>
