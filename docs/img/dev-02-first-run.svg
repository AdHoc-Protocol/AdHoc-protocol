<text x="360" y="36" font-size="14" fill="#e8eaed" font-weight="700">Get the template</text>
<text x="330" y="61" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >in the folder of your description project</tspan></text>
<circle cx="642" cy="31" r="12" fill="#e8833a" stroke="#2b2b2b" stroke-width="2"/><text data-ok="1" x="642" y="35.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">5</text>
<text x="662" y="36" font-size="14" fill="#e8eaed" font-weight="700">Compose your protocol</text>
<text x="632" y="61" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >the template is a start:</tspan></text>
<text x="632" y="77" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >make it your protocol</tspan></text>
