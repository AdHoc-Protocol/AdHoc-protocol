<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<circle cx="28" cy="31" r="12" fill="#e8833a" stroke="#2b2b2b" stroke-width="2"/><text data-ok="1" x="28" y="35.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">2</text>
<text x="48" y="36" font-size="14" fill="#e8eaed" font-weight="700">Store your UUID</text>
<text x="18" y="61" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >once, with the UUID from your sign-up</tspan></text>
