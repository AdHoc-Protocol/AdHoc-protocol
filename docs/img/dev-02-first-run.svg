<text x="682" y="218" font-size="12" fill="#e8833a">+ hosts and their languages</text>
<text x="682" y="234" font-size="12" fill="#e8833a">+ connections, states, branches</text>
<text x="674" y="256" font-size="12" fill="#9aa0a6">the IDE checks the C# as you type</text>
<circle cx="518" cy="319" r="12" fill="#e8833a" stroke="#2b2b2b" stroke-width="2"/><text data-ok="1" x="518" y="323.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">6</text>
<text x="538" y="324" font-size="14" fill="#e8eaed" font-weight="700">Generate</text>
<text x="508" y="349" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >the path needs a directory part: </tspan><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">.\</tspan><tspan > or </tspan><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">./</tspan></text>
<circle cx="28" cy="319" r="12" fill="#e8833a" stroke="#2b2b2b" stroke-width="2"/><text data-ok="1" x="28" y="323.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">7</text>
<text x="48" y="324" font-size="14" fill="#e8eaed" font-weight="700">Deploy</text>
<text x="18" y="349" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >after adding a route </tspan><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">[](/D:/Projects/server/protocol/)</tspan></text>
<text x="18" y="365" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >and ⛔ for unused hosts</tspan></text>
