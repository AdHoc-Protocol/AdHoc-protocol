<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="title desc">
<title id="title">快速入门:从你的 UUID 到第一份部署代码的五个步骤</title>
<desc id="desc">上排从左到右:步骤 2,AdHocAgent 后跟你的 UUID,把它作为 PersonalVolatileUUID 存入 AdHocAgent 旁边的 AdHocAgent.toml;步骤 4,无参数的 AdHocAgent 把模板 MyProtocolDescription.cs 写入当前文件夹,覆盖同名文件;步骤 5,你在 IDE 中编写协议:pack 及其字段、主机及其语言、连接、状态和分支。沿右侧向下到底排,从右到左:步骤 6,AdHocAgent .\MyProtocolDescription.cs 把编号表加入描述,填充收到的文件夹 MyProtocolDescription(含 .description、InCS、InJAVA 和 InTS 主机文件夹),写出 MyProtocolDescription.md 后停止;不带目录部分的裸文件名会被当作 UUID,不生成任何东西。步骤 7:在 .md 文件中添加路由和 ⛔ 标记后,AdHocAgent .\MyProtocolDescription.md 把 gen、lib 和 LICENSE-GRANT.md 复制到 D:\Projects\server\protocol。</desc>
