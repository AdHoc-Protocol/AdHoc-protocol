<text x="360" y="36" font-size="14" fill="#e8eaed" font-weight="700">获取模板</text>
<text x="330" y="61" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >在描述项目的文件夹中</tspan></text>
