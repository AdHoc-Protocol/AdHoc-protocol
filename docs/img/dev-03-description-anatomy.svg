<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="title desc">
<title id="title">The anatomy of one description file: which C# construct is which AdHoc entity</title>
<desc id="desc">MyProtocol.cs starts with using org.unirail.Meta and holds a required namespace com.my.company. In the namespace, a dashed strip marks the numbers tables that AdHocAgent writes. The project interface MyProject contains packs (class Order with the nested pack class Line), hosts (struct Browser : Host and struct Store : Host with its language marker and its pack class Receipt), a constants container struct Limits and enum Payment, and the connection interface Session : Connects&lt;Browser, Store&gt; with the states Open and Paying and the actor interface Checkout : Actor with a state of its own. Dashed arrows show that the branch of Open selects Order and the branch of Paying selects Store.Receipt. Labels in the right margin name the chapter of each region.</desc>
