<path d="M604 261 L595 256.5 L595 265.5 Z" fill="#9aa0a6"/>
<rect x="604" y="208" width="320" height="106" rx="4" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="616" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#e8eaed">C#</text>
<text x="616" y="252" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12"><tspan fill="#9aa0a6">/// </tspan><tspan fill="#e8eaed">&lt;summary&gt;</tspan><tspan fill="#9aa0a6"> ...</tspan></text>
<text x="616" y="272" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12"><tspan fill="#9aa0a6">/// </tspan><tspan fill="#e8eaed">&lt;remarks&gt;</tspan><tspan fill="#9aa0a6"> ... </tspan><tspan fill="#f2c14e">&lt;c&gt;JoinReply&lt;/c&gt;</tspan></text>
<text x="616" y="302" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">above the generated class JoinRoom</text>
<text x="20" y="342" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed">Written once as C# comments; each language gets its own comment syntax, escaped for that language.</text>
</svg>
