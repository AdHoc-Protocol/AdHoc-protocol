<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img">
<title>Three rows show where the length of an array lives when the array is the value of a Map with three keys. T[] constant length: three values of exactly four items each and no length anywhere; the length is the declared N and is never sent. T[,] fixed at creation: one length box, len 3, written once for the whole field, then three values of exactly three items each. T[,,] dynamic: every value is preceded by its own length box, len 2, len 5 and len 1, followed by that many items</title>
