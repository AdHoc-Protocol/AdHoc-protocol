<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" role="img">
<title>三行展示当数组是含三个键的 Map 的值时，数组长度存放在哪里。T[] 定长：三个值都恰好有 4 个元素，任何地方都没有长度；长度就是声明的 N，从不发送。T[,] 创建时定长：一个长度框 len 3，整个字段只写一次，随后是三个各含 3 个元素的值。T[,,] 动态：每个值前面都有自己的长度框 len 2、len 5、len 1，后跟相应数量的元素</title>
