<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img">
<title>Two color-coded declarations. Top: [D(-100, 20, +50)] string?[][,,] a; arrows join -100 to the first bracket pair [], the outer array of exactly 100 elements; 20 to the second pair [,,], each inner list holding at most 20; +50 to string, at most 50 characters; and the ? marks strings that may be null. A small picture shows an outer box of 100 slots, each holding a list of a different length. Bottom: string?[]?[,,] d; with string?[]? boxed in purple as the element, a nullable constant-length array closed by the ?, and the [,,] after it bracketed in orange as the outer list</title>
