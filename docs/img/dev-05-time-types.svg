<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img">
<title>Three panels on how the compact time types use whole bytes. DateTimeDef: a timeline from min 2000-01-01 to the requested max 2050-01-01 drawn solid, continued dashed to the expanded max 2136-02-07; 31 bits are needed, so 4 bytes are used and the spare bit extends max, or with @precision refines the step. TimeSpanDef: a ring of one cycle, 16,777,216 steps of 6 ms, about 27.96 hours, with the receiver's now marked; the usable history ends at now and a 1-minute margin follows it; a value decodes into the one cycle that ends one minute after now; 3 bytes, the spare capacity refines the precision from 1 s to 6 ms. Duration: a line from 0 to the requested max of 30,000 steps drawn solid, continued dashed to the promoted max of 65,535 steps; 2 bytes; the precision never changes, so 19 ms steps reach about 20.75 minutes</title>
<rect width="980" height="520" rx="10" fill="#2b2b2b"/>
<rect x="16" y="16" width="948" height="154" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<rect x="16" y="182" width="948" height="154" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<rect x="16" y="348" width="948" height="154" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
