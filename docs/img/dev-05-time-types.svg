<text x="250" y="305" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">A value decodes into the one cycle that ends at now + 1 min.</text>
<text x="250" y="323" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">Not to scale: the margin is 1 minute of the 27.96 h cycle.</text>
