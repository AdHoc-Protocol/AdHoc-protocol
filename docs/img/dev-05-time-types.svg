<line x1="48" y1="86" x2="280.18221895664954" y2="86" stroke="#e8833a" stroke-width="5"/>
<line x1="280.18221895664954" y1="86" x2="680" y2="86" stroke="#e8833a" stroke-width="5" stroke-dasharray="7 5" opacity="0.8"/>
<line x1="48" y1="77" x2="48" y2="95" stroke="#e8eaed" stroke-width="1.6"/>
<line x1="280.18221895664954" y1="77" x2="280.18221895664954" y2="95" stroke="#e8eaed" stroke-width="1.6"/>
<line x1="680" y1="77" x2="680" y2="95" stroke="#e8eaed" stroke-width="1.6"/>
<text x="164.09110947832477" y="72" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="middle">requested: 50 years in 1 s steps</text>
<text x="480.09110947832477" y="72" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="middle">added by the spare bit: 2³² − 1 steps in all</text>
<text x="48" y="112" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">min 2000-01-01</text>
<text x="280.18221895664954" y="112" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">requested max 2050-01-01</text>
<text x="680" y="112" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">expanded max 2136-02-07</text>
<text x="32" y="138" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">Default: the spare bits extend max; the step stays 1 s.</text>
<text x="32" y="156" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">With @precision: the spare bits refine the step instead; the range stays close to the requested one.</text>
