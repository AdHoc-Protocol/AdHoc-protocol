<text x="250" y="240" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">ring = one cycle = capacity × precision = 16,777,216 × 6 ms ≈ 27.96 h</text>
<rect x="250" y="253" width="18" height="6" fill="#4fb3ff"/>
