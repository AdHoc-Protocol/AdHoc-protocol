<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img">
<title>三个面板展示紧凑时间类型如何占满整字节。DateTimeDef：从 min 2000-01-01 到请求的 max 2050-01-01 的时间轴画为实线，再虚线延续到扩展的 max 2136-02-07；需要 31 位，所以使用 4 字节，空闲位用于扩展 max，或配合 @precision 细化步长。TimeSpanDef：一个周期的环，16,777,216 个 6 ms 的步进，约 27.96 小时，标出了接收方的 now；可用历史在 now 结束，其后跟随 1 分钟余量；一个值解码到在 now 后 1 分钟结束的那个周期；3 字节，空闲容量将精度从 1 s 细化到 6 ms。Duration：从 0 到请求的 max 30,000 步画为实线，再虚线延续到提升的 max 65,535 步；2 字节；精度不变，所以 19 ms 的步长可达约 20.75 分钟</title>
