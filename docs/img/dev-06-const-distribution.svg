<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 606" width="960" height="606" role="img"><title>Where constants containers and enums end up. Left: a project description with a project-level container GlobalLimits, the DataType enum listed in the project's _&lt;...&gt;, and host A holding the container Units, the enum Mode used as a field type of the pack Reading, and the pack Event whose constant initializer names its nested container Mask; both packs go from A to B. Right: the generated code of hosts A, B and C with the route that brought each item. Route 1 (declared in the host body) reaches only A; routes 2 and 3 (project level, project _&lt;...&gt;) reach all three hosts; route 4 (field type) brings Mode to B; route 5 (constant initializer) brings Mask to B; host C, which exchanges neither pack, gets only the project-wide ones. The connection between A and B carries fields only: no constant ever travels.</title><rect width="960" height="606" rx="10" fill="#2b2b2b"/><rect x="16" y="16" width="414" height="492" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/><text x="32" y="38" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">Description</text><text x="32" y="62" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve"><tspan >interface MyProject : </tspan><tspan fill="#f2c14e">_&lt;…Field.DataType&gt;</tspan></text><circle cx="334" cy="58" r="9" fill="#2b2b2b" stroke="#f2c14e" stroke-width="1.6"/><text x="334" y="62.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" font-weight="700">3</text><rect x="32" y="78" width="382" height="50" rx="4" fill="#2f2f2f" stroke="#9aa0a6" stroke-width="1.1"/><text x="44" y="98" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" xml:space="preserve">struct GlobalLimits { const int MaxPayload }</text><text x="44" y="118" 