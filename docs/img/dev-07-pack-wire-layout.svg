<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 556" width="980" height="556" role="img"><title>The Reading pack as declared, field by field, above the bytes it becomes: the pack id, then sensor in 2 little-endian bytes, celsius and alarm filling one bit-field byte, a second bit-field byte holding the length bit of pressure, the one payload byte of pressure, a null-bits byte for label, sequence and samples, then label and samples; sequence, absent, costs only its null bit. Arrows from each declared field to its place show that the groups are written fixed-width first, then bit fields with the varint length bits, then the varint payloads, and nullable and reference fields last, each group in declaration order, with conduits after everything.</title><rect width="980" height="556" rx="10" fill="#2b2b2b"/><text x="22" y="30" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="14">class Reading</tspan><tspan fill="#9aa0a6" font-size="12">    fields in declaration order; the number is the wire group</tspan></text><rect x="22" y="50" width="126" height="52" rx="4" fill="#3a3a3a" stroke="#e8eaed" stroke-width="1.5"/><text x="85" y="81" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">string? label</text><circle cx="134" cy="50" r="9" fill="#2b2b2b" stroke="#e8eaed" stroke-width="1.5"/><text x="134" y="54.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="700">4</text><text x="85" y="120" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">label = &quot;ok&quot;</text><rect x="157" y="50" width="126" height="52" rx="4" fill="#4a2f1c" stroke="#e8833a" stroke-width="1.5"/><text x="220" y="81" font-family="Consolas,DejaVu 