<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img"><title>Agent 如何组装 pack 的字段列表</title><desc>四个步骤,从左到右:1 原生字段,在类体中声明 (version、note);2 字段注入,FieldsInjectInto&lt;Set&gt; 追加其字段并替换同名字段 (stamp);3 XML see-cref 指令,+ 添加、- 移除,自上而下 (id 被添加,Common.version 因名称已被占用而跳过);4 基类列表,先是 C# 基类,然后是 _&lt;(A, B)&gt; 项,X&lt;C&gt; 表示移除,从左到右 (trace_id)。来自另一个项目的 Modify&lt;Pack&gt; 可在之后修改列表。规则:同名时第一个字段胜出,注入除外,它会替换。输出:最终字段列表 version、note、stamp、id、trace_id —— 生成器依据的顺序;在线上字段按种类分组,此顺序在每组内保持。</desc><rect width="960" height="420" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="120" y="16" width="720" height="34" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/><text x="480" y="38" font-size="14" fill="#e8eaed" text-anchor="middle"><tspan font-weight="700">名称占用情况:</tspan> 同名时第一个字段胜出 —— 注入除外,会替换</text><rect x="16" y="70" width="178" height="160" rx="8" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="38" cy="94" r="12" fill="#3a3d42" stroke="#e8eaed" stroke-width="1.6"/><text x="38" y="99" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">1</text><text x="58" y="99" font-size="15" fill="#e8eaed" font-weight="600">原生字段</text><text x="28" y="126" font-size="12" fill="#9aa0a6">在类体中声明</text><rect x="28" y="176" width="74" height="24" rx="5" fill="#3a3d42" stroke="#e8eaed" stroke-width="1.4"/><text x="65" y="192.7" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">version</text><rect x="110" y="176" width="50" height="24" rx="5" fill="#3a3d42" stroke="#e8eaed" stroke-width="1.4"/><text x="135" y="192.7" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">note</text><line x1="196" y1="150" x2="206" y2="150" stroke="#9aa0a6" stroke-width="2"/><path d="M214 150 L205 145.1 L205 155 Z" fill="#9aa0a6"/><rect x="216" y="70" width="178" height="160" rx="8" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="238" cy="94" r="12" fill="#45301f" stroke="#e8833a" stroke-width="1.6"/><text x="238" y="99" font-size="14" fill="#e8833a" text-anchor="middle" font-weight="700">2</text><text x="258" y="99" font-size="15" fill="#e8eaed" font-weight="600">字段注入</text><text x="228" y="126" font-size="12" fill="#9aa0a6"><tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">FieldsInjectInto&lt;Set&gt;</tspan>:</text><text x="228" y="142" font-size="12" fill="#9aa0a6">追加,替换</text><text x="228" y="158" font-size="12" fill="#9aa0a6">同名字段</text><rect x="228" y="176" width="58" height="24" rx="5" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="257" y="192.7" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">stamp</text><line x1="396" y1="150" x2="406" y2="150" stroke="#9aa0a6" stroke-width="2"/><path d="M414 150 L405 145.1 L405 155 Z" fill="#9aa0a6"/><rect x="416" y="70" width="178" height="160" rx="8" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="438" cy="94" r="12" fill="#3b3424" stroke="#f2c14e" stroke-width="1.6"/><text x="438" y="99" font-size="14" fill="#f2c14e" text-anchor="middle" font-weight="700">3</text><text x="458" y="99" font-size="15" fill="#e8eaed" font-weight="600">XML 指令</text><text x="428" y="126" font-size="12" fill="#9aa0a6"><tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">&lt;see cref/&gt;+</tspan> 添加,</text><text x="428" y="142" font-size="12" fill="#9aa0a6"><tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">-</tspan> 移除,</text><text x="428" y="158" font-size="12" fill="#9aa0a6">自上而下</text><rect x="428" y="176" width="34" height="24" rx="5" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="445" y="192.7" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">id</text><rect x="470" y="176" width="74" height="24" rx="5" fill="#232323" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="3 2"/><text x="507" y="192.7" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" class="ok">version</text><line x1="476" y1="188.5" x2="538" y2="188.5" stroke="#9aa0a6" stroke-width="1.4" class="ok"/><text x="507" y="217" font-size="12" fill="#9aa0a6" text-anchor="middle" font-style="italic">跳过:名称已被占用</text><line x1="596" y1="150" x2="606" y2="150" stroke="#9aa0a6" stroke-width="2"/><path d="M614 150 L605 145.1 L605 155 Z" fill="#9aa0a6"/><rect x="616" y="70" width="178" height="160" rx="8" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="638" cy="94" r="12" fill="#342a42" stroke="#a06fd0" stroke-width="1.6"/><text x="638" y="99" font-size="14" fill="#a06fd0" text-anchor="middle" font-weight="700">4</text><text x="658" y="99" font-size="15" fill="#e8eaed" font-weight="600">基类列表</text><text x="628" y="126" font-size="12" fill="#9aa0a6">C# 基类,然后</text><text x="628" y="142" font-size="12" fill="#9aa0a6"><tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">_&lt;(A, B)&gt;</tspan>, <tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">X&lt;C&gt;</tspan> 移除;</text><text x="628" y="158" font-size="12" fill="#9aa0a6">从左到右</text><rect x="628" y="176" width="81" height="24" rx="5" fill="#342a42" stroke="#a06fd0" stroke-width="1.4"/><text x="668.5" y="192.7" font-size="13" fill="#a06fd0" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">trace_id</text><path d="M796 150 L806 150" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3" stroke-linejoin="round"/><path d="M814 150 L805 145.1 L805 155 Z" fill="#9aa0a6"/><rect x="816" y="92" width="128" height="116" rx="8" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="880" y="118" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Modify&lt;Pack&gt;</text><text x="880" y="140" font-size="12" fill="#9aa0a6" text-anchor="middle">来自另一个</text><text x="880" y="156" font-size="12" fill="#9aa0a6" text-anchor="middle">项目</text><text x="880" y="178" font-size="12" fill="#9aa0a6" text-anchor="middle" font-style="italic">(复用</text><text x="880" y="194" font-size="12" fill="#9aa0a6" text-anchor="middle" font-style="italic">描述)</text><rect x="16" y="290" width="928" height="46" rx="8" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="928" y="319" font-size="15" fill="#e8eaed" text-anchor="end" font-weight="600">最终字段列表</text><rect x="39" y="301" width="74" height="24" rx="5" fill="#3a3d42" stroke="#e8eaed" stroke-width="1.4"/><text x="76" y="317.7" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">version</text><rect x="121" y="301" width="50" height="24" rx="5" fill="#3a3d42" stroke="#e8eaed" stroke-width="1.4"/><text x="146" y="317.7" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">note</text><line x1="105" y1="234" x2="105" y2="279" stroke="#9aa0a6" stroke-width="1.8"/><path d="M105 287 L100.1 278 L110 278 Z" fill="#9aa0a6"/><rect x="276" y="301" width="58" height="24" rx="5" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="305" y="317.7" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">stamp</text><line x1="305" y1="234" x2="305" y2="279" stroke="#e8833a" stroke-width="1.8"/><path d="M305 287 L300.1 278 L310 278 Z" fill="#e8833a"/><rect x="488" y="301" width="34" height="24" rx="5" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="505" y="317.7" font-size="13" fill="#f2c14e" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">id</text><line x1="505" y1="234" x2="505" y2="279" stroke="#f2c14e" stroke-width="1.8"/><path d="M505 287 L500.1 278 L510 278 Z" fill="#f2c14e"/><rect x="664.5" y="301" width="81" height="24" rx="5" fill="#342a42" stroke="#a06fd0" stroke-width="1.4"/><text x="705" y="317.7" font-size="13" fill="#a06fd0" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">trace_id</text><line x1="705" y1="234" x2="705" y2="279" stroke="#a06fd0" stroke-width="1.8"/><path d="M705 287 L700.1 278 L710 278 Z" fill="#a06fd0"/><text x="480" y="362" font-size="13" fill="#9aa0a6" text-anchor="middle">生成器依据的顺序;在线上字段按种类分组,此顺序在每组内保持</text><rect x="174.8" y="382" width="14" height="14" rx="3" fill="#3a3d42" stroke="#e8eaed" stroke-width="1.4"/><text x="195.8" y="393" font-size="12" fill="#9aa0a6">原生字段</text><rect x="282.9" y="382" width="14" height="14" rx="3" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="303.9" y="393" font-size="12" fill="#9aa0a6">注入 (FieldsInjectInto)</text><rect x="477.3" y="382" width="14" height="14" rx="3" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="498.3" y="393" font-size="12" fill="#9aa0a6">由 XML 指令添加</text><rect x="669.4" y="382" width="14" height="14" rx="3" fill="#342a42" stroke="#a06fd0" stroke-width="1.4"/><text x="690.4" y="393" font-size="12" fill="#9aa0a6">来自基类列表</text>
</g></svg>
