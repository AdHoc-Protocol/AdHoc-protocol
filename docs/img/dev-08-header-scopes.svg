<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><title>Where a header is declared sets which transmissions carry it</title><desc>The project Headers holds ProjectScopeHeader : HeaderFor&lt;(Headers, X&lt;ServerStatus&gt;)&gt;. Host NodeA holds NodeAHeader, host NodeB holds NodeBHeader, and the connection CommunicationChannel between them holds ChannelScopeHeader. Two wire lanes run between the hosts: to NodeB on top, to NodeA below. Dashed connectors show that ProjectScopeHeader and ChannelScopeHeader ride both lanes, NodeBHeader only the lane to NodeB (on PlayerEvent, not on PrecedenceTestPacket) and NodeAHeader only the lane to NodeA. PrecedenceTestPacket to NodeB carries id, ProjectScopeHeader, ChannelScopeHeader, payload; to NodeA it carries id, ProjectScopeHeader, NodeAHeader, ChannelScopeHeader, payload. Project scope: both directions, every connection; host scope: only transmissions arriving at that host; connection scope: both directions, that connection only. Every matching header travels; none overrides another.</desc><rect width="960" height="540" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="16" y="16" width="928" height="412" rx="10" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.4"/><text x="32" y="40" font-size="14" fill="#e8eaed"><tspan fill="#9aa0a6" font-weight="400">project </tspan><tspan font-weight="700">Headers</tspan></text><rect x="242.5" y="28" width="475" height="24" rx="5" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="480" y="44.7" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ProjectScopeHeader : HeaderFor&lt;(Headers, X&lt;ServerStatus&gt;)&gt;</text><rect x="26" y="76" width="108" height="340" rx="8" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6"/><text x="80" y="100" font-size="14" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">host </tspan><tspan font-weight="700">NodeA</tspan></text><rect x="826" y="76" width="108" height="340" rx="8" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6"/><text x="880" y="100" font-size="14" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">host </tspan><tspan font-weight="700">NodeB</tspan></text><rect x="150" y="76" width="660" height="340" rx="8" fill="#2a2d31" stroke="#7d858f" stroke-width="1.4" stroke-dasharray="7 4"/><text x="794" y="100" font-size="14" fill="#e8eaed" text-anchor="end"><tspan fill="#9aa0a6">connection </tspan><tspan font-weight="700">CommunicationChannel</tspan></text><line x1="134" y1="190" x2="322" y2="190" stroke="#4fb3ff" stroke-width="2.2"/><line x1="704" y1="190" x2="818" y2="190" stroke="#4fb3ff" stroke-width="2.2"/><path d="M826 190 L816 184.5 L816 195.5 Z" fill="#4fb3ff"/><line x1="826" y1="350" x2="796" y2="350" stroke="#4fb3ff" stroke-width="2.2"/><line x1="322" y1="350" x2="142" y2="350" stroke="#4fb3ff" stroke-width="2.2"/><path d="M134 350 L144 344.5 L144 355.5 Z" fill="#4fb3ff"/><rect x="322" y="173" width="34" height="34" rx="2" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="339" y="194.5" font-size="12" fill="#f2c14e" text-anchor="middle">id</text><rect x="356" y="173" width="140" height="34" rx="2" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="426" y="194.5" font-size="12" fill="#e8eaed" text-anchor="middle">ProjectScopeHeader</text><rect x="496" y="173" width="144" height="34" rx="2" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="568" y="194.5" font-size="12" fill="#e8eaed" text-anchor="middle">ChannelScopeHeader</text><rect x="640" y="173" width="64" height="34" rx="2" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.4"/><text x="672" y="194.5" font-size="12" fill="#4fb3ff" text-anchor="middle">payload</text><rect x="322" y="333" width="34" height="34" rx="2" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="339" y="354.5" font-size="12" fill="#f2c14e" text-anchor="middle">id</text><rect x="356" y="333" width="140" height="34" rx="2" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="426" y="354.5" font-size="12" fill="#e8eaed" text-anchor="middle">ProjectScopeHeader</text><rect x="496" y="333" width="92" height="34" rx="2" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="542" y="354.5" font-size="12" fill="#e8eaed" text-anchor="middle">NodeAHeader</text><rect x="588" y="333" width="144" height="34" rx="2" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="660" y="354.5" font-size="12" fill="#e8eaed" text-anchor="middle">ChannelScopeHeader</text><rect x="732" y="333" width="64" height="34" rx="2" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.4"/><text x="764" y="354.5" font-size="12" fill="#4fb3ff" text-anchor="middle">payload</text><text x="314" y="182" font-size="12" fill="#e8eaed" text-anchor="end">PrecedenceTestPacket</text><text x="314" y="342" font-size="12" fill="#e8eaed" text-anchor="end">PrecedenceTestPacket</text><text x="800" y="210" font-size="13" fill="#4fb3ff" text-anchor="end" font-weight="600">to NodeB</text><text x="160" y="370" font-size="13" fill="#4fb3ff" font-weight="600">to NodeA</text><path d="M426 52 L426 165" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M426 172 L421.6 164 L430.4 164 Z" fill="#e8833a"/><path d="M426 207 L426 325" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M426 332 L421.6 324 L430.4 324 Z" fill="#e8833a"/><rect x="534" y="258" width="160" height="24" rx="5" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="614" y="274.7" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ChannelScopeHeader</text><path d="M568 258 L568 215" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M568 208 L563.6 216 L572.4 216 Z" fill="#e8833a"/><path d="M660 282 L660 325" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M660 332 L655.6 324 L664.4 324 Z" fill="#e8833a"/><rect x="833" y="118" width="94" height="24" rx="5" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="880" y="134.3" font-size="12" fill="#e8833a" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">NodeBHeader</text><path d="M833 130 L774 130 L774 181" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M774 188 L769.6 180 L778.4 180 Z" fill="#e8833a"/><text x="766" y="148" font-size="12" fill="#9aa0a6" text-anchor="end">on PlayerEvent only,</text><text x="766" y="164" font-size="12" fill="#9aa0a6" text-anchor="end">not on this pack</text><rect x="33" y="374" width="94" height="24" rx="5" fill="#45301f" stroke="#e8833a" stroke-width="1.4"/><text x="80" y="390.3" font-size="12" fill="#e8833a" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">NodeAHeader</text><path d="M127 386 L542 386 L542 375" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M542 368 L537.6 376 L546.4 376 Z" fill="#e8833a"/><text x="300" y="454" font-size="13" fill="#e8eaed"><tspan fill="#e8833a" font-weight="600">project scope:</tspan><tspan fill="#e8eaed"> both directions, every connection</tspan></text><text x="300" y="472" font-size="13" fill="#e8eaed"><tspan fill="#e8833a" font-weight="600">host scope:</tspan><tspan fill="#e8eaed"> only transmissions arriving at that host</tspan></text><text x="300" y="490" font-size="13" fill="#e8eaed"><tspan fill="#e8833a" font-weight="600">connection scope:</tspan><tspan fill="#e8eaed"> both directions, that connection only</tspan></text><text x="300" y="516" font-size="14" fill="#e8eaed" font-weight="700">every matching header travels; none overrides another</text>
</g></svg>
