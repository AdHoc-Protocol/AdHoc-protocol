<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img"><title>头部位在线路上的位置</title><desc>第 1 行,PrecedenceTestPacket 从 NodeB 单独发送到 NodeA: pack ID;actor address,出现在寻址多个 Actor 的连接上;ProjectScopeHeader,96 位(timestamp 64、session_id 32);NodeAHeader,37 位(host_specific_id 32、flags 5);ChannelScopeHeader,49 位(sequence_num 32、priority 16、flag_bit 1);2 位填充;载荷 test_data。三个头部组首尾相接: 共 182 个头部位,逐组位打包,向上取整为 23 个整字节,解析载荷前即可在 OnReceiving 中读取。第 2 行,同一个 pack 作为另一个 pack 的字段: 外层 pack 字段,然后只有 PrecedenceTestPacket 的载荷 test_data;头部组被划掉——子 pack 上无头部。注意: 头部字段是单个定宽基元类型(bool, byte ... ulong, float, double);[MinMax] 收窄位宽;不允许: nullable, string, Binary, pack, array, Map/Set, [D], [A], [V], [X]。</desc><rect width="960" height="360" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="30" y="36" font-size="15" fill="#e8eaed" xml:space="preserve"><tspan font-weight="700">PrecedenceTestPacket 单独发送</tspan><tspan fill="#9aa0a6">  (NodeB 到 NodeA)</tspan></text><rect x="38" y="88" width="64" height="48" rx="3" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="70" y="116" font-size="12" fill="#f2c14e" text-anchor="middle">pack ID</text><rect x="102" y="88" width="96" height="48" rx="0" fill="#363a40" stroke="#7d858f" stroke-width="1.4" stroke-dasharray="4 3"/><text x="150" y="116" font-size="12" fill="#9aa0a6" text-anchor="middle">Actor 地址</text><rect x="198" y="88" width="120" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="258" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">时间戳</text><text x="258" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">64 位</text><rect x="318" y="88" width="80" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="358" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">session_id</text><text x="358" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">32 位</text><rect x="198" y="88" width="200" height="48" rx="0" fill="none" stroke="#e8833a" stroke-width="2"/><text x="298" y="64" font-size="13" fill="#e8833a" text-anchor="middle" font-weight="600">ProjectScopeHeader</text><text x="298" y="79" font-size="12" fill="#9aa0a6" text-anchor="middle">96 位</text><rect x="398" y="88" width="124" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="460" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">host_specific_id</text><text x="460" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">32 位</text><rect x="522" y="88" width="44" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="544" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">标志位</text><text x="544" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">5 位</text><rect x="398" y="88" width="168" height="48" rx="0" fill="none" stroke="#e8833a" stroke-width="2"/><text x="482" y="64" font-size="13" fill="#e8833a" text-anchor="middle" font-weight="600">NodeAHeader</text><text x="482" y="79" font-size="12" fill="#9aa0a6" text-anchor="middle">37 位</text><rect x="566" y="88" width="104" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="618" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">sequence_num</text><text x="618" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">32 位</text><rect x="670" y="88" width="62" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="701" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">优先级</text><text x="701" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">16 位</text><rect x="732" y="88" width="56" height="48" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="0.8"/><text x="760" y="108" font-size="12" fill="#e8eaed" text-anchor="middle">flag_bit</text><text x="760" y="125" font-size="12" fill="#d9a57a" text-anchor="middle">1 位</text><rect x="566" y="88" width="222" height="48" rx="0" fill="none" stroke="#e8833a" stroke-width="2"/><text x="677" y="64" font-size="13" fill="#e8833a" text-anchor="middle" font-weight="600">ChannelScopeHeader</text><text x="677" y="79" font-size="12" fill="#9aa0a6" text-anchor="middle">49 位</text><rect x="788" y="88" width="44" height="48" rx="0" fill="#2f3135" stroke="#7d858f" stroke-width="1.4"/><text x="810" y="108" font-size="12" fill="#9aa0a6" text-anchor="middle">填充</text><text x="810" y="125" font-size="12" fill="#9aa0a6" text-anchor="middle">2 位</text><rect x="832" y="88" width="100" height="48" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.4"/><text x="882" y="108" font-size="12" fill="#4fb3ff" text-anchor="middle">载荷:</text><text x="882" y="125" font-size="12" fill="#e8eaed" text-anchor="middle">test_data</text><path d="M199 142 L199 150 L831 150 L831 142 M515 150 L515 157" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><text x="515" y="176" font-size="13" fill="#e8eaed" text-anchor="middle">182 个头部位,逐组位打包,向上取整为整字节 (23)</text><text x="515" y="194" font-size="12" fill="#9aa0a6" text-anchor="middle">解析载荷前即可在 OnReceiving 中读取</text><line x1="150" y1="138" x2="150" y2="152" stroke="#7d858f" stroke-width="1.2"/><text x="38" y="168" font-size="12" fill="#9aa0a6" font-style="italic">在连接上</text><text x="38" y="184" font-size="12" fill="#9aa0a6" font-style="italic">寻址多个 Actor 时</text><text x="30" y="232" font-size="15" fill="#e8eaed"><tspan font-weight="700">同一个 pack 作为另一个 pack 的字段</tspan></text><rect x="38" y="294" width="176" height="44" rx="3" fill="#363a40" stroke="#7d858f" stroke-width="1.4"/><text x="126" y="321" font-size="12" fill="#9aa0a6" text-anchor="middle">外层 pack 字段 ...</text><rect x="214" y="294" width="220" height="44" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.4"/><text x="324" y="313" font-size="12" fill="#4fb3ff" text-anchor="middle">PrecedenceTestPacket 载荷</text><text x="324" y="329" font-size="12" fill="#e8eaed" text-anchor="middle">test_data</text><rect x="214" y="248" width="128" height="30" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="1.2" opacity="0.35" class="ok"/><text x="278" y="267.5" font-size="12" fill="#e8eaed" text-anchor="middle" opacity="0.4" class="ok">ProjectScopeHeader</text><rect x="342" y="248" width="92" height="30" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="1.2" opacity="0.35" class="ok"/><text x="388" y="267.5" font-size="12" fill="#e8eaed" text-anchor="middle" opacity="0.4" class="ok">NodeAHeader</text><rect x="434" y="248" width="132" height="30" rx="0" fill="#45301f" stroke="#e8833a" stroke-width="1.2" opacity="0.35" class="ok"/><text x="500" y="267.5" font-size="12" fill="#e8eaed" text-anchor="middle" opacity="0.4" class="ok">ChannelScopeHeader</text><line x1="210" y1="244" x2="570" y2="282" stroke="#e8833a" stroke-width="2.6" class="ok" stroke-linecap="round"/><line x1="210" y1="282" x2="570" y2="244" stroke="#e8833a" stroke-width="2.6" class="ok" stroke-linecap="round"/><text x="198" y="261" font-size="13" fill="#e8833a" text-anchor="end" font-weight="600">无头部</text><text x="198" y="278" font-size="13" fill="#e8833a" text-anchor="end" font-weight="600">在子 pack 上</text><rect x="610" y="216" width="334" height="112" rx="8" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/><text x="624" y="240" font-size="13" fill="#e8eaed"><tspan font-weight="700">头部字段: </tspan>单个定宽基元类型</text><text x="624" y="259" font-size="13" fill="#e8eaed">(bool, byte ... ulong, float, double);</text><text x="624" y="278" font-size="13" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[MinMax]</tspan> 收窄位宽。</text><text x="624" y="297" font-size="13" fill="#e8eaed"><tspan fill="#e8833a" font-weight="700">不允许: </tspan>nullable, string, Binary, pack,</text><text x="624" y="316" font-size="13" fill="#e8eaed">array, Map/Set, <tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[D]</tspan>, <tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[A]</tspan>, <tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[V]</tspan>, <tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[X]</tspan></text>
</g></svg>
