<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"><title>Agent 如何对 Pack Set 表达式求值</title><desc>顶部: 表达式 _&lt;(ReportTraffic, CriticalAlerts&lt;@Server&gt;, X&lt;ActiveOnly&lt;@Order&gt;&gt;)&gt; 被拆成三个元素,从左到右处理: 1 ReportTraffic 添加,2 CriticalAlerts&lt;@Server&gt; 添加,3 X&lt;ActiveOnly&lt;@Order&gt;&gt; 从工作集中移除;X&lt;&gt; 只移除它之前的内容。中部: 在一次过滤器模板调用内,参数(元组即并集,例如 @Order 与 @Server.Report)依次通过模板基列表(_&lt;SCOPE&gt;, X&lt;...&gt;),再经过 KeepName、KeepDoc、SkipName、SkipDoc 各阶段;留存的 pack 回到外层集合。名称阶段读取完整路径(例如 Server.Report.Subscribe,无命名空间);文档阶段读取文档注释池(/// 和 // 注释行加上 packs 表标签)。同类: OR;跨类: AND;模式是区分大小写、非锚定的 .NET 正则。插图: 嵌套即交集,OnlyOrders&lt;ActiveOnly&lt;@Shop&gt;&gt; 由内向外读: @Shop,然后 ActiveOnly 过滤,再 OnlyOrders 过滤。</desc><rect width="960" height="470" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="16" y="16" width="710" height="34" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/><text x="30" y="38" font-size="14" fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace"><tspan fill="#9aa0a6">_&lt;(</tspan><tspan fill="#e8eaed">ReportTraffic</tspan><tspan fill="#9aa0a6">, </tspan><tspan fill="#e8eaed">CriticalAlerts&lt;@Server&gt;</tspan><tspan fill="#9aa0a6">, </tspan><tspan fill="#e8833a">X&lt;ActiveOnly&lt;@Order&gt;&gt;</tspan><tspan fill="#9aa0a6">)&gt;</tspan></text><rect x="16" y="66" width="186" height="46" rx="6" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="34" cy="89" r="11" fill="#232323" stroke="#4fb3ff" stroke-width="1.6"/><text x="34" y="94" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="700">1</text><text x="52" y="86" font-size="13" fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ReportTraffic</text><text x="52" y="103" font-size="12" fill="#9aa0a6">一个命名 Pack Set</text><line x1="109" y1="114" x2="109" y2="136" stroke="#4fb3ff" stroke-width="2"/><path d="M109 144 L104.1 135 L114 135 Z" fill="#4fb3ff"/><text x="119" y="135" font-size="13" fill="#4fb3ff" font-weight="600">+ 添加</text><line x1="208" y1="89" x2="224" y2="89" stroke="#9aa0a6" stroke-width="1.4"/><path d="M230 89 L223 85.2 L223 92.9 Z" fill="#9aa0a6"/><rect x="236" y="66" width="236" height="46" rx="6" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="254" cy="89" r="11" fill="#232323" stroke="#4fb3ff" stroke-width="1.6"/><text x="254" y="94" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="700">2</text><text x="272" y="86" font-size="13" fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">CriticalAlerts&lt;@Server&gt;</text><text x="272" y="103" font-size="12" fill="#9aa0a6">一次过滤器模板调用</text><line x1="354" y1="114" x2="354" y2="136" stroke="#4fb3ff" stroke-width="2"/><path d="M354 144 L349.1 135 L359 135 Z" fill="#4fb3ff"/><text x="364" y="135" font-size="13" fill="#4fb3ff" font-weight="600">+ 添加</text><line x1="478" y1="89" x2="494" y2="89" stroke="#9aa0a6" stroke-width="1.4"/><path d="M500 89 L493 85.2 L493 92.9 Z" fill="#9aa0a6"/><rect x="506" y="66" width="220" height="46" rx="6" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="524" cy="89" r="11" fill="#232323" stroke="#e8833a" stroke-width="1.6"/><text x="524" y="94" font-size="13" fill="#e8833a" text-anchor="middle" font-weight="700">3</text><text x="542" y="86" font-size="13" fill="#e8833a" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">X&lt;ActiveOnly&lt;@Order&gt;&gt;</text><text x="542" y="103" font-size="12" fill="#9aa0a6">一个排除项</text><line x1="616" y1="114" x2="616" y2="136" stroke="#e8833a" stroke-width="2"/><path d="M616 144 L611.1 135 L621 135 Z" fill="#e8833a"/><text x="626" y="135" font-size="13" fill="#e8833a" font-weight="600">- 移除</text><rect x="16" y="146" width="710" height="30" rx="6" fill="#22303d" stroke="#4fb3ff" stroke-width="1.4"/><text x="712" y="166" font-size="13" fill="#4fb3ff" text-anchor="end" font-weight="600">工作集</text><text x="30" y="166" font-size="12" fill="#9aa0a6">从左到右,按书写顺序</text><text x="748" y="84" font-size="13" fill="#e8eaed"><tspan fill="#e8833a" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">X&lt;&gt;</tspan> 只移除</text><text x="748" y="102" font-size="13" fill="#e8eaed">它之前的内容</text><line x1="16" y1="196" x2="944" y2="196" stroke="#4a4a4a" stroke-width="1"/><text x="20" y="218" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">放大: 一次过滤器模板调用,例如 </tspan><tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">PublicView&lt;(@Order, @Server.Report)&gt;</tspan></text><rect x="16" y="232" width="150" height="70" rx="6" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><text x="91" y="247" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan font-weight="700">参数</tspan></text><text x="91" y="263" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">(元组 = 并集)</tspan></text><text x="91" y="279" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">@Order ∪</tspan></text><text x="91" y="295" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">@Server.Report</tspan></text><line x1="169" y1="267" x2="177" y2="267" stroke="#9aa0a6" stroke-width="1.6"/><path d="M183 267 L176 263.2 L176 270.9 Z" fill="#9aa0a6"/><rect x="186" y="232" width="150" height="70" rx="6" fill="#303236" stroke="#4a4a4a" stroke-width="1.4"/><text x="261" y="255" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan font-weight="700">模板基列表</tspan></text><text x="261" y="271" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">_&lt;SCOPE&gt;, X&lt;...&gt;</tspan></text><text x="261" y="287" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">SCOPE = 该参数</tspan></text><line x1="339" y1="267" x2="347" y2="267" stroke="#9aa0a6" stroke-width="1.6"/><path d="M353 267 L346 263.2 L346 270.9 Z" fill="#9aa0a6"/><rect x="356" y="244" width="96" height="46" rx="6" fill="#3b3424" stroke="#f2c14e" stroke-width="1.6"/><text x="404" y="272" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">KeepName</text><line x1="455" y1="267" x2="463" y2="267" stroke="#9aa0a6" stroke-width="1.6"/><path d="M469 267 L462 263.2 L462 270.9 Z" fill="#9aa0a6"/><rect x="472" y="244" width="96" height="46" rx="6" fill="#342a42" stroke="#a06fd0" stroke-width="1.6"/><text x="520" y="272" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">KeepDoc</text><line x1="571" y1="267" x2="579" y2="267" stroke="#9aa0a6" stroke-width="1.6"/><path d="M585 267 L578 263.2 L578 270.9 Z" fill="#9aa0a6"/><rect x="588" y="244" width="96" height="46" rx="6" fill="#3b3424" stroke="#f2c14e" stroke-width="1.6"/><text x="636" y="272" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">SkipName</text><line x1="687" y1="267" x2="695" y2="267" stroke="#9aa0a6" stroke-width="1.6"/><path d="M701 267 L694 263.2 L694 270.9 Z" fill="#9aa0a6"/><rect x="704" y="244" width="96" height="46" rx="6" fill="#342a42" stroke="#a06fd0" stroke-width="1.6"/><text x="752" y="272" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">SkipDoc</text><line x1="803" y1="267" x2="811" y2="267" stroke="#9aa0a6" stroke-width="1.6"/><path d="M817 267 L810 263.2 L810 270.9 Z" fill="#9aa0a6"/><rect x="820" y="232" width="122" height="70" rx="6" fill="#303236" stroke="#4fb3ff" stroke-width="1.4"/><text x="881" y="255" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan font-weight="700">留存的 pack</tspan></text><text x="881" y="271" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">回到</tspan></text><text x="881" y="287" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">外层集合</tspan></text><path d="M881 230 L881 161 L735 161" fill="none" stroke="#4fb3ff" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M728 161 L737 156.1 L737 166 Z" fill="#4fb3ff"/><rect x="344" y="352" width="214" height="54" rx="6" fill="#3b3424" stroke="#f2c14e" stroke-width="1.4"/><text x="451" y="370" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#f2c14e" font-weight="700">完整路径</tspan><tspan fill="#9aa0a6"> (无命名空间)</tspan></text><text x="451" y="388" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#9aa0a6">例如 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Server.Report.Subscribe</tspan></text><line x1="404" y1="352" x2="404" y2="320" stroke="#f2c14e" stroke-width="1.6"/><line x1="404" y1="320" x2="636" y2="320" stroke="#f2c14e" stroke-width="1.6"/><line x1="404" y1="320" x2="404" y2="299" stroke="#f2c14e" stroke-width="1.6"/><path d="M404 292 L399.6 300 L408.4 300 Z" fill="#f2c14e"/><line x1="636" y1="320" x2="636" y2="299" stroke="#f2c14e" stroke-width="1.6"/><path d="M636 292 L631.6 300 L640.4 300 Z" fill="#f2c14e"/><rect x="674" y="352" width="236" height="54" rx="6" fill="#342a42" stroke="#a06fd0" stroke-width="1.4"/><text x="792" y="370" font-size="12" fill="#e8eaed" text-anchor="middle"><tspan fill="#a06fd0" font-weight="700">文档注释池</tspan><tspan fill="#e8eaed"> = /// 和 // 注释行</tspan></text><text x="792" y="388" font-size="12" fill="#e8eaed" text-anchor="middle">+ packs 表标签</text><line x1="752" y1="352" x2="752" y2="336" stroke="#a06fd0" stroke-width="1.6"/><line x1="752" y1="336" x2="752" y2="299" stroke="#a06fd0" stroke-width="1.6"/><path d="M752 292 L747.6 300 L756.4 300 Z" fill="#a06fd0"/><line x1="752" y1="336" x2="520" y2="336" stroke="#a06fd0" stroke-width="1.6"/><path d="M520 336 L520 326 A 6 6 0 0 0 520 314" fill="none" stroke="#a06fd0" stroke-width="1.6" stroke-linejoin="round"/><line x1="520" y1="314" x2="520" y2="299" stroke="#a06fd0" stroke-width="1.6"/><path d="M520 292 L515.6 300 L524.4 300 Z" fill="#a06fd0"/><text x="632" y="432" font-size="13" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan font-weight="600">同类: OR</tspan><tspan fill="#9aa0a6">   |   </tspan><tspan font-weight="600">跨类: AND</tspan><tspan fill="#9aa0a6">   |   </tspan>区分大小写、非锚定的 .NET 正则</text><rect x="16" y="318" width="300" height="136" rx="8" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/><text x="28" y="338" font-size="13" fill="#e8eaed"><tspan font-weight="700">嵌套 = 交集</tspan></text><text x="28" y="356" font-size="13" fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">OnlyOrders&lt;ActiveOnly&lt;@Shop&gt;&gt;</text><rect x="28" y="368" width="276" height="22" rx="4" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.2" opacity="1"/><text x="36" y="383.5" font-size="12" fill="#e8eaed" xml:space="preserve"><tspan fill="#4fb3ff" font-weight="700">1  </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">@Shop</tspan><tspan fill="#9aa0a6">  Shop 的每个 pack</tspan></text><rect x="37" y="396" width="258" height="22" rx="4" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.2" opacity="1"/><text x="45" y="411.5" font-size="12" fill="#e8eaed" xml:space="preserve"><tspan fill="#4fb3ff" font-weight="700">2  </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ActiveOnly</tspan><tspan fill="#9aa0a6">  丢弃旧版 pack</tspan></text><rect x="46" y="424" width="240" height="22" rx="4" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.2" opacity="1"/><text x="54" y="439.5" font-size="12" fill="#e8eaed" xml:space="preserve"><tspan fill="#4fb3ff" font-weight="700">3  </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">OnlyOrders</tspan><tspan fill="#9aa0a6">  保留 Order.* pack</tspan></text>
</g></svg>
