<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544" role="img"><title>What each scope selects, with and without @</title><desc>Left: the tree of project Shop - top-level packs CpuStats and V1Payload, pack Order with nested Line and Cancel, host Server holding Credentials and Report with nested Subscribe and Unsubscribe, and host Client with no packs. Right: a matrix with one row per pack and the columns Order, @Order, Server, @Server, Shop, @Shop. Order selects Order. @Order selects Order.Line and Order.Cancel; Order itself, the container, is excluded. Server selects Server.Credentials and Server.Report. @Server selects those plus Server.Report.Subscribe and Server.Report.Unsubscribe. Shop selects CpuStats, V1Payload, Order, Order.Line and Order.Cancel, no pack of a host. @Shop selects all nine packs. Without @: a pack is itself, a host is the packs directly in it, a project is the packs outside hosts at any depth. With @: everything inside, the container pack itself left out.</desc><rect width="960" height="544" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
