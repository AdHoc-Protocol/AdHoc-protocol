<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 544" width="960" height="544" role="img"><title>每个作用域在有 @ 和无 @ 时选中什么</title><desc>左: 项目 Shop 的树——顶层 pack CpuStats 和 V1Payload,pack Order 嵌套 Line 和 Cancel,主机 Server 持有 Credentials 和 Report(Report 嵌套 Subscribe 和 Unsubscribe),主机 Client 无 pack。右: 一个矩阵,每个 pack 一行,列为 Order、@Order、Server、@Server、Shop、@Shop。Order 选中 Order。@Order 选中 Order.Line 和 Order.Cancel;Order 本身(容器)被排除。Server 选中 Server.Credentials 和 Server.Report。@Server 选中这些以及 Server.Report.Subscribe 和 Server.Report.Unsubscribe。Shop 选中 CpuStats、V1Payload、Order、Order.Line 和 Order.Cancel,不含任何主机的 pack。@Shop 选中全部九个 pack。无 @: pack 是自身,主机是它直接包含的 pack,项目是主机之外任意深度的 pack。有 @: 内部全部,容器 pack 本身除外。</desc><rect width="960" height="544" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
