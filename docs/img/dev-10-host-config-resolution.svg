="M340 464 L332 468.5 L332 459.5 Z" fill="#e8833a"/><text x="356" y="468" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed">Telemetry</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed"> abstract in Java, every other pack </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" font-weight="700">++</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">   (what was meant)</tspan></text><text x="40" y="494" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">The agent warns about a line that changes nothing, with its file and line.</text></svg>
