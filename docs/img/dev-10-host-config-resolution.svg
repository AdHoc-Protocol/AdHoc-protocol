<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 528" width="1000" height="528" role="img"><title>A host doc comment read top to bottom. Left: seven comment lines - InCS- with Payload, InCS+- with no references, InJAVA-- with RowsResult and Row, InJAVA+- with no references. Middle: what each reference takes in C# and Java; a marker with references gives its setting to the references below it, a marker without references passes nothing on and only proposes the default. Right: the result - Payload abstract in C# and concrete in Java, RowsResult and Row concrete in C# and abstract in Java, every other pack +- in both, the defaults from the last marker of each language, lines 3 and 7. Bottom: the default goes last - InJAVA then InJAVA- Telemetry makes every pack abstract in Java; InJAVA- Telemetry then InJAVA does what was meant.</title><rect width="1000" height="528" rx="10" fill="#2b2b2b"/><text x="24" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">How a host comment is read: references take a marker above them; the last marker is the default</text><text x="24" y="64" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="600">Host comment, top to bottom</text><text x="352" y="64" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="600">What each reference takes (C# | Java)</text><text x="668" y="64" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="600">Result on this host</text><text x="389" y="88" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" font-weight="600">C#</text><text x="449" y="88" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anc