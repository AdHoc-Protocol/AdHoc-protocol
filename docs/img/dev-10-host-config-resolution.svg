t-anchor="start">passes nothing on; the last C# marker: C# default</text><text x="24" y="222" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve">4</text><text x="48" y="222" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">&lt;see cref='InJAVA'/&gt;--</text><text x="24" y="254" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve">5</text><text x="76" y="254" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">&lt;see cref='RowsResult'/&gt;</text><rect x="362" y="239" width="54" height="22" rx="3" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="4 3"/><text x="389" y="256" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" font-weight="400">default</text><rect x="422" y="239" width="54" height="22" rx="3" fill="#5a3a22" stroke="#e8833a" stroke-width="1.6"/><text x="449" y="256" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700" xml:space="preserve">--</text><text x="24" y="286" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve">6</text><text x="76" y="286" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">&lt;see cref='Row'/&gt;</text><rect x="362" y="271" width="54" height="22" rx="3" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="4 3"/><text x="389" y="288" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" font-weight="400">default</text><rect x="422" y="271" width="54" height="22" rx="3" fill="#5a3a22" stroke="#e8833a" stroke-width="1.6"/><text x="449" y="288" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700" xml:space="preserve">--</text><text x="24" y="318" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve">7</text><text x="48" y="318" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">&lt;see cref='InJAVA'/&gt;+-</text><rect x="232" y="305" width="100" height="18" rx="9" fill="none" stroke="#9aa0a6" stroke-width="1.1"/><text x="282" y="318.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">no references</text><text x="48" y="339" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start">the last Java marker: Java default</text><path d="M362 106 L350 106 L350 138" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><line x1="350" y1="138" x2="356" y2="138" stroke="#9aa0a6" stroke-width="1.4"/><path d="M361 138 L355 141.5 L355 134.5 Z" fill="#9aa0a6"/><path d="M362 218 L350 218 L350 282" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><line x1="350" y1="250" x2="356" y2="250" stroke="#9aa0a6" stroke-width="1.4"/><path d="M361 250 L355 253.5 L355 246.5 Z" fill="#9aa0a6"/><line x1="350" y1="282" x2="356" y2="282" stroke="#9aa0a6" stroke-width="1.4"/><path d="M361 282 L355 285.5 L355 278.5 Z" fill="#9aa0a6"/><text x="488" y="142" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed">C# from line 1</tspan></text><text x="488" y="158" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">Java named only below</text><text x="4