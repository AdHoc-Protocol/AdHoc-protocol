<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img"><title>Concrete (+) and abstract (-) implementation of a pack, receiving and sending. Concrete: the parser fills a generated pack object that your code reads; your code fills a generated pack object that the serializer writes. Abstract: the parser calls a setter per field on your own object as the bytes arrive, and the serializer calls a getter per field; no generated pack object exists in either direction.</title><rect width="1000" height="420" rx="10" fill="#2b2b2b"/><text x="24" y="36" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">Who holds the data: concrete (+) or abstract (-)</text><text x="316" y="66" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0a6" text-anchor="middle" font-weight="600">Receiving</text><text x="772" y="66" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0a6" text-anchor="middle" font-weight="600">Sending</text><line x1="544" y1="54" x2="544" y2="340" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="24" y1="166" x2="976" y2="166" stroke="#4a4a4a" stroke-width="1.2"/><text x="24" y="113" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="28" fill="#e8833a" text-anchor="start" font-weight="700">+</text><text x="24" y="136" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" text-anchor="start" font-weight="600">concrete</text><rect x="104" y="84" width="66" height="64" rx="5" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="137" y="112.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">receive</text><text x="137" y="128.8" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">buffer</text><line x1="170" y1="116" x2="183" y2="116" stroke="#4fb3ff" stroke-width="2"/><path d="M190 116 L182 120.5 L182 111.5 Z" fill="#4fb3ff"/><rect x="190" y="84" width="74" height="64" rx="5" fill="#353535" stroke="#9aa0a6" stroke-width="1.6"/><text x="227" y="112.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">generated</text><text x="227" y="128.8" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">parser</text><line x1="264" y1="116" x2="277" y2="116" stroke="#4fb3ff" stroke-width="2"/><path d="M284 116 L276 120.5 L276 111.5 Z" fill="#4fb3ff"/><rect x="284" y="84" width="108" height="64" rx="5" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/><text x="338" y="104" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">generated</text><text x="338" y="120.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">pack object</text><text x="338" y="137" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle">all fields stored</text><line x1="392" y1="116" x2="405" y2="116" stroke="#4fb3ff" stroke-width="2"/><path d="M412 116 L404 120.5 L404 111.5 Z" fill="#4fb3ff"/><rect x="412" y="84" width="116" height="64" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="470" y="112.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">your code</text><text x="470" y="128.8" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">reads the fields</text><rect x="560" y="84" width="116" height="64" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="618" y="112.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,s