<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 584" width="1000" height="584" role="img"><title>Top, in the description: host Client (L, the first type argument) and host Server (R, the second) joined by one connection, interface Session : Connects&lt;Client, Server&gt;, which holds lanes for Actor0 (the states declared in the body), a named actor and an RPC actor, and carries packs of both directions. Bottom, at run time on each host: the transport, External, seated by External(ext) under the generated Connection, Internal, which holds a transmitter, a receiver and the actors; an event goes through OnExternalEvent first to the actors, then to Connection.OnEvent.handlers; OnOpen and OnClose come once per network connection.</title><rect width="1000" height="584" rx="10" fill="#2b2b2b"/><text x="24" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="600">In the description</text><rect x="24" y="152" width="124" height="68" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="86" y="183" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle">host Client</text><text x="86" y="202" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">struct : Host</text><rect x="852" y="152" width="124" height="68" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="914" y="183" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle">host Server</text><text x="914" y="202" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">struct : Host</text><rect x="196" y="54" width="608" height="206" rx="7" fill="#262626" stroke="#e8eaed" stroke-width="1.4"/><text x="500" y="80" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700" xml:space="preserve">interface Session : Connects&lt;Client, Server&gt;</text><text x="210" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start">L - first type argument</text><text x="790" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#4fb3ff" text-anchor="end">R - second type argument</text><line x1="148" y1="186" x2="196" y2="186" stroke="#e8833a" stroke-width="2"/><circle cx="172" cy="186" r="10" fill="#2b2b2b" stroke="#e8833a" stroke-width="1.5"/><text x="172" y="190.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="middle" font-weight="700">L</text><line x1="804" y1="186" x2="852" y2="186" stroke="#4fb3ff" stroke-width="2"/><circle cx="828" cy="186" r="10" fill="#2b2b2b" stroke="#4fb3ff" stroke-width="1.5"/><text x="828" y="190.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff" text-anchor="middle" font-weight="700">R</text><rect x="210" y="114" width="452" height="38" rx="5" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><text x="222" y="137.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="600">Actor0</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> - the states declared in the body</tspan></text><rect x="484" y="120" width="64" height="26" rx="13" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.3"/><text x="516" y="137.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Open</text><rect x="558" y="120" width="84" height="26" rx="13" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.3"/><text x="600" y="137.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Working</text><rect x="210" y="160" width="452" height="38" rx="5" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><text x="222" y="183.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="600">named actor</tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6">  interface Notify : Actor</tspan></text><rect x="484" y="166" width="90" height="26" rx="13" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.3"/><text x="529" y="183.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Messages</text><rect x="584" y="166" width="62" height="26" rx="13" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.3"/><text x="615" y="183.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Flags</text><rect x="210" y="206" width="452" height="38" rx="5" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><text x="222" y="229.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="600">RPC actor</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> - a method in the body</tspan></text><rect x="484" y="212" width="126" height="26" rx="13" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.3"/><text x="547" y="229.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">ping(Ping req)</text><text x="733" y="164" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">packs of</text><text x="733" y="180" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">both directions</text><line x1="689" y1="198" x2="777" y2="198" stroke="#f2c14e" stroke-width="2"/><path d="M784 198 L776 202.5 L776 193.5 Z" fill="#f2c14e"/><path d="M682 198 L690 193.5 L690 202.5 Z" fill="#f2c14e"/><text x="500" y="282" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">one connection per pair of hosts</text><line x1="24" y1="302" x2="976" y2="302" stroke="#4a4a4a" stroke-width="1.2"/><text x="24" y="330" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="600">At run time, on each host</text><rect x="24" y="370" width="190" height="122" rx="6" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="38" y="394" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">External = the transport</text><text x="38" y="418" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">TCP / WebSocket /</text><text x="38" y="434" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">tunnel endpoint</text><text x="38" y="458" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">Close()  Abort()</text><text x="38" y="475" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">the two timeouts</text><rect x="380" y="350" width="440" height="204" rx="7" fill="#2f2a26" stroke="#e8833a" stroke-width="1.8"/><text x="396" y="376" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">generated Connection = Internal</text><rect x="396" y="390" width="204" height="30" rx="4" fill="#383838" stroke="#9aa0a6" stroke-width="1.2"/><text x="498" y="409.5" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed">transmitter</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed">: bytes to send</tspan></text><rect x="612" y="390" width="192" height="30" rx="4" fill="#383838" stroke="#9aa0a6" stroke-width="1.2"/><text x="708" y="409.5" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed">receiver</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed">: bytes received</tspan></text><rect x="396" y="434" width="252" height="24" rx="12" fill="#3a2c20" stroke="#e8833a" stroke-width="1.2"/><text x="522" y="450.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">OnExternalEvent(connection, event)</text><rect x="396" y="482" width="190" height="44" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.3"/><text x="491" y="500" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">actors</text><text x="491" y="517" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">start state on connect</text><rect x="602" y="482" width="202" height="44" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="703" y="500" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">Connection.OnEvent.handlers</text><text x="703" y="517" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">your code</text><line x1="480" y1="458" x2="480" y2="476" stroke="#e8833a" stroke-width="1.8"/><path d="M480 482 L476 475 L484 475 Z" fill="#e8833a"/><circle cx="500" cy="471" r="9" fill="#e8833a"/><text x="500" y="475.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1e1e1e" text-anchor="middle" font-weight="700">1</text><line x1="630" y1="458" x2="630" y2="476" stroke="#e8833a" stroke-width="1.8"/><path d="M630 482 L626 475 L634 475 Z" fill="#e8833a"/><circle cx="650" cy="471" r="9" fill="#e8833a"/><text x="650" y="475.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1e1e1e" text-anchor="middle" font-weight="700">2</text><rect x="536" y="543" width="272" height="22" rx="11" fill="#3a2c20" stroke="#e8833a" stroke-width="1.2"/><text x="672" y="558" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed">OnOpen() / OnClose()</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed">: once per connection</tspan></text><line x1="214" y1="405" x2="380" y2="405" stroke="#9aa0a6" stroke-width="3"/><circle cx="214" cy="405" r="4" fill="#9aa0a6"/><circle cx="380" cy="405" r="4" fill="#9aa0a6"/><text x="297" y="396" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed">External(ext)</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed"> seats it</tspan></text><text x="297" y="424" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed">External(null)</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed"> unseats it</tspan></text><line x1="214" y1="446" x2="388" y2="446" stroke="#e8833a" stroke-width="2"/><path d="M395 446 L387 450.5 L387 441.5 Z" fill="#e8833a"/><text x="295" y="468" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">events: connect,</text><text x="295" y="484" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">close, timeout</text><text x="840" y="432" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">Own port or shared port:</text><text x="840" y="448" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">decided at deployment</text><text x="840" y="464" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">(Multiplexing)</text></svg>
