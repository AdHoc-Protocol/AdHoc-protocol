<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img"><title>A timeline of two states on one connection. State A carries [TransmitTimeout(12)] and the left host sends in it: on entry the left host writes Transmit 12 s, Receive no limit, and the right host writes Transmit no limit, Receive 60 s (default). State B carries [ReceiveTimeout(30)] and the right host sends: the left host writes Transmit no limit, Receive 30 s; the right host writes Transmit 60 s (default), Receive no limit. A third lane shows the left host's one pair of values on the connection, replaced at each entry, and overwritten in the middle of state B when another actor enters its own state: the last state entered wins for every actor on the connection.</title><rect width="1000" height="430" rx="10" fill="#2b2b2b"/><text x="24" y="36" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">Connection timeouts are written on state entry, per side</text><path d="M846 31 L838 36 L838 26 Z" fill="#e8eaed"/><text x="852" y="36" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">written on entry</text><rect x="190" y="52" width="388" height="46" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/><text x="204" y="71" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" font-weight="600">state A</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">   </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" font-weight="700">[TransmitTimeout(12)]</tspan></text><text x="204" y="89" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start">the left host sends in it</text><rect x="582" y="52" width="394" height="46" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/><text x="596" y="71" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" font-weight="600">state B</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">   </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" font-weight="700">[ReceiveTimeout(30)]</tspan></text><text x="596" y="89" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start">the right host sends in it</text><text x="24" y="137" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">Left host</text><text x="24" y="189" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">Right host</text><rect x="190" y="110" width="388" height="44" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><path d="M204 132 L196 137 L196 127 Z" fill="#e8eaed"/><text x="216" y="136.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">12 s</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">   ·   </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan></text><rect x="582" y="110" width="394" height="44" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><path d="M596 132 L588 137 L588 127 Z" fill="#e8eaed"/><text x="608" y="136.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">   ·   </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">30 s</tspan></text><rect x="190" y="162" width="388" height="44" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><path d="M204 184 L196 189 L196 179 Z" fill="#e8eaed"/><text x="216" y="188.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">   ·   </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" font-style="italic">60 s (default)</tspan></text><rect x="582" y="162" width="394" height="44" rx="4" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><path d="M596 184 L588 189 L588 179 Z" fill="#e8eaed"/><text x="608" y="188.5" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" font-style="italic">60 s (default)</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">   ·   </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan></text><text x="24" y="270" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">the connection's</text><text x="24" y="286" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">one pair of values</text><text x="24" y="302" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">(left host)</text><rect x="190" y="256" width="388" height="52" rx="4" fill="#303030" stroke="#9aa0a6" stroke-width="1.2"/><path d="M204 282 L196 287 L196 277 Z" fill="#e8eaed"/><text x="216" y="277" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">12 s</tspan></text><text x="216" y="295" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan></text><rect x="582" y="256" width="188" height="52" rx="4" fill="#303030" stroke="#9aa0a6" stroke-width="1.2"/><path d="M596 282 L588 287 L588 277 Z" fill="#e8eaed"/><text x="608" y="277" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan></text><text x="608" y="295" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">30 s</tspan></text><rect x="774" y="256" width="202" height="52" rx="4" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><path d="M788 282 L780 287 L780 277 Z" fill="#e8833a"/><text x="800" y="277" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Transmit </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" font-weight="700">no limit</tspan></text><text x="800" y="295" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">Receive </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" font-style="italic">60 s (default)</tspan></text><line x1="772" y1="226" x2="772" y2="254" stroke="#e8833a" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M772 254 L766.5 245 L777.5 245 Z" fill="#e8833a"/><text x="784" y="240" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" text-anchor="start">another actor enters its state</text><text x="976" y="330" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="end" font-weight="600">last state entered wins - for every actor on the connection</text><line x1="190" y1="356" x2="969" y2="356" stroke="#9aa0a6" stroke-width="1.5"/><path d="M976 356 L968 360.5 L968 351.5 Z" fill="#9aa0a6"/><text x="24" y="360.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">time</text><text x="24" y="392" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">ReceiveTimeout</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> restarts with every byte received. When a limit runs out, the transport asks </tspan></text><text x="24" y="410" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">OnReceiveTimeout()</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> / </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">OnTransmitTimeout()</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">; the default answer, 0, closes the connection as a loss.</tspan></text></svg>
