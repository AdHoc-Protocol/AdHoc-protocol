<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img"><title>A timeline of one connection with two receive timeouts. Above, the declarations: [ReceiveTimeout(15)] on the connection is the link, any byte restarts it, Pulse_ too; [ReceiveTimeout(20)] on the state Waiting is the stage, only a pack of the peer restarts it. The line carries a Question at 0 s and then nothing but Pulse_ at 5, 10, 15 and 20 s: the side that accepted the connection says it every third of 15 s and the side that dialed answers. The link lane restarts at every Pulse_ and never runs out while the peer is there; a dead peer is noticed in 15 s. The stage lane runs from 0 to 20 s through the Pulse_ marks, which do not restart it, and at 20 s OnReceiveTimeout() is asked: 0 closes the connection as a receive timeout. Footer: on the connection 60 s when absent, set once per session; on a state no limit when absent, set as the state is entered; Pulse_ is a service pack the generator adds, TCP and WebSocket only, nothing on a line that carries packs.</title><rect width="1000" height="470" rx="10" fill="#2b2b2b"/><text x="24" y="36" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">Two receive timeouts: the link and the stage</text><rect x="190" y="54" width="384" height="50" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/><text x="204" y="74" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" font-weight="700">[ReceiveTimeout(15)]</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">  on the connection</tspan></text><text x="204" y="93" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start">the link: any byte restarts it - Pulse_ too</text><rect x="582" y="54" width="384" height="50" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/><text x="596" y="74" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" font-weight="700">[ReceiveTimeout(20)]</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">  on the state Waiting</tspan></text><text x="596" y="93" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="start">the stage: only a pack of the peer restarts it</text><text x="24" y="146" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">the line</text><text x="24" y="162" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">Question, then silence</text><rect x="190" y="134" width="78" height="24" rx="4" fill="#203d56" stroke="#4fb3ff" stroke-width="1.3"/><text x="199" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">Question</text><rect x="319.2" y="134" width="52" height="24" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.2"/><text x="345.2" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle">Pulse_</text><rect x="474.4" y="134" width="52" height="24" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.2"/><text x="500.4" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle">Pulse_</text><rect x="629.6" y="134" width="52" height="24" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.2"/><text x="655.6" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle">Pulse_</text><rect x="784.8" y="134" width="52" height="24" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.2"/><text x="810.8" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle">Pulse_</text><text x="966" y="176" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="end">the side that accepted says Pulse_ every third of 15 s; the side that dialed answers</text><text x="24" y="226" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">the link  15 s</text><text x="24" y="242" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">any byte restarts it</text><rect x="192" y="214" width="151.2" height="16" rx="3" fill="#203d56" stroke="#4fb3ff" stroke-width="1"/><line x1="345.2" y1="210" x2="345.2" y2="234" stroke="#f2c14e" stroke-width="1.5"/><rect x="347.2" y="214" width="151.2" height="16" rx="3" fill="#203d56" stroke="#4fb3ff" stroke-width="1"/><line x1="500.4" y1="210" x2="500.4" y2="234" stroke="#f2c14e" stroke-width="1.5"/><rect x="502.4" y="214" width="151.2" height="16" rx="3" fill="#203d56" stroke="#4fb3ff" stroke-width="1"/><line x1="655.6" y1="210" x2="655.6" y2="234" stroke="#f2c14e" stroke-width="1.5"/><rect x="657.6" y="214" width="151.2" height="16" rx="3" fill="#203d56" stroke="#4fb3ff" stroke-width="1"/><line x1="810.8" y1="210" x2="810.8" y2="234" stroke="#f2c14e" stroke-width="1.5"/><rect x="812.8" y="214" width="151.2" height="16" rx="3" fill="#203d56" stroke="#4fb3ff" stroke-width="1"/><line x1="966" y1="210" x2="966" y2="234" stroke="#f2c14e" stroke-width="1.5"/><text x="966" y="250" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#4fb3ff" text-anchor="end">never runs out while the peer is there: a dead peer is noticed in 15 s</text><text x="24" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600">the stage  20 s</text><text x="24" y="316" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">packs of the peer only</text><rect x="192" y="288" width="618.8" height="16" rx="3" fill="#4a3322" stroke="#e8833a" stroke-width="1.4"/><text x="345.2" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">Pulse_ - no restart</text><text x="500.4" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">Pulse_ - no restart</text><text x="655.6" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">Pulse_ - no restart</text><line x1="810.8" y1="280" x2="810.8" y2="312" stroke="#e8833a" stroke-width="2"/><text x="820.8" y="294" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8833a">OnReceiveTimeout()</tspan></text><text x="820.8" y="311" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start">0: closed as a receive timeout</text><line x1="190" y1="346" x2="959" y2="346" stroke="#9aa0a6" stroke-width="1.5"/><path d="M966 346 L958 350.5 L958 341.5 Z" fill="#9aa0a6"/><text x="24" y="350.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">time</text><line x1="190" y1="342" x2="190" y2="350" stroke="#9aa0a6" stroke-width="1.2"/><text x="190" y="366" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">0 s</text><line x1="345.2" y1="342" x2="345.2" y2="350" stroke="#9aa0a6" stroke-width="1.2"/><text x="345.2" y="366" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">5 s</text><line x1="500.4" y1="342" x2="500.4" y2="350" stroke="#9aa0a6" stroke-width="1.2"/><text x="500.4" y="366" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">10 s</text><line x1="655.6" y1="342" x2="655.6" y2="350" stroke="#9aa0a6" stroke-width="1.2"/><text x="655.6" y="366" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">15 s</text><line x1="810.8" y1="342" x2="810.8" y2="350" stroke="#9aa0a6" stroke-width="1.2"/><text x="810.8" y="366" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">20 s</text><text x="24" y="400" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" font-weight="600">On the connection</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> - 60 s when absent, set once per session. </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" font-weight="600">On a state</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> - no limit when absent, set as the state is entered.</tspan></text><text x="24" y="420" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">Either one that runs out asks </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">OnReceiveTimeout()</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> how much longer to wait; the default answer, 0, closes the connection as a loss.</tspan></text><text x="24" y="440" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Pulse_ is a service pack the generator adds: TCP and WebSocket only, nothing on a line that carries packs.</text></svg>
