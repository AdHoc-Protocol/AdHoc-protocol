<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" width="960" height="350" role="img"><title>Two processes run the same generated module of host Broker over one socket. The process that dialed is the Left side and sends Append; the process that accepted is the Right side and answers with Ack. Under each process, the actor-instance id space is split in two: the left process uses the left half, the right process the right half, so instances opened at both ends at once never share an id. Decided once when the socket connects; nothing is added per pack.</title><rect width="960" height="350" rx="10" fill="#2b2b2b"/><text x="24" y="36" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" font-weight="600">A host connected to itself: </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="17" fill="#e8eaed" font-weight="700">Connects&lt;Broker, Broker&gt;</tspan></text><rect x="24" y="66" width="290" height="124" rx="6" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="169" y="96" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">process</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed"> - host </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" font-weight="600">Broker</tspan></text><text x="169" y="118" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="middle">the same generated module</text><rect x="64" y="136" width="210" height="30" rx="15" fill="#2b2b2b" stroke="#e8833a" stroke-width="1.4"/><text x="169" y="156" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8833a" text-anchor="middle" font-weight="600">dialed  →  Left side</text><rect x="646" y="66" width="290" height="124" rx="6" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="791" y="96" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#c9d1d9">process</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed"> - host </tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" font-weight="600">Broker</tspan></text><text x="791" y="118" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#c9d1d9" text-anchor="middle">the same generated module</text><rect x="686" y="136" width="210" height="30" rx="15" fill="#2b2b2b" stroke="#4fb3ff" stroke-width="1.4"/><text x="791" y="156" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" text-anchor="middle" font-weight="600">accepted  →  Right side</text><line x1="314" y1="128" x2="438" y2="128" stroke="#9aa0a6" stroke-width="6" stroke-linecap="butt"/><line x1="522" y1="128" x2="646" y2="128" stroke="#9aa0a6" stroke-width="6" stroke-linecap="butt"/><text x="480" y="132.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">one socket</text><line x1="330" y1="104" x2="623" y2="104" stroke="#e8833a" stroke-width="2"/><path d="M630 104 L622 108.5 L622 99.5 Z" fill="#e8833a"/><text x="480" y="94" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" font-weight="700">Append</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed"> - sent by Left (the caller)</tspan></text><line x1="630" y1="152" x2="337" y2="152" stroke="#4fb3ff" stroke-width="2"/><path d="M330 152 L338 147.5 L338 156.5 Z" fill="#4fb3ff"/><text x="480" y="174" text-anchor="middle" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" font-weight="700">Ack</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed"> - sent by Right (the acceptor)</tspan></text><text x="24" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">actor-instance ids</text><rect x="169" y="240" width="145" height="30" rx="0" fill="none" stroke="#4a4a4a" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="24" y="240" width="145" height="30" rx="0" fill="#e8833a" stroke="#e8833a" stroke-width="1.5" fill-opacity="0.35"/><text x="96.5" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">its ids</text><text x="241.5" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">right half</text><text x="646" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start">actor-instance ids</text><rect x="646" y="240" width="145" height="30" rx="0" fill="none" stroke="#4a4a4a" stroke-width="1.3" stroke-dasharray="4 3"/><rect x="791" y="240" width="145" height="30" rx="0" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="1.5" fill-opacity="0.35"/><text x="863.5" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">its ids</text><text x="718.5" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">left half</text><text x="480" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">instances opened at both ends</text><text x="480" y="264" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">at the same moment never share an id</text><text x="480" y="320" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">Decided once, when the socket connects. Nothing is added per pack.</text></svg>
