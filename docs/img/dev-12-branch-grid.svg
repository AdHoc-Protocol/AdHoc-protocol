<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 478" width="1000" height="478" role="img"><rect width="1000" height="478" rx="10" fill="#2b2b2b"/><title>The five routing attributes: the letter position names the sender, the letter case says whether the sender leads and moves the state</title>
<text x="24" y="40" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">Routing attributes: who sends, and whether the state moves</text>
<text x="306" y="80" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" text-anchor="middle" font-weight="600">Left host sends</text>
<text x="306" y="98" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">first host of Connects&lt;L, R&gt;</text>
<text x="576" y="80" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#4fb3ff" text-anchor="middle" font-weight="600">Right host sends</text>
<text x="576" y="98" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">second host</text>
<text x="846" y="80" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#a06fd0" text-anchor="middle" font-weight="600">Either host sends</text>
<text x="846" y="98" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">Left or Right</text>
<text x="24" y="150" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="start" font-weight="600">UPPER case</text>
<text x="24" y="169" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">= transitional</text>
<text x="24" y="192" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the sender leads</text>
<text x="24" y="207" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the state</text>
<text x="24" y="276" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="start" font-weight="600">lower case</text>
<text x="24" y="295" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">= stay</text>
<text x="24" y="318" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the state does</text>
<text x="24" y="333" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">not change</text>
<rect x="176" y="112" width="260" height="116" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<rect x="446" y="112" width="260" height="116" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<rect x="716" y="112" width="260" height="116" rx="6" fill="none" stroke="#4a4a4a" stroke-width="1.5" stroke-dasharray="6 5"/>
