<text x="305" y="203" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">the state moves</text>
<text x="576" y="144" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#4fb3ff" text-anchor="middle" xml:space="preserve" style="white-space:pre">[____________R&lt;Target, PACKS&gt;]</text>
<rect x="458" y="164" width="58" height="44" rx="6" fill="#363a40" stroke="#7d858f" stroke-width="1.6"/><text x="487" y="191" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">State</text>
<rect x="634" y="164" width="60" height="44" rx="6" fill="#363a40" stroke="#7d858f" stroke-width="1.6"/><text x="664" y="191" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Target</text>
<path d="M516 186 L626 186" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M634 186 L625 190.5 L625 181.5 Z" fill="#4fb3ff"/>
<text x="575" y="178" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#4fb3ff" text-anchor="middle">Right sends a pack</text>
<text x="575" y="203" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">the state moves</text>
<text x="846" y="144" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#6f747a" text-anchor="middle" xml:space="preserve" style="white-space:pre">[_____LR_____&lt;Target, PACKS&gt;]</text>
<line x1="738.325" y1="139" x2="953.675" y2="139" stroke="#9aa0a6" stroke-width="1.6"/>
<text x="846" y="176" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">no transitional form:</text>
<text x="846" y="194" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">a transition always</text>
<text x="846" y="212" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">belongs to one side</text>
<text x="306" y="270" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8833a" text-anchor="middle" xml:space="preserve" style="white-space:pre">[l____________&lt;PACKS&gt;]</text>
