<text x="852" y="308" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#a06fd0" text-anchor="start">either side sends</text>
<text x="852" y="326" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the state stays</text>
<rect x="24" y="370" width="952" height="92" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<text x="40" y="396" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan fill="#e8eaed" font-weight="600">letter position</tspan><tspan fill="#9aa0a6"> = sender</tspan><tspan fill="#9aa0a6">      ·      </tspan><tspan fill="#e8eaed" font-weight="600">letter case</tspan><tspan fill="#9aa0a6"> = authority</tspan></text>
<text x="40" y="420" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan >every form also exists without </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">&lt;PACKS&gt;</tspan><tspan > and takes </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">(KeepDoc, SkipDoc, KeepName, SkipName)</tspan></text>
<text x="40" y="447" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" xml:space="preserve" style="white-space:pre"><tspan >One state, one leading side: </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">L____________</tspan><tspan > and </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">____________R</tspan><tspan > on the same state is an error.</tspan></text>
</svg>
