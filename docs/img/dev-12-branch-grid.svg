<path d="M270 302 L300 302 L300 322 L278 322" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M270 322 L279 317.5 L279 326.5 Z" fill="#e8833a"/>
<text x="312" y="308" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start">Left sends a pack</text>
<text x="312" y="326" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the state stays</text>
<text x="576" y="270" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#4fb3ff" text-anchor="middle" xml:space="preserve" style="white-space:pre">[____________r&lt;PACKS&gt;]</text>
<rect x="468" y="290" width="72" height="44" rx="6" fill="#363a40" stroke="#7d858f" stroke-width="1.6"/><text x="504" y="317" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">State</text>
<path d="M540 302 L570 302 L570 322 L548 322" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M540 322 L549 317.5 L549 326.5 Z" fill="#4fb3ff"/>
<text x="582" y="308" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#4fb3ff" text-anchor="start">Right sends a pack</text>
<text x="582" y="326" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the state stays</text>
<text x="846" y="270" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#a06fd0" text-anchor="middle" xml:space="preserve" style="white-space:pre">[_____lr_____&lt;PACKS&gt;]</text>
<rect x="738" y="290" width="72" height="44" rx="6" fill="#363a40" stroke="#7d858f" stroke-width="1.6"/><text x="774" y="317" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">State</text>
