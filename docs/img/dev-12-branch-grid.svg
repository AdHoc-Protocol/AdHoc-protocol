<rect x="188" y="164" width="58" height="44" rx="6" fill="#363a40" stroke="#7d858f" stroke-width="1.6"/><text x="217" y="191" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">State</text>
