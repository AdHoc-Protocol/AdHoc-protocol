<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" width="960" height="680" role="img"><title>Two hosts joined by one connection: what exists on each host for each actor kind - Actor0 as one pair for the connection, a function-group actor as one shared object per host serving every connection, an RPC call as a registered caller instance and a pooled unregistered replier context, a stateful swarm as one instance pair per conversation, a multicast actor as instance pairs plus one group address that fans a cast out to all members</title><rect width="960" height="680" rx="10" fill="#2b2b2b"/><text x="24" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="16" fill="#e8eaed" text-anchor="start" font-weight="600">What exists on each host, per actor kind</text><text x="185" y="62" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Client (Left host)</text><text x="480" y="62" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">one connection</text><text x="775" y="62" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Server (Right host)</text><text x="40" y="93" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8833a" font-weight="700">Actor0</tspan></text><text x="920" y="93" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">Acquire(conn) returns the connection&#39;s own Actor0</text><rect x="40" y="102" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><rect x="340" y="102" width="280" height="88" rx="6" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="630" y="102" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><text x="40" y="211" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" font-weight="700">Function-group actor</tspan></text><text x="920" y="211" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">one shared object per host, for every connection - it never ends</text><rect x="40" y="220" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><rect x="340" y="220" width="280" height="88" rx="6" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="630" y="220" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><text x="40" y="329" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#a06fd0" font-weight="700">RPC actor</tspan></text><text x="920" y="329" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">caller: one instance per call - replier: one pooled context per request</text><rect x="40" y="338" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><rect x="340" y="338" width="280" height="88" rx="6" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="630" y="338" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><text x="40" y="447" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8833a" font-weight="700">Stateful swarm</tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">   MaxActiveInstances =&gt; 8</tspan></text><text x="920" y="447" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">a pair per conversation - up to 8 per connection - Acquire returns null at the limit</text><rect x="40" y="456" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><rect x="340" y="456" width="280" height="88" rx="6" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="630" y="456" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><text x="40" y="565" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" font-weight="700">Multicast</tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">   MaxActiveInstances =&gt; +4</tspan></text><text x="920" y="565" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">one pack sent, every member receives it</text><rect x="40" y="574" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><rect x="340" y="574" width="280" height="88" rx="6" fill="none" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="6 4"/><rect x="630" y="574" width="290" height="88" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><rect x="200" y="128" width="118" height="36" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="259" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Actor0</text><rect x="642" y="128" width="118" height="36" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="701" y="151" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Actor0</text><line x1="318" y1="146" x2="642" y2="146" stroke="#e8833a" stroke-width="2.2"/><text x="480" y="137" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">one pair per connection</text><text x="480" y="167" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">lives as long as the connection</text><rect x="52" y="241" width="140" height="46" rx="5" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="122" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Notify.one</text><text x="122" y="278" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">(static, shared)</text><rect x="768" y="241" width="140" height="46" rx="5" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="838" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Notify.one</text><text x="838" y="278" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">(static, shared)</text><line x1="192" y1="264" x2="262" y2="237" stroke="#f2c14e" stroke-width="1.1"/><line x1="768" y1="264" x2="698" y2="237" stroke="#f2c14e" stroke-width="1.1"/><rect x="262" y="227" width="56" height="20" rx="3" fill="#46401f" stroke="#f2c14e" stroke-width="1.2"/><text x="290" y="242" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">conn 1</text><rect x="642" y="227" width="56" height="20" rx="3" fill="#46401f" stroke="#f2c14e" stroke-width="1.2"/><text x="670" y="242" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">conn 1</text><line x1="192" y1="264" x2="262" y2="264" stroke="#f2c14e" stroke-width="1.1"/><line x1="768" y1="264" x2="698" y2="264" stroke="#f2c14e" stroke-width="1.1"/><rect x="262" y="254" width="56" height="20" rx="3" fill="#2e2e2e" stroke="#9aa0a6" stroke-width="1.2"/><text x="290" y="269" font-family="Segoe UI,Deja