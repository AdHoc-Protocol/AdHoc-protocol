 y="375" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">ping context</text><text x="736" y="393" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">pooled, not registered</text><path d="M318 368 L634 368" fill="none" stroke="#4fb3ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M642 368 L633 372.5 L633 363.5 Z" fill="#4fb3ff"/><path d="M642 392 L326 392" fill="none" stroke="#4fb3ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M318 392 L327 387.5 L327 396.5 Z" fill="#4fb3ff"/><text x="480" y="361" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff">Ping</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed"> (carries the caller instance&#39;s address)</tspan></text><text x="480" y="410" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff">Pong</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed"> (to that address)</tspan></text><text x="736" y="420" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">Release() after the reply is out</text><rect x="218" y="464" width="100" height="22" rx="4" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="268" y="480" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Job #1</text><rect x="642" y="464" width="100" height="22" rx="4" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="692" y="480" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Job #1</text><line x1="318" y1="475" x2="642" y2="475" stroke="#e883