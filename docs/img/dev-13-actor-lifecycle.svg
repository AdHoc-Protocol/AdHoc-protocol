<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img"><title>Lifecycle of one actor instance: opened from the pool by Acquire or by the first pack from the peer, limit checks on both paths, the states with their injection points, four ways to end, and Release returning the instance to the pool</title><rect width="980" height="620" rx="10" fill="#2b2b2b"/><rect x="30" y="270" width="110" height="60" rx="8" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="85" y="296" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">pool</text><text x="85" y="314" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">idle instances</text><rect x="115" y="146" width="150" height="48" rx="16" fill="#333333" stroke="#9aa0a6" stroke-width="1.6"/><text x="190" y="165.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">limit reached?</text><text x="190" y="184.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">Check limit</text><rect x="115" y="406" width="150" height="48" rx="16" fill="#333333" stroke="#9aa0a6" stroke-width="1.6"/><text x="190" y="425.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">peer over the limit?</text><text x="190" y="444.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">Check limit</text><path d="M140 286 L190 286 L190 202" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M190 194 L194.5 203 L185.5 203 Z" fill="#4fb3ff"/><path d="M140 314 L190 314 L190 398" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M190 406 L185.5 397 L194.5 397 Z" fill="#4fb3ff"/><text x="202" y="232" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">Acquire(conn)</text><text x="202" y="250" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">this side opens</text><text x="202" y="342" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">first pack of a new</text><text x="202" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">conversation from</text><text x="202" y="378" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">the peer (epoch 0)</text><path d="M190 146 L190 106" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M190 98 L194.5 107 L185.5 107 Z" fill="#e8833a"/><text x="198" y="128" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start">yes</text><rect x="70" y="40" width="240" height="58" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="190" y="65" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">null / undefined: refused</text><text x="190" y="83" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">the connection goes on</text><path d="M190 454 L190 482" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M190 490 L185.5 481 L194.5 481 Z" fill="#e8833a"/><text x="198" y="477" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start">yes</text><rect x="100" y="490" width="180" height="36" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="190" y="513" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">connection aborted</text><path d="M265 430 L352 430 L352 170" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M265 170 L396 170" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M404 170 L395 174.5 L395 165.5 Z" fill="#4fb3ff"/><circle cx="352" cy="170" r="3.5" fill="#4fb3ff"/><text x="277" y="162" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">no</text><text x="277" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">no</text><rect x="372" y="110" width="262" height="310" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.3"/><text x="384" y="132" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">states</text><rect x="404" y="150" width="160" height="40" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="484" y="175" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">start state</text><rect x="404" y="352" width="160" height="40" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="484" y="377" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">next state ...</text><path d="M428 190 L428 344" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M428 352 L423.5 343 L432.5 343 Z" fill="#4fb3ff"/><text x="440" y="214" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">a transitional pack</text><text x="440" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">arrives or goes out</text><text x="440" y="256" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">Actor OnNewState</text><text x="440" y="280" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">&lt;Pack&gt; OnReceived Event</text><text x="440" y="297" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">&lt;Pack&gt; OnSerialized Event</text><text x="440" y="322" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">OnActivate code</text><rect x="664" y="100" width="270" height="52" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="122" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">transition to End</text><text x="676" y="140" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">END OnActivate</text><path d="M634 126 L656 126" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 126 L655 130.5 L655 121.5 Z" fill="#4fb3ff"/><line x1="934" y1="126" x2="954" y2="126" stroke="#4fb3ff" stroke-width="2"/><rect x="664" y="166" width="270" height="70" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="188" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">transition to Close</text><text x="676" y="206" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">CLOSE OnActivate</text><text x="676" y="224" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">queue drained, connection closes</text><path d="M634 201 L656 201" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 201 L655 205.5 L655 196.5 Z" fill="#4fb3ff"/><line x1="934" y1="201" x2="954" y2="201" stroke="#4fb3ff" stroke-width="2"/><rect x="664" y="250" width="270" height="88" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="272" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">[Deadline] / [Idle] ran out</text><text x="676" y="290" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">Actor OnDeadline</text><text x="676" y="308" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">default: Release(conn)</text><text x="676" y="326" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Actor0: closes the connection</text><path d="M634 294 L656 294" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 294 L655 298.5 L655 289.5 Z" fill="#4fb3ff"/><line x1="934" y1="294" x2="954" y2="294" stroke="#4fb3ff" stroke-width="2"/><rect x="664" y="352" width="270" height="52" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="374" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">connection lost</text><text x="676" y="392" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">socket error, peer gone, timeout</text><path d="M634 378 L656 378" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 378 L655 382.5 L655 373.5 Z" fill="#4fb3ff"/><path d="M676 404 L676 487" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M676 437 L682 437" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M688 437 L681 440.5 L681 433.5 Z" fill="#9aa0a6"/><path d="M676 487 L682 487" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M688 487 L681 490.5 L681 483.5 Z" fill="#9aa0a6"/><rect x="688" y="416" width="246" height="42" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.1" stroke-dasharray="4 3"/><text x="698" y="433" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">[Resumable]</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> → session parked;</tspan></text><text x="698" y="450" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">the actor hears nothing</text><rect x="688" y="466" width="246" height="42" rx="4" fill="#323232" stroke="#e8eaed" stroke-width="1.1"/><text x="698" y="483" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">otherwise, or the wait runs out:</text><text x="698" y="500" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">close event → </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e">OnClose</tspan></text><rect x="560" y="530" width="404" height="56" rx="6" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="762" y="553.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">Release</text><text x="762" y="572.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">leave group - unregister - reset to start state</text><path d="M954 126 L954 522" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M954 530 L949.5 521 L958.5 521 Z" fill="#4fb3ff"/><path d="M820 508 L820 522" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M820 530 L815.5 521 L824.5 521 Z" fill="#4fb3ff"/><path d="M560 558 L85 558 L85 338" fill="none" stroke="#4fb3ff" stroke-width="2.4" stroke-linejoin="round"/><path d="M85 330 L89.5 339 L80.5 339 Z" fill="#4fb3ff"/><text x="320" y="549" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">reused by the next conversation</text></svg>
