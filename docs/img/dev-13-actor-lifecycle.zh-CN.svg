<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img"><title>单个 Actor 实例的生命周期:由 Acquire 或对端的首个 pack 从池中开启,两条路径都做上限检查,各状态及其注入点,四种结束方式,以及 Release 把实例归还池中</title><rect width="980" height="620" rx="10" fill="#2b2b2b"/><rect x="30" y="270" width="110" height="60" rx="8" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="85" y="296" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">池</text><text x="85" y="314" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">空闲实例</text><rect x="115" y="146" width="150" height="48" rx="16" fill="#333333" stroke="#9aa0a6" stroke-width="1.6"/><text x="190" y="165.5" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">已达上限?</text><text x="190" y="184.5" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">Check limit</text><rect x="115" y="406" width="150" height="48" rx="16" fill="#333333" stroke="#9aa0a6" stroke-width="1.6"/><text x="190" y="425.5" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">对端超限?</text><text x="190" y="444.5" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">Check limit</text><path d="M140 286 L190 286 L190 202" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M190 194 L194.5 203 L185.5 203 Z" fill="#4fb3ff"/><path d="M140 314 L190 314 L190 398" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="roun