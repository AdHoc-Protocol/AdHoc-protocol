al,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">下一状态 ...</text><path d="M428 190 L428 344" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M428 352 L423.5 343 L432.5 343 Z" fill="#4fb3ff"/><text x="440" y="214" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">过渡 pack</text><text x="440" y="230" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">到达或发出</text><text x="440" y="256" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">Actor OnNewState</text><text x="440" y="280" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">&lt;Pack&gt; OnReceived Event</text><text x="440" y="297" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">&lt;Pack&gt; OnSerialized Event</text><text x="440" y="322" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">OnActivate 代码</text><rect x="664" y="100" width="270" height="52" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="122" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">过渡到 End</text><text x="676" y="140" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">END OnActivate</text><path d="M634 126 L656 126" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 126 L655 130.5 L655 121.5 Z" fill="#4fb3ff"/><line x1="934" y1="126" x2="954" y2="126" stroke="#4fb3ff" stroke-width="2"/><rect x="664" y="166" width="270" height="70" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="188" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">过渡到 Close</text><text x="676" y="206" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">CLOSE OnActivate</text><text x="676" y="224" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">队列排空,连接关闭</text><path d="M634 201 L656 201" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 201 L655 205.5 L655 196.5 Z" fill="#4fb3ff"/><line x1="934" y1="201" x2="954" y2="201" stroke="#4fb3ff" stroke-width="2"/><rect x="664" y="250" width="270" height="88" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="272" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">[Deadline] / [Idle] 到期</text><text x="676" y="290" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">Actor OnDeadline</text><text x="676" y="308" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">默认:Release(conn)</text><text x="676" y="326" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Actor0:关闭连接</text><path d="M634 294 L656 294" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 294 L655 298.5 L655 289.5 Z" fill="#4fb3ff"/><line x1="934" y1="294" x2="954" y2="294" stroke="#4fb3ff" stroke-width="2"/><rect x="664" y="352" width="270" height="52" rx="5" fill="#323232" stroke="#e8eaed" stroke-width="1.2"/><text x="676" y="374" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start">连接丢失</text><text x="676" y="392" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">套接字错误、对端消失、超时</text><path d="M634 378 L656 378" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M664 378 L655 382.5 L655 373.5 Z" fill="#4fb3ff"/><path d="M676 404 L676 487" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M676 437 L682 437" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M688 437 L681 440.5 L681 433.5 Z" fill="#9aa0a6"/><path d="M676 487 L682 487" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M688 487 L681 490.5 L681 483.5 Z" fill="#9aa0a6"/><rect x="688" y="416" width="246" height="42" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.1" stroke-dasharray="4 3"/><text x="698" y="433" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">[Resumable]</tspan><tspan font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> → 会话已挂起;</tspan></text><text x="698" y="450" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Actor 收不到任何通知</text><rect x="688" y="466" width="246" height="42" rx="4" fill="#323232" stroke="#e8eaed" stroke-width="1.1"/><text x="698" y="483" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">否则,或等待超时:</text><text x="698" y="500" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed">关闭事件 → </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e">OnClose</tspan></text><rect x="560" y="530" width="404" height="56" rx="6" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="762" y="553.5" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">Release</text><text x="762" y="572.5" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">退出组 - 注销 - 重置到起始状态</text><path d="M954 126 L954 522" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M954 530 L949.5 521 L958.5 521 Z" fill="#4fb3ff"/><path d="M820 508 L820 522" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M820 530 L815.5 521 L824.5 521 Z" fill="#4fb3ff"/><path d="M560 558 L85 558 L85 338" fill="none" stroke="#4fb3ff" stroke-width="2.4" stroke-linejoin="round"/><path d="M85 330 L89.5 339 L80.5 339 Z" fill="#4fb3ff"/><text x="320" y="549" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">由下一个对话复用</text></svg>
