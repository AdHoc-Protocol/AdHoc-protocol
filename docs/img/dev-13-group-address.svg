<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" width="1000" height="544" role="img"><title>A multicast actor Room on one connection: the instances on each host are members of the connection&#39;s group; the Right host casts RoomSaid once, to the group address, and the Left host&#39;s group hands it to each of its members, including one that has just opened; an instance in another group does not get it</title><rect width="1000" height="544" rx="10" fill="#2b2b2b"/><text x="24" y="38" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">The group address: one cast reaches every member</text><rect x="24" y="60" width="390" height="364" rx="6" fill="none" stroke="#e8833a" stroke-width="1.4"/><text x="32" y="76" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start" font-weight="600">L host · Client</text><rect x="586" y="60" width="390" height="364" rx="6" fill="none" stroke="#4fb3ff" stroke-width="1.4"/><text x="594" y="76" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff" text-anchor="start" font-weight="600">R host · Server</text><rect x="38" y="86" width="362" height="324" rx="5" fill="none" stroke="#5f6670" stroke-width="1.2"/><text x="46" y="101" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">connection Link</text><rect x="600" y="86" width="362" height="324" rx="5" fill="none" stroke="#5f6670" stroke-width="1.2"/><text x="608" y="101" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">connection Link</text><rect x="52" y="116" width="334" height="200" rx="5" fill="none" stroke="#a06fd0" stroke-width="1.2"/><text x="60" y="131" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#a06fd0" text-anchor="start">Room.Multicast( conn ) · the group address</text><rect x="68" y="146" width="250" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="78" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Room #1</text><rect x="234" y="150" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="272" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Inside</text><rect x="68" y="198" width="250" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="78" y="218" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Room #2</text><rect x="234" y="202" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="272" y="218" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Inside</text><rect x="68" y="250" width="250" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="78" y="270" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Room #3</text><rect x="234" y="254" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="272" y="270" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Start</text><rect x="68" y="338" width="250" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="5 4"/><text x="78" y="358" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Room #4</text><rect x="234" y="342" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="272" y="358" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Inside</text><text x="68" y="388" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">in another group: this address skips it</text><rect x="614" y="116" width="334" height="130" rx="5" fill="none" stroke="#a06fd0" stroke-width="1.2"/><text x="622" y="131" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#a06fd0" text-anchor="start">Room.Multicast( conn ) · the group address</text><rect x="630" y="146" width="250" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="640" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Room #1</text><rect x="796" y="150" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="834" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Inside</text><rect x="630" y="198" width="250" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="640" y="218" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Room #2</text><rect x="796" y="202" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="834" y="218" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Inside</text><text x="630" y="291" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="start" xml:space="preserve">cast( RoomSaid, conn )</text><path d="M622 286 L397 286" fill="none" stroke="#4fb3ff" stroke-width="3" stroke-linejoin="round"/><path d="M386 286 L398 280 L398 292 Z" fill="#4fb3ff"/><text x="500" y="276" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff" text-anchor="middle">RoomSaid</text><text x="500" y="306" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">once, to the group address</text><path d="M386 286 L366 286 L366 161" fill="none" stroke="#4fb3ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M366 161 L325 161" fill="none" stroke="#4fb3ff" stroke-width="1.6" stroke-linejoin="round"/><path d="M318 161 L326 157 L326 165 Z" fill="#4fb3ff"/><path d="M366 213 L325 213" fill="none" stroke="#4fb3ff" stroke-width="1.6" stroke-linejoin="round"/><path d="M318 213 L326 209 L326 217 Z" fill="#4fb3ff"/><path d="M366 265 L325 265" fill="none" stroke="#4fb3ff" stroke-width="1.6" stroke-linejoin="round"/><path d="M318 265 L326 261 L326 269 Z" fill="#4fb3ff"/><rect x="24" y="438" width="952" height="90" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><text x="40" y="464" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Room.Multicast( conn ) is the connection&#39;s group: an instance joins it when it opens, on either side, and leaves it in Release.</text><text x="40" y="488" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">cast( pack, conn ) sends the pack once; the peer&#39;s group hands it to each member, whatever state and epoch it is in.</text><text x="40" y="512" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">An instance is in one group at a time: one that joins another group no longer hears this address.</text></svg>
