<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 536" width="1000" height="536" role="img"><title>The Left host takes a Job instance from its pool with Acquire and sends its first pack with the new address A1 and epoch 0; the Right host finds no instance under A1, takes one from its own pool and registers it there, and every later pack goes between these two; a pack for an unknown address with an epoch other than 0 is dropped</title><rect width="1000" height="536" rx="10" fill="#2b2b2b"/><text x="24" y="38" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600">How the second instance of a pair appears</text><rect x="24" y="60" width="350" height="356" rx="6" fill="none" stroke="#e8833a" stroke-width="1.4"/><text x="32" y="76" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start" font-weight="600">L host · Client</text><rect x="626" y="60" width="350" height="356" rx="6" fill="none" stroke="#4fb3ff" stroke-width="1.4"/><text x="634" y="76" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff" text-anchor="start" font-weight="600">R host · Server</text><rect x="38" y="86" width="322" height="190" rx="5" fill="none" stroke="#5f6670" stroke-width="1.2"/><text x="46" y="101" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">connection: instances by address</text><rect x="38" y="300" width="322" height="100" rx="5" fill="none" stroke="#5f6670" stroke-width="1.2" stroke-dasharray="5 4"/><text x="46" y="315" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">Job pool</text><rect x="54" y="340" width="90" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="4 3"/><text x="64" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Job</text><rect x="154" y="340" width="90" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="4 3"/><text x="164" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Job</text><rect x="254" y="340" width="90" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="4 3"/><text x="264" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Job</text><rect x="64" y="120" width="270" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="74" y="140" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Job @A1 · epoch 1</text><rect x="250" y="124" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="288" y="140" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Running</text><rect x="640" y="86" width="322" height="190" rx="5" fill="none" stroke="#5f6670" stroke-width="1.2"/><text x="648" y="101" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">connection: instances by address</text><rect x="640" y="300" width="322" height="100" rx="5" fill="none" stroke="#5f6670" stroke-width="1.2" stroke-dasharray="5 4"/><text x="648" y="315" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">Job pool</text><rect x="656" y="340" width="90" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="4 3"/><text x="666" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Job</text><rect x="756" y="340" width="90" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="4 3"/><text x="766" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Job</text><rect x="856" y="340" width="90" height="30" rx="5" fill="#2b2e33" stroke="#5f6670" stroke-width="1.4" stroke-dasharray="4 3"/><text x="866" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">Job</text><rect x="666" y="120" width="270" height="30" rx="5" fill="#2b2e33" stroke="#7d858f" stroke-width="1.4"/><text x="676" y="140" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Job @A1 · epoch 1</text><rect x="852" y="124" width="76" height="22" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.6"/><text x="890" y="140" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Running</text><path d="M314 340 L314 158" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M314 150 L318.5 159 L309.5 159 Z" fill="#9aa0a6"/><text x="304" y="200" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="end" xml:space="preserve">Acquire()</text><path d="M334 128 L658 128" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M666 128 L657 132.5 L657 123.5 Z" fill="#e8833a"/><circle cx="392" cy="114" r="10" fill="#3a3d42"/><text x="392" y="119" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">1</text><text x="500" y="119" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="middle">JobStart · A1 · epoch 0</text><text x="666" y="176" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">no instance under A1, epoch 0:</text><text x="666" y="192" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">take one from the pool, register it</text><path d="M916 340 L916 158" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M916 150 L920.5 159 L911.5 159 Z" fill="#9aa0a6"/><path d="M334 144 L658 144" fill="none" stroke="#c9ccd1" stroke-width="1.6" stroke-linejoin="round"/><path d="M334 144 L343 139.5 L343 148.5 Z" fill="#c9ccd1"/><path d="M666 144 L657 148.5 L657 139.5 Z" fill="#c9ccd1"/><circle cx="392" cy="164" r="10" fill="#3a3d42"/><text x="392" y="169" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">2</text><text x="500" y="168" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">every later pack: to A1</text><path d="M360 236 L648 236" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"/><path d="M656 236 L647 240.5 L647 231.5 Z" fill="#e8833a"/><circle cx="392" cy="222" r="10" fill="#3a3d42"/><text x="392" y="227" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">3</text><text x="500" y="227" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="middle">JobChunk · A9 · epoch 3</text><path d="M650 230 L662 242 M662 230 L650 242" stroke="#e5534b" stroke-width="2.4"/><text x="670" y="232" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">no instance under A9, epoch ≠ 0:</text><text x="670" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e5534b" text-anchor="start">an ended conversation - dropped</text><rect x="24" y="430" width="952" height="90" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.2"/><text x="40" y="456" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">1   The opening side takes an instance with Acquire; its first pack carries the new address and epoch 0.</text><text x="40" y="480" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">2   The peer finds no instance under that address, takes one from its pool and registers it there: the pair is made.</text><text x="40" y="504" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">3   An unknown address with an epoch other than 0 belongs to a conversation that has already ended: the pack is dropped.</text></svg>
