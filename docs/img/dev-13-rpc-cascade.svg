<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img"><title>Cascaded RPC: the Dashboard calls getSessionFiles on the Gateway, whose handler calls getSessionFiles on the Server; Upload returns from the Server to the Gateway and from the Gateway to the Dashboard. During the relay the Gateway holds a replier context facing the Dashboard and a caller instance facing the Server</title><rect width="960" height="560" rx="10" fill="#2b2b2b"/><rect x="24" y="88" width="473" height="372" rx="8" fill="#2f2f2f" stroke="#4a4a4a" stroke-width="1.2"/><rect x="462" y="150" width="474" height="204" rx="8" fill="#4f6a8f" fill-opacity="0.16" stroke="#5a6578" stroke-width="1.2"/><text x="186" y="106" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">hop 1 - </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6">GatewayToDashboard.getSessionFiles</tspan></text><text x="504" y="168" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">hop 2 - </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6">ServerToGateway.getSessionFiles</tspan></text><rect x="90" y="20" width="160" height="50" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="170" y="42" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="600">Dashboard</text><text x="170" y="60" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">browser</text><rect x="400" y="20" width="160" height="50" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="480" y="42" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="600">Gateway</text><text x="480" y="60" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">relay</text><rect x="710" y="20" width="160" height="50" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="790" y="42" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="600">Server</text><text x="790" y="60" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">data source</text><line x1="170" y1="70" x2="170" y2="470" stroke="#5a5a5a" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="480" y1="70" x2="480" y2="470" stroke="#5a5a5a" stroke-width="1.4" stroke-dasharray="5 5"/><line x1="790" y1="70" x2="790" y2="470" stroke="#5a5a5a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="163" y="128" width="14" height="307" rx="2" fill="#e8833a" stroke="none" stroke-width="1.6"/><rect x="466" y="135" width="14" height="250" rx="2" fill="#a06fd0" stroke="none" stroke-width="1.6"/><rect x="480" y="198" width="14" height="107" rx="2" fill="#e8833a" stroke="none" stroke-width="1.6"/><rect x="783" y="205" width="14" height="95" rx="2" fill="#a06fd0" stroke="none" stroke-width="1.6"/><path d="M177 135 L458 135" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M466 135 L457 139.5 L457 130.5 Z" fill="#4fb3ff"/><text x="321.5" y="127" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" font-weight="700">1</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed">  Download</tspan></text><path d="M494 205 L775 205" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M783 205 L774 209.5 L774 200.5 Z" fill="#4fb3ff"/><text x="638.5" y="197" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" font-weight="700">2</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed">  Download</tspan></text><path d="M783 295 L502 295" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M494 295 L503 290.5 L503 299.5 Z" fill="#4fb3ff"/><text x="638.5" y="287" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" font-weight="700">3</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed">  Upload</tspan></text><path d="M466 375 L185 375" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M177 375 L186 370.5 L186 379.5 Z" fill="#4fb3ff"/><text x="321.5" y="367" text-anchor="middle" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" font-weight="700">4</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed">  Upload</tspan></text><text x="186" y="434" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#4fb3ff" font-weight="700">5</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed">  your code gets the files</tspan></text><text x="186" y="246" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start">caller instance</text><text x="186" y="264" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Call → Return → End</text><text x="452" y="318" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#a06fd0" text-anchor="end">replier context</text><text x="452" y="336" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="end">(faces the Dashboard)</text><text x="510" y="244" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start">caller instance</text><text x="510" y="262" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">(faces the Server)</text><text x="806" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#a06fd0" text-anchor="start">replier context</text><text x="806" y="318" text-anchor="start" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">Release()</tspan></text><text x="806" y="335" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start">back to its pool</text><text x="510" y="322" text-anchor="start" xml:space="preserve"><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" font-weight="600">End</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> - back to its pool</tspan></text><text x="452" y="404" text-anchor="end" xml:space="preserve"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#9aa0a6">Release()</tspan><tspan font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6"> after replying</tspan></text><rect x="28" y="486" width="14" height="14" rx="2" fill="#e8833a" stroke="none" stroke-width="1.6"/><text x="50" y="498" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">registered caller instance</text><rect x="250" y="486" width="14" height="14" rx="2" fill="#a06fd0" stroke="none" stroke-width="1.6"/><text x="272" y="498" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">pooled replier context, not registered</text><text x="28" y="536" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0a6" text-anchor="start">Each hop is an independent RPC: its own actors, its own lifetime.</text></svg>
