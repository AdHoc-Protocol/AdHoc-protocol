<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img"><title>The slots of the accepting host before and after reclaim: the parked session S on slot 2 moves onto socket 2 in slot 4, still in state Working, while the fresh login session F goes back to the free pool; reclaim returns the new token 4 &lt;&lt; 32 | 42.</title><rect width="960" height="600" rx="10" fill="#2b2b2b"/><text x="24" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="17" fill="#e8eaed" text-anchor="start" font-weight="600">reclaim moves a parked session onto the new socket</text><rect x="140" y="50" width="560" height="236" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="156" y="74" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="700">BEFORE</text><text x="226" y="74" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">the slots of the accepting host</text><rect x="156" y="128" width="50" height="110" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="181" y="148" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 0</text><text x="181" y="193" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">active</text><rect x="212" y="128" width="50" height="110" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="237" y="148" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 1</text><text x="237" y="193" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">free</text><rect x="268" y="128" width="150" height="110" rx="5" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8"/><text x="278" y="147" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">slot 2</text><text x="278" y="168" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" font-weight="700">PARKED session S</text><text x="278" y="186" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">identity 42</text><text x="278" y="204" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">actor in Working</text><text x="278" y="222" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">journal</text><rect x="424" y="128" width="50" height="110" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="449" y="148" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 3</text><text x="449" y="193" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">active</text><rect x="480" y="128" width="150" height="110" rx="5" fill="#203d56" stroke="#4fb3ff" stroke-width="1.8"/><text x="490" y="147" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">slot 4</text><text x="490" y="168" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" font-weight="700">ACTIVE - socket 2</text><text x="490" y="186" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">fresh session F</text><text x="490" y="204" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">actor in Authorizing</text><text x="490" y="222" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">(login running)</text><rect x="636" y="128" width="50" height="110" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="661" y="148" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 5</text><text x="661" y="193" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">free</text><rect x="16" y="128" width="110" height="110" rx="5" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="71" y="154" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">client</text><text x="71" y="178" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">back on a</text><text x="71" y="195" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">new socket 2</text><text x="71" y="218" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">kept token</text><path d="M71 128 L71 106 L555 106 L555 119" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M555 128 L550 118 L560 118 Z" fill="#4fb3ff"/><text x="166" y="98" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#4fb3ff" text-anchor="start" paint-order="stroke" stroke="#262626" stroke-width="4" stroke-linejoin="round" xml:space="preserve">Login { resume_token = 2 &lt;&lt; 32 | 42 }</text><rect x="530" y="247" width="140" height="26" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.4"/><text x="600" y="265" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">ext.reclaim(token)</text><rect x="140" y="366" width="560" height="156" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="156" y="390" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="700">AFTER</text><rect x="156" y="402" width="50" height="108" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="181" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 0</text><text x="181" y="466" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">active</text><rect x="212" y="402" width="50" height="108" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="237" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 1</text><text x="237" y="466" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">free</text><rect x="268" y="402" width="150" height="108" rx="5" fill="#333333" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="5 3"/><text x="278" y="421" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">slot 2</text><text x="278" y="442" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" font-weight="700">session F</text><text x="278" y="460" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">-&gt; back to the</text><text x="278" y="478" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">free pool</text><rect x="424" y="402" width="50" height="108" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="449" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 3</text><text x="449" y="466" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">active</text><rect x="480" y="402" width="150" height="108" rx="5" fill="#203d56" stroke="#4fb3ff" stroke-width="1.8"/><text x="490" y="421" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">slot 4</text><text x="490" y="442" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" font-weight="700">ACTIVE - socket 2</text><text x="490" y="460" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">session S</text><text x="490" y="478" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">actor still in Working</text><text x="490" y="496" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">journal</text><rect x="636" y="402" width="50" height="108" rx="5" fill="none" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="4 3"/><text x="661" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">slot 5</text><text x="661" y="466" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#7d8288" text-anchor="middle">free</text><path d="M363 238 C363 330 520 300 520 393" fill="none" stroke="#a06fd0" stroke-width="2.2"/><path d="M520 402 L515 392 L525 392 Z" fill="#a06fd0"/><path d="M506 238 C506 330 333 300 333 393" fill="none" stroke="#a06fd0" stroke-width="2.2" stroke-dasharray="6 4"/><path d="M333 402 L328 392 L338 392 Z" fill="#a06fd0"/><text x="532" y="350" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#a06fd0" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">S: slot 2 -&gt; 4</text><text x="319" y="350" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#a06fd0" text-anchor="end" font-weight="600" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">F: slot 4 -&gt; 2</text><rect x="718" y="206" width="226" height="70" rx="5" fill="#262626" stroke="#4a4a4a" stroke-width="1.3"/><text x="730" y="229" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start" font-weight="600">no parked session under the token</text><text x="730" y="247" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">(too late / never parked):</text><text x="730" y="265" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" text-anchor="start" xml:space="preserve">reclaim = identify(42)</text><line x1="670" y1="260" x2="718" y2="260" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="718" y="366" width="226" height="70" rx="5" fill="#262626" stroke="#a06fd0" stroke-width="1.3"/><text x="730" y="389" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">F hears OnClose,</text><text x="730" y="407" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">S hears OnOpen,</text><text x="730" y="425" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" text-anchor="start" xml:space="preserve">then resume(connection)</text><rect x="718" y="450" width="226" height="88" rx="5" fill="#262626" stroke="#a06fd0" stroke-width="1.3"/><text x="730" y="473" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">reclaim returns the new token</text><text x="730" y="491" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" text-anchor="start" xml:space="preserve">4 &lt;&lt; 32 | 42</text><text x="730" y="509" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">send it to the peer</text><text x="730" y="527" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">(e.g. in Welcome)</text><text x="24" y="552" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start">token = slot &lt;&lt; 32 | identity - not a secret: authenticate the peer before calling reclaim.</text><text x="24" y="574" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start">After reclaim, use ext.Internal: it is S, not the conn your handler got.</text></svg>
