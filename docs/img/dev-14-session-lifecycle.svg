<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 612" width="960" height="612" role="img"><title>Where a session goes when its socket dies: a loss parks an identified session whose resumable_minutes are above 0; otherwise, or on your own Close or Abort, the session ends at once. A parked session keeps its slot, connection, actors, states and journal, but no socket; it comes back live on a new socket when the peer returns in time, or ends with REMOTE_CLOSE_ABRUPTLY when the time runs out.</title><rect width="960" height="612" rx="10" fill="#2b2b2b"/><text x="24" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="17" fill="#e8eaed" text-anchor="start" font-weight="600">Where a session goes when its socket dies</text><rect x="16" y="50" width="928" height="64" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><rect x="32" y="64" width="290" height="36" rx="5" fill="#333333" stroke="#9aa0a6" stroke-width="1.4"/><text x="177" y="87" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">graceful Close() / Abort() by your code</text><path d="M322 82 L691 82" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M700 82 L690 87 L690 77 Z" fill="#e8833a"/><text x="511" y="74" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="middle" paint-order="stroke" stroke="#262626" stroke-width="4" stroke-linejoin="round">intent: never parked</text><rect x="700" y="58" width="228" height="48" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="814" y="78" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">ENDED at once</text><text x="814" y="96" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">whatever the minutes say</text><rect x="16" y="270" width="160" height="100" rx="5" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="96" y="294" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">LIVE - socket 1</text><text x="26" y="316" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">generated connection</text><text x="26" y="333" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">+ actors in their states</text><text x="26" y="355" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">OnOpen heard</text><path d="M341 240 L446 320 L341 400 L236 320 Z" fill="#333333" stroke="#f2c14e" stroke-width="1.8"/><text x="341" y="295" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">identified</text><text x="341" y="312" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">(id != 0) AND</text><text x="341" y="330" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">resumable_minutes</text><text x="341" y="347" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">(conn, event) &gt; 0 ?</text><path d="M176 320 L227 320" fill="none" stroke="#e06c6c" stroke-width="2" stroke-linejoin="round"/><path d="M236 320 L226 325 L226 315 Z" fill="#e06c6c"/><text x="206" y="312" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e06c6c" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">loss</text><line x1="206" y1="324" x2="206" y2="384" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="16" y="384" width="206" height="90" rx="5" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/><text x="28" y="405" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">socket error</text><text x="28" y="423" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">timeout answered 0</text><text x="28" y="441" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">peer closes (FIN too)</text><text x="28" y="459" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">unparseable pack id / lost()</text><path d="M341 400 L341 433" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M341 442 L336 432 L346 432 Z" fill="#e8833a"/><text x="351" y="426" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="start" font-weight="600">no</text><rect x="236" y="442" width="210" height="112" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="341" y="464" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">ENDED now</text><text x="248" y="486" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">close event -&gt; connection</text><text x="248" y="503" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">+ actors</text><text x="248" y="522" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">OnClose</text><text x="248" y="541" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">journal dropped, slot freed</text><path d="M446 320 L467 320" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M476 320 L466 325 L466 315 Z" fill="#f2c14e"/><text x="461" y="311" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#f2c14e" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">yes</text><rect x="476" y="194" width="240" height="252" rx="5" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8"/><text x="596" y="218" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">PARKED</text><text x="596" y="236" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">until now + minutes</text><text x="488" y="262" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="start" font-weight="700">KEPT</text><text x="638" y="262" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="start" font-weight="700">NOT KEPT</text><line x1="628" y1="250" x2="628" y2="364" stroke="#7a6a3a" stroke-width="1"/><text x="488" y="282" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">slot</text><text x="488" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">generated connection,</text><text x="488" y="318" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">actors, states</text><text x="488" y="336" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">your objects</text><text x="488" y="354" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">journal (on disk)</text><text x="638" y="282" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">socket</text><text x="638" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">I/O buffers</text><line x1="486" y1="374" x2="706" y2="374" stroke="#7a6a3a" stroke-width="1"/><text x="596" y="393" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">OnClose runs</text><text x="596" y="411" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" font-weight="600">close EVENT withheld</text><text x="596" y="429" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">actors hear nothing</text><rect x="736" y="124" width="208" height="146" rx="5" fill="#203d56" stroke="#4fb3ff" stroke-width="1.6"/><text x="840" y="146" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">LIVE again - socket 2</text><text x="746" y="167" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">same actors, same states</text><text x="746" y="185" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">OnOpen</text><text x="746" y="205" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">resume(conn): journal replays</text><text x="746" y="221" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">from the receiver position</text><text x="746" y="241" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">resume(null): sender lost</text><text x="746" y="257" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">its journal -&gt; resync</text><path d="M676 194 L676 164 L727 164" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M736 164 L726 169 L726 159 Z" fill="#4fb3ff"/><text x="664" y="138" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff" text-anchor="end" font-weight="600">peer back in time:</text><text x="664" y="157" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="end">login -&gt; reclaim(session id)  (accepting side)</text><text x="664" y="175" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="end">reconnect of the same client  (dialing side)</text><path d="M676 446 L676 490 L727 490" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M736 490 L726 495 L726 485 Z" fill="#e8833a"/><text x="664" y="486" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="end" font-weight="600">time runs out</text><rect x="736" y="450" width="208" height="112" rx="5" fill="#4a3322" stroke="#e8833a" stroke-width="1.6"/><text x="840" y="472" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">ENDED at expiry</text><text x="746" y="493" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">close event -&gt; actors:</text><text x="746" y="510" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8833a" text-anchor="start" xml:space="preserve">REMOTE_CLOSE_ABRUPTLY</text><text x="746" y="530" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">journal deleted, slot freed</text><text x="746" y="548" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start">late peer starts a new session</text><text x="480" y="596" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="middle">Only a loss parks, and only an identified session with minutes. Your own Close() or Abort() ends it at once.</text></svg>
