<svg xmlns="http://www.w3.org/2000/svg" width="980" height="528" viewBox="0 0 980 528" role="img" aria-labelledby="dev15framing-t dev15framing-d">
<title id="dev15framing-t">Byte layouts of the conduit framings</title>
<desc id="dev15framing-d">Four rows of byte boxes. Stream: chunks, each a two-byte little-endian length (0x0001 to 0xFFFE) and up to 65 534 bytes of data, closed by the terminator 0x0000 for a normal end, or by 0xFFFF (ABORT), which ends the stream as void. File: one varint total length, whose width follows the actual total, then exactly that many bytes; the receiver checks the total against S(N) before the first data byte. A trimmed pack payload is chunked like a Stream but is not interruptible. A trimmed string uses the File layout with its UTF-8 bytes. A side column says whether the total is known up front and whether the payload is interruptible: Stream no and yes, File yes and no, trimmed pack no and no, trimmed string yes and no.</desc>
<rect width="980" height="528" rx="10" fill="#2b2b2b"/>
<text x="16" y="40" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" font-weight="700">Where the bytes of a conduit end</text><text x="816" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">total known</text><text x="816" y="50" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">up front?</text><text x="910" y="50" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="600">interruptible?</text><line x1="16" y1="62" x2="964" y2="62" stroke="#4a4a4a" stroke-width="1"/><line x1="760" y1="22" x2="760" y2="512" stroke="#4a4a4a" stroke-width="1"/><text x="16" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" font-weight="700">Stream</text><text x="16" y="119" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">chunked</text><rect x="160" y="80" width="96" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/><text x="208" y="101.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">len 2 B LE</text><rect x="260" y="80" width="140" height="34" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.6"/><text x="330" y="101.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">data ≤ 65 534 B</text><rect x="404" y="80" width="46" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/><text x="427" y="101.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">len</text><rect x="454" y="80" width="80" height="34" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.6"/><text x="494" y="101.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">data</text><rect x="538" y="80" width="40" height="34" rx="3" fill="#363636" stroke="#9aa0a6" stroke-width="1.6"/><text x="558" y="101.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">…</text><line x1="578" y1="97" x2="600" y2="97" stroke="#9aa0a6" stroke-width="1.4"/><rect x="600" y="80" width="76" height="34" rx="3" fill="#4d3220" stroke="#e8833a" stroke-width="1.6"/><text x="638" y="101.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="middle" xml:space="preserve">0x0000</text><text x="638" y="131" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" text-anchor="middle">normal end</text><polyline points="589,97 589,161 595.8,161" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M600 161 L593 157.15 L593 164.85 Z" fill="#9aa0a6"/><rect x="600" y="144" width="76" height="34" rx="3" fill="#3d2d52" stroke="#a06fd0" stroke-width="1.6"/><text x="638" y="165.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="middle" xml:space="preserve">0xFFFF</text><text x="579" y="165.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a06fd0" text-anchor="end">ABORT: ends as void</text><text x="160" y="200" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">length 0x0001 – 0xFFFE; in practice a chunk is about the room left in the socket buffer</text><text x="816" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">no</text><text x="910" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">yes</text><line x1="16" y1="216" x2="748" y2="216" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 4"/><text x="16" y="256" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" font-weight="700">File</text><text x="16" y="273" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">one length prefix</text><rect x="160" y="234" width="112" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/><text x="216" y="255.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">varint total</text><rect x="276" y="234" width="404" height="34" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.6"/><text x="478" y="255.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">data: exactly total bytes</text><text x="160" y="288" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">the prefix width follows the actual total, not the cap;</text><text x="160" y="304" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">the receiver checks total ≤ S(N) before the first data byte</text><text x="816" y="256" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">yes, required</text><text x="910" y="256" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">no</text><line x1="16" y1="320" x2="748" y2="320" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 4"/><text x="16" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" font-weight="700">trimmed pack</text><text x="16" y="377" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">chunked</text><rect x="160" y="338" width="46" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6" stroke-dasharray="5 3"/><text x="183" y="359.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">len</text><rect x="210" y="338" width="110" height="34" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.6" stroke-dasharray="5 3"/><text x="265" y="359.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">pack bytes</text><rect x="324" y="338" width="46" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6" stroke-dasharray="5 3"/><text x="347" y="359.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">len</text><rect x="374" y="338" width="110" height="34" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.6" stroke-dasharray="5 3"/><text x="429" y="359.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">pack bytes</text><rect x="488" y="338" width="40" height="34" rx="3" fill="#363636" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 3"/><text x="508" y="359.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">…</text><rect x="532" y="338" width="76" height="34" rx="3" fill="#4d3220" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 3"/><text x="570" y="359.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="middle" xml:space="preserve">0x0000</text><text x="160" y="392" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">chunked like Stream, but not interruptible: one whole serialized value - see Trims</text><text x="816" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">no</text><text x="910" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">no</text><line x1="16" y1="408" x2="748" y2="408" stroke="#4a4a4a" stroke-width="1" stroke-dasharray="2 4"/><text x="16" y="448" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" font-weight="700">trimmed string</text><text x="16" y="465" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6">one length prefix</text><rect x="160" y="426" width="112" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6" stroke-dasharray="5 3"/><text x="216" y="447.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">varint total</text><rect x="276" y="426" width="230" height="34" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.6" stroke-dasharray="5 3"/><text x="391" y="447.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">UTF-8 bytes</text><text x="160" y="480" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">File layout: the string travels as its UTF-8 form on the cut leg - see Trims</text><text x="816" y="448" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">yes</text><text x="910" y="448" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">no</text>
</svg>
