<svg xmlns="http://www.w3.org/2000/svg" width="980" height="548" viewBox="0 0 980 548" role="img" aria-labelledby="dev15layers-t dev15layers-d">
<title id="dev15layers-t">AdHoc streaming as layers over one pull-based core</title>
<desc id="dev15layers-d">Six stacked layers, top to bottom: pack fields generated concrete or abstract per host, language, pack and field; raw Stream and File conduits between your source or sink and the socket buffer, capped by S(N); transform chains of stages such as Zstd and ChaCha20 that wrap the serialized bytes of a field, a pack or a connection; trims ToStream and FromStream that cut a chain at one depth for one endpoint; connections, where a chain on Connects wraps one hop and a VirtuallyConnects with its relay runs end to end; and at the bottom the socket buffer, one per direction, of fixed size whatever the payload. Your data goes down on transmit and comes up on receive. Each layer names the chapter that describes it.</desc>
<rect width="980" height="548" rx="10" fill="#2b2b2b"/>
<rect x="112" y="58" width="852" height="62" rx="8" fill="#313131" stroke="#4a4a4a" stroke-width="1.4"/><text x="128" y="94" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" font-weight="700">Pack fields</text><text x="326" y="84" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">+ concrete object   /   − abstract, event-driven</text><text x="326" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">decided per host, language, pack and field</text><text x="948" y="94" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">Hosts, languages, generated code</text><rect x="112" y="130" width="852" height="62" rx="8" fill="#313131" stroke="#4a4a4a" stroke-width="1.4"/><text x="128" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" font-weight="700">Stream / File conduits</text><text x="326" y="156" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">raw bytes: your source → socket buffer → your sink,</text><text x="326" y="174" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">capped by [S(N)]</text><text x="948" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">Streams</text><rect x="112" y="202" width="852" height="62" rx="8" fill="#313131" stroke="#4a4a4a" stroke-width="1.4"/><text x="128" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" font-weight="700">Transform chains</text><text x="326" y="228" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">[Zstd] [ChaCha20] custom stages wrap the serialized</text><text x="326" y="246" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">bytes of a field, a pack or a connection</text><text x="948" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">Transform chains</text><rect x="112" y="274" width="852" height="62" rx="8" fill="#313131" stroke="#4a4a4a" stroke-width="1.4"/><text x="128" y="310" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" font-weight="700">Trims</text><text x="326" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">[ToStream&lt;E&gt;] / [FromStream&lt;E&gt;] cut a chain at one depth</text><text x="326" y="318" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6">for one endpoint: that side holds raw bytes</text><text x="948" y="310" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">Trims</text><rect x="112" y="346" width="852" height="62" rx="8" fill="#313131" stroke="#4a4a4a" stroke-width="1.4"/><text x="128" y="382" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8833a" font-weight="700">Connections</text><rect x="300" y="354" width="160" height="46" rx="5" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="380" y="373" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Connects&lt;L, R&gt;</text><text x="380" y="390" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">a chain wraps one hop</text><rect x="470" y="354" width="276" height="46" rx="5" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="608" y="373" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">VirtuallyConnects&lt;L, R, PATH&gt; + relay</text><text x="608" y="390" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">end to end, relays never decode</text><text x="948" y="373" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">Connections /</text><text x="948" y="390" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">Virtual connections and relays</text><rect x="112" y="418" width="852" height="62" rx="8" fill="#1f3347" stroke="#4fb3ff" stroke-width="2"/><text x="128" y="454" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#4fb3ff" font-weight="700">Socket buffer</text><text x="326" y="444" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff">one per direction, reused, fixed size whatever the payload</text><text x="326" y="462" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#4fb3ff">packs never pass through a payload-sized byte array</text><text x="948" y="454" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="end">How AdHoc works</text><text x="62" y="36" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">your data</text><line x1="48" y1="48" x2="48" y2="443.6" stroke="#e8833a" stroke-width="2.2"/><path d="M48 449 L43.05 440 L52.95 440 Z" fill="#e8833a"/><line x1="80" y1="449" x2="80" y2="53.4" stroke="#f2c14e" stroke-width="2.2"/><path d="M80 48 L75.05 57 L84.95 57 Z" fill="#f2c14e"/><line x1="80" y1="449" x2="112" y2="449" stroke="#4fb3ff" stroke-width="1.2" stroke-dasharray="3 3"/><text x="38" y="248.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8833a" text-anchor="middle" transform="rotate(-90 38 248.5)">transmit</text><text x="101" y="248.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#f2c14e" text-anchor="middle" transform="rotate(-90 101 248.5)">receive</text><text x="490" y="528" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">The layers compose: a conduit can carry a chain, a trim cuts a chain for one endpoint, a connection can carry a chain over a whole link.</text>
</svg>
