<svg xmlns="http://www.w3.org/2000/svg" width="980" height="504" viewBox="0 0 980 504" role="img" aria-labelledby="dev16dataflow-t dev16dataflow-d">
<title id="dev16dataflow-t">Dataflow of a transform chain</title>
<desc id="dev16dataflow-d">Top row, transmit, a chain written as Zstd, ChaCha20: the leaf, a serialized Order, flows left to right through the Zstd compressor, the ChaCha20 cipher and the chunked framing of length-prefixed chunks closed by 0x0000, onto the wire. Left is the leaf, right is the wire, and a cipher written left of a compressor is rejected. Middle row, receive: the same boxes in the same columns, walked right to left: de-framing, ChaCha20 decryption, Zstd decompression, back to the typed Order. Bottom row: a field typed with the named Stream pack TelemetryFrame, which declares Zstd, while the field declares Base64; the composed chain is leaf, Base64, Zstd inherited from the pack, chunked framing, wire. Inherited entries always sit nearer the wire, and the rules are checked on the composed chain.</desc>
<rect width="980" height="504" rx="10" fill="#2b2b2b"/>
<text x="32" y="40" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed"><tspan font-weight="700">Transmit</tspan><tspan fill="#9aa0a6">   -   written as </tspan><tspan fill="#e8eaed" font-weight="600">[Zstd, ChaCha20]</tspan></text><rect x="32" y="58" width="176" height="58" rx="5" fill="#4d3220" stroke="#e8833a" stroke-width="1.7"/><text x="120" y="84" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">leaf</text><text x="120" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">serialized Order</text><rect x="252" y="58" width="122" height="58" rx="5" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.7"/><text x="313" y="84" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Zstd</text><text x="313" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">compression</text><rect x="418" y="58" width="122" height="58" rx="5" fill="#3d2d52" stroke="#a06fd0" stroke-width="1.7"/><text x="479" y="84" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">ChaCha20</text><text x="479" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">cipher</text><rect x="584" y="58" width="228" height="58" rx="5" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.7"/><text x="698" y="84" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">chunked framing</text><text x="698" y="102" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">[len][data] … [0x0000]</text><rect x="856" y="58" width="92" height="58" rx="5" fill="#363636" stroke="#9aa0a6" stroke-width="1.7"/><text x="902" y="92" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">wire</text><line x1="212" y1="87" x2="242.6" y2="87" stroke="#e8833a" stroke-width="2"/><path d="M248 87 L239 82.05 L239 91.95 Z" fill="#e8833a"/><line x1="378" y1="87" x2="408.6" y2="87" stroke="#e8833a" stroke-width="2"/><path d="M414 87 L405 82.05 L405 91.95 Z" fill="#e8833a"/><line x1="544" y1="87" x2="574.6" y2="87" stroke="#e8833a" stroke-width="2"/><path d="M580 87 L571 82.05 L571 91.95 Z" fill="#e8833a"/><line x1="816" y1="87" x2="846.6" y2="87" stroke="#e8833a" stroke-width="2"/><path d="M852 87 L843 82.05 L843 91.95 Z" fill="#e8833a"/><text x="32" y="140" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">left = leaf, right = wire; a cipher written left of a compressor is rejected</text><line x1="16" y1="158" x2="964" y2="158" stroke="#4a4a4a" stroke-width="1"/><text x="32" y="186" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed"><tspan font-weight="700">Receive</tspan><tspan fill="#9aa0a6">   -   the same list, walked backwards</tspan></text><rect x="32" y="204" width="176" height="58" rx="5" fill="#4d3220" stroke="#e8833a" stroke-width="1.7"/><text x="120" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Order</text><text x="120" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">the typed pack again</text><rect x="252" y="204" width="122" height="58" rx="5" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.7"/><text x="313" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Zstd</text><text x="313" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">decompress</text><rect x="418" y="204" width="122" height="58" rx="5" fill="#3d2d52" stroke="#a06fd0" stroke-width="1.7"/><text x="479" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">ChaCha20</text><text x="479" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">decrypt</text><rect x="584" y="204" width="228" height="58" rx="5" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.7"/><text x="698" y="230" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">de-framing</text><text x="698" y="248" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">[len][data] … [0x0000]</text><rect x="856" y="204" width="92" height="58" rx="5" fill="#363636" stroke="#9aa0a6" stroke-width="1.7"/><text x="902" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">wire</text><line x1="248" y1="233" x2="217.4" y2="233" stroke="#f2c14e" stroke-width="2"/><path d="M212 233 L221 228.05 L221 237.95 Z" fill="#f2c14e"/><line x1="414" y1="233" x2="383.4" y2="233" stroke="#f2c14e" stroke-width="2"/><path d="M378 233 L387 228.05 L387 237.95 Z" fill="#f2c14e"/><line x1="580" y1="233" x2="549.4" y2="233" stroke="#f2c14e" stroke-width="2"/><path d="M544 233 L553 228.05 L553 237.95 Z" fill="#f2c14e"/><line x1="852" y1="233" x2="821.4" y2="233" stroke="#f2c14e" stroke-width="2"/><path d="M816 233 L825 228.05 L825 237.95 Z" fill="#f2c14e"/><text x="32" y="286" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">the inverse of the right-most stage runs first; both sides end up holding the same Order</text><line x1="16" y1="304" x2="964" y2="304" stroke="#4a4a4a" stroke-width="1"/><text x="32" y="334" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed"><tspan font-weight="700">A field typed with a named Stream pack</tspan></text><text x="32" y="360" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve"><tspan fill="#9aa0a6">[S(1_600_000), </tspan><tspan fill="#f2c14e">Zstd</tspan><tspan fill="#9aa0a6">] class TelemetryFrame : Stream { }</tspan></text><text x="462" y="360" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve"><tspan fill="#9aa0a6">class Telemetry { [</tspan><tspan fill="#cfd3d8">Base64</tspan><tspan fill="#9aa0a6">] TelemetryFrame frame; }</tspan></text><text x="479" y="384" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">inherited from the pack</text><rect x="409" y="390" width="140" height="70" rx="9" fill="none" stroke="#f2c14e" stroke-width="1.3" stroke-dasharray="5 4"/><rect x="32" y="398" width="176" height="54" rx="5" fill="#4d3220" stroke="#e8833a" stroke-width="1.7"/><text x="120" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">leaf</text><text x="120" y="440" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">the conduit's bytes</text><rect x="252" y="398" width="122" height="54" rx="5" fill="#363636" stroke="#cfd3d8" stroke-width="1.7"/><text x="313" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Base64</text><text x="313" y="440" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">the field's own</text><rect x="418" y="398" width="122" height="54" rx="5" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.7"/><text x="479" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Zstd</text><text x="479" y="440" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">compression</text><rect x="584" y="398" width="228" height="54" rx="5" fill="#1f3347" stroke="#4fb3ff" stroke-width="1.7"/><text x="698" y="422" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">chunked framing</text><text x="698" y="440" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">[len][data] … [0x0000]</text><rect x="856" y="398" width="92" height="54" rx="5" fill="#363636" stroke="#9aa0a6" stroke-width="1.7"/><text x="902" y="430" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">wire</text><line x1="212" y1="425" x2="242.6" y2="425" stroke="#e8833a" stroke-width="2"/><path d="M248 425 L239 420.05 L239 429.95 Z" fill="#e8833a"/><line x1="378" y1="425" x2="399.6" y2="425" stroke="#e8833a" stroke-width="2"/><path d="M405 425 L396 420.05 L396 429.95 Z" fill="#e8833a"/><line x1="553" y1="425" x2="574.6" y2="425" stroke="#e8833a" stroke-width="2"/><path d="M580 425 L571 420.05 L571 429.95 Z" fill="#e8833a"/><line x1="816" y1="425" x2="846.6" y2="425" stroke="#e8833a" stroke-width="2"/><path d="M852 425 L843 420.05 L843 429.95 Z" fill="#e8833a"/><text x="32" y="482" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">inherited entries always sit nearer the wire; the rules are checked on the composed chain</text>
</svg>
