3.23 3.23 0 0 1 563.23 566.73 V569.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><rect x="616" y="559" width="140" height="26" rx="3" fill="#f2c14e"/><text x="686" y="576.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#1e1e1e" text-anchor="middle" font-weight="600">12 B: key id + seq</text><rect x="756" y="559" width="56" height="26" rx="3" fill="#a06fd0"/><rect x="778.77" y="569.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M780.77 569.1 V566.73 A3.23 3.23 0 0 1 787.23 566.73 V569.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><text x="152" y="620" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">applied to each pack on its own: survives loss, journal replay, reconnect;  the clear 12 B header is written by [ChaCha20]</text><line x1="16" y1="632" x2="964" y2="632" stroke="#4a4a4a" stroke-width="1"/><text x="24" y="656" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">the stages run at the sender, the inverse stages at the receiver</text><rect x="600" y="644" width="34" height="16" rx="3" fill="#a06fd0"/><rect x="611.77" y="649.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M613.77 649.1 V646.73 A3.23 3.23 0 0 1 620.23 646.73 V649.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><text x="642" y="656" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed">sealed by the chain</text><rect x="790" y="646" width="34" height="12" rx="3" fill="#1f3347" stroke="#4fb3ff" stroke-width="1"/><text x="832" y="656" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed">not wrapped</text>
