"102" stroke="#4fb3ff" stroke-width="0.8"/><rect x="446" y="82" width="120" height="24" rx="3" fill="#a06fd0"/><rect x="500.77" y="91.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M502.77 91.1 V88.73 A3.23 3.23 0 0 1 509.23 88.73 V91.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><text x="506" y="74" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a06fd0" text-anchor="middle">one value</text><text x="176" y="128" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">the stages wrap one field value or one pack; the rest of the stream travels as it is</text><line x1="16" y1="156" x2="964" y2="156" stroke="#4a4a4a" stroke-width="1"/><text x="24" y="198" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed"><tspan font-weight="700">chain on each physical </tspan><tspan fill="#f2c14e" font-weight="700">Connects</tspan><tspan font-weight="700">  (per hop)</tspan></text><rect x="24" y="230" width="120" height="48" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="84" y="259" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Device</text><rect x="836" y="230" width="120" height="48" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="896" y="259" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Cloud</text><rect x="360" y="222" width="260" height="64" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="490" y="246" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Gateway</text><rect x="378.23" y="263.9" width="11.55" height="8.4" rx="1.58" fill="#e8833a"/><path d="M376.23 260.75 V258.65 A3.57 3.57 0 0 1 383.37 258.65 V261.28" fill="none" stroke="#e8833a" stroke-width="1.89" stroke-linecap="round"/><text x="400" y="271" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a">plaintext here - holds both keys</text><rect x="144" y="247" width="216" height="14" rx="3" fill="#a06fd0"/><rect x="246.78" y="251.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M248.77 251.1 V248.72 A3.23 3.23 0 0 1 255.23 248.72 V251.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><rect x="620" y="247" width="216" height="14" rx="3" fill="#a06fd0"/><rect x="722.77" y="251.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M724.77 251.1 V248.72 A3.23 3.23 0 0 1 731.23 248.72 V251.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><text x="252" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">Connects&lt;Device, Gateway&gt;</text><text x="728" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">Connects&lt;Gateway, Cloud&gt;</text><text x="152" y="312" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">each hop runs its own chain and ends at a host: inside it the bytes are plaintext again</text><line x1="16" y1="320" x2="964" y2="320" stroke="#4a4a4a" stroke-width="1"/><text x="24" y="362" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed"><tspan font-weight="700">chain on </tspan><tspan fill="#f2c14e" font-weight="700">VirtuallyConnects&lt;Device, Cloud, Broker&gt;</tspan><tspan font-weight="700">  (end to end)</tspan></text><rect x="24" y="402" width="120" height="48" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="84" y="431" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Device</text><rect x="836" y="402" width="120" height="48" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="896" y="431" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Cloud</text><rect x="390" y="386" width="200" height="72" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="5 4"/><text x="490" y="406" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#9aa0a6" text-anchor="middle" font-weight="600">Broker (relay)</text><rect x="144" y="419" width="692" height="14" rx="3" fill="#a06fd0"/><rect x="311.77" y="423.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M313.77 423.1 V420.72 A3.23 3.23 0 0 1 320.23 420.72 V423.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><rect x="484.77" y="423.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M486.77 423.1 V420.72 A3.23 3.23 0 0 1 493.23 420.72 V423.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><rect x="657.77" y="423.1" width="10.45" height="7.6" rx="1.42" fill="#1e1e1e"/><path d="M659.77 423.1 V420.72 A3.23 3.23 0 0 1 666.23 420.72 V423.1" fill="none" stroke="#1e1e1e" stroke-width="1.71" stroke-linecap="round"/><text x="490" y="476" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6" text-anchor="middle">forwards sealed chunks: no schema, no key</text><text x="152" y="452" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a06fd0">runs at the two endpoints only</text><line x1="16" y1="488" x2="964" y2="488" stroke="#4a4a4a" stroke-width="1"/><text x="24" y="530" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed"><tspan font-weight="700">chain on a </tspan><tspan fill="#f2c14e" font-weight="700">[UDP]</tspan><tspan font-weight="700"> or </tspan><tspan fil