<svg xmlns="http://www.w3.org/2000/svg" width="980" height="676" viewBox="0 0 980 676" role="img" aria-labelledby="dev16scope-t dev16scope-d">
<title id="dev16scope-t">How far a transform chain reaches</title>
<desc id="dev16scope-d">Four lanes. A chain on a field or a pack seals one value inside the stream between Host A and Host B; the rest of the stream travels as it is. A chain on each physical Connects seals each hop separately: Device to Gateway and Gateway to Cloud; inside the Gateway the bytes are plaintext and it holds the keys of both hops. A chain on VirtuallyConnects of Device, Cloud and Broker is one sealed segment from Device to Cloud that passes straight through the Broker relay, which forwards sealed chunks with no schema and no key; it runs at the two endpoints only. A chain on a UDP or Resumable connection is applied to each pack on its own: every pack from Client to Server carries a 12-byte clear header, the key id and a sequence, in front of its sealed bytes, so it survives loss, journal replay and reconnect. The stages run at the sender, the inverse stages at the receiver.</desc>
<rect width="980" height="676" rx="10" fill="#2b2b2b"/>
