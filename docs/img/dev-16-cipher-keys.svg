ext><text x="896" y="293" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">by your code,</text><text x="896" y="308" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">once per stream</text><rect x="889" y="176" width="14" height="52" rx="2" fill="#a06fd0"/><rect x="891.05" y="199.2" width="9.9" height="7.2" rx="1.35" fill="#1e1e1e"/><path d="M892.94 199.2 V196.95 A3.06 3.06 0 0 1 899.06 196.95 V199.2" fill="none" stroke="#1e1e1e" stroke-width="1.62" stroke-linecap="round"/><text x="910" y="206" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#a06fd0">one stream</text><text x="808" y="341" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" font-weight="600">never reuse a</text><text x="808" y="357" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" font-weight="600">(key, nonce) for</text><text x="808" y="373" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" font-weight="600">two streams</text><line x1="16" y1="398" x2="984" y2="398" stroke="#4a4a4a" stroke-width="1"/><text x="500" y="428" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">[ChaCha20] conceals but does not authenticate; Poly1305 authenticates transport records on each physical connection only</text>
