Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">key 9 (newest)</text><rect x="360" y="70" width="126" height="253" rx="5" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="423" y="94" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="700">Server</text><text x="423" y="112" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#c9d4e3" text-anchor="middle">static X25519</text><text x="423" y="127" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#c9d4e3" text-anchor="middle">key pair</text><rect x="366" y="146" width="114" height="169" rx="4" fill="#232323" stroke="#6f9fd8" stroke-width="1"/><text x="423" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">session keyring</text><rect x="370" y="201" width="106" height="26" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8"/><text x="423" y="218.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">key 7</text><rect x="370" y="277" width="106" height="26" rx="3" fill="#363636" stroke="#9aa0a6" stroke-width="1"/><text x="423" y="294.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">key 9 (newest)</text><path d="M141 214 L149 209.6 L149 218.4 Z" fill="#4fb3ff"/><line x1="149" y1="214" x2="364.2" y2="214" stroke="#4fb3ff" stroke-width="2"/><path d="M369 214 L361 209.6 L361 218.4 Z" fill="#4fb3ff"/><text x="255" y="206" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle" font-weight="600">connection #1</text><text x="255" y="231" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">Noise NK handshake, then</text><text x="255" y="245" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">ChaCha20-Poly1305 records</text><path d="M141 290 L149 285.6 L149 294.4 Z" fill="#4fb3ff"/><line x1="149" y1="290" x2="364.2" y2="290" stroke="#4fb3ff" stroke-width="2"/><path d="M369 290 L361 285.6 L361 294.4 Z" fill="#4fb3ff"/><text x="255" y="282" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle" font-weight="600">connection #2 (reconnect)</text><text x="255" y="307" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">Noise NK handshake, then</text><text x="255" y="321" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle">ChaCha20-Poly1305 records</text><text x="24" y="345" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">each connection adds its key to the session;</text><text x="24" y="361" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa0a6">keys stay until the session ends</text><rect x="512" y="96" width="74" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/><text x="549" y="117.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">key id 4 B</text><rect x="586" y="96" width="100" height="34" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/><text x="636" y="117.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">sequence 8 B</text><rect x="690" y="96" width="96" height="34" rx="3" fill="#3d2d52" stroke="#a06fd0" stroke-width="1.6"/><rect x="700.77" y="110.1" width="10.45" height="7.6" rx="1.42" fill="#a06fd0"/><path d="M702.77 110.1 V107.73 A3.23 3.23 0 0 1 709.23 107.73 V110.1" fill="none" stroke="#a06fd0" stroke-width="1.71" stroke-linecap="round"/><text x="748" y="117.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">ciphertext</text><path d="M513 90 V84 H685 V90" fill="none" stroke="#f2c14e" stroke-width="1.3"/><text x="599" y="78" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">in clear</text><text x="512" y="152" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed">nonce = key base nonce XOR sequence;</text><text x="512" y="168" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed">each pack decrypts alone</text><rect x="692" y="197" width="92" height="34" rx="4" fill="#363636" stroke="#9aa0a6" stroke-width="1.3"/><text x="738" y="218.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">journal</text><line x1="690" y1="214" x2="481.4" y2="214" stroke="#f2c14e" stroke-width="2"/><path d="M476 214 L485 209.05 L485 218.95 Z" fill="#f2c14e"/><text x="682" y="190" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="end">replayed after</text><text x="682" y="205" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="end">reconnect:</text><text x="682" y="234" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="end">names key 7</text><rect x="692" y="273" width="92" height="34" rx="4" fill="#363636" stroke="#9aa0a6" stroke-width="1.3"/><text x="738" y="294.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">new pack</text><line x1="690" y1="290" x2="480.8" y2="290" stroke="#e8eaed" stroke-width="1.6"/><path d="M476 290 L484 285.6 L484 294.4 Z" fill="#e8ea