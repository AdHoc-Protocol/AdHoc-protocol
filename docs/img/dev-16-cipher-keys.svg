<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="456" viewBox="0 0 1000 456" role="img" aria-labelledby="dev16keys-t dev16keys-d">
<title id="dev16keys-t">Where the keys of a ChaCha20 stage come from</title>
<desc id="dev16keys-d">Three columns. Session keys from the transport: the Server holds a static X25519 key pair and the Client pins the server public key; connection number 1 and, after a reconnect, connection number 2 each run a Noise NK handshake and then ChaCha20-Poly1305 records, and each adds its key to the session keyring on both sides, key 7 and key 9, the newest. Per-pack cipher: a pack carries a 4-byte key id and an 8-byte sequence in clear in front of its ciphertext; the nonce is the key base nonce XOR the sequence, so each pack decrypts alone. A pack replayed from the journal after a reconnect names key 7 and is decrypted with it; new packs use the newest key; a pack whose key the receiver does not have is dropped whole. Chain on a connection stream: both endpoints get a key and nonce injected by your code, once per stream, and a key and nonce pair must never be reused for two streams. ChaCha20 conceals but does not authenticate; Poly1305 authenticates transport records on each physical connection only.</desc>
<rect width="1000" height="456" rx="10" fill="#2b2b2b"/>
