<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" width="980" height="486" role="img"><title>The chain leaf, Zstd, ChaCha20, wire with the cut marker at three depths. Marker at the leaf: the store keeps the plain serialized pack, runs ChaCha20 inverse and Zstd inverse, holds the key and both stages. Marker between Zstd and ChaCha20: it keeps the compressed blob, runs ChaCha20 inverse only, holds the key. Chain Zstd only, marker at the wire end (AdHoc’s own Project.source): it keeps the compressed wire bytes, runs nothing, holds nothing. Stages left of the marker are skipped on the cut leg</title><rect width="980" height="486" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13"><text x="24" y="40" font-size="18" fill="#e8eaed" font-weight="600">Where the marker stands decides what the store runs</text>
<text x="290" y="76" font-size="13" fill="#9aa0a6">dataflow: leaf → wire</text>
<line x1="432" y1="71" x2="656" y2="71" stroke="#9aa0a6" stroke-width="1.6"/><path d="M664 71 L655 66 L655 76 Z" fill="#9aa0a6"/>
<text x="24" y="106" font-size="12" fill="#9aa0a6">declaration, in dataflow order</text>
<text x="290" y="106" font-size="12" fill="#9aa0a6">on the legs the marker names</text>
<text x="700" y="106" font-size="12" fill="#9aa0a6">the store on its cut legs</text>
<text x="700" y="122" font-size="12" fill="#9aa0a6">(⁻¹ on receipt; forward again on replay)</text>
<line x1="24" y1="218" x2="956" y2="218" stroke="#3a3a3a" stroke-width="1"/>
<line x1="24" y1="318" x2="956" y2="318" stroke="#3a3a3a" stroke-width="1"/>
<text x="24" y="173" font-size="13" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">[<tspan fill="#e8833a">Stream&lt;To,From&gt;</tspan>, Zstd, ChaCha20]</text>
<rect x="290" y="152" width="92" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="336" y="173" font-size="13" fill="#9aa0a6" text-anchor="middle">pack (leaf)</text><line x1="382" y1="168" x2="417" y2="168" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M424 168 L416 163.5 L416 172.5 Z" fill="#9aa0a6"/><line x1="403" y1="143" x2="403" y2="192" stroke="#e8833a" stroke-width="3.5"/><text x="403" y="137" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="700">cut</text><rect x="424" y="152" width="56" height="32" rx="5" fill="#26384d" stroke="#6f9fd8" stroke-width="1.5"/><text x="452" y="173" font-size="13" fill="#e8eaed" text-anchor="middle">Zstd</text><line x1="480" y1="168" x2="497" y2="168" stroke="#e8eaed" stroke-width="1.6"/><path d="M504 168 L496 163.5 L496 172.5 Z" fill="#e8eaed"/><rect x="504" y="152" width="80" height="32" rx="5" fill="#26384d" stroke="#6f9fd8" stroke-width="1.5"/><text x="544" y="173" font-size="13" fill="#e8eaed" text-anchor="middle">ChaCha20</text><line x1="584" y1="168" x2="601" y2="168" stroke="#e8eaed" stroke-width="1.6"/><path d="M608 168 L600 163.5 L600 172.5 Z" fill="#e8eaed"/><rect x="608" y="152" width="56" height="32" rx="5" fill="#1f3a52" stroke="#4fb3ff" stroke-width="1.5"/><text x="636" y="173" font-size="13" fill="#4fb3ff" text-anchor="middle">wire</text><text x="290" y="208" font-size="12" fill="#9aa0a6" font-style="italic">skipped on the cut leg</text>
<text x="700" y="154" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">keeps: </tspan>the plain serialized pack</text><text x="700" y="174" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">runs: </tspan>ChaCha20⁻¹, Zstd⁻¹</text><text x="700" y="194" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">holds: </tspan>the key + both stages</text>
<text x="24" y="273" font-size="13" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">[Zstd, <tspan fill="#e8833a">Stream&lt;To,From&gt;</tspan>, ChaCha20]</text>
<rect x="290" y="252" width="92" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="336" y="273" font-size="13" fill="#9aa0a6" text-anchor="middle">pack (leaf)</text><line x1="382" y1="268" x2="399" y2="268" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M406 268 L398 263.5 L398 272.5 Z" fill="#9aa0a6"/><rect x="406" y="252" width="56" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="434" y="273" font-size="13" fill="#9aa0a6" text-anchor="middle">Zstd</text><line x1="462" y1="268" x2="497" y2="268" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M504 268 L496 263.5 L496 272.5 Z" fill="#9aa0a6"/><line x1="483" y1="243" x2="483" y2="292" stroke="#e8833a" stroke-width="3.5"/><text x="483" y="237" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="700">cut</text><rect x="504" y="252" width="80" height="32" rx="5" fill="#26384d" stroke="#6f9fd8" stroke-width="1.5"/><text x="544" y="273" font-size="13" fill="#e8eaed" text-anchor="middle">ChaCha20</text><line x1="584" y1="268" x2="601" y2="268" stroke="#e8eaed" stroke-width="1.6"/><path d="M608 268 L600 263.5 L600 272.5 Z" fill="#e8eaed"/><rect x="608" y="252" width="56" height="32" rx="5" fill="#1f3a52" stroke="#4fb3ff" stroke-width="1.5"/><text x="636" y="273" font-size="13" fill="#4fb3ff" text-anchor="middle">wire</text><text x="290" y="308" font-size="12" fill="#9aa0a6" font-style="italic">skipped on the cut leg</text>
<text x="700" y="254" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">keeps: </tspan>the compressed blob</text><text x="700" y="274" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">runs: </tspan>ChaCha20⁻¹ only</text><text x="700" y="294" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">holds: </tspan>the key</text>
<text x="24" y="373" font-size="13" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">[Zstd, <tspan fill="#e8833a">ToStream&lt;E&gt;</tspan>]</text>
<rect x="290" y="352" width="92" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="336" y="373" font-size="13" fill="#9aa0a6" text-anchor="middle">pack (leaf)</text><line x1="382" y1="368" x2="399" y2="368" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M406 368 L398 363.5 L398 372.5 Z" fill="#9aa0a6"/><rect x="406" y="352" width="56" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="434" y="373" font-size="13" fill="#9aa0a6" text-anchor="middle">Zstd</text><line x1="462" y1="368" x2="497" y2="368" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M504 368 L496 363.5 L496 372.5 Z" fill="#9aa0a6"/><line x1="483" y1="343" x2="483" y2="392" stroke="#e8833a" stroke-width="3.5"/><text x="483" y="337" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="700">cut</text><rect x="504" y="352" width="56" height="32" rx="5" fill="#1f3a52" stroke="#4fb3ff" stroke-width="1.5"/><text x="532" y="373" font-size="13" fill="#4fb3ff" text-anchor="middle">wire</text><text x="290" y="408" font-size="12" fill="#9aa0a6" font-style="italic">skipped on the cut leg</text>
<text x="700" y="354" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">keeps: </tspan>the wire bytes, still compressed</text><text x="700" y="374" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">runs: </tspan>nothing</text><text x="700" y="394" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">holds: </tspan>nothing</text>
<rect x="24" y="384" width="176" height="22" rx="11" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.3"/>
<text x="112" y="399" font-size="12" fill="#f2c14e" text-anchor="middle">AdHoc’s own Project.source</text>
<text x="24" y="446" font-size="13" fill="#9aa0a6">On every leg the marker does not name, the whole chain runs and both ends hold a typed value.</text>
<text x="24" y="466" font-size="13" fill="#9aa0a6">Keep the built-in ChaCha20 right of a cut whose bytes are replayed: it is keyed per connection.</text></g></svg>
