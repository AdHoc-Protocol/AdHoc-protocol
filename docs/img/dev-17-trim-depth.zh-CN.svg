<text x="24" y="373" font-size="13" fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[Zstd, <tspan fill="#e8833a">ToStream&lt;E&gt;</tspan>]</text>
<rect x="290" y="352" width="92" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="336" y="373" font-size="13" fill="#9aa0a6" text-anchor="middle">pack（叶）</text><line x1="382" y1="368" x2="399" y2="368" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M406 368 L398 363.5 L398 372.5 Z" fill="#9aa0a6"/><rect x="406" y="352" width="56" height="32" rx="5" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="5 4"/><text x="434" y="373" font-size="13" fill="#9aa0a6" text-anchor="middle">Zstd</text><line x1="462" y1="368" x2="497" y2="368" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="4 3"/><path d="M504 368 L496 363.5 L496 372.5 Z" fill="#9aa0a6"/><line x1="483" y1="343" x2="483" y2="392" stroke="#e8833a" stroke-width="3.5"/><text x="483" y="337" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="700">切断</text><rect x="504" y="352" width="56" height="32" rx="5" fill="#1f3a52" stroke="#4fb3ff" stroke-width="1.5"/><text x="532" y="373" font-size="13" fill="#4fb3ff" text-anchor="middle">线路</text><text x="290" y="408" font-size="12" fill="#9aa0a6" font-style="italic">在切断腿上跳过</text>
<text x="700" y="354" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">保留：</tspan>线路字节，仍是压缩的</text><text x="700" y="374" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">运行：</tspan>无</text><text x="700" y="394" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">持有：</tspan>无</text>
