<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 486" width="980" height="486" role="img"><title>链的叶节点、Zstd、ChaCha20、线路，切断标记位于三个深度。标记在叶节点：存储端保留明文序列化的 pack，运行 ChaCha20 逆和 Zstd 逆，持有密钥和两个阶段。标记在 Zstd 与 ChaCha20 之间：保留压缩块，只运行 ChaCha20 逆，持有密钥。链只有 Zstd，标记在线路端（AdHoc 自己的 Project.source）：保留压缩后的线路字节，不运行任何东西，不持有任何东西。标记左侧的阶段在切断腿上都被跳过</title><rect width="980" height="486" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13"><text x="24" y="40" font-size="18" fill="#e8eaed" font-weight="600">标记的位置决定存储端运行什么</text>
<text x="290" y="76" font-size="13" fill="#9aa0a6">数据流：叶 → 线路</text>
<line x1="432" y1="71" x2="656" y2="71" stroke="#9aa0a6" stroke-width="1.6"/><path d="M664 71 L655 66 L655 76 Z" fill="#9aa0a6"/>
<text x="24" y="106" font-size="12" fill="#9aa0a6">声明，按数据流顺序</text>
<text x="290" y="106" font-size="12" fill="#9aa0a6">标记命名的腿上</text>
<text x="700" y="106" font-size="12" fill="#9aa0a6">切断腿上的存储端</text>
<text x="700" y="122" font-size="12" fill="#9aa0a6">（⁻¹ 接收时；重放时再正向）</text>
<line x1="24" y1="218" x2="956" y2="218" stroke="#3a3a3a" stroke-width="1"/>
<line x1="24" y1="318" x2="956" y2="318" stroke="#3a3a3a" stroke-width="1"/>
