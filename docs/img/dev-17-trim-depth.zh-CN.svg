<text x="112" y="399" font-size="12" fill="#f2c14e" text-anchor="middle">AdHoc 自己的 Project.source</text>
<text x="24" y="446" font-size="13" fill="#9aa0a6">在标记未命名的每条腿上，整条链都会运行，两端都持有类型化的值。</text>
<text x="24" y="466" font-size="13" fill="#9aa0a6">若字节会被重放，把内置 ChaCha20 放在切断点的右侧：它按连接设置密钥。</text></g></svg>
