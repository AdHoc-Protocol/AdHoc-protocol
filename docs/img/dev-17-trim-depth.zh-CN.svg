<text x="700" y="154" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">保留：</tspan>明文序列化的 pack</text><text x="700" y="174" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">运行：</tspan>ChaCha20⁻¹, Zstd⁻¹</text><text x="700" y="194" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">持有：</tspan>密钥 + 两个阶段</text>
