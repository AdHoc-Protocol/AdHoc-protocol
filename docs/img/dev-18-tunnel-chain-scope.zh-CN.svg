<text x="300" y="140" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[Zstd, ChaCha20]</text>
<text x="300" y="171" font-size="12" fill="#9aa0a6" text-anchor="middle">在此线路上密封</text>
