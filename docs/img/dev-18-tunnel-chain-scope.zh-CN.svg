<text x="680" y="140" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[Zstd, ChaCha20]</text>
<text x="680" y="171" font-size="12" fill="#9aa0a6" text-anchor="middle">在此线路上密封</text>
<text x="490" y="222" font-size="13" fill="#e8833a" text-anchor="middle">Hub 解密一段链路并加密下一段</text>
<rect x="16" y="266" width="948" height="240" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="36" y="292" font-size="14" fill="#e8eaed" font-weight="700">虚拟连接上的链</text>
<text x="490" y="300" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">[Zstd(6), ChaCha20]</text>
<text x="490" y="318" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">interface ViewerToServer : VirtuallyConnects&lt;Viewer, Server, Hub&gt;</text>
