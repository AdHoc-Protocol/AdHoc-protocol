<text x="490" y="442" font-size="13" fill="#4fb3ff" text-anchor="middle">无密钥,无明文</text>
<rect x="770" y="376" width="150" height="80" rx="6" fill="#35383d" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="845" y="412" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Server</text>
<g stroke="#f2c14e" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="838" cy="432" r="4.5"/><path d="M842.5 432 H856 M851.5 432 V437 M856 432 V438"/></g>
