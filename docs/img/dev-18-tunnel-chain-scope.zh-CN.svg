<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 572" width="980" height="572" role="img"><title>上图:物理链路 ViewerToHub 与 HubToServer 上的链,各为 Zstd 与 ChaCha20;Viewer、Hub、Server 都持有密钥,Hub 在两段链路之间持有明文。下图:虚拟连接 ViewerToServer 上的链 Zstd(6)、ChaCha20;只有 Viewer 和 Server 持有密钥,Hub 转发密封块,无密钥也无明文;Viewer 先压缩后加密,Server 先解密后解压</title><rect width="980" height="572" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13"><text x="24" y="40" font-size="18" fill="#e8eaed" font-weight="600">谁能读取载荷</text>
