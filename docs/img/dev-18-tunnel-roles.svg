<line x1="248" y1="177" x2="416" y2="177" stroke="#4fb3ff" stroke-width="2.5"/><path d="M425 177 L415 171.5 L415 182.5 Z" fill="#4fb3ff"/><path d="M239 177 L249 171.5 L249 182.5 Z" fill="#4fb3ff"/>
<text x="332" y="166" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ViewerToHub :</text>
<text x="332" y="197" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Connects&lt;Viewer, Hub&gt;</text>
<line x1="564" y1="177" x2="732" y2="177" stroke="#4fb3ff" stroke-width="2.5"/><path d="M741 177 L731 171.5 L731 182.5 Z" fill="#4fb3ff"/><path d="M555 177 L565 171.5 L565 182.5 Z" fill="#4fb3ff"/>
<text x="648" y="166" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">HubToServer :</text>
