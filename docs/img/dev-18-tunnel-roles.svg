<text x="174" y="172" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Viewer</text>
<text x="174" y="193" font-size="13" fill="#e8833a" text-anchor="middle">L - endpoint</text>
<rect x="425" y="148" width="130" height="58" rx="6" fill="#35383d" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="490" y="172" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Hub</text>
<text x="490" y="193" font-size="13" fill="#a06fd0" text-anchor="middle">PATH - relay host</text>
<rect x="741" y="148" width="130" height="58" rx="6" fill="#35383d" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="806" y="172" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Server</text>
