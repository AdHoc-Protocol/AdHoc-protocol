<rect x="24" y="236" width="300" height="212" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><path d="M24 242 Q24 236 30 236 H318 Q324 236 324 242" fill="none" stroke="#e8833a" stroke-width="3"/><text x="38" y="262" font-size="14" fill="#e8833a" font-weight="700">endpoint</text><text x="38" y="286" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">carrier = </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ViewerToHub</tspan></text><text x="38" y="304" font-size="12" fill="#9aa0a6">the physical leg the frames arrive on</text><line x1="42" y1="314" x2="42" y2="374" stroke="#4a4a4a" stroke-width="1.4"/><text x="52" y="328" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">tunnels_ViewerToServer</tspan><tspan fill="#9aa0a6"> - by tunnel_id</tspan></text><text x="52" y="348" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">rx_ / tx_ / send_ViewerToServer</tspan></text><text x="52" y="368" font-size="12" fill="#e8eaed"><tspan fill="#9aa0a6">regions </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunnel</tspan><tspan fill="#9aa0a6"> and </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunnel end</tspan></text><line x1="38" y1="386" x2="310" y2="386" stroke="#3a3a3a" stroke-width="1"/><text x="38" y="408" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ViewerToServer.Connection</tspan><tspan fill="#9aa0a6"> on a</tspan></text><text x="38" y="428" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunnel.EndPoint</tspan><tspan fill="#9aa0a6">: actors, packs, chain</tspan></text>
<rect x="656" y="236" width="300" height="212" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><path d="M656 242 Q656 236 662 236 H950 Q956 236 956 242" fill="none" stroke="#e8833a" stroke-width="3"/><text x="670" y="262" font-size="14" fill="#e8833a" font-weight="700">endpoint</text><text x="670" y="286" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">carrier = </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">HubToServer</tspan></text><text x="670" y="304" font-size="12" fill="#9aa0a6">the physical leg the frames arrive on</text><line x1="674" y1="314" x2="674" y2="374" stroke="#4a4a4a" stroke-width="1.4"/><text x="684" y="328" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">tunnels_ViewerToServer</tspan><tspan fill="#9aa0a6"> - by tunnel_id</tspan></text><text x="684" y="348" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">rx_ / tx_ / send_ViewerToServer</tspan></text><text x="684" y="368" font-size="12" fill="#e8eaed"><tspan fill="#9aa0a6">regions </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunnel</tspan><tspan fill="#9aa0a6"> and </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunnel end</tspan></text><line x1="670" y1="386" x2="942" y2="386" stroke="#3a3a3a" stroke-width="1"/><text x="670" y="408" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ViewerToServer.Connection</tspan><tspan fill="#9aa0a6"> on a</tspan></text><text x="670" y="428" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunnel.EndPoint</tspan><tspan fill="#9aa0a6">: actors, packs, chain</tspan></text>
<rect x="340" y="236" width="300" height="212" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><path d="M340 242 Q340 236 346 236 H634 Q640 236 640 242" fill="none" stroke="#a06fd0" stroke-width="3"/><text x="354" y="262" font-size="14" fill="#a06fd0" font-weight="700">relay host</text><text x="354" y="286" font-size="13" fill="#e8eaed">on the receiver of each leg:</text><text x="354" y="306" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">relay&lt;id&gt;</tspan><tspan fill="#9aa0a6"> - a </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Connection.Tunnel.Relay</tspan></text><text x="354" y="330" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Provider_ViewerToServer_External</tspan></text><text x="370" y="348" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">.outbound(dst, tunnel_id)</tspan></text><text x="354" y="372" font-size="12" fill="#e8eaed"><tspan fill="#9aa0a6">region </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Tunneling</tspan><tspan fill="#9aa0a6">:</tspan></text><text x="370" y="390" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">tunnel_id</tspan><tspan fill="#9aa0a6"> → the other leg, or null</tspan></text><line x1="354" y1="404" x2="626" y2="404" stroke="#3a3a3a" stroke-width="1"/><text x="354" y="428" font-size="12" fill="#a06fd0">no packs, actors or keys of ViewerToServer</text>
<text x="24" y="484" font-size="13" fill="#9aa0a6">Relays forward chunks without decoding them; the endpoints speak the whole connection.</text>
<text x="24" y="504" font-size="13" fill="#9aa0a6">TypeScript endpoints have no tunnels table: your code fills the regions.</text></g></svg>
