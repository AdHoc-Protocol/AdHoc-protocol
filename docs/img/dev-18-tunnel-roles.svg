<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 528" width="980" height="528" role="img"><title>Viewer and Server joined by the virtual connection ViewerToServer through the Hub. The Hub, the relay host, gets a Relay per virtual connection on the receiver of each physical leg and a Provider whose Tunneling region maps a tunnel_id to the other leg; the endpoints get, on their carrier connection, the tunnels table, the rx and tx demux, the send function, the Tunnel and Tunnel end regions, and the virtual connection itself on a Tunnel.EndPoint with its actors, packs and chain</title><rect width="980" height="528" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13"><text x="24" y="40" font-size="18" fill="#e8eaed" font-weight="600">One VirtuallyConnects declaration, three roles</text>
<text x="490" y="72" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ViewerToServer : VirtuallyConnects&lt;Viewer, Server, Hub&gt;</text>
<path d="M174 140 C174 88 806 88 806 140" fill="none" stroke="#e8833a" stroke-width="2.2" stroke-dasharray="7 5"/>
