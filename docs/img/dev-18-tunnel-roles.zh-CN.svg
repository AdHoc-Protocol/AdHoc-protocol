<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 528" width="980" height="528" role="img"><title>Viewer 与 Server 经由 Hub 通过虚拟连接 ViewerToServer 相连。Hub 是中继主机，它在每条物理链路的接收器上为每条虚拟连接获得一个 Relay，并有一个 Provider，其 Tunneling 区域把 tunnel_id 映射到另一条链路；两个端点在其承载连接上获得 tunnels 表、rx 与 tx 解复用器、发送函数、Tunnel 与 Tunnel end 区域，以及位于 Tunnel.EndPoint 上的虚拟连接本身及其 Actor、pack 和变换链</title><rect width="980" height="528" rx="10" fill="#2b2b2b"/><g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13"><text x="24" y="40" font-size="18" fill="#e8eaed" font-weight="600">一个 VirtuallyConnects 声明，三种角色</text>
<text x="490" y="72" font-size="13" fill="#e8833a" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ViewerToServer : VirtuallyConnects&lt;Viewer, Server, Hub&gt;</text>
<path d="M174 140 C174 88 806 88 806 140" fill="none" stroke="#e8833a" stroke-width="2.2" stroke-dasharray="7 5"/>
<path d="M174 148 L169 139 L179 139 Z" fill="#e8833a"/>
<path d="M806 148 L801 139 L811 139 Z" fill="#e8833a"/>
<text x="490" y="127" font-size="12" fill="#9aa0a6" text-anchor="middle">隧道——字节行经两条物理链路</text>
<rect x="109" y="148" width="130" height="58" rx="6" fill="#35383d" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="174" y="172" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Viewer</text>
<text x="174" y="193" font-size="13" fill="#e8833a" text-anchor="middle">L——端点</text>
<rect x="425" y="148" width="130" height="58" rx="6" fill="#35383d" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="490" y="172" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Hub</text>
<text x="490" y="193" font-size="13" fill="#a06fd0" text-anchor="middle">PATH——中继主机</text>
<rect x="741" y="148" width="130" height="58" rx="6" fill="#35383d" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="806" y="172" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Server</text>
<text x="806" y="193" font-size="13" fill="#e8833a" text-anchor="middle">R——端点</text>
<line x1="248" y1="177" x2="416" y2="177" stroke="#4fb3ff" stroke-width="2.5"/><path d="M425 177 L415 171.5 L415 182.5 Z" fill="#4fb3ff"/><path d="M239 177 L249 171.5 L249 182.5 Z" fill="#4fb3ff"/>
<text x="332" y="166" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ViewerToHub :</text>
<text x="332" y="197" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Connects&lt;Viewer, Hub&gt;</text>
<line x1="564" y1="177" x2="732" y2="177" stroke="#4fb3ff" stroke-width="2.5"/><path d="M741 177 L731 171.5 L731 182.5 Z" fill="#4fb3ff"/><path d="M555 177 L565 171.5 L565 182.5 Z" fill="#4fb3ff"/>
<text x="648" y="166" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">HubToServer :</text>
<text x="648" y="197" font-size="13" fill="#9aa0a6" text-anchor="middle" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Connects&lt;Hub, Server&gt;</text>
<line x1="174" y1="206" x2="174" y2="236" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="490" y1="206" x2="490" y2="236" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="3 3"/>
<line x1="806" y1="206" x2="806" y2="236" stroke="#4a4a4a" stroke-width="1.6" stroke-dasharray="3 3"/>
<rect x="24" y="236" width="300" height="212" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><path d="M24 242 Q24 236 30 236 H318 Q324 236 324 242" fill="none" stroke="#e8833a" stroke-width="3"/><text x="38" y="262" font-size="14" fill="#e8833a" font-weight="700">端点</text><text x="38" y="286" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">承载连接 = </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ViewerToHub</tspan></text><text x="38" y="304" font-size="12" fill="#9aa0a6">帧到达的物理链路</text><line x1="42" y1="314" x2="42" y2="374" stroke="#4a4a4a" stroke-width="1.4"/><text x="52" y="328" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">tunnels_ViewerToServer</tspan><tspan fill="#9aa0a6">——按 tunnel_id</tspan></text><text x="52" y="348" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">rx_ / tx_ / send_ViewerToServer</tspan></text><text x="52" y="368" font-size="12" fill="#e8eaed"><tspan fill="#9aa0a6">区域 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunnel</tspan><tspan fill="#9aa0a6"> 与 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunnel end</tspan></text><line x1="38" y1="386" x2="310" y2="386" stroke="#3a3a3a" stroke-width="1"/><text x="38" y="408" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ViewerToServer.Connection</tspan><tspan fill="#9aa0a6">，位于</tspan></text><text x="38" y="428" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunnel.EndPoint</tspan><tspan fill="#9aa0a6">:Actor、pack、变换链</tspan></text>
<rect x="656" y="236" width="300" height="212" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><path d="M656 242 Q656 236 662 236 H950 Q956 236 956 242" fill="none" stroke="#e8833a" stroke-width="3"/><text x="670" y="262" font-size="14" fill="#e8833a" font-weight="700">端点</text><text x="670" y="286" font-size="13" fill="#e8eaed"><tspan fill="#9aa0a6">承载连接 = </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">HubToServer</tspan></text><text x="670" y="304" font-size="12" fill="#9aa0a6">帧到达的物理链路</text><line x1="674" y1="314" x2="674" y2="374" stroke="#4a4a4a" stroke-width="1.4"/><text x="684" y="328" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">tunnels_ViewerToServer</tspan><tspan fill="#9aa0a6">——按 tunnel_id</tspan></text><text x="684" y="348" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">rx_ / tx_ / send_ViewerToServer</tspan></text><text x="684" y="368" font-size="12" fill="#e8eaed"><tspan fill="#9aa0a6">区域 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunnel</tspan><tspan fill="#9aa0a6"> 与 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunnel end</tspan></text><line x1="670" y1="386" x2="942" y2="386" stroke="#3a3a3a" stroke-width="1"/><text x="670" y="408" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">ViewerToServer.Connection</tspan><tspan fill="#9aa0a6">，位于</tspan></text><text x="670" y="428" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunnel.EndPoint</tspan><tspan fill="#9aa0a6">:Actor、pack、变换链</tspan></text>
<rect x="340" y="236" width="300" height="212" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><path d="M340 242 Q340 236 346 236 H634 Q640 236 640 242" fill="none" stroke="#a06fd0" stroke-width="3"/><text x="354" y="262" font-size="14" fill="#a06fd0" font-weight="700">中继主机</text><text x="354" y="286" font-size="13" fill="#e8eaed">在每条链路的接收器上:</text><text x="354" y="306" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">relay&lt;id&gt;</tspan><tspan fill="#9aa0a6">——一个 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Connection.Tunnel.Relay</tspan></text><text x="354" y="330" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Provider_ViewerToServer_External</tspan></text><text x="370" y="348" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">.outbound(dst, tunnel_id)</tspan></text><text x="354" y="372" font-size="12" fill="#e8eaed"><tspan fill="#9aa0a6">区域 </tspan><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">Tunneling</tspan><tspan fill="#9aa0a6">:</tspan></text><text x="370" y="390" font-size="12" fill="#e8eaed"><tspan font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">tunnel_id</tspan><tspan fill="#9aa0a6"> → 另一条链路，或 null</tspan></text><line x1="354" y1="404" x2="626" y2="404" stroke="#3a3a3a" stroke-width="1"/><text x="354" y="428" font-size="12" fill="#a06fd0">没有 ViewerToServer 的 pack、Actor 或密钥</text>
<text x="24" y="484" font-size="13" fill="#9aa0a6">Relay 不解码直接转发块;整条连接的协议由端点处理。</text>
<text x="24" y="504" font-size="13" fill="#9aa0a6">TypeScript 端点没有 tunnels 表:由你的代码填充各区域。</text></g></svg>
