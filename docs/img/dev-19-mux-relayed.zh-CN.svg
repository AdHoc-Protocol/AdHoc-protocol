<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="dev19relay-t dev19relay-d">
<title id="dev19relay-t">多路复用器中的一条中继连接</title>
<desc id="dev19relay-d">Browser、Admin 和 Mobile 各自拨号主机 Edge 的 443 端口，每个套接字以拨号主机的 uid 开头。多路复用器 EdgePort 读取第一个字节：Browser.uid 去往 Console，Admin.uid 去往 AdminLink，两者由 Edge 自己服务；Mobile.uid 去往 Query — Mobile 与 Backend 之间的连接，Edge 不是其参与方，因此 Edge 中继它。Query 的字节在隧道中传输，wire id 来自 packs 池，封装在 EdgeBackend 中 — Edge 与 Backend 之间唯一的物理连接，即承载者。Edge 与 Mobile 之间被划掉的虚线第二链路展示了错误情形：如果 Query 两端都与 Edge 有物理连接，就分不清该由哪一侧拨号。</desc>
<rect width="960" height="500" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">

<!-- dialing hosts -->
<rect x="28" y="52" width="152" height="52" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="104" y="74" font-size="14" fill="#e8eaed" text-anchor="middle">Browser</text>
<text x="104" y="92" font-size="12" fill="#9aa0a6" text-anchor="middle">为 Console 拨号</text>
<rect x="28" y="150" width="152" height="52" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="104" y="172" font-size="14" fill="#e8eaed" text-anchor="middle">Admin</text>
<text x="104" y="190" font-size="12" fill="#9aa0a6" text-anchor="middle">为 AdminLink 拨号</text>
<rect x="28" y="248" width="152" height="52" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="104" y="270" font-size="14" fill="#e8eaed" text-anchor="middle">Mobile</text>
<text x="104" y="288" font-size="12" fill="#9aa0a6" text-anchor="middle">为 Query 拨号</text>

<!-- wires to the port, labelled with the first byte -->
<path d="M180 78 H248 L280 162 H295" fill="none" stroke="#4fb3ff" stroke-width="2"/>
<path d="M302 162 L295 157.8 L295 166.2 Z" fill="#4fb3ff"/>
<line x1="180" y1="176" x2="295" y2="176" stroke="#4fb3ff" stroke-width="2"/>
<path d="M302 176 L295 171.8 L295 180.2 Z" fill="#4fb3ff"/>
<path d="M180 274 H248 L280 190 H295" fill="none" stroke="#4fb3ff" stroke-width="2"/>
<path d="M302 190 L295 185.8 L295 194.2 Z" fill="#4fb3ff"/>
<text x="217" y="70" font-size="12.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Browser.uid</text>
<text x="230" y="168" font-size="12.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Admin.uid</text>
<text x="217" y="266" font-size="12.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Mobile.uid</text>

<!-- Edge -->
<rect x="320" y="36" width="276" height="294" rx="4" fill="#3a5a80" stroke="#e8833a" stroke-width="2"/>
<text x="458" y="60" font-size="15" fill="#e8eaed" text-anchor="middle">Edge</text>
<text x="458" y="78" font-size="12" fill="#9aa0a6" text-anchor="middle">Console 和 AdminLink 的参与方</text>

<!-- port tab -->
<rect x="302" y="150" width="92" height="52" rx="4" fill="#243447" stroke="#e8833a" stroke-width="1.8"/>
<text x="348" y="172" font-size="14" fill="#e8eaed" text-anchor="middle">:443</text>
<text x="348" y="191" font-size="12" fill="#9aa0a6" text-anchor="middle">TCP/WS 服务器</text>
<line x1="394" y1="176" x2="401" y2="176" stroke="#4fb3ff" stroke-width="2"/>
<path d="M408 176 L401 171.8 L401 180.2 Z" fill="#4fb3ff"/>

<!-- EdgePort -->
<rect x="408" y="96" width="174" height="220" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8"/>
<text x="495" y="118" font-size="14" fill="#e8eaed" text-anchor="middle">EdgePort</text>
<text x="495" y="135" font-size="12" fill="#9aa0a6" text-anchor="middle">读取第 1 个字节</text>
<rect x="418" y="148" width="154" height="44" rx="3" fill="#2b2b2b" stroke="#6f9fd8" stroke-width="1.2"/>
<text x="495" y="166" font-size="12.5" fill="#e8eaed" text-anchor="middle">Browser.uid → Console</text>
<text x="495" y="184" font-size="12" fill="#9aa0a6" text-anchor="middle">由此处服务</text>
<rect x="418" y="202" width="154" height="44" rx="3" fill="#2b2b2b" stroke="#6f9fd8" stroke-width="1.2"/>
<text x="495" y="220" font-size="12.5" fill="#e8eaed" text-anchor="middle">Admin.uid → AdminLink</text>
<text x="495" y="238" font-size="12" fill="#9aa0a6" text-anchor="middle">由此处服务</text>
<rect x="418" y="256" width="154" height="44" rx="3" fill="#2b2b2b" stroke="#a06fd0" stroke-width="1.6"/>
<text x="495" y="274" font-size="12.5" fill="#e8eaed" text-anchor="middle">Mobile.uid → Query</text>
<text x="495" y="292" font-size="12.5" fill="#f2c14e" text-anchor="middle">被中继</text>

<!-- the carrier band and the tunnel inside it -->
<text x="683" y="222" font-size="13.5" fill="#f2c14e" text-anchor="middle">EdgeBackend</text>
<text x="683" y="240" font-size="12.5" fill="#e8eaed" text-anchor="middle">承载者</text>
<text x="683" y="254" font-size="12" fill="#9aa0a6" text-anchor="middle">（物理 Connects）</text>
<rect x="596" y="263" width="174" height="30" fill="#4a4a4a"/>
<line x1="579" y1="278" x2="779" y2="278" stroke="#a06fd0" stroke-width="2.2" stroke-dasharray="7 4"/>
<path d="M572 278 L579 273.8 L579 282.2 Z" fill="#a06fd0"/>
<path d="M786 278 L779 273.8 L779 282.2 Z" fill="#a06fd0"/>
<text x="683" y="312" font-size="12" fill="#a06fd0" text-anchor="middle">Query 字节在隧道中，</text>
<text x="683" y="328" font-size="12" fill="#a06fd0" text-anchor="middle">wire id 来自 packs 池</text>

<!-- Backend -->
<rect x="770" y="196" width="160" height="134" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="850" y="218" font-size="14" fill="#e8eaed" text-anchor="middle">Backend</text>
<text x="850" y="236" font-size="12" fill="#9aa0a6" text-anchor="middle">只能从 Edge 到达</text>
<rect x="786" y="254" width="128" height="48" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/>
<text x="850" y="274" font-size="13" fill="#f2c14e" text-anchor="middle">Query</text>
<text x="850" y="291" font-size="12" fill="#9aa0a6" text-anchor="middle">另一端</text>

<!-- the error case: a second carrier -->
<path d="M104 300 V368 H458 V330" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.6"/>
<path d="M273 360 L289 376 M289 360 L273 376" stroke="#9aa0a6" stroke-width="2.6" stroke-linecap="round"/>
<text x="281" y="394" font-size="12.5" fill="#9aa0a6" text-anchor="middle">Edge - Mobile 的第二条物理链路：</text>
<text x="281" y="411" font-size="12.5" fill="#9aa0a6" text-anchor="middle">错误 — 分不清哪一侧拨号</text>

<!-- caption -->
<text x="480" y="452" font-size="13" fill="#9aa0a6" text-anchor="middle">Edge 是 Console 和 AdminLink 的参与方，因此它拥有该端口。Query（Mobile - Backend）通过唯一的承载者 EdgeBackend 中继；</text>
<text x="480" y="472" font-size="13" fill="#9aa0a6" text-anchor="middle">没有承载者的一端 Mobile 用 Mobile.uid 拨号该端口。</text>
</g>
</svg>
