<rect x="736" y="200" width="91" height="32" rx="5" fill="#342a42" stroke="#a06fd0" stroke-width="1.4"/>
<text x="781.5" y="221" font-size="13" fill="#a06fd0" text-anchor="middle">removed</text>
<rect x="839" y="200" width="91" height="32" rx="5" fill="#303236" stroke="#9aa0a6" stroke-width="1.4"/>
<text x="884.5" y="221" font-size="13" fill="#9aa0a6" text-anchor="middle">not reached</text>

<path d="M532 245 L539 249.5 L532 254 Z" fill="#9aa0a6"/>
<text x="546" y="254" font-size="12.5" fill="#e8eaed">How it is decided</text>
<path d="M532 265 L539 269.5 L532 274 Z" fill="#9aa0a6"/>
<text x="546" y="274" font-size="12.5" fill="#e8eaed">The details<tspan fill="#9aa0a6">: what changed, and why each host is reached</tspan></text>
<path d="M532 285 L539 289.5 L532 294 Z" fill="#9aa0a6"/>
<text x="546" y="294" font-size="12.5" fill="#e8eaed">Comments edited<tspan fill="#9aa0a6">: reach no host</tspan></text>

<rect x="530" y="306" width="400" height="24" rx="3" fill="#1f2a36" stroke="#4fb3ff" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="542" y="322" font-size="12" fill="#4fb3ff" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">&lt;script id="adhoc-impact"&gt;<tspan fill="#9aa0a6" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5"> one line of JSON, not shown</tspan></text>

<!-- pipeline -->
<path d="M560 330 V378 H592" fill="none" stroke="#4fb3ff" stroke-width="2"/>
<path d="M600 378 L592 373.5 L592 382.5 Z" fill="#4fb3ff"/>
<text x="550" y="382" font-size="12" fill="#9aa0a6" text-anchor="end">one grep, no HTML parser</text>
<rect x="600" y="352" width="344" height="52" rx="6" fill="#26384d" stroke="#4fb3ff" stroke-width="1.4"/>
<text x="616" y="374" font-size="13.5" fill="#e8eaed">CI script: jq / ConvertFrom-Json</text>
<text x="616" y="393" font-size="12" fill="#9aa0a6">fail when a frozen host is in update or removed</text>
</g>
</svg>
