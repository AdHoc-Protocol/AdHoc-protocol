<text x="530" y="164" font-size="13" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">FleetProtocol.changes.html</text>

<text x="530" y="192" font-size="12" fill="#9aa0a6">one tile per host, by verdict</text>
