<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="d22l-t d22l-d">
<title id="d22l-t">一个主机的一个端口，连接来自两个系统</title>
<desc id="d22l-d">三个项目。下方并排：Product，含主机 Engine；Operations，含主机 Console 和 Agent，Console 通过 ConsoleToAgent 拨号到 Agent。上方虚线紫框：Board，同时扩展两者的一层。Board 中有主机 Screen、连接 ScreenToAgent（Screen 属于一个系统，Agent 属于另一个，只有 Board 能声明它），以及覆盖 ScreenToAgent 与 ConsoleToAgent 的多路复用器 AgentPort（橙框）：只有 Board 同时看到这两个连接。Agent 的端口画在 Agent 上，两条箭头到达它：来自 Screen，首字节 Screen.uid；来自 Console，首字节 Console.uid；端口把每个套接字交给它的连接。每个主机下方注明其代码从哪个项目生成：Engine 与 Console 来自各自的系统；Screen 与 Agent 来自 Board--Agent 因为它监听 Board 声明的多路复用器。底部：拨号的主机不需要在自己的项目中看到多路复用器，因为每个连接都带有 id，即其自身主机的 uid，在每个看到它的项目中都相同；监听的主机从声明其多路复用器的项目生成，因此只从那里部署它。</desc>
<defs><marker id="d22l-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4fb3ff"/></marker></defs>
<rect width="960" height="540" rx="10" fill="#2b2b2b"/>
<g font-family="Microsoft YaHei,PingFang SC,Noto Sans CJK SC,Segoe UI,sans-serif">
<text x="24" y="36" font-size="18" fill="#e8833a" font-weight="600">一个主机的一个端口，连接来自两个系统</text>
<rect x="20" y="56" width="920" height="150" rx="8" fill="none" stroke="#a06fd0" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="36" y="80" font-size="13" fill="#a06fd0" font-weight="600">Board : Product, Operations - 同时看到两个系统的层</text>
<rect x="60" y="104" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="135.0" y="131" font-size="14" fill="#e8eaed" text-anchor="middle">Screen</text>
<text x="135" y="168" font-size="12" fill="#9aa0a6" text-anchor="middle">代码来自 Board</text>
<rect x="470" y="98" width="440" height="66" rx="6" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/>
<text x="690" y="124" font-size="13" fill="#f2c14e" text-anchor="middle">AgentPort : Multiplex&lt;(ScreenToAgent, ConsoleToAgent)&gt;</text>
<text x="690" y="148" font-size="12" fill="#e8eaed" text-anchor="middle">在 Board 中声明：只有 Board 同时看到这两个连接</text>
<rect x="20" y="236" width="300" height="186" rx="8" fill="none" stroke="#6f9fd8" stroke-width="1.4"/>
<text x="36" y="260" font-size="13" fill="#6f9fd8" font-weight="600">Product</text>
<rect x="95" y="290" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="170.0" y="317" font-size="14" fill="#e8eaed" text-anchor="middle">Engine</text>
<text x="170" y="354" font-size="12" fill="#9aa0a6" text-anchor="middle">代码来自 Product</text>
<rect x="350" y="236" width="590" height="186" rx="8" fill="none" stroke="#6f9fd8" stroke-width="1.4"/>
<text x="366" y="260" font-size="13" fill="#6f9fd8" font-weight="600">Operations</text>
<rect x="372" y="330" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="447.0" y="357" font-size="14" fill="#e8eaed" text-anchor="middle">Console</text>
<text x="447" y="394" font-size="12" fill="#9aa0a6" text-anchor="middle">代码来自 Operations</text>
<rect x="740" y="330" width="170" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="825.0" y="357" font-size="14" fill="#e8eaed" text-anchor="middle">Agent</text>
<text x="825" y="394" font-size="12" fill="#e8eaed" text-anchor="middle">代码来自 Board：它监听 AgentPort</text>
<rect x="712" y="324" width="28" height="56" rx="3" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/>
<text x="726" y="318" font-size="11" fill="#f2c14e" text-anchor="middle">端口</text>
<line x1="726" y1="164" x2="726" y2="310" stroke="#f2c14e" stroke-width="1.2" stroke-dasharray="3 3"/>
<line x1="522" y1="352" x2="710" y2="352" stroke="#4fb3ff" stroke-width="2" marker-end="url(#d22l-a)"/>
<text x="612" y="304" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">ConsoleToAgent · 首字节 Console.uid</text>
<path d="M210 140 C 420 210, 600 250, 710 338" stroke="#4fb3ff" stroke-width="2" fill="none" marker-end="url(#d22l-a)"/>
<text x="470" y="228" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">ScreenToAgent · 首字节 Screen.uid</text>
<text x="24" y="470" font-size="12" fill="#e8eaed" text-anchor="start">拨号的主机不需要在自己的项目中看到多路复用器：每个连接都带有 id，即其自身主机的 uid，</text>
<text x="24" y="492" font-size="12" fill="#e8eaed" text-anchor="start">在每个看到它的项目中都相同。监听的主机来自声明其多路复用器的项目。</text>
</g></svg>