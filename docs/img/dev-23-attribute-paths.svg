<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="dev23paths-t dev23paths-d">
<title id="dev23paths-t">How the agent sorts an attribute</title>
<desc id="dev23paths-d">An attribute written on an entity is checked in four steps, top to bottom, and the first match decides. One: a class derived from StreamStageAttribute, StreamFlowAttribute or StreamTrimAttribute goes to a transform chain or trim and produces no constants. Two: on a field, an attribute written as S, D, MinMax, A, V or X, or ValueFor on a static field, is interpreted as field encoding. Three: any other class of the namespace org.unirail.Meta is interpreted; branch attributes, Pack Set filters, UDP and ClearAttributes are interpreted only, while TransmitTimeout, ReceiveTimeout, Deadline, Idle, Grouped and Resumable are interpreted and also emitted as constants of their state, actor or connection, Resumable as resume_. Four: attributes of the namespace System, and Flags, are skipped, for example AttributeUsage. Everything else is custom and becomes constants of the entity: Lease(30) becomes Lease = 30; Owner with two arguments becomes a container Owner with name and email; a repeated Tag becomes a container Tag with sub-containers _0 and _1, each holding name and note. A custom attribute never changes the bytes on the wire.</desc>
<rect width="980" height="560" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">

<!-- start -->
<rect x="24" y="20" width="176" height="52" rx="26" fill="#3a3a3a" stroke="#8a8f95" stroke-width="1.6"/>
<text x="112" y="42" font-size="14" fill="#e8eaed" text-anchor="middle">attribute written</text>
<text x="112" y="60" font-size="14" fill="#e8eaed" text-anchor="middle">on an entity</text>
<line x1="200" y1="46" x2="229" y2="46" stroke="#9aa0a6" stroke-width="1.8"/>
<path d="M236 46 L229 41.8 L229 50.2 Z" fill="#9aa0a6"/>
<text x="112" y="100" font-size="12.5" fill="#9aa0a6" text-anchor="middle">checked in this order;</text>
<text x="112" y="117" font-size="12.5" fill="#9aa0a6" text-anchor="middle">the first match decides</text>

<!-- decisions -->
<g fill="#313131" stroke="#8a8f95" stroke-width="1.4">
<rect x="236" y="20"  width="334" height="52" rx="8"/>
<rect x="236" y="98"  width="334" height="52" rx="8"/>
<rect x="236" y="190" width="334" height="52" rx="8"/>
<rect x="236" y="306" width="334" height="52" rx="8"/>
</g>
<g fill="none" stroke="#9aa0a6" stroke-width="1.2">
<circle cx="256" cy="46" r="10"/>
<circle cx="256" cy="124" r="10"/>
<circle cx="256" cy="216" r="10"/>
<circle cx="256" cy="332" r="10"/>
</g>
<g font-size="12" fill="#9aa0a6" text-anchor="middle">
<text x="256" y="50">1</text>
<text x="256" y="128">2</text>
<text x="256" y="220">3</text>
<text x="256" y="336">4</text>
</g>
<g font-size="13" fill="#9aa0a6">
<text x="276" y="41">derives from <tspan fill="#e8eaed">StreamStageAttribute</tspan>,</text>
<text x="276" y="59"><tspan fill="#e8eaed">StreamFlowAttribute</tspan> or <tspan fill="#e8eaed">StreamTrimAttribute</tspan>?</text>
<text x="276" y="119">on a field, written as <tspan fill="#f2c14e">S</tspan>, <tspan fill="#f2c14e">D</tspan>, <tspan fill="#f2c14e">MinMax</tspan>, <tspan fill="#f2c14e">A</tspan>, <tspan fill="#f2c14e">V</tspan>, <tspan fill="#f2c14e">X</tspan>?</text>
<text x="276" y="137">(or <tspan fill="#f2c14e">ValueFor</tspan> on a static field)</text>
<text x="276" y="211">any other class of the namespace</text>
<text x="276" y="229"><tspan fill="#e8eaed">org.unirail.Meta</tspan>?</text>
<text x="276" y="327">an attribute of the namespace <tspan fill="#e8eaed">System</tspan>,</text>
<text x="276" y="345">or <tspan fill="#e8eaed">[Flags]</tspan>?</text>
</g>

<!-- "no" arrows -->
<g stroke="#9aa0a6" stroke-width="1.8">
<line x1="403" y1="72"  x2="403" y2="91"/>
<line x1="403" y1="150" x2="403" y2="183"/>
<line x1="403" y1="242" x2="403" y2="299"/>
</g>
<g fill="#9aa0a6">
<path d="M403 98 L398.8 91 L407.2 91 Z"/>
<path d="M403 190 L398.8 183 L407.2 183 Z"/>
<path d="M403 306 L398.8 299 L407.2 299 Z"/>
</g>
<line x1="403" y1="358" x2="403" y2="389" stroke="#4fb3ff" stroke-width="2"/>
<path d="M403 396 L398.8 389 L407.2 389 Z" fill="#4fb3ff"/>
<g font-size="12" fill="#9aa0a6">
<text x="413" y="89">no</text>
<text x="413" y="174">no</text>
<text x="413" y="278">no</text>
<text x="413" y="381">no</text>
</g>

<!-- "yes" arrows -->
<g stroke="#9aa0a6" stroke-width="1.8" fill="none">
<line x1="570" y1="46"  x2="609" y2="46"/>
<line x1="570" y1="124" x2="609" y2="124"/>
<path d="M570 216 H594 M594 187 V256 M594 187 H609 M594 256 H609"/>
<line x1="570" y1="332" x2="609" y2="332"/>
</g>
<g fill="#9aa0a6">
<path d="M616 46 L609 41.8 L609 50.2 Z"/>
<path d="M616 124 L609 119.8 L609 128.2 Z"/>
<path d="M616 187 L609 182.8 L609 191.2 Z"/>
<path d="M616 256 L609 251.8 L609 260.2 Z"/>
<path d="M616 332 L609 327.8 L609 336.2 Z"/>
</g>
<g font-size="12" fill="#9aa0a6" text-anchor="middle">
<text x="592" y="39">yes</text>
<text x="592" y="117">yes</text>
<text x="582" y="209">yes</text>
<text x="592" y="325">yes</text>
</g>

<!-- outcomes -->
<rect x="616" y="22" width="340" height="48" rx="6" fill="#2e2a36" stroke="#a06fd0" stroke-width="1.6"/>
<text x="632" y="42" font-size="14" fill="#e8eaed">transform chain or trim</text>
<text x="632" y="60" font-size="12" fill="#9aa0a6">no constants - see Transform chains, Trims</text>

<rect x="616" y="100" width="340" height="48" rx="6" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/>
<text x="632" y="120" font-size="14" fill="#e8eaed">interpreted: field encoding</text>
<text x="632" y="138" font-size="12" fill="#9aa0a6">no constants - see How values become bytes</text>

<rect x="616" y="164" width="340" height="46" rx="6" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/>
<text x="632" y="182" font-size="13" fill="#e8eaed">branch attributes, Pack Set filters,</text>
<text x="632" y="200" font-size="13" fill="#e8eaed"><tspan fill="#f2c14e">[UDP]</tspan>, <tspan fill="#f2c14e">[ClearAttributes]</tspan><tspan dx="10">→ interpreted only</tspan></text>

<rect x="616" y="218" width="340" height="76" rx="6" fill="#4a3020" stroke="#e8833a" stroke-width="1.8"/>
<text x="632" y="237" font-size="13" fill="#f2c14e">[TransmitTimeout]<tspan dx="6">[ReceiveTimeout]</tspan><tspan dx="6">[Deadline]</tspan></text>
<text x="632" y="253" font-size="13" fill="#f2c14e">[Idle]<tspan dx="6">[Grouped]</tspan><tspan dx="6">[Resumable]</tspan><tspan dx="10" fill="#e8eaed">→ interpreted AND</tspan></text>
<text x="632" y="269" font-size="12.5" fill="#e8eaed">constants of their state, actor or connection;</text>
<text x="632" y="285" font-size="12.5" fill="#9aa0a6">[Resumable] becomes <tspan fill="#e8eaed">resume_</tspan></text>

<rect x="616" y="310" width="340" height="44" rx="6" fill="#303030" stroke="#6b6f74" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="632" y="328" font-size="13.5" fill="#c4c7cb">skipped</text>
<text x="632" y="346" font-size="12" fill="#9aa0a6">e.g. [AttributeUsage] - never emitted</text>

<!-- custom -->
<rect x="24" y="396" width="932" height="106" rx="8" fill="#1f3347" stroke="#4fb3ff" stroke-width="2"/>
<text x="44" y="420" font-size="14.5" font-weight="700" fill="#4fb3ff">custom → constants of the entity</text>
<text x="940" y="420" font-size="12.5" fill="#9aa0a6" text-anchor="end">one argument: inline<tspan dx="14">several: a container</tspan><tspan dx="14">repeated: _0, _1, …</tspan></text>
<g font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5">
<text x="44" y="446" fill="#e8eaed">[Lease(30)]</text>
<text x="44" y="468" fill="#e8eaed">[Owner("Platform team", "platform@example.com")]</text>
<text x="44" y="490" fill="#e8eaed">[Tag(…)] [Tag(…)]</text>
<text x="458" y="446" fill="#4fb3ff">Lease = 30</text>
<text x="458" y="468" fill="#4fb3ff">Owner { name, email }</text>
<text x="458" y="490" fill="#4fb3ff">Tag { _0 { name, note }, _1 { name, note } }</text>
</g>
<g font-size="13" fill="#9aa0a6" text-anchor="middle">
<text x="433" y="446">→</text>
<text x="433" y="468">→</text>
<text x="433" y="490">→</text>
</g>

<text x="490" y="532" font-size="13" fill="#9aa0a6" text-anchor="middle">A custom attribute never changes the bytes on the wire.</text>
</g>
</svg>
