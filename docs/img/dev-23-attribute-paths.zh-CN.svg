<!-- outcomes -->
<rect x="616" y="22" width="340" height="48" rx="6" fill="#2e2a36" stroke="#a06fd0" stroke-width="1.6"/>
<text x="632" y="42" font-size="14" fill="#e8eaed">变换链或 trim</text>
<text x="632" y="60" font-size="12" fill="#9aa0a6">无常量——见“变换链”“Trim”</text>

<rect x="616" y="100" width="340" height="48" rx="6" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/>
<text x="632" y="120" font-size="14" fill="#e8eaed">被解释:字段编码</text>
<text x="632" y="138" font-size="12" fill="#9aa0a6">无常量——见“值如何变成字节”</text>

<rect x="616" y="164" width="340" height="46" rx="6" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.6"/>
<text x="632" y="182" font-size="13" fill="#e8eaed">分支特性、Pack Set 过滤器、</text>
<text x="632" y="200" font-size="13" fill="#e8eaed"><tspan fill="#f2c14e">[UDP]</tspan>, <tspan fill="#f2c14e">[ClearAttributes]</tspan><tspan dx="10">→ 仅被解释</tspan></text>

<rect x="616" y="218" width="340" height="76" rx="6" fill="#4a3020" stroke="#e8833a" stroke-width="1.8"/>
<text x="632" y="237" font-size="13" fill="#f2c14e">[TransmitTimeout]<tspan dx="6">[ReceiveTimeout]</tspan><tspan dx="6">[Deadline]</tspan></text>
<text x="632" y="253" font-size="13" fill="#f2c14e">[Idle]<tspan dx="6">[Grouped]</tspan><tspan dx="6">[Resumable]</tspan><tspan dx="10" fill="#e8eaed">→ 被解释,且</tspan></text>
<text x="632" y="269" font-size="12.5" fill="#e8eaed">成为其状态、Actor 或连接的常量;</text>
<text x="632" y="285" font-size="12.5" fill="#9aa0a6">[Resumable] becomes <tspan fill="#e8eaed">resume_</tspan></text>

<rect x="616" y="310" width="340" height="44" rx="6" fill="#303030" stroke="#6b6f74" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="632" y="328" font-size="13.5" fill="#c4c7cb">跳过</text>
<text x="632" y="346" font-size="12" fill="#9aa0a6">如 [AttributeUsage]——永不发出</text>

<!-- custom -->
<rect x="24" y="396" width="932" height="106" rx="8" fill="#1f3347" stroke="#4fb3ff" stroke-width="2"/>
<text x="44" y="420" font-size="14.5" font-weight="700" fill="#4fb3ff">自定义 → 实体的常量</text>
<text x="940" y="420" font-size="12.5" fill="#9aa0a6" text-anchor="end">one argument: inline<tspan dx="14">多个:一个容器</tspan><tspan dx="14">重复:_0、_1、…</tspan></text>
<g font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5">
<text x="44" y="446" fill="#e8eaed">[Lease(30)]</text>
<text x="44" y="468" fill="#e8eaed">[Owner("Platform team", "platform@example.com")]</text>
<text x="44" y="490" fill="#e8eaed">[Tag(…)] [Tag(…)]</text>
<text x="458" y="446" fill="#4fb3ff">Lease = 30</text>
<text x="458" y="468" fill="#4fb3ff">Owner { name, email }</text>
<text x="458" y="490" fill="#4fb3ff">Tag { _0 { name, note }, _1 { name, note } }</text>
</g>
<g font-size="13" fill="#9aa0a6" text-anchor="middle">
<text x="433" y="446">→</text>
<text x="433" y="468">→</text>
<text x="433" y="490">→</text>
</g>

<text x="490" y="532" font-size="13" fill="#9aa0a6" text-anchor="middle">自定义特性永不改变线上的字节。</text>
</g>
</svg>
