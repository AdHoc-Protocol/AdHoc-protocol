<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640" role="img" aria-labelledby="dev23map-t dev23map-d">
<title id="dev23map-t">特性的挂载位置</title>
<desc id="dev23map-d">A ladder of the description model, top to bottom: project, host, connection, actor, state, pack, field, ending in wire bytes. Beside each rung, what a description writes there. Project: the pack sets _ and X, Named Pack Sets with KeepName, SkipName, KeepDoc and SkipDoc, and Modify with ClearAttributes. Host: Host, the language markers InCS, InJAVA, InTS, and Modify of a host. Connection: Connects, VirtuallyConnects, SwapHosts; Resumable, UDP, UDP with an exclusion set, Zstd, ChaCha20 and your own stages and flows; Resumable of a host and packs and HeaderFor declared in its body; beside it a multiplexer, Multiplex, one port for several connections, which takes constants only. Actor: Actor with MaxActiveInstances, Idle, Grouped, and RPC methods. State: the five branch attributes, TransmitTimeout, ReceiveTimeout, Deadline, Idle, Resumable, and the targets End and Close. Pack: HeaderFor, FieldsInjectInto, Stream and File with S, stages and flows, the trims ToStream, FromStream and Stream. Field: MinMax, A, V, X, D, S, the Key and Val targets, stages, flows and trims, and ValueFor on a static field. An orange check on every rung from project to field marks where custom attributes become constants; a custom attribute never changes the wire bytes.</desc>
<rect width="980" height="640" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">

<text x="104" y="32" font-size="13" fill="#9aa0a6" text-anchor="middle">模型</text>
<text x="232" y="32" font-size="13" fill="#9aa0a6">描述文件在其中写什么:Meta.cs 构造与内置特性</text>

