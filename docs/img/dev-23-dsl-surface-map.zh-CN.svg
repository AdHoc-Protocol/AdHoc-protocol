<g font-size="13" fill="#9aa0a6">
<text x="232" y="68"><tspan fill="#e8eaed">_&lt;…&gt;   X&lt;…&gt;</tspan><tspan dx="9">Pack Set、排除项</tspan><tspan dx="18" fill="#e8eaed">具名 Pack Set</tspan><tspan dx="7">带有</tspan><tspan dx="7" fill="#f2c14e">[KeepName]  [SkipName]  [KeepDoc]  [SkipDoc]</tspan></text>
<text x="232" y="87"><tspan fill="#e8eaed">Modify&lt;…&gt;</tspan><tspan dx="7">+</tspan><tspan dx="7" fill="#f2c14e">[ClearAttributes]</tspan><tspan dx="18">导入的 pack、主机、枚举、常量、连接的修饰符</tspan></text>
<text x="232" y="132"><tspan fill="#e8eaed">Host</tspan><tspan dx="18">语言标记</tspan><tspan dx="7" fill="#e8eaed">InCS   InJAVA   InTS</tspan></text>
<text x="232" y="151"><tspan fill="#e8eaed">Modify&lt;Host&gt;</tspan><tspan dx="18">配置一个导入的主机</tspan></text>
<text x="232" y="196"><tspan fill="#e8eaed">Connects&lt;L, R&gt;</tspan><tspan dx="18" fill="#e8eaed">VirtuallyConnects&lt;L, R, PATH&gt;</tspan><tspan dx="18" fill="#e8eaed">SwapHosts&lt;C&gt;</tspan></text>
<text x="232" y="215"><tspan fill="#f2c14e">[Resumable]  [UDP]  [UDP&lt;…&gt;]</tspan><tspan dx="18" fill="#f2c14e">[Zstd]  [ChaCha20]</tspan><tspan dx="7">+ 你的阶段 / 流</tspan></text>
<text x="232" y="234"><tspan fill="#e8eaed">Resumable&lt;HOST, PACKS&gt;</tspan><tspan dx="18" fill="#e8eaed">HeaderFor&lt;…&gt;</tspan><tspan dx="9">在其体内声明</tspan></text>
<text x="232" y="278"><tspan fill="#e8eaed">Actor</tspan><tspan dx="7">带有</tspan><tspan dx="7" fill="#e8eaed">MaxActiveInstances</tspan><tspan dx="7">/</tspan><tspan dx="7" fill="#e8eaed">UNLIMITED</tspan><tspan dx="28" fill="#f2c14e">[Idle]  [Grouped]</tspan></text>
<text x="232" y="297"><tspan>连接体中的 RPC 方法:每个都成为一个 Actor</tspan></text>
<text x="232" y="342"><tspan fill="#f2c14e">[l____________]  [L____________]  [____________r]  [____________R]  [_____lr_____]</tspan><tspan dx="9">分支特性</tspan></text>
<text x="232" y="361"><tspan fill="#f2c14e">[TransmitTimeout]  [ReceiveTimeout]  [Deadline]  [Idle]  [Resumable]</tspan><tspan dx="28">目标</tspan><tspan dx="7" fill="#e8eaed">End   Close</tspan></text>
<text x="232" y="406"><tspan fill="#e8eaed">HeaderFor&lt;…&gt;</tspan><tspan dx="18" fill="#e8eaed">FieldsInjectInto&lt;…&gt;</tspan><tspan dx="28">通道</tspan><tspan dx="7" fill="#e8eaed">Stream   File</tspan><tspan dx="7">+</tspan><tspan dx="7" fill="#f2c14e">[S]</tspan></text>
<text x="232" y="425"><tspan fill="#f2c14e">[Zstd]  [ChaCha20]</tspan><tspan dx="9">阶段 / 流</tspan><tspan dx="28">trim</tspan><tspan dx="7" fill="#f2c14e">[ToStream&lt;E&gt;]  [FromStream&lt;E&gt;]  [Stream&lt;To, From&gt;]</tspan></text>
<text x="232" y="470"><tspan fill="#f2c14e">[MinMax]  [A]  [V]  [X]  [D]  [S]</tspan><tspan dx="28">目标</tspan><tspan dx="7" fill="#f2c14e">[Key: …]  [Val: …]</tspan></text>
<text x="232" y="489"><tspan fill="#f2c14e">[Zstd]  [ChaCha20]</tspan><tspan dx="9">阶段 / 流</tspan><tspan dx="28">trim</tspan><tspan dx="28">在静态字段上:</tspan><tspan dx="7" fill="#f2c14e">[ValueFor]</tspan></text>
</g>

<!-- multiplexer, beside the connection rung -->
<rect x="748" y="174" width="196" height="72" rx="6" fill="#2e2a36" stroke="#a06fd0" stroke-width="1.6"/>
<text x="846" y="197" font-size="14" fill="#e8eaed" text-anchor="middle">Multiplex&lt;(…)&gt;</text>
<text x="846" y="216" font-size="12.5" fill="#9aa0a6" text-anchor="middle">一个端口,多条连接</text>
<text x="846" y="234" font-size="12.5" fill="#9aa0a6" text-anchor="middle">仅常量,无特性</text>

<text x="216" y="544" font-size="13" fill="#9aa0a6">自定义特性永不改变这些字节</text>

