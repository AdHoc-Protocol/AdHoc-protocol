="preserve">AdHocAgent .\MyProtocol.cs</text><text x="734" y="533" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">→ generates</text><path d="M722 519 L700.3 519" fill="none" stroke="#4fb3ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M692 519 L702.3 514.7 L702.3 523.3 Z" fill="#4fb3ff"/><text x="722" y="342" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">test 3 runs before the .md and .cs</text><text x="722" y="358" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">tests: a bare file name never</text><text x="722" y="374" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">reaches them</text><text x="24" y="672" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">tested top to bottom, first match wins; extension tests are case-sensitive</text></svg>
