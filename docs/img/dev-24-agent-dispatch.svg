<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img"><title>Decision chart of AdHocAgent's first argument, tested top to bottom, first match wins: no arguments - help and the MyProtocolDescription.cs template; ends with .cs~ - impact report; no backslash and no slash - taken as a UUID, which is where a bare MyProtocol.cs lands, so nothing is generated; ends with .md - redeploy; then the PersonalVolatileUUID key is required, otherwise exit 1; ends with .cs - generate; anything else - exit 2 with the converters link</title><rect width="960" height="700" fill="#2b2b2b" rx="10"/><text x="24" y="40" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve"><tspan fill="#e8eaed">AdHocAgent </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="16">&lt;first argument&gt; ...</tspan><tspan fill="#e8eaed">  - which task runs</tspan></text><rect x="64" y="76" width="236" height="46" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="182" y="103.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">no arguments?</text><circle cx="40" cy="99" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="40" y="103.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">1</text><rect x="362" y="76" width="330" height="46" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="376" y="95" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed">help + writes </tspan><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5">MyProtocolDescription.cs</tspan></text><text x="376" y="112" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">into the working directory (overwrites it)</text><path d="M300 99 L354.1 99" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M362 99 L352.2 103.1 L352.2 94.9 Z" fill="#9aa0a6"/><text x="331" y="92" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">yes</text><path d="M182 122 L182 152.1" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M182 160 L177.9 150.2 L186.1 150.2 Z" fill="#9aa0a6"/><text x="191" y="145" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">no</text><rect x="64" y="160" width="236" height="46" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="182" y="187.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed">ends with </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">.cs~</tspan><tspan fill="#e8eaed"> ?</tspan></text><circle cx="40" cy="183" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="40" y="187.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">2</text><rect x="362" y="160" width="330" height="46" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="376" y="179" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed">impact report </tspan><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5">&lt;stem&gt;.changes.html</tspan></text><text x="376" y="196" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve">no UUID needed</text><path d="M300 183 L354.1 183" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M362 183 L352.2 187.1 L352.2 178.9 Z" fill="#9aa0a6"/><text x="331" y="176" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">yes</text><path d="M182 206 L182 236.1" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M182 244 L177.9 234.2 L186.1 234.2 Z" fill="#9aa0a6"/><text x="191" y="229" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">no</text><rect x="64" y="244" width="236" height="46" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="182" y="271.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed">no </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">\</tspan><tspan fill="#e8eaed"> and no </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">/</tspan><tspan fill="#e8eaed"> in it?</tspan></text><circle cx="40" cy="267" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="40" y="271.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">3</text><rect x="362" y="244" width="330" height="46" rx="6" fill="#3a321d" stroke="#f2c14e" stroke-width="2"/><text x="376" y="263" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">taken as a UUID: stored in AdHocAgent.toml</text><text x="376" y="280" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">if valid, otherwise ignored</text><path d="M300 267 L354.1 267" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M362 267 L352.2 271.1 L352.2 262.9 Z" fill="#9aa0a6"/><text x="331" y="260" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">yes</text><path d="M182 290 L182 320.1" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M182 328 L177.9 318.2 L186.1 318.2 Z" fill="#9aa0a6"/><text x="191" y="313" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">no</text><rect x="64" y="328" width="236" height="46" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="182" y="355.5" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed">ends with </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">.md</tspan><tspan fill="#e8eaed"> ?</tspan></text><circle cx="40" cy="351" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="40" y="355.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">4</text><rect x="362" y="328" width="330" height="46" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="376" y="347" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">redeploy the received folder</text><text x="376" y="364" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#9aa0a6" text-anchor="start" xml:space="preserve">(md path without .md) - no U