<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img"><title>AdHocAgent 第一个参数的判定流程图,自上而下测试,首个匹配生效:无参数——输出帮助并写入 MyProtocolDescription.cs 模板;以 .cs~ 结尾——影响报告;不含反斜杠也不含斜杠——被视为 UUID(裸文件名 MyProtocol.cs 也落在这里,因此不会生成任何内容);以 .md 结尾——重新部署;然后要求 PersonalVolatileUUID 键,否则退出码 1;以 .cs 结尾——生成;其他任何情况——退出码 2 并附转换器链接</title><rect width="960" height="700" fill="#2b2b2b" rx="10"/><text x="24" y="40" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="18" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve"><tspan fill="#e8eaed">AdHocAgent </tspan><tspan fill="#f2c14e" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="16">&lt;第一个参数&gt; ...</tspan><tspan fill="#e8eaed">——运行哪个任务</tspan></text><rect x="64" y="76" width="236" height="46" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="182" y="103.5" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">无参数?</text><circle cx="40" cy="99" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="40" y="103.3" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">1</text><rect x="362" y="76" width="330" height="46" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="376" y="95" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed">帮助 + 写入 </tspan><tspan fill="#e8eaed" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5">MyProtocolDescription.cs</tspan></text><text x="376" y="112" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">到工作目录(覆盖已有文件)</text><path d="M300 99 L354.1 99" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M362 99 L352.2 103.1 L352.2 94.9 Z" fill="#9aa0a6"/><text x="331" y="92" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">是</text><path d="M182 122 L182 152.1" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linejoin="round"/><path d="M182 160 L177.9 150.2 L186.1 150.2 Z" fill="#9aa0a6"/><text x="191" y="145" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">否</text><rect x="64" y="160" width="236" height="46" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="182" y="187.5" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed">以 </tspan><tspan fill="#f2c14e" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">.cs~</tspan><tspan fill="#e8eaed"> 结尾?</tspan></text><circle cx="40" cy="183" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="40" y="187.3" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">2</text><rect x="362" y="160" width="330" height="46" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="376" y="179" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-ancho