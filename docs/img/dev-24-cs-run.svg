ial,sans-serif" font-size="12.5" fill="#e8833a" text-anchor="start" xml:space="preserve">Info, or</text><text x="782" y="554" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" text-anchor="start" xml:space="preserve">connection</text><text x="782" y="570" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8833a" text-anchor="start" xml:space="preserve">closed early</text><path d="M861 604 L861 492.8" fill="none" stroke="#4fb3ff" stroke-width="4.5" stroke-linejoin="round"/><path d="M861 482 L866.6 495.5 L855.4 495.5 Z" fill="#4fb3ff"/><text x="870" y="538" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#4fb3ff" text-anchor="start" xml:space="preserve">Result</text><text x="870" y="554" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">files stream into</text><text x="870" y="570" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">&lt;output&gt;/&lt;stem&gt;/</text><text x="280" y="626" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">culture, UTC offset,</text><text x="280" y="642" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">version 1</text><text x="414" y="626" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">UUID hi / lo</text><text x="576" y="626" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">description files, model,</text><text x="576" y="642" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anch