<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img"><title>The .cs run in two lanes, your machine and the generator server: six local steps (UUID key, compile and validate, optional ADHOC_PARSE_ONLY stop, open source check, clearing the received folder, connecting) each with the exit code of its failure; then Version, Invitation, Login, Invitation or InvitationUpdate, the Project upload that sets the description read-only, Progress packs and the Result streamed into the received folder, followed by steps 7 and 8; an Info or an early close after the upload ends with exit code 0 and leaves the description read-only</title><rect width="1000" height="720" fill="#2b2b2b" rx="10"/><rect x="16" y="44" width="968" height="460" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><rect x="16" y="604" width="968" height="100" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="28" y="66" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">your machine - AdHocAgent</text><text x="28" y="626" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">generator server</text><text x="28" y="650" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">nothing arrives here</text><text x="28" y="666" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">before the dashed line</text><rect x="50" y="76" width="190" height="44" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="60" y="94" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">PersonalVolatileUUID key</text><text x="60" y="109" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">present?</text><circle cx="34" cy="98" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="34" y="102.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">1</text><rect x="56" y="125" width="46.1" height="18" rx="9" fill="#35271c" stroke="#e8833a" stroke-width="1.1"/><text x="63" y="138" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start" xml:space="preserve">exit 1</text><rect x="50" y="151" width="190" height="59" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="60" y="169" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">compile + validate description</text><text x="60" y="184" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">(Roslyn + parser);</text><text x="60" y="199" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">numbers tables updated</text><circle cx="34" cy="180.5" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="34" y="184.8" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">2</text><rect x="56" y="215" width="147.8" height="18" rx="9" fill="#35271c" stroke="#e8833a" stroke-width="1.1"/><text x="63" y="228" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start" xml:space="preserve">exit 1 / parser exit code</text><rect x="50" y="240" width="190" height="44" rx="6" fill="#2a2a2a" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5 3"/><text x="60" y="258" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12">ADHOC_PARSE_ONLY=1</tspan></text><text x="60" y="273" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">→ stop, exit 0</text><circle cx="34" cy="262" r="10" fill="#2b2b2b" stroke="#9aa0a6" stroke-width="1.2"/><text x="34" y="266.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">3</text><rect x="50" y="296" width="190" height="44" rx="6" fill="#2a2a2a" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5 3"/><text x="60" y="314" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">open source mode:</text><text x="60" y="329" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">check the GitHub copy</text><circle cx="34" cy="318" r="10" fill="#2b2b2b" stroke="#9aa0a6" stroke-width="1.2"/><text x="34" y="322.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">4</text><rect x="56" y="345" width="121" height="18" rx="9" fill="#35271c" stroke="#e8833a" stroke-width="1.1"/><text x="63" y="358" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start" xml:space="preserve">exit 1, nothing sent</text><rect x="50" y="371" width="190" height="44" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="60" y="389" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">delete + prepare</text><text x="60" y="404" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12">&lt;output&gt;/&lt;stem&gt;/</tspan></text><circle cx="34" cy="393" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="34" y="397.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">5</text><rect x="50" y="427" width="190" height="44" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><text x="60" y="445" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">connect: server endpoints</text><text x="60" y="460" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">in order, 10 s each</text><circle cx="34" cy="449" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="34" y="453.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">6</text><rect x="22" y="476" width="222.7" height="18" rx="9" fill="#35271c" stroke="#e8833a" stroke-width="1.1"/><text x="29" y="489" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8833a" text-anchor="start" xml:space="preserve">exit 1: There are no servers available.</text><path d="M34 108 L34 163" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M34 170.5 L30.1 161.1 L37.9 161.1 Z" fill="#9aa0a6"/><path d="M34 190.5 L34 244.5" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M34 252 L30.1 242.6 L37.9 242.6 Z" fill="#9aa0a6"/><path d="M34 272 L34 300.5" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M34 308 L30.1 298.6 L37.9 298.6 Z" fill="#9aa0a6"/><path d="M34 328 L34 375.5" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M34 383 L30.1 373.6 L37.9 373.6 Z" fill="#9aa0a6"/><path d="M34 403 L34 431.5" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/><path d="M34 439 L30.1 429.6 L37.9 429.6 Z" fill="#9aa0a6"/><line x1="254" y1="44" x2="254" y2="704" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="6 4"/><text x="266" y="70" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">the exchange with the server starts</text><text x="266" y="87" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">everything left of this line is local</text><path d="M274 504 L274 595.7" fill="none" stroke="#e8eaed" stroke-width="1.8" stroke-linejoin="round"/><path d="M274 604 L269.7 593.7 L278.3 593.7 Z" fill="#e8eaed"/><text x="280" y="554" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">Version</text><path d="M335 604 L335 512.3" fill="none" stroke="#e8eaed" stroke-width="1.8" stroke-linejoin="round"/><path d="M335 504 L339.3 514.3 L330.7 514.3 Z" fill="#e8eaed"/><text x="341" y="554" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve">Invitation</text><path d="M408 504 L408 595.7" fill="none" stroke="#e8eaed" stroke-width="1.8" stroke-linejoin="round"/><path d="M408 604 L403.7 593.7 L412.3 593.7 Z" fill="#e8eaed"/><text x="414" y="554" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor