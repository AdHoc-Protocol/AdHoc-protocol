<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" role="img"><title>Timeline of one deployment run: scan the received folder, match the list lines, plan destinations and collect orphans; on NEW, REMOVED or orphans a report and the Deploy now prompt (n refreshes the list and exits 0); refresh the list into a numbered copy; exit 1 when no route exists; before-deployment hooks; processing steps in the received folder; merge into temporary files, with the orphaned-code prompt; the per-file report; after-deployment hooks while the destinations still hold the previous files; then the backup folder and last the copy into the destinations. Brackets: destinations untouched through step 11, changed in steps 12 and 13</title><rect width="1000" height="764" fill="#2b2b2b" rx="10"/><text x="24" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="16" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">One deployment run</text><rect x="40" y="54" width="460" height="32" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="58" cy="70" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="58" y="74.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">1</text><text x="78" y="75" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">scan the received folder</text><path d="M270 86 L270 94" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-linejoin="round"/><path d="M270 100 L266.9 92.5 L273.1 92.5 Z" fill="#9aa0a6"/><rect x="40" y="100" width="460" height="32" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="58" cy="116" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="58" y="120.3" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" 