<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 764" width="1000" height="764" role="img"><title>一次部署运行的时间线：扫描接收文件夹，匹配指令文件各行，规划目标并收集孤立文件；有 NEW、REMOVED 或孤立文件时给出报告和 Deploy now 提示（n 刷新列表并以 0 退出）；把列表刷新为带编号的副本；没有任何路由时以 1 退出；部署前钩子；接收文件夹中的处理步骤；合并到临时文件，可能出现孤立代码提示；逐文件报告；目标处仍是之前文件时运行部署后钩子；然后是备份文件夹，最后复制到目标。括号：目标在第 11 步之前保持不动，在第 12、13 步发生变化</title><rect width="1000" height="764" fill="#2b2b2b" rx="10"/><text x="24" y="34" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="16" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">一次部署运行</text><rect x="40" y="54" width="460" height="32" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="58" cy="70" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="58" y="74.3" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">1</text><text x="78" y="75" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve">扫描接收文件夹</text><path d="M270 86 L270 94" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-linejoin="round"/><path d="M270 100 L266.9 92.5 L273.1 92.5 Z" fill="#9aa0a6"/><rect x="40" y="100" width="460" height="32" rx="6" fill="#232323" stroke="#4a4a4a" stroke-width="1.4"/><circle cx="58" cy="116" r="10" fill="#3a3a3a" stroke="#9aa0a6" stroke-width="1.2"/><text x="58" y="120.3" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600" xml:space="preserve">2</text><text x="78" y="121" font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anc