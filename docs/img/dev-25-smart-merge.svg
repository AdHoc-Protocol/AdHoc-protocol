<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img"><title>One injection point across a deployment, in three columns - the received version, your file before, your file after - paired by the region UID: an untouched generated block is replaced by the generator's new version; an edited block is kept with a pencil mark in its tag and a todo note carrying the new version; a deleted block comes back after your last block; a dropped block that held your edit stays commented out under a todo note; your own lines between blocks pass unchanged. Below: a region whose UID is missing from the received file is dropped silently when only generated code was left, and otherwise asks Proceed with the merge, where N cancels the whole deployment with exit -1</title><rect width="1000" height="700" fill="#2b2b2b" rx="10"/><text x="20" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">received - the generator's new version</text><text x="296" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">your file before</text><text x="588" y="34" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="start" font-weight="600" xml:space="preserve">your file after</text><text x="20" y="54" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6">the UID </tspan><tspan fill="#e8833a" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Āÿÿ.Actor</tspan><tspan fill="#9aa0a6"> pairs the regions</tspan></text><rect x="16" y="66" width="262" height="454" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="30" y="88" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#9aa0a6" text-anchor="start" xml:space="preserve">#region&gt; Actor</text><text x="30" y="508" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6">#endregion&gt; </tspan><tspan fill="#e8833a" font-weight="700">Āÿÿ.Actor</tspan></text><rect x="292" y="66" width="262" height="454" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="306" y="88" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#9aa0a6" text-anchor="start" xml:space="preserve">#region&gt; Actor</text><text x="306" y="508" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6">#endregion&gt; </tspan><tspan fill="#e8833a" font-weight="700">Āÿÿ.Actor</tspan></text><rect x="584" y="66" width="262" height="454" rx="6" fill="#262626" stroke="#4a4a4a" stroke-width="1.4"/><text x="598" y="88" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#9aa0a6" text-anchor="start" xml:space="preserve">#region&gt; Actor</text><text x="598" y="508" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6">#endregion&gt; </tspan><tspan fill="#e8833a" font-weight="700">Āÿÿ.Actor</tspan></text><line x1="24" y1="172" x2="270" y2="172" stroke="#3a3a3a" stroke-width="1"/><line x1="300" y1="172" x2="546" y2="172" stroke="#3a3a3a" stroke-width="1"/><line x1="592" y1="172" x2="838" y2="172" stroke="#3a3a3a" stroke-width="1"/><line x1="24" y1="280" x2="270" y2="280" stroke="#3a3a3a" stroke-width="1"/><line x1="300" y1="280" x2="546" y2="280" stroke="#3a3a3a" stroke-width="1"/><line x1="592" y1="280" x2="838" y2="280" stroke="#3a3a3a" stroke-width="1"/><line x1="24" y1="371" x2="270" y2="371" stroke="#3a3a3a" stroke-width="1"/><line x1="300" y1="371" x2="546" y