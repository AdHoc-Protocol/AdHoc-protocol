" stroke-width="1.3" stroke-linejoin="round"/><path d="M580 207 L573.3 209.8 L573.3 204.2 Z" fill="#9aa0a6"/><text x="860" y="192" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6" font-weight="700">B  </tspan><tspan fill="#e8eaed" font-weight="600">edited block</tspan></text><text x="860" y="209" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">edited → kept,</text><text x="860" y="224" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">note added</text><path d="M558 315 L574.6 315" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-linejoin="round"/><path d="M580 315 L573.3 317.8 L573.3 312.2 Z" fill="#9aa0a6"/><text x="860" y="300" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6" font-weight="700">C  </tspan><tspan fill="#e8eaed" font-weight="600">deleted block</tspan></text><text x="860" y="317" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">deleted → comes back</text><path d="M558 406 L574.6 406" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-linejoin="round"/><path d="M580 406 L573.3 408.8 L573.3 403.2 Z" fill="#9aa0a6"/><text x="860" y="391" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6" font-weight="700">D  </tspan><tspan fill="#e8eaed" font-weight="600">dropped block</tspan></text><text x="860" y="408" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">dropped by the</text><text x="860" y="423" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">generator → your code</text><text x="860" y="438" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">stays, commented out</text><path d="M558 463 L574.6 463" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-linejoin="round"/><path d="M580 463 L573.3 465.8 L573.3 460.2 Z" fill="#9aa0a6"/><text x="860" y="465" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#9aa0a6" font-weight="700">E  </tspan><tspan fill="#e8eaed" font-weight="600">your own lines</tspan></text><text x="860" y="482" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">your code between</text><text x="860" y="497" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" xml:space="preserve">blocks: untouched</text><rect x="16" y="544" width="968" height="132" rx="8" fill="#2f2620" stroke="#e8833a" stroke-width="1.8"/><text x="32" y="570" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8833a" font-weight="700">Region UID missing from the received file</tspan><tspan fill="#e8eaed"> → the generated blocks you did not edit are stripped, then:</tspan></text><text x="48" y="598" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed" font-weight="600">nothing left</tspan><tspan fill="#e8eaed">  →  the region is dropped silently</tspan></text><text x="48" y="624" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed" font-weight="600">your code left</tspan><tspan fill="#e8eaed">  →  </tspan><tspan fill="#e8833a" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5">Proceed with the merge? (y/N)</tspan></text><text x="72" y="646" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">y</tspan><tspan fill="#9aa0a6">: the file is merged without that code; the file you had is in the backup folder</tspan></text><text x="72" y="664" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start" xml:space="preserve"><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">N</tspan><tspan fill="#9aa0a6">: cancels the whole deployment, exit -1 - nothing written, backed up or deleted</tspan></text></svg>
