<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" width="980" height="390" role="img" aria-labelledby="dev28chainlayers-t dev28chainlayers-d">
<title id="dev28chainlayers-t">一个缓冲区中的各层</title>
<desc id="dev28chainlayers-d">Left, the stack: your packs; Noise adds a 2-byte length and a 16-byte tag a record; WebSocket frames add a 2 to 14-byte header, a client masks; TLS 1.3 adds a 5-byte header, 1 byte of type and a 16-byte tag a record; TCP is the socket. Right, one transmit buffer with all of them in place: TLS header 5, frame header up to 14, Noise length 2, your packs, Noise tag 16, TLS type and tag 17. The Noise record lies inside the frame, the frame inside the TLS record. The loop's buffers are 56 bytes longer than the size asked, so the room of every header and tag is there before the packs are written: one send is one buffer and one write, and nothing is copied to add a layer.</desc>
<rect width="980" height="390" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text xml:space="preserve" x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">一个缓冲区中的各层</text>
<text xml:space="preserve" x="24" y="56" font-size="12" fill="#9aa0a6">TLS( WebSocket( Noise( packs ) ) )：每一层都在写入你的 pack 的那个缓冲区中就地密封</text>
<rect x="24" y="82" width="310" height="40" rx="4" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<text xml:space="preserve" x="36" y="107" font-size="12" fill="#e8eaed" font-weight="700">pack</text>
<text xml:space="preserve" x="324" y="107" font-size="11.5" fill="#9aa0a6" text-anchor="end">你的 pack 的字节</text>
<rect x="24" y="130" width="310" height="40" rx="4" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.2"/>
<text xml:space="preserve" x="36" y="155" font-size="12" fill="#e8eaed" font-weight="700">Noise</text>
<text xml:space="preserve" x="324" y="155" font-size="11.5" fill="#9aa0a6" text-anchor="end">每条记录 +2 长度、+16 标签</text>
<rect x="24" y="178" width="310" height="40" rx="4" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<text xml:space="preserve" x="36" y="203" font-size="12" fill="#e8eaed" font-weight="700">WebSocket 帧</text>
<text xml:space="preserve" x="324" y="203" font-size="11.5" fill="#9aa0a6" text-anchor="end">+2…14 头部；客户端加掩码</text>
<rect x="24" y="226" width="310" height="40" rx="4" fill="#2f4560" stroke="#6f9fd8" stroke-width="1.2"/>
<text xml:space="preserve" x="36" y="251" font-size="12" fill="#e8eaed" font-weight="700">TLS 1.3</text>
<text xml:space="preserve" x="324" y="251" font-size="11.5" fill="#9aa0a6" text-anchor="end">+5 头部、+1 类型、+16 标签</text>
<rect x="24" y="274" width="310" height="40" rx="4" fill="#30343a" stroke="#8c9198" stroke-width="1.2"/>
<text xml:space="preserve" x="36" y="299" font-size="12" fill="#e8eaed" font-weight="700">TCP</text>
<text xml:space="preserve" x="324" y="299" font-size="11.5" fill="#9aa0a6" text-anchor="end">套接字</text>
<rect x="370" y="150" width="36" height="50" fill="#2f4560" stroke="#6f9fd8" stroke-width="1.2"/>
<text xml:space="preserve" x="388" y="180" font-size="11.5" fill="#e8eaed" text-anchor="middle">5</text>
<text xml:space="preserve" x="388" y="142" font-size="11" fill="#9aa0a6" text-anchor="middle">TLS</text>
<rect x="406" y="150" width="46" height="50" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<text xml:space="preserve" x="429" y="180" font-size="11.5" fill="#e8eaed" text-anchor="middle">≤14</text>
<text xml:space="preserve" x="429" y="142" font-size="11" fill="#9aa0a6" text-anchor="middle">帧</text>
<rect x="452" y="150" width="30" height="50" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.2"/>
<text xml:space="preserve" x="467" y="180" font-size="11.5" fill="#e8eaed" text-anchor="middle">2</text>
<text xml:space="preserve" x="467" y="142" font-size="11" fill="#9aa0a6" text-anchor="middle">Noise</text>
<rect x="482" y="150" width="348" height="50" fill="#26382c" stroke="#6fbf7f" stroke-width="1.2"/>
<text xml:space="preserve" x="656" y="180" font-size="11.5" fill="#e8eaed" text-anchor="middle">你的 pack</text>
<rect x="830" y="150" width="56" height="50" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.2"/>
<text xml:space="preserve" x="858" y="180" font-size="11.5" fill="#e8eaed" text-anchor="middle">16</text>
<text xml:space="preserve" x="858" y="142" font-size="11" fill="#9aa0a6" text-anchor="middle">标签</text>
<rect x="886" y="150" width="70" height="50" fill="#2f4560" stroke="#6f9fd8" stroke-width="1.2"/>
<text xml:space="preserve" x="921" y="180" font-size="11.5" fill="#e8eaed" text-anchor="middle">1 + 16</text>
<text xml:space="preserve" x="921" y="142" font-size="11" fill="#9aa0a6" text-anchor="middle">TLS</text>
<path d="M452,208 V216 H886 V208" fill="none" stroke="#b58cf0" stroke-width="1.4" stroke-linejoin="round"/>
<text xml:space="preserve" x="669" y="232" font-size="11.5" fill="#b58cf0" text-anchor="middle">一条 Noise 记录</text>
<path d="M406,240 V248 H886 V240" fill="none" stroke="#9aa0a6" stroke-width="1.4" stroke-linejoin="round"/>
<text xml:space="preserve" x="646" y="264" font-size="11.5" fill="#9aa0a6" text-anchor="middle">一个 WebSocket 帧</text>
<path d="M370,272 V280 H956 V272" fill="none" stroke="#6f9fd8" stroke-width="1.4" stroke-linejoin="round"/>
<text xml:space="preserve" x="663" y="296" font-size="11.5" fill="#6f9fd8" text-anchor="middle">一条 TLS 记录：整个缓冲区，一次写出</text>
<text xml:space="preserve" x="24" y="336" font-size="12" fill="#9aa0a6">循环的缓冲区比请求的大小长 56 字节：在写入 pack 之前，每个头部和标签的空间就已就位，</text>
<text xml:space="preserve" x="24" y="354" font-size="12" fill="#9aa0a6">因此加一层不需要复制任何内容。没有的层不产生开销；TLS 和 Noise 记录各自至多容纳 16 KB 明文。</text>
</g>
</svg>
