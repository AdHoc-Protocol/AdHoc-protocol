<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text xml:space="preserve" x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">Common chains</text>
<text xml:space="preserve" x="24" y="56" font-size="12" fill="#9aa0a6">Each layer present costs its handshake once and its bytes on every record; each handshake is about one round trip</text>
