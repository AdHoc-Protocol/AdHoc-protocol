<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="dev28chainvariants-t dev28chainvariants-d">
<title id="dev28chainvariants-t">Common chains</title>
<desc id="dev28chainvariants-d">Six chains, with their layers, what they give, the bytes they add a record and the handshakes after TCP. Plain TCP: a network you trust, nothing added, no handshake. TCP and Noise: sealed and proved by key, 18 bytes, the Noise handshake. TCP and TLS: someone else's TLS service, 22 bytes, the TLS handshake. ws://: proxies and browsers, nothing sealed, 2 to 14 bytes, the upgrade. wss://: web ports, but a terminator reads all, 24 to 36 bytes, TLS and the upgrade. wss:// with Noise: sealed past any terminator, 42 to 54 bytes, TLS, the upgrade and Noise. Each handshake is about one round trip; a WebSocket frame header is 2 to 14 bytes, 4 of them the mask a client adds.</desc>
