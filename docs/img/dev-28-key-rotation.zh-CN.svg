<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="dev28keyrotation-t dev28keyrotation-d">
<title id="dev28keyrotation-t">为服务器换新密钥</title>
<desc id="dev28keyrotation-d">Two timelines. Two listeners for a while: the old key serves port 7000 while a new key starts on port 7001; old clients keep dialing 7000, updated clients dial 7001; when the old clients are gone port 7000 closes. A client that knows both keys: the server runs Noise XX with its old secret, then switches to the new one; the clients, updated first, accept either key in onPeer, so both before and after the switch they connect. A key that leaked is changed at once, and the clients that pin it stop connecting.</desc>
<rect width="980" height="420" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text xml:space="preserve" x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">为服务器换新密钥</text>
<text xml:space="preserve" x="24" y="56" font-size="12" fill="#9aa0a6">客户端固定一个密钥：在 NK 下换掉它，会把所有尚未更新的客户端挡在门外。有两种过渡办法</text>
<text xml:space="preserve" x="24" y="96" font-size="13" fill="#e8eaed" font-weight="700">暂时开两个监听</text>
<text xml:space="preserve" x="24" y="128" font-size="12" fill="#9aa0a6">旧客户端</text>
<text xml:space="preserve" x="24" y="163" font-size="12" fill="#9aa0a6">已更新的客户端</text>
<rect x="220" y="112" width="480" height="24" rx="4" fill="#4a3a26" stroke="#f2a44e" stroke-width="1.2"/>
<text xml:space="preserve" x="232" y="128" font-size="12" fill="#e8eaed">端口 7000：旧密钥</text>
<rect x="420" y="147" width="530" height="24" rx="4" fill="#26382c" stroke="#6fbf7f" stroke-width="1.2"/>
<text xml:space="preserve" x="432" y="163" font-size="12" fill="#e8eaed">端口 7001：新密钥</text>
<line x1="130.0" y1="124.0" x2="208.0" y2="124.0" stroke="#8c9198" stroke-width="1.8"/>
<polygon points="216.0,124.0 206.0,118.5 206.0,129.5" fill="#8c9198"/>
<line x1="160.0" y1="159.0" x2="408.0" y2="159.0" stroke="#8c9198" stroke-width="1.8"/>
<polygon points="416.0,159.0 406.0,153.5 406.0,164.5" fill="#8c9198"/>
<line x1="420.0" y1="104.0" x2="420.0" y2="184.0" stroke="#f2c14e" stroke-width="1.2" stroke-dasharray="4 4"/>
<text xml:space="preserve" x="420" y="200" font-size="12" fill="#f2c14e" text-anchor="middle">新密钥，在新端口上</text>
<line x1="700.0" y1="104.0" x2="700.0" y2="184.0" stroke="#f2c14e" stroke-width="1.2" stroke-dasharray="4 4"/>
<text xml:space="preserve" x="700" y="200" font-size="12" fill="#f2c14e" text-anchor="middle">旧客户端都已离开：关闭 7000</text>
<text xml:space="preserve" x="24" y="252" font-size="13" fill="#e8eaed" font-weight="700">客户端同时认两个密钥</text>
<text xml:space="preserve" x="24" y="270" font-size="12" fill="#b58cf0" font-family="Consolas,DejaVu Sans Mono,monospace">Noise XX</text>
<text xml:space="preserve" x="24" y="288" font-size="12" fill="#9aa0a6">服务器</text>
<text xml:space="preserve" x="24" y="323" font-size="12" fill="#9aa0a6">客户端</text>
<rect x="220" y="272" width="340" height="24" rx="4" fill="#4a3a26" stroke="#f2a44e" stroke-width="1.2"/>
<text xml:space="preserve" x="232" y="288" font-size="12" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,monospace">noiseXX( oldSecret )</text>
<rect x="560" y="272" width="390" height="24" rx="4" fill="#26382c" stroke="#6fbf7f" stroke-width="1.2"/>
<text xml:space="preserve" x="572" y="288" font-size="12" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,monospace">noiseXX( newSecret )</text>
<rect x="220" y="307" width="730" height="24" rx="4" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.2"/>
<text xml:space="preserve" x="232" y="323" font-size="11.5" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,monospace">onPeer( key -&gt; key == OLD || key == NEW )：在切换之前先完成更新</text>
<line x1="560.0" y1="262.0" x2="560.0" y2="344.0" stroke="#f2c14e" stroke-width="1.2" stroke-dasharray="4 4"/>
<text xml:space="preserve" x="560" y="360" font-size="12" fill="#f2c14e" text-anchor="middle">切换：所有客户端仍能连接</text>
<line x1="220.0" y1="380.0" x2="942.0" y2="380.0" stroke="#4a4a4a" stroke-width="1.2"/>
<polygon points="950.0,380.0 940.0,374.5 940.0,385.5" fill="#4a4a4a"/>
<text xml:space="preserve" x="940" y="372" font-size="12" fill="#9aa0a6" text-anchor="end">时间</text>
<text xml:space="preserve" x="24" y="406" font-size="12" fill="#9aa0a6">泄露的密钥要立即更换：仍固定它的客户端从此连不上，这正是目的。</text>
</g>
</svg>
