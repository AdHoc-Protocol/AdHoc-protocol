<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" role="img" aria-labelledby="dev28noiseik-t dev28noiseik-d">
<title id="dev28noiseik-t">Noise IK：客户端立即证明自己的密钥</title>
<desc id="dev28noiseik-d">Noise IK, the client proves its own key at once. Official notation: &lt;- s    ...    -&gt; e, es, s, ss    &lt;- e, ee, se. s: the server's key, pinned by the client beforehand. Message 1, client to server: tokens e, es, s, ss; 96 bytes: e 32 + s 32+16 + tag 16; the server checks the client's key in onPeer. Message 2, server to client: tokens e, ee, se; 48 bytes: e 32 + tag 16; both proved; forward secrecy from here. After the handshake: Server: proved by its key; Client: proved by its key; Forward secrecy: yes, for every pack; Client's key sent: in message 1, sealed to the server's key: whoever later steals the server's secret learns which client it was; onPeer: on the server; Also used by: WireGuard (IK with a pre-shared key).</desc>
<rect width="980" height="490" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text xml:space="preserve" x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">Noise IK：客户端立即证明自己的密钥</text>
<text xml:space="preserve" x="24" y="56" font-size="12" fill="#9aa0a6">官方记法：   &lt;- s    ...    -&gt; e, es, s, ss    &lt;- e, ee, se</text>
<rect x="60" y="76" width="150" height="40" rx="8" fill="#30343a" stroke="#8c9198" stroke-width="1.6"/>
<text xml:space="preserve" x="135" y="100.5" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">客户端</text>
<rect x="430" y="76" width="150" height="40" rx="8" fill="#26382c" stroke="#6fbf7f" stroke-width="1.6"/>
<text xml:space="preserve" x="505" y="100.5" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">服务器</text>
<text xml:space="preserve" x="135" y="134" font-size="11.5" fill="#9aa0a6" text-anchor="middle">s 和 e；固定 S 的密钥</text>
<text xml:space="preserve" x="505" y="134" font-size="11.5" fill="#9aa0a6" text-anchor="middle">静态 s；一次性 e</text>
<line x1="135.0" y1="142.0" x2="135.0" y2="448.0" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="505.0" y1="142.0" x2="505.0" y2="448.0" stroke="#4a4a4a" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="505.0" y1="162.0" x2="143.0" y2="162.0" stroke="#f2c14e" stroke-width="1.2" stroke-dasharray="4 4"/>
<polygon points="135.0,162.0 145.0,167.5 145.0,156.5" fill="#f2c14e"/>
<text xml:space="preserve" x="320" y="157" font-size="11.5" fill="#f2c14e" text-anchor="middle">s：服务器的密钥，客户端事先固定</text>
<line x1="135.0" y1="236.0" x2="497.0" y2="236.0" stroke="#e8eaed" stroke-width="1.8"/>
<polygon points="505.0,236.0 495.0,230.5 495.0,241.5" fill="#e8eaed"/>
<text xml:space="preserve" x="125" y="240" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="700">1</text>
<rect x="259" y="211" width="22" height="21" rx="4" fill="#232323" stroke="#e8eaed" stroke-width="1.4"/>
<text xml:space="preserve" x="270" y="226" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">e</text>
<rect x="287" y="211" width="30" height="21" rx="4" fill="#232323" stroke="#6f9fd8" stroke-width="1.4"/>
<text xml:space="preserve" x="302" y="226" font-size="13" fill="#6f9fd8" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">es</text>
<rect x="323" y="211" width="22" height="21" rx="4" fill="#232323" stroke="#e8eaed" stroke-width="1.4"/>
<text xml:space="preserve" x="334" y="226" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">s</text>
<rect x="351" y="211" width="30" height="21" rx="4" fill="#232323" stroke="#8c9198" stroke-width="1.4"/>
<text xml:space="preserve" x="366" y="226" font-size="13" fill="#8c9198" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">ss</text>
<text xml:space="preserve" x="320" y="253" font-size="11.5" fill="#9aa0a6" text-anchor="middle">96 字节：e 32 + s 32+16 + 标签 16</text>
<text xml:space="preserve" x="320" y="269" font-size="11.5" fill="#f2c14e" text-anchor="middle">服务器在 onPeer 中检查客户端的密钥</text>
<line x1="505.0" y1="312.0" x2="143.0" y2="312.0" stroke="#e8eaed" stroke-width="1.8"/>
<polygon points="135.0,312.0 145.0,317.5 145.0,306.5" fill="#e8eaed"/>
<text xml:space="preserve" x="515" y="316" font-size="12" fill="#e8eaed" text-anchor="start" font-weight="700">2</text>
<rect x="273" y="287" width="22" height="21" rx="4" fill="#232323" stroke="#e8eaed" stroke-width="1.4"/>
<text xml:space="preserve" x="284" y="302" font-size="13" fill="#e8eaed" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">e</text>
<rect x="301" y="287" width="30" height="21" rx="4" fill="#232323" stroke="#6fbf7f" stroke-width="1.4"/>
<text xml:space="preserve" x="316" y="302" font-size="13" fill="#6fbf7f" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">ee</text>
<rect x="337" y="287" width="30" height="21" rx="4" fill="#232323" stroke="#f2a44e" stroke-width="1.4"/>
<text xml:space="preserve" x="352" y="302" font-size="13" fill="#f2a44e" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">se</text>
<text xml:space="preserve" x="320" y="329" font-size="11.5" fill="#9aa0a6" text-anchor="middle">48 字节：e 32 + 标签 16</text>
<text xml:space="preserve" x="320" y="345" font-size="11.5" fill="#f2c14e" text-anchor="middle">双方都得到证明；从此有前向保密</text>
<rect x="610" y="72" width="350" height="376" rx="8" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<text xml:space="preserve" x="626" y="96" font-size="13" fill="#e8eaed" font-weight="700">握手之后</text>
<text xml:space="preserve" x="626" y="122" font-size="11.5" fill="#e8eaed" font-weight="700">服务器</text>
<text xml:space="preserve" x="786" y="122" font-size="11.5" fill="#9aa0a6">由其密钥证明</text>
<text xml:space="preserve" x="626" y="147" font-size="11.5" fill="#e8eaed" font-weight="700">客户端</text>
<text xml:space="preserve" x="786" y="147" font-size="11.5" fill="#9aa0a6">由其密钥证明</text>
<text xml:space="preserve" x="626" y="172" font-size="11.5" fill="#e8eaed" font-weight="700">前向保密</text>
<text xml:space="preserve" x="786" y="172" font-size="11.5" fill="#9aa0a6">有，对每个 pack</text>
<text xml:space="preserve" x="626" y="197" font-size="11.5" fill="#e8eaed" font-weight="700">发送的客户端密钥</text>
<text xml:space="preserve" x="786" y="197" font-size="11.5" fill="#9aa0a6">在消息 1 中，按服务器密钥</text>
<text xml:space="preserve" x="786" y="212" font-size="11.5" fill="#9aa0a6">密封：事后盗得服务器</text>
<text xml:space="preserve" x="786" y="227" font-size="11.5" fill="#9aa0a6">私钥的人能知道</text>
<text xml:space="preserve" x="786" y="242" font-size="11.5" fill="#9aa0a6">那是哪个客户端</text>
<text xml:space="preserve" x="626" y="267" font-size="11.5" fill="#e8eaed" font-weight="700">onPeer</text>
<text xml:space="preserve" x="786" y="267" font-size="11.5" fill="#9aa0a6">在服务器端</text>
<text xml:space="preserve" x="626" y="292" font-size="11.5" fill="#e8eaed" font-weight="700">也用于</text>
<text xml:space="preserve" x="786" y="292" font-size="11.5" fill="#9aa0a6">WireGuard（带预共享</text>
<text xml:space="preserve" x="786" y="307" font-size="11.5" fill="#9aa0a6">密钥的 IK）</text>
<text xml:space="preserve" x="24" y="474" font-size="11.5" fill="#9aa0a6">AdHoc 不在握手中发送数据：每个 pack 都在握手之后发送，所用密钥包含 ee。在流上每条消息为 [长度 1][消息]。</text>
</g>
</svg>
