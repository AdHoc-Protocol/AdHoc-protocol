<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 490" width="980" height="490" role="img" aria-labelledby="dev28noisenk-t dev28noisenk-d">
<title id="dev28noisenk-t">Noise NK: the client knows the server's key</title>
<desc id="dev28noisenk-d">Noise NK, the client knows the server's key. Official notation: &lt;- s    ...    -&gt; e, es    &lt;- e, ee. s: the server's key, pinned by the client beforehand. Message 1, client to server: tokens e, es; 48 bytes: e 32 + tag 16; sealed to the server's key: only the server reads on. Message 2, server to client: tokens e, ee; 48 bytes: e 32 + tag 16; the server is proved; forward secrecy from here. After the handshake: Server: proved by its key; Client: anonymous: its login goes inside the protocol, sealed; Forward secrecy: yes, for every pack; Static keys sent: none; onPeer: not called on the server; In AdHoc: host.key and the server key on connect; UDP with a key.</desc>
<rect width="980" height="490" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text xml:space="preserve" x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">Noise NK: the client knows the server's key</text>
<text xml:space="preserve" x="24" y="56" font-size="12" fill="#9aa0a6">Official notation:   &lt;- s    ...    -&gt; e, es    &lt;- e, ee</text>
<rect x="60" y="76" width="150" height="40" rx="8" fill="#30343a" stroke="#8c9198" stroke-width="1.6"/>
<text xml:space="preserve" x="135" y="100.5" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">Client</text>
