<text xml:space="preserve" x="320" y="345" font-size="11.5" fill="#f2c14e" text-anchor="middle">the server is proved; forward secrecy from here</text>
<rect x="610" y="72" width="350" height="376" rx="8" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/>
<text xml:space="preserve" x="626" y="96" font-size="13" fill="#e8eaed" font-weight="700">After the handshake</text>
<text xml:space="preserve" x="626" y="122" font-size="11.5" fill="#e8eaed" font-weight="700">Server</text>
<text xml:space="preserve" x="786" y="122" font-size="11.5" fill="#9aa0a6">proved by its key</text>
<text xml:space="preserve" x="626" y="147" font-size="11.5" fill="#e8eaed" font-weight="700">Client</text>
<text xml:space="preserve" x="786" y="147" font-size="11.5" fill="#9aa0a6">anonymous: its login goes</text>
<text xml:space="preserve" x="786" y="162" font-size="11.5" fill="#9aa0a6">inside the protocol, sealed</text>
<text xml:space="preserve" x="626" y="187" font-size="11.5" fill="#e8eaed" font-weight="700">Forward secrecy</text>
<text xml:space="preserve" x="786" y="187" font-size="11.5" fill="#9aa0a6">yes, for every pack</text>
<text xml:space="preserve" x="626" y="212" font-size="11.5" fill="#e8eaed" font-weight="700">Static keys sent</text>
<text xml:space="preserve" x="786" y="212" font-size="11.5" fill="#9aa0a6">none</text>
<text xml:space="preserve" x="626" y="237" font-size="11.5" fill="#e8eaed" font-weight="700">onPeer</text>
<text xml:space="preserve" x="786" y="237" font-size="11.5" fill="#9aa0a6">not called on the server</text>
<text xml:space="preserve" x="626" y="262" font-size="11.5" fill="#e8eaed" font-weight="700">In AdHoc</text>
<text xml:space="preserve" x="786" y="262" font-size="11.5" fill="#9aa0a6">host.key and the server key</text>
<text xml:space="preserve" x="786" y="277" font-size="11.5" fill="#9aa0a6">on connect; UDP with a key</text>
<text xml:space="preserve" x="24" y="474" font-size="11.5" fill="#9aa0a6">AdHoc sends no data inside the handshake: every pack goes after it, under keys that include ee. On a stream each message is [length 1][message].</text>
