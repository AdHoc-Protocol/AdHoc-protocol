<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="dev28tunnelnoise-t dev28tunnelnoise-d">
<title id="dev28tunnelnoise-t">Relays that must not read: Noise in the tunnel</title>
<desc id="dev28tunnelnoise-d">A device, a broker that relays, and a cloud host. Each physical leg, device to broker and broker to cloud, may run Noise of its own, which ends at the broker. Inside, a tunnel of the virtual connection from the device to the cloud runs a Noise handshake of its own; the broker forwards its records with no key, so it can neither read nor change them. Tunnel.chain(tunnel_id, carrier) returns the Chain of each new tunnel, asked once on both ends. A record changed, dropped or replayed on the way ends that tunnel only; the carrier and its other tunnels go on.</desc>
<rect width="980" height="430" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text xml:space="preserve" x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">Relays that must not read: Noise in the tunnel</text>
<text xml:space="preserve" x="24" y="56" font-size="12" fill="#9aa0a6">Per-hop Noise protects each wire; Noise in the tunnel protects the conversation. The two stack</text>
<rect x="30" y="90" width="150" height="70" rx="8" fill="#26382c" stroke="#6fbf7f" stroke-width="1.6"/>
<text xml:space="preserve" x="105" y="122" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">Device</text>
<text xml:space="preserve" x="105" y="139" font-size="12" fill="#9aa0a6" text-anchor="middle">one end</text>
<rect x="415" y="90" width="150" height="210" rx="8" fill="#30343a" stroke="#8c9198" stroke-width="1.6"/>
<text xml:space="preserve" x="490" y="114" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">Broker</text>
<text xml:space="preserve" x="490" y="131" font-size="12" fill="#9aa0a6" text-anchor="middle">relay</text>
<rect x="800" y="90" width="150" height="70" rx="8" fill="#26382c" stroke="#6fbf7f" stroke-width="1.6"/>
<text xml:space="preserve" x="875" y="122" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">Cloud</text>
<text xml:space="preserve" x="875" y="139" font-size="12" fill="#9aa0a6" text-anchor="middle">the other end</text>
<rect x="180" y="116" width="235" height="20" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.2"/>
<text xml:space="preserve" x="297" y="130" font-size="11.5" fill="#e8eaed" text-anchor="middle">Noise, per hop</text>
<rect x="565" y="116" width="235" height="20" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.2"/>
<text xml:space="preserve" x="682" y="130" font-size="11.5" fill="#e8eaed" text-anchor="middle">Noise, per hop</text>
<text xml:space="preserve" x="490" y="160" font-size="12" fill="#9aa0a6" text-anchor="middle">holds the keys</text>
<text xml:space="preserve" x="490" y="176" font-size="12" fill="#9aa0a6" text-anchor="middle">of both hops</text>
<line x1="105.0" y1="160.0" x2="105.0" y2="240.0" stroke="#b58cf0" stroke-width="2.6" stroke-dasharray="7 5"/>
<line x1="875.0" y1="160.0" x2="875.0" y2="240.0" stroke="#b58cf0" stroke-width="2.6" stroke-dasharray="7 5"/>
<line x1="105.0" y1="240.0" x2="875.0" y2="240.0" stroke="#b58cf0" stroke-width="2.6" stroke-dasharray="7 5"/>
<text xml:space="preserve" x="270" y="232" font-size="12" fill="#e8eaed" text-anchor="middle">Noise in the tunnel: Device to Cloud</text>
<rect x="415" y="230" width="150" height="20" fill="#3a2f4d" stroke="#b58cf0" stroke-width="1.4" stroke-dasharray="7 5"/>
<text xml:space="preserve" x="490" y="244" font-size="11.5" fill="#e8eaed" text-anchor="middle">sealed records</text>
<text xml:space="preserve" x="490" y="274" font-size="12" fill="#f2c14e" text-anchor="middle">forwards records:</text>
<text xml:space="preserve" x="490" y="290" font-size="12" fill="#f2c14e" text-anchor="middle">no key of the tunnel</text>
<text xml:space="preserve" x="490" y="326" font-size="12" fill="#f2c14e" text-anchor="middle" font-family="Consolas,DejaVu Sans Mono,monospace">Tunnel.chain( tunnel_id, carrier ) → Chain</text>
<text xml:space="preserve" x="490" y="344" font-size="12" fill="#9aa0a6" text-anchor="middle">asked once for each new tunnel, on both ends; null leaves the tunnel unsealed</text>
<rect x="250" y="362" width="480" height="52" rx="8" fill="#4a2a2a" stroke="#e06c6c" stroke-width="1.6"/>
<text xml:space="preserve" x="490" y="384" font-size="12" fill="#e8eaed" text-anchor="middle">a record changed, dropped or replayed ends this tunnel only:</text>
<text xml:space="preserve" x="490" y="399" font-size="12" fill="#f2b8b5" text-anchor="middle">the carrier and its other tunnels go on</text>
</g>
</svg>
