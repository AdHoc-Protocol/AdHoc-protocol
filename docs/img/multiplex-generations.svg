<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img"><rect width="980" height="480" fill="#2b2b2b"/><title>Two server generations, Fleet and FleetV2, in one process behind one port: a composed function asks FleetPort first and FleetV2Port second; every peer host has its own uid, so the byte never needs a guess</title><line x1="340" y1="72" x2="340" y2="342" stroke="#4fb3ff" stroke-width="2"/><rect x="24" y="50" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="99" y="77" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Vehicle</text><line x1="174" y1="72" x2="340" y2="72" stroke="#4fb3ff" stroke-width="2"/><text x="257" y="64" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Telemetry</text><rect x="24" y="120" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="99" y="147" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Dashboard</text><line x1="174" y1="142" x2="340" y2="142" stroke="#4fb3ff" stroke-width="2"/><text x="257" y="134" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Console</text><rect x="24" y="250" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="99" y="277" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">VehicleV2</text><line x1="174" y1="272" x2="340" y2="272" stroke="#4fb3ff" stroke-width="2"/><text x="257" y="264" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">TelemetryV2</text><rect x="24" y="320" width="150" height="44" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="99" y="347" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">DashboardV2</text><line x1="174" y1="342" x2="340" y2="342" stroke="#4fb3ff" stroke-width="2"/><text x="257" y="334" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">ConsoleV2</text><path d="M16 54 L8 54 L8 160 L16 160" fill="none" stroke="#a06fd0" stroke-width="1.6"/><text x="24" y="192" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a06fd0" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">generation 1 - frozen, still in the field</text><path d="M16 254 L8 254 L8 360 L16 360" fill="none" stroke="#a06fd0" stroke-width="1.6"/><text x="24" y="392" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a06fd0" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">generation 2 - free to change</text><rect x="420" y="24" width="544" height="396" rx="6" fill="none" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="7 5"/><text x="436" y="46" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">one process</text><line x1="340" y1="207" x2="380" y2="207" stroke="#4fb3ff" stroke-width="3"/><rect x="380" y="185" width="80" height="44" rx="4" fill="#243447" stroke="#e8833a" stroke-width="1.8"/><circle cx="396" cy="207" r="8" fill="none" stroke="#e8833a" stroke-width="1.4"/><path d="M394 203 L400 207 L394 211 Z" fill="#e8833a"/><text x="433" y="212" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">:443</text><line x1="460" y1="207" x2="476" y2="207" stroke="#4fb3ff" stroke-width="2"/><rect x="476" y="187" width="104" height="40" rx="3" fill="#2d4665" stroke="#6f9fd8" stroke-width="1.2" stroke-dasharray="5 3"/><text x="528" y="211" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#e8eaed" text-anchor="middle">TCP/WS server</text><line x1="580" y1="207" x2="596" y2="207" stroke="#4fb3ff" stroke-width="2"/><rect x="596" y="160" width="124" height="94" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8"/><text x="658" y="186" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">uid -&gt;</text><text x="658" y="206" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">FleetPort</text><text x="658" y="222" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">or else</text><text x="658" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">FleetV2Port</text><rect x="770" y="60" width="180" height="150" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="860" y="82" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Fleet</text><text x="860" y="98" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">host, own generated code</text><rect x="786" y="112" width="148" height="36" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/><text x="860" y="128" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">Telemetry</text><text x="860" y="143" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">pooled</text><rect x="786" y="158" width="148" height="36" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/><text x="860" y="174" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">Console</text><text x="860" y="189" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">pooled</text><path d="M720 207 L745 207 L745 135 L762 135" fill="none" stroke="#4fb3ff" stroke-width="2"/><line x1="755" y1="135" x2="770" y2="135" stroke="#4fb3ff" stroke-width="2"/><path d="M770 135 L763 130.8 L763 139.2 Z" fill="#4fb3ff"/><rect x="770" y="250" width="180" height="150" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="860" y="272" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">FleetV2</text><text x="860" y="288" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">host, own generated code</text><rect x="786" y="302" width="148" height="36" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/><text x="860" y="318" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">TelemetryV2</text><text x="860" y="333" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">pooled</text><rect x="786" y="348" width="148" height="36" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/><text x="860" y="364" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">ConsoleV2</text><text x="860" y="379" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">pooled</text><path d="M720 207 L745 207 L745 325 L762 325" fill="none" stroke="#4fb3ff" stroke-width="2"/><line x1="755" y1="325" x2="770" y2="325" stroke="#4fb3ff" stroke-width="2"/><path d="M770 325 L763 320.8 L763 329.2 Z" fill="#4fb3ff"/><text x="490" y="448" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Two server generations, one port.</text><text x="490" y="470" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Every peer host has its own uid, so a byte belongs to exactly one multiplexer - the composed function never guesses.</text></svg>