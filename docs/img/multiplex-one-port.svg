822 296 L815 291.8 L815 300.2 Z" fill="#4fb3ff"/><rect x="822" y="274" width="126" height="44" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/><text x="885" y="294" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">Console</text><text x="885" y="309" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">pooled</text><rect x="662" y="343" width="130" height="26" rx="3" fill="#2b2b2b" stroke="#a06fd0" stroke-width="1.2"/><text x="727" y="360" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Service.uid</text><line x1="792" y1="356" x2="822" y2="356" stroke="#4fb3ff" stroke-width="2"/><path d="M822 356 L815 351.8 L815 360.2 Z" fill="#4fb3ff"/><rect x="822" y="334" width="126" height="44" rx="3" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2"/><text x="885" y="354" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle">Diagnostics</text><text x="885" y="369" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">pooled</text><text x="490" y="460" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Four declared Connections. One host, one port, one server instance.</text><text x="490" y="482" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Every socket opens with one byte - the uid of the dialing host - and the multiplexer hands it to that Connection.</text></svg>