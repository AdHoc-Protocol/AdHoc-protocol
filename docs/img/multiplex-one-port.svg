<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img"><rect width="980" height="500" fill="#2b2b2b"/><title>Four peer hosts dial one host, Fleet, through one port; the multiplexer FleetPort reads the first byte of each socket - the dialing host's uid - and hands the socket to the matching Connection</title><rect x="460" y="30" width="500" height="400" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="548" y="62" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Fleet</text><text x="548" y="80" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">one host, four Connections</text><line x1="392" y1="69" x2="392" y2="339" stroke="#4fb3ff" stroke-width="2"/><rect x="24" y="44" width="196" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="122" y="68" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Vehicle</text><text x="122" y="85" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">firmware 3.x - most of the fleet</text><line x1="220" y1="69" x2="392" y2="69" stroke="#4fb3ff" stroke-width="2"/><text x="306" y="60" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Telemetry</text><rect x="24" y="124" width="196" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="122" y="148" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">VehicleLegacy</text><