<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" width="940" height="340" role="img"><rect width="940" height="340" fill="#2b2b2b"/><title>One host, Fleet, deployed three ways: a port per Connection, one multiplexed port for all of them, and a mix of both</title><rect x="16" y="16" width="292" height="308" rx="5" fill="none" stroke="#4a4a4a" stroke-width="1"/><text x="162" y="42" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">A port per Connection</text><text x="162" y="294" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">a server instance per Connection</text><text x="162" y="311" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">no multiplexer declared, or not used</text><rect x="166" y="58" width="132" height="212" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="232" y="262" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Fleet</text><rect x="324" y="16" width="292" height="308" rx="5" fill="none" stroke="#4a4a4a" stroke-width="1"/><text x="470" y="42" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">One multiplexed port</text><text x="470" y="294" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">one server instance for all of them</text><text x="470" y="311" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">the 1st byte picks the Connection</text><rect x="474" y="58" width="132" height="212" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="540" y="262" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Fleet</text><rect x="632" y="16" width="292" height="308" rx="5" fill="none" stroke="#4a4a4a" stroke-width="1"/><text x="778" y="42" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Mixed</text><text x="778" y="294" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">the public Connections share a port</text><text x="778" y="311" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Diagnostics keeps its own, LAN only</text><rect x="782" y="58" width="132" height="212" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="848" y="262" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Fleet</text><rect x="24" y="76" width="84" height="34" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="66" y="98" font-family="Segoe UI,DejaVu Sans,He