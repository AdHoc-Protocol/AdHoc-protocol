<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img"><rect width="940" height="420" fill="#2b2b2b"/><title>The life of one socket on a multiplexed port: the caller connects and sends one byte, the multiplexer takes a Connection from its pool and seats it on the socket, packs flow with no per-pack overhead, and on close the Connection goes back to the pool</title><rect x="40" y="20" width="220" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="150" y="44" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Vehicle</text><text x="150" y="61" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">Telemetry.Connection, mux = true</text><rect x="360" y="20" width="220" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="470" y="44" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Fleet :443</text><text x="470" y="61" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">TCP/WS server + FleetPort</text><rect x="680" y="20" width="220" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="790" y="44" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Fleet</text><text x="790" y="61" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">Telemetry.Connection, pooled</text><line x1="150" y1="70" x2="150" y2="372" stroke="#4a4a4a" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="470" y1="70" x2="470" y2="372" stroke="#4a4a4a" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="790" y1="70" x2="790" y2="372" stroke="#4a4a4a" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="24" cy="108" r="10" fill="none" stroke="#9aa0a6" stroke-width="1.2"/><text x="24" y="112" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">1</text><line x1="150" y1="108" x2="470" y2="108" stroke="#4fb3ff" stroke-width="2"/><path d="M470 108 L463 103.8 L463 112.2 Z" fill="#4fb3ff"/><text x="310" y="100" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">connect - TCP, or TCP + WebSocket upgrade</text><circle cx="24" cy="162" r="10" fill="none" stroke="#9aa0a6" stroke-width="1.2"/><text x="24" y="166" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">2</text><line x1="150" y1="162" x2="470" y2="162" stroke="#a06fd0" stroke-width="2.4"/><path d="M470 162 L463 157.8 L463 166.2 Z" fill="#a06fd0"/><text x="310" y="154" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a06fd0" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">1st byte: Telemetry.id() = Vehicle.uid</text><text x="310" y="180" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">on every socket, reconnects included</text><circle cx="24" cy="222" r="10" fill="none" stroke="#9aa0a6" stroke-width="1.2"/><text x="24" y="226" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">3</text><line x1="470" y1="222" x2="790" y2="222" stroke="#f2c14e" stroke-width="2"/><path d="M790 222 L783 217.8 L783 226.2 Z" fill="#f2c14e"/><text x="630" y="214" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">FleetPort.apply(Vehicle.uid)</text><text x="630" y="240" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">pool.acquire() - seated on the socket - OnOpen()</text><circle cx="24" cy="290" r="10" fill="none" stroke="#9aa0a6" stroke-width="1.2"/><text x="24" y="294" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">4</text><line x1="150" y1="290" x2="790" y2="290" stroke="#4fb3ff" stroke-width="3"/><path d="M150 290 L157 285.8 L157 294.2 Z" fill="#4fb3ff"/><path d="M790 290 L783 285.8 L783 294.2 Z" fill="#4fb3ff"/><text x="470" y="282" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">packs, both ways - nothing added per pack</text><circle cx="24" cy="346" r="10" fill="none" stroke="#9aa0a6" stroke-width="1.2"/><text x="24" y="350" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">5</text><line x1="470" y1="346" x2="790" y2="346" stroke="#9aa0a6" stroke-width="2"/><path d="M790 346 L783 341.8 L783 350.2 Z" fill="#9aa0a6"/><text x="630" y="338" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">socket closed - External(null)</text><text x="630" y="364" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">back to the pool, ready for the next caller</text><text x="470" y="404" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Unknown byte: the socket is closed and the failure reported. A direct port skips steps 2-3 and has no pool.</text></svg>