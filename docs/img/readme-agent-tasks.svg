<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="title desc">
<title id="title">AdHocAgent: the first argument picks the task</title>
<desc id="desc">AdHocAgent: the first argument picks the task. Six commands on the left, each with an arrow to its result: AdHocAgent alone prints the help and writes the template MyProtocolDescription.cs; AdHocAgent with your UUID stores PersonalVolatileUUID in AdHocAgent.toml; AdHocAgent .\MyProtocol.cs checks the description locally and uploads it - its result box is the only one joined across a dashed boundary between your machine and the network to the generator, a cloud service that tests the code: the description goes out, the generated code comes back into the received folder and is deployed; AdHocAgent .\MyProtocol.cs~ writes the impact report MyProtocol.changes.html with JSON for scripts; AdHocAgent .\MyProtocol.md redeploys the received folder; AdHocAgent .\MyProtocol.cs? starts the AdHoc Observer at localhost:4321. Every result but the .cs one is marked local. A warning strip: AdHocAgent MyProtocol.cs without a directory part is taken as a UUID and nothing is generated. A note: ADHOC_PARSE_ONLY=1 checks a pull request in CI without uploading.</desc>
