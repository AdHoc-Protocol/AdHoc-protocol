<text x="674" y="78" font-size="13" fill="#9aa0a6" font-weight="700">receiver</text>
<text x="674" y="94" font-size="12" fill="#9aa0a6">AdHocAgent, receiving generated code</text>
<rect x="64" y="104" width="196" height="46" rx="6" fill="#203d56" stroke="#4fb3ff" stroke-width="1.5"/>
<text x="162" y="124.2" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">send buffer</text>
<text x="162" y="139.9" font-size="12" fill="#9aa0a6" text-anchor="middle">fixed size</text>
<rect x="64" y="203" width="196" height="46" rx="6" fill="#46401f" stroke="#f2c14e" stroke-width="1.5"/>
<text x="162" y="223.2" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">Zstd (SrcZip)</text>
<text x="162" y="238.9" font-size="12" fill="#9aa0a6" text-anchor="middle">fixed staging buffer</text>
<rect x="64" y="302" width="196" height="46" rx="6" fill="#4a3322" stroke="#e8833a" stroke-width="1.5"/>
<text x="174" y="322.2" font-size="14" fill="#e8eaed" text-anchor="middle" font-weight="600">files on disk</text>
<text x="174" y="337.9" font-size="12" fill="#9aa0a6" text-anchor="middle">your source</text>
<path d="M77 317 V333 A9 3.2 0 0 0 95 333 V317" fill="#2b2b2b" stroke="#e8833a" stroke-width="1.4"/><ellipse cx="86" cy="317" rx="9" ry="3.2" fill="#2b2b2b" stroke="#e8833a" stroke-width="1.4"/><path d="M77 325 A9 3.2 0 0 0 95 325" fill="none" stroke="#e8833a" stroke-width="1.1"/>
<path d="M162 302 L162 257" fill="none" stroke="#e8833a" stroke-width="2" stroke-linejoin="round"/><path d="M162 249 L166.6 258 L157.4 258 Z" fill="#e8833a"/>
