<rect x="474" y="113" width="76" height="24" rx="4" fill="#203d56" stroke="#4fb3ff" stroke-width="1.3"/>
<text x="512" y="129.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">[len|data]</text>
