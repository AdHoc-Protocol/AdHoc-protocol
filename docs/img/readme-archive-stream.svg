<text x="172" y="285" font-size="12" fill="#e8eaed">entry after entry</text>
<path d="M162 203 L162 158" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M162 150 L166.6 159 L157.4 159 Z" fill="#f2c14e"/>
<text x="172" y="181" font-size="12" fill="#e8eaed">compressed on the fly</text>
