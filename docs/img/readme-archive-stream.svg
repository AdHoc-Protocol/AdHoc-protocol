<text x="609" y="129.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">0x0000</text>
<path d="M340 336 L620 336" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-linejoin="round"/><path d="M626 336 L619 339.4 L619 332.6 Z" fill="#9aa0a6"/>
<path d="M340 336 L340 190" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-linejoin="round"/><path d="M340 184 L343.4 191 L336.6 191 Z" fill="#9aa0a6"/>
<text x="626" y="354" font-size="12" fill="#9aa0a6" text-anchor="end">archive size →</text>
<text x="350" y="196" font-size="12" fill="#9aa0a6">bytes held, on each side</text>
<line x1="342" y1="332" x2="612" y2="210" stroke="#9aa0a6" stroke-width="1.8" stroke-dasharray="6 5"/>
<text x="566" y="220" font-size="12" fill="#9aa0a6" text-anchor="end">archive size: any</text>
<line x1="342" y1="306" x2="616" y2="306" stroke="#4fb3ff" stroke-width="2.6"/>
<text x="616" y="298" font-size="12" fill="#4fb3ff" text-anchor="end" font-weight="600">memory: fixed</text>
<text x="616" y="324" font-size="12" fill="#9aa0a6" text-anchor="end">buffers + codec contexts</text>
<text x="480" y="394" font-size="13" fill="#9aa0a6" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">FileEntry</tspan><tspan > = path + </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">[S(0x5_000_000)] Stream</tspan><tspan >: up to 80 MiB per entry, up to 65 535 entries, the cap checked on both sides.</tspan></text>
<text x="480" y="414" font-size="13" fill="#9aa0a6" text-anchor="middle">AdHoc's own protocol delivers project files this way.</text>
