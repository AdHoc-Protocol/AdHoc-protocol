<g data-nocheck="1"><path d="M260 125 L691 125" fill="none" stroke="#4fb3ff" stroke-width="2.4" stroke-linejoin="round"/><path d="M700 125 L690 130 L690 120 Z" fill="#4fb3ff"/></g>
<text x="480" y="104" font-size="12" fill="#9aa0a6" text-anchor="middle">the wire: length-prefixed chunks</text>
<rect x="310" y="113" width="76" height="24" rx="4" fill="#203d56" stroke="#4fb3ff" stroke-width="1.3"/>
<text x="348" y="129.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">[len|data]</text>
<rect x="392" y="113" width="76" height="24" rx="4" fill="#203d56" stroke="#4fb3ff" stroke-width="1.3"/>
