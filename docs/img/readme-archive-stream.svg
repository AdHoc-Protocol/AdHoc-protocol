<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 432" width="960" height="432" role="img" aria-labelledby="title desc">
<title id="title">An archive of any size, disk to disk, at constant memory</title>
<desc id="desc">Sender: each file is read from disk in blocks, entry after entry, compressed on the fly by the Zstd stage of the SrcZip flow with its fixed staging buffer, into a fixed send buffer, and onto the wire as length-prefixed chunks closed by 0x0000. Receiver, AdHocAgent receiving generated code: a fixed receive buffer, inverse Zstd, and one re-armed FileEntry, a path and a Stream, whose sink, a FileStream, writes each entry to disk. Between them a chart: the memory held on each side stays flat - buffers and codec contexts - while the archive size grows without limit.</desc>
<rect width="960" height="432" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="18" fill="#e8eaed" font-weight="700">An archive of any size, disk to disk, at constant memory</text>
<rect x="24" y="56" width="276" height="310" rx="8" fill="#242424" stroke="#4a4a4a" stroke-width="1.4"/>
<rect x="660" y="56" width="276" height="310" rx="8" fill="#242424" stroke="#4a4a4a" stroke-width="1.4"/>
