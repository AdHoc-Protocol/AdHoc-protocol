<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
<title id="title">Read the metadata, keep the bytes: AuditRecord on ServiceToAuditor</title>
<desc id="desc">One AuditRecord on the wire: the pack id, the AuditMeta header - trace_id 64 bits, tenant 32 bits, severity 3 bits, 99 bits rounded up to 13 bytes - the 4-byte timestamp at, a null-bits byte, and the payment as hatched opaque bytes in length-prefixed chunks ending with a zero length. A dashed line after the header marks where OnReceiving runs, before the payload is parsed. Below: the Service holds a typed Payment card and sends AuditRecord; the Auditor, with no Payment type and no parser, lets your code pick a shelf by tenant (tenant 7 to shelf C) and keeps the exact bytes there; the same bytes travel as Evidence (FromStream) to the Investigator, whose generated parser turns them back into a typed Payment card. A bracket joins the two cards: the same bytes, the same Payment, byte-faithful evidence. Footer: header fields are single, non-nullable, fixed-size primitives with MinMax allowed; they live on the connection, not in the pack; send takes their values before the connection argument.</desc>
