<text x="24" y="34" font-size="18" fill="#e8eaed" font-weight="600" xml:space="preserve"><tspan >Read the metadata, keep the bytes: </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">AuditRecord</tspan><tspan > on </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">ServiceToAuditor</tspan></text>
