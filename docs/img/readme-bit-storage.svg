<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
<title id="title">Bit fields: small values share the pack's bits</title>
<desc id="desc">Top: the pack Status on the wire - its id, the 8 bytes of the long field at, 3 bytes of bit storage, a byte of null bits and the string driver. The bit storage is zoomed below as 24 bits in three bytes, bit 0 first, in declaration order: ignition 1 bit (bool), door_open 2 bits (bool?: false, true, none), gear 2 bits (Gear), wanted 2 bits (Gear?), fuel_pct 7 bits (0 to 100), tilt 6 bits (-20 to 20) and 4 unused bits. Each field holds its code, value minus min, and none is one more code inside the field. Bottom: six small fields at a byte each would be 6 bytes; in bit storage they take 3 bytes, 20 bits used.</desc>
<rect width="960" height="430" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">Bit fields: small values share the pack's bits</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">every field whose codes fit in 7 bits goes into the pack's bit storage - rounded up to whole bytes once per pack</text>
<text x="24" y="82" font-size="12.5" fill="#e8eaed" font-weight="700">Status on the wire</text>
<rect x="24" y="88" width="44" height="34" rx="3" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="46" y="110" font-size="12.5" fill="#e8eaed" text-anchor="middle">id</text>
<rect x="72" y="88" width="230" height="34" rx="3" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="187" y="110" font-size="12.5" fill="#e8eaed" text-anchor="middle">at - 8 bytes</text>
<rect x="306" y="88" width="210" height="34" rx="3" fill="#3d3520" stroke="#f2c14e" stroke-width="2"/>
<text x="411" y="110" font-size="12.5" fill="#e8eaed" text-anchor="middle">bit storage - 3 bytes</text>
<rect x="520" y="88" width="90" height="34" rx="3" fill="#30343a" stroke="#8c9198" stroke-width="1.2"/>
<text x="565" y="110" font-size="12.5" fill="#e8eaed" text-anchor="middle">null bits</text>
<rect x="614" y="88" width="150" height="34" rx="3" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="689" y="110" font-size="12.5" fill="#e8eaed" text-anchor="middle">driver …</text>
