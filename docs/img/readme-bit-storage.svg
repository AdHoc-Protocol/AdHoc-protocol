<line x1="24" y1="166" x2="24" y2="224" stroke="#4fb3ff" stroke-width="1.6"/>
<text x="28" y="164" font-size="12" fill="#4fb3ff">byte 0</text>
<line x1="344" y1="166" x2="344" y2="224" stroke="#4fb3ff" stroke-width="1.6"/>
<text x="348" y="164" font-size="12" fill="#4fb3ff">byte 1</text>
