<text x="668" y="164" font-size="12" fill="#4fb3ff">byte 2</text>
<line x1="912" y1="166" x2="912" y2="224" stroke="#4fb3ff" stroke-width="1.6"/>
<text x="24" y="284" font-size="12" fill="#9aa0a6">bit 0 first, in declaration order · each field holds its code (value - min); &quot;none&quot; is one more code inside the field</text>
