<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
<title id="title">One Reading, sent two ways</title>
<desc id="desc">The Reading pack drawn to scale, 5 px per byte. Top: a request/response exchange of 162 bytes - a 49-byte request line and headers, an 86-byte text body of which 56 bytes are field names with their quotes and colons, 23 bytes values and 7 bytes punctuation, and a 27-byte reply. Bottom: the same Reading as an AdHoc pack of 15 bytes, enlarged byte by byte: the pack id, sensor 513 in 2 bytes, celsius and alarm in one bit-field byte, the length bit of pressure in a second bit-field byte, the payload byte of pressure, a byte of null bits, label &quot;ok&quot; in 3 bytes and samples [1, 2] in 5 bytes. AdHoc sends no reply unless the protocol declares one.</desc>
<rect width="960" height="430" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">One Reading, sent two ways - to scale, 5 px = 1 byte</text>
<text x="24" y="112" font-size="12" fill="#e8eaed">request/response</text>
<text x="24" y="128" font-size="12" fill="#9aa0a6">text body</text>
