<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 356" width="960" height="356" role="img" aria-labelledby="title desc">
<title id="title">一行特性,整条编解码链</title>
<desc id="desc">The field [Zstd(6), ChaCha20] Order secured; explained: Zstd(6) is the compression, written left, nearer the data; ChaCha20 the cipher, written right, nearer the wire. Send row: the typed Order is serialized, compressed by Zstd(6), encrypted by ChaCha20 and framed as chunks, length then data, closed by 0, onto the wire. Receive row, right to left: de-framing, inverse ChaCha20, inverse Zstd, parsing, and the typed Order again. A badge for every language - C++, Rust, C#, Java, Go, Swift, C, Dart, Python, TypeScript: the same chain is generated for each, no codec code to write. Notes: Zstd is lossless, level 1 to 22, default 3; ChaCha20 hides the bytes but does not detect tampering; a pack that cannot exceed 1024 bytes loses Zstd automatically, while a chain on a field stays as written.</desc>
