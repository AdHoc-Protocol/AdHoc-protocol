<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="title desc">
<title id="title">Rooms, presence and turns on Talk : Connects&lt;Member, Hub&gt;</title>
<desc id="desc">Left, the Hub: Connection.Groups lists the rooms. In #general the member instances M1, M2, M4 and M3 are linked by prev and next, with the group's own lock at its head; one Said fans out into one queued copy per member, because a send only queues and a slow member sets nobody's pace. #design links M2, M5 and M3. M3 is drawn leaving both rooms: a red note says an instance leaves its room by itself when it ends - through Leave in its state machine, through Idle(60) after 60 s without Say, Typing or Here, or when its session ends after the parked wait that follows a lost socket - Release, no ghosts, no sweeper. Right, the Edit state machine: Editing, led by the member, stays on TextInsert, TextDelete and CursorMove from both sides and goes to Reviewing on FinalizeDoc; Reviewing, led by the hub, returns on Approved or NeedsChanges; a TextInsert in Reviewing is refused before it leaves with DISCARDED_BYSTATE. Bottom: Say is a guaranteed leg, Resumable&lt;Member, Member.Say&gt;, delivered once and in order across a lost socket; Typing is not journalled; with Resumable(10) an identified member whose socket drops is parked and keeps its rooms.</desc>
