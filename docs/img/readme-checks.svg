<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">Checks before the handler</title>
<desc id="desc">A simplified receiving pipeline of generated gates, left to right, between the arriving bytes and your handler: is the pack id known here; is the pack allowed in this state; is the actor instance within MaxActiveInstances and on the current epoch; are lengths within D(+N), D(N) and S(N). Each gate has a red exit below it: an unknown id puts the channel out of step and it is dropped; a pack not expected now is reported to the error handler; a peer over the instance limit has its connection aborted, and a pack with an old epoch is dropped; a length over the limit is refused as OVERFLOW, in C# before anything is allocated. A timer strip underneath: ReceiveTimeout and TransmitTimeout for the connection, Deadline and Idle for one actor instance. Your handler, at the end, gets a typed pack and the transmitter of the next state. When sending, a pack the state does not allow is refused as DISCARDED_BYSTATE; value ranges are published as MIN and MAX constants, and checking input before a setter is your code.</desc>
<rect width="960" height="360" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="16" fill="#e8eaed" xml:space="preserve"><tspan font-weight="700" font-size="16">What runs before your handler sees a pack</tspan><tspan fill="#9aa0a6" font-size="12">  (simplified)</tspan></text>
<text x="944" y="60" font-size="12" fill="#e8eaed" text-anchor="end" xml:space="preserve"><tspan fill="#9aa0a6">sending: a pack the state does not allow is refused - </tspan><tspan fill="#e06c6c" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">DISCARDED_BYSTATE</tspan></text>
<text x="24" y="104" font-size="12" fill="#4fb3ff">bytes arrive</text>
<path d="M24 120 L102 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M109 120 L101 124.2 L101 115.8 Z" fill="#4fb3ff"/>
<rect x="110" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="185" y="116.8" font-size="12" fill="#e8eaed" text-anchor="middle">pack id</text><text x="185" y="131.8" font-size="12" fill="#e8eaed" text-anchor="middle">known here?</text>
<path d="M261 120 L272 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M279 120 L271 124.2 L271 115.8 Z" fill="#4fb3ff"/>
<path d="M185 153 L185 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M185 191 L181 183 L189 183 Z" fill="#e06c6c"/>
<rect x="110" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="185" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">unknown id:</text><text x="185" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">out of step - channel</text><text x="185" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">dropped</text>
<rect x="280" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="355" y="116.8" font-size="12" fill="#e8eaed" text-anchor="middle">allowed in</text><text x="355" y="131.8" font-size="12" fill="#e8eaed" text-anchor="middle">this state?</text>
<path d="M431 120 L442 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M449 120 L441 124.2 L441 115.8 Z" fill="#4fb3ff"/>
<path d="M355 153 L355 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M355 191 L351 183 L359 183 Z" fill="#e06c6c"/>
<rect x="280" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="355" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">not expected now:</text><text x="355" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">reported to the</text><text x="355" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">error handler</text>
<rect x="450" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="525" y="109.3" font-size="12" fill="#e8eaed" text-anchor="middle">instance within</text><text x="525" y="124.3" font-size="12" fill="#e8eaed" text-anchor="middle">MaxActiveInstances?</text><text x="525" y="139.3" font-size="12" fill="#e8eaed" text-anchor="middle">current epoch?</text>
<path d="M601 120 L612 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M619 120 L611 124.2 L611 115.8 Z" fill="#4fb3ff"/>
<path d="M525 153 L525 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M525 191 L521 183 L529 183 Z" fill="#e06c6c"/>
<rect x="450" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="525" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">peer over the limit:</text><text x="525" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">connection aborted;</text><text x="525" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">old epoch: dropped</text>
<rect x="620" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="695" y="116.8" font-size="12" fill="#e8eaed" text-anchor="middle">lengths within</text><text x="695" y="131.8" font-size="12" fill="#e8eaed" text-anchor="middle">D(+N), D(N), S(N)?</text>
<path d="M771 120 L782 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M789 120 L781 124.2 L781 115.8 Z" fill="#4fb3ff"/>
<path d="M695 153 L695 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M695 191 L691 183 L699 183 Z" fill="#e06c6c"/>
<rect x="620" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="695" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">over the limit:</text><text x="695" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">refused as OVERFLOW</text><text x="695" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">(C#: before allocating)</text>
<rect x="790" y="80" width="154" height="80" rx="6" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/>
<text x="867" y="100.3" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">your handler</text><text x="867" y="116.3" font-size="12" fill="#e8eaed" text-anchor="middle">a typed pack +</text><text x="867" y="132.3" font-size="12" fill="#e8eaed" text-anchor="middle">the next state's</text><text x="867" y="148.3" font-size="12" fill="#e8eaed" text-anchor="middle">transmitter</text>
<text x="24" y="293" font-size="12" fill="#9aa0a6">timers</text>
<rect x="110" y="274" width="834" height="30" rx="6" fill="#2a2a2a" stroke="#8c9198" stroke-width="1.4"/><text x="527" y="293.3" font-size="12" fill="#e8eaed" text-anchor="middle">ReceiveTimeout · TransmitTimeout (connection) · Deadline · Idle (one actor instance): a stalled peer or step ends</text>
<text x="24" y="338" font-size="12" fill="#9aa0a6">value ranges: MIN / MAX are generated constants - checking input before a setter is your code</text>
</g>
</svg>
