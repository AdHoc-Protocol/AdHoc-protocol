<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="title desc">
<title id="title">处理器之前的检查</title>
<desc id="desc">A simplified receiving pipeline of generated gates, left to right, between the arriving bytes and your handler: is the pack id known here; is the pack allowed in this state; is the actor instance within MaxActiveInstances and on the current epoch; are lengths within D(+N), D(N) and S(N). Each gate has a red exit below it: an unknown id puts the channel out of step and it is dropped; a pack not expected now is reported to the error handler; a peer over the instance limit has its connection aborted, and a pack with an old epoch is dropped; a length over the limit is refused as OVERFLOW, in C# before anything is allocated. A timer strip underneath: ReceiveTimeout and TransmitTimeout for the connection, Deadline and Idle for one actor instance. Your handler, at the end, gets a typed pack and the transmitter of the next state. When sending, a pack the state does not allow is refused as DISCARDED_BYSTATE; value ranges are published as MIN and MAX constants, and checking input before a setter is your code.</desc>
<rect width="960" height="360" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="16" fill="#e8eaed" xml:space="preserve"><tspan font-weight="700" font-size="16">pack 到达你的处理器之前,会经过哪些检查</tspan><tspan fill="#9aa0a6" font-size="12">  (简化)</tspan></text>
<text x="944" y="60" font-size="12" fill="#e8eaed" text-anchor="end" xml:space="preserve"><tspan fill="#9aa0a6">发送:状态不允许的 pack 在离开前被拒—— </tspan><tspan fill="#e06c6c" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace">DISCARDED_BYSTATE</tspan></text>
<text x="24" y="104" font-size="12" fill="#4fb3ff">字节到达</text>
<path d="M24 120 L102 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M109 120 L101 124.2 L101 115.8 Z" fill="#4fb3ff"/>
<rect x="110" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="185" y="116.8" font-size="12" fill="#e8eaed" text-anchor="middle">pack id</text><text x="185" y="131.8" font-size="12" fill="#e8eaed" text-anchor="middle">此处已知?</text>
<path d="M261 120 L272 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M279 120 L271 124.2 L271 115.8 Z" fill="#4fb3ff"/>
<path d="M185 153 L185 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M185 191 L181 183 L189 183 Z" fill="#e06c6c"/>
<rect x="110" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="185" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">未知 id:</text><text x="185" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">不同步——通道</text><text x="185" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">被丢弃</text>
<rect x="280" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="355" y="116.8" font-size="12" fill="#e8eaed" text-anchor="middle">当前状态</text><text x="355" y="131.8" font-size="12" fill="#e8eaed" text-anchor="middle">允许吗?</text>
<path d="M431 120 L442 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M449 120 L441 124.2 L441 115.8 Z" fill="#4fb3ff"/>
<path d="M355 153 L355 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M355 191 L351 183 L359 183 Z" fill="#e06c6c"/>
<rect x="280" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="355" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">此刻不应出现:</text><text x="355" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">上报给</text><text x="355" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">错误处理器</text>
<rect x="450" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="525" y="109.3" font-size="12" fill="#e8eaed" text-anchor="middle">实例数未超</text><text x="525" y="124.3" font-size="12" fill="#e8eaed" text-anchor="middle">MaxActiveInstances?</text><text x="525" y="139.3" font-size="12" fill="#e8eaed" text-anchor="middle">epoch 当前?</text>
<path d="M601 120 L612 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M619 120 L611 124.2 L611 115.8 Z" fill="#4fb3ff"/>
<path d="M525 153 L525 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M525 191 L521 183 L529 183 Z" fill="#e06c6c"/>
<rect x="450" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="525" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">对端超限:</text><text x="525" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">连接中止;</text><text x="525" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">旧 epoch:丢弃</text>
<rect x="620" y="88" width="150" height="64" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="695" y="116.8" font-size="12" fill="#e8eaed" text-anchor="middle">长度在</text><text x="695" y="131.8" font-size="12" fill="#e8eaed" text-anchor="middle">D(+N), D(N), S(N)?</text>
<path d="M771 120 L782 120" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M789 120 L781 124.2 L781 115.8 Z" fill="#4fb3ff"/>
<path d="M695 153 L695 184" fill="none" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M695 191 L691 183 L699 183 Z" fill="#e06c6c"/>
<rect x="620" y="192" width="150" height="58" rx="6" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.4"/><text x="695" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle">超过限制:</text><text x="695" y="225.3" font-size="12" fill="#e8eaed" text-anchor="middle">按 OVERFLOW 拒绝</text><text x="695" y="240.3" font-size="12" fill="#e8eaed" text-anchor="middle">(C#:分配前)</text>
<rect x="790" y="80" width="154" height="80" rx="6" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/>
<text x="867" y="100.3" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">你的处理器</text><text x="867" y="116.3" font-size="12" fill="#e8eaed" text-anchor="middle">类型化的 pack +</text><text x="867" y="132.3" font-size="12" fill="#e8eaed" text-anchor="middle">下一状态的</text><text x="867" y="148.3" font-size="12" fill="#e8eaed" text-anchor="middle">发送器</text>
<text x="24" y="293" font-size="12" fill="#9aa0a6">定时器</text>
<rect x="110" y="274" width="834" height="30" rx="6" fill="#2a2a2a" stroke="#8c9198" stroke-width="1.4"/><text x="527" y="293.3" font-size="12" fill="#e8eaed" text-anchor="middle">ReceiveTimeout · TransmitTimeout(连接)· Deadline · Idle(单个 Actor 实例):停滞的对端或步骤被终止</text>
<text x="24" y="338" font-size="12" fill="#9aa0a6">值范围:MIN / MAX 是生成的常量——在 setter 之前检查输入是你的代码</text>
</g>
</svg>
