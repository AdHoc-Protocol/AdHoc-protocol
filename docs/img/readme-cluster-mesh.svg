<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">A host connected to itself, clients on the same port: Connects&lt;Node, Node&gt;</title>
<desc id="desc">Three processes A, B and C, each the same generated module of host Node, joined pairwise by InterNode sockets. On every socket the dialing end is Left and the accepting end Right: A dialed B, so Append flows from A to B and Ack back; C dialed A and B, so A is Left on one socket and Right on another. Under the A-B socket the actor-instance id space is split into A's half and B's half, once, when the socket connects, nothing per pack. On the left, A's one port NodePort reads the first byte: a TypeScript Client arrives with Client.uid and lands on ClientNode, another Node arrives with Node.uid and lands on InterNode. At C a RoomEvent from a client fans out to the local room group ([Grouped]) and your code forwards it over InterNode to A and B, which fan it out to their own groups. Footer: ReceiveTimeout(30) notices a silent peer, OnReceiveTimeout may send a heartbeat and keep waiting; one host type for every node.</desc>
