<path d="M560 205 L560 240" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linejoin="round"/><path d="M560 247 L556 239 L564 239 Z" fill="#f2c14e"/>
<rect x="764" y="92" width="120" height="34" rx="10" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="824" y="113.7" font-size="13" fill="#e8eaed" text-anchor="middle">Start</text>
<rect x="764" y="170" width="120" height="34" rx="10" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="824" y="191.7" font-size="13" fill="#e8eaed" text-anchor="middle">Running</text>
<rect x="764" y="248" width="120" height="34" rx="10" fill="none" stroke="#f2c14e" stroke-width="1.4" stroke-dasharray="5 4"/><text x="824" y="269.7" font-size="13" fill="#e8eaed" text-anchor="middle">End</text>
<text x="824" y="298" font-size="12" fill="#9aa0a6" text-anchor="middle">pair released</text>
