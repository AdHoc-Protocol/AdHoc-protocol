<path d="M824 205 L824 240" fill="none" stroke="#f2c14e" stroke-width="1.8" stroke-linejoin="round"/><path d="M824 247 L820 239 L828 239 Z" fill="#f2c14e"/>
<path d="M620 179 L633 179 Q638 179 638 184 L638 191 Q638 196 633 196 L627 196" fill="none" stroke="#f2c14e" stroke-width="1.5" stroke-linejoin="round"/><path d="M621 196 L628 192.4 L628 199.6 Z" fill="#f2c14e"/>
