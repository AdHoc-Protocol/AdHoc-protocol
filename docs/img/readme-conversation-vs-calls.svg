<line x1="621" y1="109" x2="662" y2="109" stroke="#e06c6c" stroke-width="1.6" stroke-dasharray="4 3"/>
<path d="M666 104 L676 114 M676 104 L666 114" stroke="#e06c6c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
<text x="642" y="103" font-size="12" fill="#e06c6c" text-anchor="middle">Done</text>
<path d="M460 310 L472 322 M472 310 L460 322" stroke="#e06c6c" stroke-width="2.4" stroke-linecap="round" fill="none"/>
<text x="484" y="320" font-size="13" fill="#e8eaed">Done sent while still in Start - refused before it leaves:</text>
<text x="484" y="338" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e06c6c" xml:space="preserve">DISCARDED_BYSTATE</text>
