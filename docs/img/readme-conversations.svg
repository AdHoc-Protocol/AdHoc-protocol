<text x="126" y="466" font-size="12" fill="#9aa0a6" xml:space="preserve">in the order they cross, left to right;  ▶ Client to Server,  ◀ Server to Client</text>
<text x="480" y="494" font-size="14" fill="#e8eaed" text-anchor="middle">Every pack carries its actor - and its instance, for actors with instances.</text>
<text x="480" y="512" font-size="13" fill="#9aa0a6" text-anchor="middle">Each actor keeps its own state; no conversation waits for another to reach a state.</text>
