<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="title desc">
<title id="title">One connection, several conversations - each with its own state machine</title>
<desc id="desc">A Client and a Server joined by one connection, interface Link : Connects&lt;Client, Server&gt;, carrying four conversations in lanes: Actor0 (Start, Authorizing, Ready on Login and Welcome, with a Beat loop sent by either side); Notify, a function group that is always active, through which the Server pushes Note and Alert; ping, an RPC going Call, Return, End on Ping and Pong; and Job, a swarm of up to 8 instance pairs, three shown, each going Start, Running, End with its own Deadline(30) clock. Below, one socket on which the packs of all four interleave, colored by actor.</desc>
<rect width="960" height="530" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="18" fill="#e8eaed" font-weight="700">One connection, several conversations - each with its own state machine</text>
