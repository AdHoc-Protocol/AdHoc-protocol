<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 608" width="960" height="608" role="img" aria-labelledby="title desc">
<title id="title">The same AdHoc declarations answer everyday problems of devices, backends and apps</title>
<desc id="desc">Three columns, each problem tagged with the number of its ready solution. Devices and the field (C# or Java on the device side): R13 every byte costs airtime; R4 no event lost on a dropout; R5 sure commands, fresh samples; R2 generations, no version field; R10 OTA updates of any size; R14 moves only when armed; R19 video that yields to alerts; R22 serial links that resync. Backends and clusters (C# or Java servers): R3 one public port, many services; R16 cluster protocol, same port; R1 store bytes it cannot read; R11 compress once, fan out; R17 audit without the payload; R12 each role sees its own; R15 ingest into your structures; R20 one pack, many recipients; R21 store and broadcast at once. Apps and browsers (TypeScript, C# and Java clients): R7 live dashboards, push both ways; R8 jobs with progress, cancel and deadline; R9 subscriptions with leases; R18 rooms, presence, turn-taking; R6 private hosts via a gateway; R4 orders survive a flaky network; R19 video, commands never wait; R20 one tick to every player. Below, an orange bar - one description, one C# file - feeds a yellow bar - generated code in C#, Java and TypeScript, one protocol, the same bytes - which feeds all three columns. Footnote: device-side hosts are C# or Java programs today; a TypeScript host always dials.</desc>
