<text x="24" y="582" font-size="12" fill="#9aa0a6">设备:固件、网关、工业 PC、车载电脑——用 C、C++、Rust、Go、C# 或 Java。TypeScript 主机总是主动拨出。R 编号:见下文的现成方案。</text>
