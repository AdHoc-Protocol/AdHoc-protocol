<text x="226" y="323" font-size="12" fill="#e06c6c" font-weight="600">backend exposed</text>
<text x="32" y="356" font-size="12" fill="#9aa0a6">three listeners, three certificates,</text>
<text x="32" y="372" font-size="12" fill="#9aa0a6">three firewall rules - and Mobile needs</text>
<text x="32" y="388" font-size="12" fill="#9aa0a6">a way in to Backend</text>
