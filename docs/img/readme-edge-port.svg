<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="title desc">
<title id="title">One public port for many services</title>
<desc id="desc">A port per service against one multiplexed port: Browser, Admin and Mobile dial one port of Edge; Query is relayed to a hidden Backend without being decoded.</desc>
