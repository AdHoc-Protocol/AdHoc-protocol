<text x="370" y="364" font-size="12" fill="#e8eaed">X25519 key on Edge: a Noise NK handshake, then ChaCha20-Poly1305</text>
<text x="370" y="380" font-size="12" fill="#e8eaed">records on every connection - the uid byte travels encrypted</text>
<text x="480" y="418" font-size="13" fill="#9aa0a6" text-anchor="middle">One listener, one address, one certificate, one NAT hole. A port per connection or one shared port: chosen at deployment, same generated code.</text>
