<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="title desc">
<title id="title">One pack, many recipients, no copies</title>
<desc id="desc">Your code fills one Tick object once and sends it on every subscriber connection. Each of four connections holds only a reference to that one object in a slot of its sending queue (dashed yellow lines back to the object); its transmitter writes the object into its own send buffer with its own cursor, each at a different point, and on to Viewer 1 to Viewer 4. The object is never copied. Notes: send puts a reference in a queue and serializes nothing yet; keep the object unchanged until every connection has reached OnSerialized; a Value Pack is a number, so each queue slot gets its own copy.</desc>
<rect width="960" height="470" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">One pack, many recipients, no copies</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">send queues a reference; every connection writes the same object with its own cursor</text>
<rect x="16" y="84" width="230" height="120" rx="8" fill="#3a2c20" stroke="#e8833a" stroke-width="1.6"/>
<text x="30" y="106" font-size="12" fill="#e8833a" font-weight="700">your code</text>
<text x="30" y="132" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" xml:space="preserve">Tick tick = new Tick();</text>
<text x="30" y="154" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#9aa0a6" xml:space="preserve">for each subscriber:</text>
<text x="30" y="176" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" xml:space="preserve">  send( tick, conn, w );</text>
