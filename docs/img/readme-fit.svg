<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-labelledby="title desc">
<title id="title">Where AdHoc fits</title>
<desc id="desc">Where AdHoc fits, as two cards. Left, AdHoc fits: peers you deploy and can list - services, devices, apps, consoles; high message rates where bytes and CPU count; large or live payloads - files, media, streams; conversations with phases and pushes from both sides; middle tiers that must route or store without the schema; one protocol in several languages - C#, Java, TypeScript. Right, text request/response fits better: open public APIs for clients you will never meet; peers that evolve independently forever, with no bound on their generations; traffic read by eye or parsed by generic intermediaries; rare, small calls where bytes do not matter; a language AdHoc does not generate yet - C++, Rust, Go are markers only. Strip: AdHoc carries generations as separate hosts - right for a population you know, wrong for an ecosystem without bounds.</desc>
