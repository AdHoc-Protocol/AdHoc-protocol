<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="title desc">
<title id="title">Three gates</title>
<desc id="desc">A horizontal track from MyProtocol.cs to the generated code, through three gates. Gate 1, the C# compiler (Roslyn): the errors your IDE shows as you type - for example a misspelled host in Connects&lt;Sensor, Colector&gt; is an unknown type. Gate 2, the AdHoc rules, checked by AdHocAgent on your machine, where the first error stops: for example both sides leading one state, a state claiming a pack twice, MinMax(5, 5) as a range of a single value, A(1_000, 1_100) as a varint whose span fits one byte. A dashed boundary after gate 2: nothing leaves your machine until the description passes. Gate 3, server tests before the code returns, as deep as the load allows; the result says how far testing went, so keep your own tests. Both ends of a connection come from one declaration, so a type mismatch between two hosts cannot be written.</desc>
<rect width="960" height="340" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="24" y="88" width="120" height="44" rx="6" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/><text x="84" y="114.7" font-size="13" fill="#e8eaed" text-anchor="middle">MyProtocol.cs</text>
<rect x="170" y="70" width="180" height="80" rx="6" fill="#2a2a2a" stroke="#8c9198" stroke-width="1.4"/>
<circle cx="190" cy="92" r="10" fill="#8c9198"/><text data-ok="1" x="190" y="96.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">1</text>
<text x="208" y="97" font-size="13" fill="#e8eaed" font-weight="700">C# compiler</text>
<text x="260" y="120" font-size="12" fill="#e8eaed" text-anchor="middle">Roslyn - the errors your</text>
<text x="260" y="136" font-size="12" fill="#e8eaed" text-anchor="middle">IDE shows as you type</text>
<rect x="370" y="70" width="190" height="80" rx="6" fill="#2a2a2a" stroke="#8c9198" stroke-width="1.4"/>
<circle cx="390" cy="92" r="10" fill="#8c9198"/><text data-ok="1" x="390" y="96.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">2</text>
<text x="408" y="97" font-size="13" fill="#e8eaed" font-weight="700">AdHoc rules</text>
<text x="465" y="120" font-size="12" fill="#e8eaed" text-anchor="middle">AdHocAgent, on your</text>
<text x="465" y="136" font-size="12" fill="#e8eaed" text-anchor="middle">machine; first error stops</text>
<rect x="594" y="70" width="180" height="80" rx="6" fill="#342a42" stroke="#a06fd0" stroke-width="1.4"/>
<circle cx="614" cy="92" r="10" fill="#a06fd0"/><text data-ok="1" x="614" y="96.5" font-size="13" fill="#1e1e1e" text-anchor="middle" font-weight="700">3</text>
<text x="632" y="97" font-size="13" fill="#e8eaed" font-weight="700">server tests</text>
<text x="684" y="120" font-size="12" fill="#e8eaed" text-anchor="middle">before the code returns;</text>
<text x="684" y="136" font-size="12" fill="#e8eaed" text-anchor="middle">depth depends on load</text>
<rect x="800" y="88" width="144" height="44" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="872" y="106.2" font-size="13" fill="#e8eaed" text-anchor="middle">generated code</text><text x="872" y="123.2" font-size="13" fill="#e8eaed" text-anchor="middle">for every host</text>
<path d="M145 110 L162 110" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M169 110 L161 114.2 L161 105.8 Z" fill="#4fb3ff"/>
<path d="M351 110 L362 110" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M369 110 L361 114.2 L361 105.8 Z" fill="#4fb3ff"/>
<path d="M561 110 L586 110" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M593 110 L585 114.2 L585 105.8 Z" fill="#4fb3ff"/>
