<line x1="576" y1="60" x2="576" y2="298" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="576" y="50" font-size="12" fill="#e8eaed" text-anchor="middle">nothing leaves your machine until the description passes</text>
