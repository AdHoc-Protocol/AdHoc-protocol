<text x="382" y="212" font-size="12" fill="#e8eaed">both sides lead a state</text>
<text x="382" y="229" font-size="12" fill="#e8eaed">a state claims a pack twice</text>
<text x="382" y="246" font-size="12" fill="#e8eaed">MinMax(5, 5): a single value</text>
<text x="382" y="263" font-size="12" fill="#e8eaed">A(1_000, 1_100): a varint</text>
<text x="382" y="280" font-size="12" fill="#e8eaed" xml:space="preserve">  whose span fits one byte</text>
<line x1="684" y1="151" x2="684" y2="169" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="3 3"/>
<rect x="594" y="170" width="180" height="124" rx="6" fill="#2b2b2b" stroke="#9aa0a6" stroke-width="1.4"/>
<text x="606" y="216" font-size="12" fill="#9aa0a6">the result says how far</text>
<text x="606" y="234" font-size="12" fill="#9aa0a6">testing went - keep</text>
<text x="606" y="252" font-size="12" fill="#9aa0a6">your own tests</text>
<text x="24" y="322" font-size="12" fill="#e8eaed">both ends of a connection come from one declaration: a type mismatch between two hosts cannot be written</text>
