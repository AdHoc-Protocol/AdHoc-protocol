<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 436" width="960" height="436" role="img" aria-labelledby="title desc">
<title id="title">What Resumable&lt;Client, (Order, Cancel)&gt; costs</title>
<desc id="desc">On the wire from Client to Server, guaranteed packs Order and Cancel, marked G, travel between ordinary Beat packs and carry no extra bytes. Each guaranteed pack is copied into the Client journal as it goes out; ordinary packs are not journalled. The journal holds the unacknowledged packs in memory first, then in 4 MB files on disk, capped by resumable_megabytes, default 100. Back from the Server, one REPORT(position) control record, the pack id plus 8 bytes, every 4 KiB of guaranteed packs, frees every journal byte below the position. After a reconnect, CONTINUE(position) makes the sender replay from the journal before new packs.</desc>
