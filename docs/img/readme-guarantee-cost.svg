<text x="24" y="34" font-size="18" fill="#e8eaed" font-weight="700" xml:space="preserve"><tspan >What </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Resumable&lt;Client, (Order, Cancel)&gt;</tspan><tspan > costs</tspan></text>
