<text x="480" y="400" font-size="14" fill="#e8eaed" text-anchor="middle">Packs outside the set, and connections without a Resumable, carry nothing of it.</text>
<text x="480" y="419" font-size="13" fill="#9aa0a6" text-anchor="middle">On [UDP] every pack is journalled - you name the ones that may be lost.</text>
