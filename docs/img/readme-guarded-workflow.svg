<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" width="980" height="560" role="img" aria-labelledby="title desc">
<title id="title">Protocol-enforced workflow: the Motion state machine of Control, compiled into the Console and the Robot</title>
<desc id="desc">Safe, led by the Console, goes to Arming on Console.Arm. Arming, led by the Robot and limited by Deadline(3), goes to Armed on Robot.ArmedAck or to End on Robot.Refused. Armed, led by the Console, stays on Console.Jog and Console.Heartbeat and on Robot.Pose, and ends on Console.Disarm; its Idle(1) lease is held by the Robot. Lower left: the Console's generated transmitters - one send method per pack the state allows: Arm in Safe, none in Arming, Jog, Heartbeat and Disarm in Armed; a dashed card shows that Safe has no method for Jog. Middle: a Jog sent anyway in Safe is refused before it leaves as DISCARDED_BYSTATE; a second Motion opened by the peer aborts the connection, a second local Acquire returns null; a late pack from a previous state is dropped by the epoch. Right: on the Robot, Jog and Heartbeat ticks, then one second of silence, and OnDeadline fires so your code makes a safe stop; the connection lives on; only received packs count.</desc>
