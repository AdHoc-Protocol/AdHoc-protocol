<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="title desc">
<title id="title">Written by hand, per message, per side and per language - or declared once in an AdHoc description</title>
<desc id="desc">Left: a grey stack of eleven layers of hand-written network plumbing, with two offset copies behind it tabbed C#, Java and TypeScript: encoder and decoder for every message; a dispatch switch and &quot;may this arrive now?&quot; flags; correlation ids and a map of pending calls; reconnect, session restore and a resend queue; sequence numbers, acks and a retransmit window; chunking and temp files for big payloads; compression and cipher wrappers; a store that decrypts, decodes and re-encodes; a proxy that parses and holds the keys; a router in front or a port per service; a version field with if (version &gt;= 3) branches. Under it: times both sides of every connection, kept in step by hand. Right: an orange card, declared once, one line in the description per layer, each joined to its layer by an arrow: class Order with [MinMax(1, 100)] byte quantity; [L____________&lt;Shopping, Login&gt;] struct Start; (L____________, Pong) ping(Ping req); [Resumable(30)] plus Resumable&lt;Client, Order&gt;; [UDP&lt;Samples&gt;(10)]; [S(200_000)] Stream feed; [Zstd, ChaCha20]; [ToStream&lt;FromCamera&gt;] Snapshot snapshot; VirtuallyConnects&lt;Operator, Fleet, Edge&gt;; Multiplex&lt;(Telemetry, TelemetryV2, Console)&gt;; struct VehicleV2 : Host, a new generation. An arrow from the card to a yellow band: generated for every host, in each of its languages - C#, Java, TypeScript - the same bytes on the wire; your code says what a pack means and what a state starts, in injection points kept by smart merge.</desc>
<rect width="960" height="620" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="18" fill="#e8eaed" font-weight="700">Written by hand</text>
<text x="24" y="54" font-size="13" fill="#9aa0a6">per message - per side - per language</text>
<text x="560" y="34" font-size="18" fill="#e8833a" font-weight="700">Declared once</text>
<text x="560" y="54" font-size="13" fill="#9aa0a6">one line in the description</text>
