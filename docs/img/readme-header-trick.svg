<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
<title id="title">Beyond 64 bits: an empty pack with a header</title>
<desc id="desc">Two rows. Top, an ordinary pack Point3 with three floats: the sender makes new Point3(), an object per message, the queue holds a reference, the wire carries the pack id and x, y, z, and the receiver makes another new Point3() before the handler. Bottom, an empty pack Position with the header XYZ : HeaderFor&lt;Position&gt; holding float x, y, z: send(x, y, z, ...) passes three numbers, the queue holds the values, the wire carries the same bytes - the pack id and 12 bytes - and the receiver gives the handler an XYZ header view over the receive buffer, from which it reads x(), y() and z(). Facts: no object on either side; header fields are single non-nullable primitives, MinMax allowed; read the values in the handler, the next pack overwrites the view.</desc>
<rect width="960" height="430" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">Beyond 64 bits: an empty pack with a header</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">x, y, z - 12 bytes, too wide for a Value Pack - sent and received with no object on either side</text>
<text x="24" y="92" font-size="12.5" fill="#e8eaed" font-weight="700">an ordinary pack: class Point3 { float x, y, z; }</text>
