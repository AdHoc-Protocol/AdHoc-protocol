<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 448" width="980" height="448" role="img" aria-labelledby="title desc">
<title id="title">Who holds the data</title>
<desc id="desc">A matrix over the pack Frame and its fields timestamp, channel and samples. Broker in Java, configured --, sends Frame: every cell purple, read through getters from its own objects. Router in C# receives Frame: a generated object stores timestamp and channel, while samples is handed to your code as it arrives. Dashboard in TypeScript receives Frame: every cell a plain generated object. One wire strip of Frame below: the same bytes for every row.</desc>
<rect width="980" height="448" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="16" fill="#e8eaed" font-weight="700">Who holds the data of one pack, host by host</text>
<text x="24" y="64" font-size="12" fill="#9aa0a6">host · language · role</text>
<text x="430" y="64" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">Frame (pack)</text>
<text x="575" y="64" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">timestamp</text>
<text x="715" y="64" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">channel</text>
<text x="860" y="64" font-size="13" fill="#e8eaed" text-anchor="middle" font-weight="700">samples ≤ 1 000 000</text>
<rect x="16" y="90" width="918" height="70" rx="8" fill="#303133"/>
<text x="28" y="112" font-size="14" fill="#e8eaed" font-weight="700">Broker · Java · sends Frame</text>
<text x="28" y="131" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve">&lt;see cref='InJAVA'/&gt;--</text>
<rect x="364" y="98" width="132" height="54" rx="7" fill="#32293e" stroke="#a06fd0" stroke-width="1.5"/>
<text x="430" y="121.3" font-size="12" fill="#e8eaed" text-anchor="middle">interface over</text>
<text x="430" y="137.3" font-size="12" fill="#e8eaed" text-anchor="middle">your object</text>
<rect x="514" y="98" width="122" height="54" rx="7" fill="#32293e" stroke="#a06fd0" stroke-width="1.5"/>
<text x="575" y="129.3" font-size="12" fill="#e8eaed" text-anchor="middle">getter</text>
<rect x="654" y="98" width="122" height="54" rx="7" fill="#32293e" stroke="#a06fd0" stroke-width="1.5"/>
<text x="715" y="129.3" font-size="12" fill="#e8eaed" text-anchor="middle">getter</text>
<rect x="794" y="98" width="132" height="54" rx="7" fill="#32293e" stroke="#a06fd0" stroke-width="1.5"/>
<text x="860" y="121.3" font-size="12" fill="#e8eaed" text-anchor="middle">getter: items</text>
<text x="860" y="137.3" font-size="12" fill="#e8eaed" text-anchor="middle">from your log</text>
<rect x="16" y="170" width="918" height="80" rx="8" fill="#303133"/>
<text x="28" y="192" font-size="14" fill="#e8eaed" font-weight="700">Router · C# · receives Frame</text>
<text x="28" y="211" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve">&lt;see cref='InCS'/&gt;</text>
<text x="28" y="226" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve">&lt;see cref='InCS'/&gt;-</text>
<text x="28" y="241" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve">&lt;see cref='Frame.samples'/&gt;</text>
