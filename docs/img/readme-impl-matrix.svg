<text x="304" y="424" font-size="12" fill="#9aa0a6" xml:space="preserve">-  your code holds it</text>
<text x="952" y="424" font-size="12" fill="#9aa0a6" text-anchor="end">field rule &gt; pack rule &gt; host default · a second + or - turns equality and hash on or off</text>
