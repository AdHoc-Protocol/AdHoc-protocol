<rect x="360" y="356" width="592" height="36" rx="4" fill="none" stroke="#4fb3ff" stroke-width="1.5"/>
<rect x="24" y="413" width="14" height="14" rx="3" fill="#3d3520" stroke="#f2c14e" stroke-width="1.5"/>
<text x="46" y="424" font-size="12" fill="#9aa0a6" xml:space="preserve">+  生成的对象持有数据</text>
<rect x="282" y="413" width="14" height="14" rx="3" fill="#32293e" stroke="#a06fd0" stroke-width="1.5"/>
<text x="304" y="424" font-size="12" fill="#9aa0a6" xml:space="preserve">-  你的代码持有数据</text>
<text x="952" y="424" font-size="12" fill="#9aa0a6" text-anchor="end">字段规则 &gt; pack 规则 &gt; 主机默认 · 第二个 + 或 - 开关相等比较与哈希</text>
