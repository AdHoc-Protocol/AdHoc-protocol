<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 444" width="960" height="444" role="img" aria-labelledby="title desc">
<title id="title">Where to read about what in MANUAL.md</title>
<desc id="desc">A map of MANUAL.md. Across the top, the pipeline as six boxes left to right, each with the chapters that explain it: description 3 and 23, AdHocAgent 24, generator 1 and 24, code per host 10, deployment 25, runtime 1 and 13. Below, the model as a stack of bands from project down to bytes, each with its chapters: project - 3 description file, 20 numbers tables, 21 evolving, 22 reuse; host - 10 hosts, languages; connection - 11 connections, 14 sessions and UDP, 18 virtual connections, 19 multiplexing; actor, state, branch - 12 actors, states, branches, 13 actor kinds; pack - 4 packs, 8 building packs, 9 Pack Sets, 17 trims; field - 5 fields and types, 6 constants and enums; bytes - 7 values to bytes, 15 streams, 16 transform chains. On the right, start here: 1 How AdHoc works and 2 Getting started, then the part you need; to look up: 23 Attributes, the glossary in 1, every AdHocAgent option in 24.</desc>
