<text x="878" y="126" font-size="12" fill="#9aa0a6" text-anchor="middle">TypeScript</text>
<text x="878" y="168" font-size="12" fill="#e8eaed" text-anchor="middle">video decoder</text>
<text x="878" y="186" font-size="12" fill="#4fb3ff" text-anchor="middle">← segment sink</text>
<text x="878" y="228" font-size="12" fill="#e8eaed" text-anchor="middle">alert panel</text>
<text x="878" y="246" font-size="12" fill="#e8833a" text-anchor="middle">← Alert</text>
<text x="878" y="318" font-size="12" fill="#e8eaed" text-anchor="middle">sticks, buttons</text>
<text x="878" y="336" font-size="12" fill="#e8833a" text-anchor="middle">→ send(Land)</text>
<text x="164" y="150" font-size="12" fill="#e8eaed" font-weight="700">Drone → Operator · one pack at a time</text>
