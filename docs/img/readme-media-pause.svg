<text x="82" y="168" font-size="12" fill="#e8eaed" text-anchor="middle">camera encoder</text>
<text x="82" y="186" font-size="12" fill="#4fb3ff" text-anchor="middle">→ segment source</text>
<text x="82" y="228" font-size="12" fill="#e8eaed" text-anchor="middle">battery monitor</text>
<text x="82" y="246" font-size="12" fill="#e8833a" text-anchor="middle">→ send(Alert)</text>
<text x="82" y="318" font-size="12" fill="#e8eaed" text-anchor="middle">flight control</text>
<text x="82" y="336" font-size="12" fill="#e8833a" text-anchor="middle">← Command, Land</text>
<rect x="812" y="84" width="132" height="300" rx="8" fill="#2f4560" stroke="#6f9fd8" stroke-width="1.6"/>
