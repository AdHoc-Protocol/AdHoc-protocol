<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">An endless video feed in Stream segments that stops for an urgent alert</title>
<desc id="desc">Drone on the left, Operator on the right, one connection. Upper lane, Drone to Operator: VideoSegment packs, each a run of chunks closed by a zero terminator; send(Alert) is called during the second segment, its next Read returns 0, the segment ends early with its terminator, the Alert goes out within about one socket buffer, and the next VideoSegment continues the feed. Lower lane, Operator to Drone: Command packs and an urgent Land cross at any time, never waiting for the video, because the two directions run on separate loops. Notes: a segment is a named Stream pack capped by S(N), chunked and ending at any byte; the feed has no end and is cut where the decoder can resume; memory stays two socket buffers per connection.</desc>
<rect width="960" height="520" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">One link: an endless video feed that stops for an urgent alert</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">time runs left to right · one connection · one session</text>
