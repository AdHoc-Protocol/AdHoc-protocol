<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">Stream 分段中的无尽视频流,为紧急告警让路</title>
<desc id="desc">Drone on the left, Operator on the right, one connection. Upper lane, Drone to Operator: VideoSegment packs, each a run of chunks closed by a zero terminator; send(Alert) is called during the second segment, its next Read returns 0, the segment ends early with its terminator, the Alert goes out within about one socket buffer, and the next VideoSegment continues the feed. Lower lane, Operator to Drone: Command packs and an urgent Land cross at any time, never waiting for the video, because the two directions run on separate loops. Notes: a segment is a named Stream pack capped by S(N), chunked and ending at any byte; the feed has no end and is cut where the decoder can resume; memory stays two socket buffers per connection.</desc>
<rect width="960" height="520" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">一条链路:无尽视频流为紧急告警让路</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">时间从左到右 · 一条连接 · 一个会话</text>
<rect x="16" y="84" width="132" height="300" rx="8" fill="#2f4560" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="82" y="108" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">Drone</text>
<text x="82" y="126" font-size="12" fill="#9aa0a6" text-anchor="middle">C#</text>
<text x="82" y="168" font-size="12" fill="#e8eaed" text-anchor="middle">相机编码器</text>
<text x="82" y="186" font-size="12" fill="#4fb3ff" text-anchor="middle">→ 分段源</text>
<text x="82" y="228" font-size="12" fill="#e8eaed" text-anchor="middle">电池监控</text>
<text x="82" y="246" font-size="12" fill="#e8833a" text-anchor="middle">→ send(Alert)</text>
<text x="82" y="318" font-size="12" fill="#e8eaed" text-anchor="middle">飞行控制</text>
<text x="82" y="336" font-size="12" fill="#e8833a" text-anchor="middle">← Command, Land</text>
<rect x="812" y="84" width="132" height="300" rx="8" fill="#2f4560" stroke="#6f9fd8" stroke-width="1.6"/>
<text x="878" y="108" font-size="15" fill="#e8eaed" text-anchor="middle" font-weight="700">Operator</text>
<text x="878" y="126" font-size="12" fill="#9aa0a6" text-anchor="middle">TypeScript</text>
<text x="878" y="168" font-size="12" fill="#e8eaed" text-anchor="middle">视频解码器</text>
<text x="878" y="186" font-size="12" fill="#4fb3ff" text-anchor="middle">← 分段数据汇</text>
<text x="878" y="228" font-size="12" fill="#e8eaed" text-anchor="middle">告警面板</text>
<text x="878" y="246" font-size="12" fill="#e8833a" text-anchor="middle">← Alert</text>
<text x="878" y="318" font-size="12" fill="#e8eaed" text-anchor="middle">操纵杆、按钮</text>
<text x="878" y="336" font-size="12" fill="#e8833a" text-anchor="middle">→ send(Land)</text>
<text x="164" y="150" font-size="12" fill="#e8eaed" font-weight="700">Drone → Operator · 一次一个 pack</text>
<path d="M164 232 L788 232" fill="none" stroke="#4a4a4a" stroke-width="1.4" stroke-linejoin="round"/><path d="M796 232 L787 236.6 L787 227.4 Z" fill="#4a4a4a"/>
<text x="792" y="248" font-size="12" fill="#9aa0a6" text-anchor="end">时间</text>
<text x="164" y="170" font-size="12" fill="#4fb3ff">VideoSegment</text>
<rect x="164" y="180" width="14" height="32" rx="2" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1"/>
<rect x="179" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
<rect x="215" y="180" width="14" height="32" rx="2" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1"/>
<rect x="230" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
<rect x="266" y="180" width="22" height="32" rx="2" fill="#1c1c1c" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="277" y="200" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#4fb3ff" text-anchor="middle" xml:space="preserve">0</text>
<text x="296" y="170" font-size="12" fill="#4fb3ff">VideoSegment —— 提前结束</text>
<rect x="296" y="180" width="14" height="32" rx="2" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1"/>
<rect x="311" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
