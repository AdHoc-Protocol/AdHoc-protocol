<rect x="362" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
<rect x="398" y="180" width="14" height="32" rx="2" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1"/>
<rect x="413" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
<rect x="449" y="180" width="22" height="32" rx="2" fill="#1c1c1c" stroke="#e8833a" stroke-width="1.8"/>
<text x="460" y="200" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8833a" text-anchor="middle" xml:space="preserve">0</text>
<rect x="479" y="180" width="64" height="32" rx="4" fill="#3a2c20" stroke="#e8833a" stroke-width="1.8"/>
<text x="511" y="201" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="700">Alert</text>
<text x="551" y="170" font-size="12" fill="#4fb3ff">VideoSegment —— 流继续</text>
<rect x="551" y="180" width="14" height="32" rx="2" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1"/>
<rect x="566" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
<rect x="602" y="180" width="14" height="32" rx="2" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1"/>
<rect x="617" y="180" width="34" height="32" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1"/>
<rect x="653" y="180" width="22" height="32" rx="2" fill="#1c1c1c" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="664" y="200" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#4fb3ff" text-anchor="middle" xml:space="preserve">0</text>
<text x="685" y="201" font-size="15" fill="#4fb3ff">…</text>
<line x1="392" y1="272" x2="392" y2="214" stroke="#e8833a" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="386" y="286" font-size="12" fill="#e8833a" text-anchor="end">send(Alert) 已排队</text>
<text x="386" y="302" font-size="12" fill="#9aa0a6" text-anchor="end">下次 Read() 返回 0:分段结束</text>
<text x="386" y="318" font-size="12" fill="#e8833a" text-anchor="end">约一个套接字缓冲区之后:Alert 到达</text>
<line x1="392" y1="156" x2="479" y2="156" stroke="#e8833a" stroke-width="1.4"/>
<line x1="392" y1="151" x2="392" y2="161" stroke="#e8833a" stroke-width="1.4"/>
<line x1="479" y1="151" x2="479" y2="161" stroke="#e8833a" stroke-width="1.4"/>
<text x="460" y="224" font-size="12" fill="#9aa0a6" text-anchor="middle">终止符</text>
<text x="164" y="300" font-size="12" fill="#e8eaed"></text>
<text x="796" y="318" font-size="12" fill="#e8eaed" text-anchor="end" font-weight="700">Operator → Drone:独立回路 —— 从不等视频</text>
<path d="M796 368 L172 368" fill="none" stroke="#4a4a4a" stroke-width="1.4" stroke-linejoin="round"/><path d="M164 368 L173 363.4 L173 372.6 Z" fill="#4a4a4a"/>
<rect x="240" y="324" width="76" height="28" rx="4" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="278" y="343" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="400">Command</text>
<rect x="400" y="324" width="76" height="28" rx="4" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="438" y="343" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="400">Command</text>
<rect x="520" y="324" width="58" height="28" rx="4" fill="#3a2c20" stroke="#e8833a" stroke-width="1.8"/>
<text x="549" y="343" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="700">Land</text>
<rect x="650" y="324" width="76" height="28" rx="4" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="688" y="343" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="400">Command</text>
<text x="549" y="388" font-size="12" fill="#9aa0a6" text-anchor="middle">与反向传输中的分段交错而过</text>
<rect x="16" y="410" width="300" height="74" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/>
<text x="30" y="434" font-size="12" fill="#4fb3ff" font-weight="700">分段</text>
<text x="30" y="454" font-size="12" fill="#e8eaed">一个命名的 Stream pack,[S(64_000_000)]:分块,</text>
<text x="30" y="472" font-size="12" fill="#e8eaed">事先不知长度,可在任意字节结束</text>
<rect x="328" y="410" width="300" height="74" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/>
<text x="342" y="434" font-size="12" fill="#4fb3ff" font-weight="700">源流</text>
<text x="342" y="454" font-size="12" fill="#e8eaed">没有尽头:分段接分段;切分点</text>
<text x="342" y="472" font-size="12" fill="#e8eaed">选在解码器可续播处(帧、GOP)</text>
<rect x="640" y="410" width="300" height="74" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/>
<text x="654" y="434" font-size="12" fill="#4fb3ff" font-weight="700">内存</text>
<text x="654" y="454" font-size="12" fill="#e8eaed">每条连接两个套接字缓冲区,</text>
<text x="654" y="472" font-size="12" fill="#e8eaed">无论飞多久</text>
<rect x="16" y="496" width="13" height="13" rx="3" fill="#26384d" stroke="#4fb3ff" stroke-width="1.4"/>
<text x="36" y="507" font-size="12" fill="#9aa0a6">视频字节与普通 pack</text>
<rect x="250" y="496" width="13" height="13" rx="3" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/>
<text x="270" y="507" font-size="12" fill="#9aa0a6">紧急 pack 与分段的提前结束</text>
</g>
</svg>
