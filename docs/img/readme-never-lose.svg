<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="title desc">
<title id="title">A client that never loses an order</title>
<desc id="desc">Socket 1, no network, socket 2: the session parks, orders sent offline are journalled, and after the login and reclaim every order arrives once, in order.</desc>
<rect width="980" height="500" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<defs><pattern id="gap" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#3a3a3a" stroke-width="2"/></pattern></defs>
<text x="24" y="34" font-size="18" fill="#e8eaed" font-weight="600">A client that never loses an order</text>
<rect x="110" y="88" width="290" height="304" rx="6" fill="#4fb3ff" fill-opacity="0.07"/>
<rect x="400" y="88" width="200" height="304" fill="url(#gap)"/>
