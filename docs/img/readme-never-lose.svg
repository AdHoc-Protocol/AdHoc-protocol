<text x="416" y="165" font-size="12" fill="#9aa0a6">journal</text>
<rect x="476" y="150" width="34" height="22" rx="3" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="493" y="165.5" font-size="12" fill="#9aa0a6" text-anchor="middle">41</text>
<rect x="513" y="150" width="34" height="22" rx="3" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/>
<text x="530" y="165.5" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">42</text>
<rect x="550" y="150" width="34" height="22" rx="3" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/>
<text x="567" y="165.5" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">43</text>
<text x="410" y="196" font-size="12" fill="#e8833a" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">43 sent offline: journalled</text>
<text x="410" y="212" font-size="12" fill="#9aa0a6" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">Location sent offline: dropped</text>
<text x="410" y="228" font-size="12" fill="#9aa0a6" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">41 is freed once acknowledged</text>
<rect x="406" y="246" width="188" height="128" rx="6" fill="#242424" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="416" y="265" font-size="12" fill="#e8eaed" font-weight="700">parked session</text>
<text x="416" y="282" font-size="12" fill="#e8eaed">actor still in Working</text>
<text x="416" y="298" font-size="12" fill="#e8eaed">your objects, its journal</text>
<text x="416" y="314" font-size="12" fill="#9aa0a6">no socket, no buffers</text>
<g data-nocheck="1"><circle cx="424" cy="335" r="7" fill="none" stroke="#9aa0a6" stroke-width="1.5"/><path d="M424 330.8 V335 H427.5" fill="none" stroke="#9aa0a6" stroke-width="1.5" stroke-linecap="round"/></g>
<text x="437" y="339" font-size="12" fill="#9aa0a6">waits up to (minutes)</text>
<text x="416" y="357" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8833a" xml:space="preserve">[Resumable(60 * 24)]</text>
<path d="M616 124 L644.8 293.1" fill="none" stroke="#e8eaed" stroke-width="1.8" stroke-linejoin="round"/><path d="M646 300 L640.7 292.8 L648.6 291.4 Z" fill="#e8eaed"/><rect x="585.5" y="186" width="85.6" height="20" rx="4" fill="#333536" stroke="#e8eaed" stroke-width="1.3"/><text data-ok="1" x="628.3" y="200.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Login(token)</text>
<rect x="650" y="312" width="106.4" height="22" rx="4" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/>
<text x="703.2" y="327.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">reclaim(token)</text>
<path d="M594 344 L642.4 325.2" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-dasharray="5 4" stroke-linejoin="round"/><path d="M648 323 L642.7 328.8 L640.2 322.3 Z" fill="#e8833a"/>
<text x="703.2" y="352" font-size="12" fill="#9aa0a6" text-anchor="middle">the parked session</text>
<text x="703.2" y="368" font-size="12" fill="#9aa0a6" text-anchor="middle">moves onto socket 2</text>
<rect x="764.4" y="313" width="53.6" height="20" rx="10" fill="#333536" stroke="#e8eaed" stroke-width="1.2"/><text x="791.2" y="327.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">resume</text>
<rect x="700" y="94" width="53.6" height="20" rx="10" fill="#333536" stroke="#e8eaed" stroke-width="1.2"/><text x="726.8" y="108.5" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">resume</text>
<path d="M748 300 L774.9 130.9" fill="none" stroke="#4fb3ff" stroke-width="1.8" stroke-linejoin="round"/><path d="M776 124 L778.7 132.5 L770.8 131.3 Z" fill="#4fb3ff"/><rect x="688.8" y="218" width="141.4" height="20" rx="4" fill="#1f3a52" stroke="#4fb3ff" stroke-width="1.3"/><text data-ok="1" x="759.5" y="232.3" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">CONTINUE (after 41)</text>
<text x="870" y="108" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="600">replayed from the journal</text>
<path d="M814 124 L840.9 293.1" fill="none" stroke="#e8833a" stroke-width="1.8" stroke-linejoin="round"/><path d="M842 300 L836.8 292.7 L844.7 291.5 Z" fill="#e8833a"/><rect x="793.2" y="186" width="64.4" height="20" rx="4" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/><text data-ok="1" x="825.5" y="200.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Order 42</text>
<path d="M884 124 L910.9 293.1" fill="none" stroke="#e8833a" stroke-width="1.8" stroke-linejoin="round"/><path d="M912 300 L906.8 292.7 L914.7 291.5 Z" fill="#e8833a"/><rect x="863.2" y="186" width="64.4" height="20" rx="4" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/><text data-ok="1" x="895.5" y="200.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">Order 43</text>
<path data-nocheck="1" d="M835 320 L837.9 323.1 L843.5 316.8" fill="none" stroke="#6cc08b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="848" y="324" font-size="12" fill="#6cc08b" font-weight="600">42</text>
<path data-nocheck="1" d="M905 320 L907.9 323.1 L913.5 316.8" fill="none" stroke="#6cc08b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="918" y="324" font-size="12" fill="#6cc08b" font-weight="600">43</text>
<text x="876" y="344" font-size="12" fill="#6cc08b" text-anchor="middle" font-weight="600">once, in order</text>
<line x1="24" y1="410" x2="956" y2="410" stroke="#4a4a4a" stroke-width="1"/>
<text x="24" y="436" font-size="13" fill="#e8833a" xml:space="preserve"><tspan fill="#e8833a">you declare: </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">[Resumable(...)]</tspan><tspan >, </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">Resumable&lt;App, App.Order&gt;</tspan></text>
<text x="24" y="456" font-size="13" fill="#e8833a">you write: one reclaim call in the login handler</text>
<text x="510" y="436" font-size="13" fill="#9aa0a6">not covered: a killed sender process → resume(null) → resync;</text>
<text x="510" y="456" font-size="13" fill="#9aa0a6">persist such orders as packs yourself</text>
</g>
</svg>
