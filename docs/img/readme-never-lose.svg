<path data-nocheck="1" d="M390.8 248.8 L401.2 259.2 M401.2 248.8 L390.8 259.2" stroke="#e06c6c" stroke-width="3.1" stroke-linecap="round"/>
<text x="384" y="280" font-size="12" fill="#e06c6c" text-anchor="end" font-weight="700" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">lost</text>
<text x="418" y="104" font-size="12" fill="#9aa0a6" font-weight="600" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">Location</text>
