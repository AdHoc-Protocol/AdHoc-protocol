<text x="567" y="104" font-size="12" fill="#e8833a" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round">Order 43</text>
<path d="M567 124 L567 143" fill="none" stroke="#e8833a" stroke-width="1.6" stroke-linejoin="round"/><path d="M567 149 L563.5 142 L570.5 142 Z" fill="#e8833a"/>
