<text x="500" y="80" font-size="12" fill="#9aa0a6" text-anchor="middle">no network</text>
<text x="610" y="80" font-size="12" fill="#9aa0a6">socket 2</text>
<text x="24" y="129" font-size="14" fill="#e8eaed" font-weight="600">App</text>
<text x="24" y="217" font-size="14" fill="#4fb3ff" font-weight="600">wire</text>
<text x="24" y="305" font-size="14" fill="#e8eaed" font-weight="600">Backend</text>
