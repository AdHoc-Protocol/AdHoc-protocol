<text x="212" y="336" font-size="12" fill="#4fb3ff">类型化:存储可读取、索引并按其过滤</text>
<text x="212" y="356" font-size="12" fill="#9aa0a6">blob:thumbnail 原样 · body 压缩 · secret 压缩并加密——一个对象,三种形态</text>
<text x="212" y="398" font-size="12.5" fill="#e8eaed">任何主机都可解码</text>
<text x="212" y="416" font-size="12.5" fill="#e8eaed">——前提是有 schema</text>
<text x="212" y="434" font-size="12.5" fill="#e8eaed">静态存储时最大</text>
<text x="464" y="398" font-size="12.5" fill="#e8eaed">由拥有 schema 和</text>
<text x="464" y="416" font-size="12.5" fill="#e8eaed">解压器的主机可解码</text>
<text x="464" y="434" font-size="12.5" fill="#e8eaed">更小:压缩一次</text>
<text x="716" y="398" font-size="12.5" fill="#e8eaed">只有生产者</text>
<text x="716" y="416" font-size="12.5" fill="#e8eaed">和消费者能解码——密钥</text>
<text x="716" y="434" font-size="12.5" fill="#e8833a">密封:存储无法读取</text>
<text x="24" y="398" font-size="12" fill="#e8eaed" font-weight="700">谁能读取</text>
<text x="24" y="416" font-size="12" fill="#e8eaed" font-weight="700">存储的 blob</text>
