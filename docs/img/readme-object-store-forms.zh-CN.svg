<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">AdHoc 存储保存什么:整个对象或其一部分——原样、压缩,或压缩并加密</title>
<desc id="desc">Three columns: as is ([Stream&lt;In, Out&gt;]), compressed ([Zstd, Stream&lt;In, Out&gt;]) and compressed and encrypted ([Zstd, AesCtr, Stream&lt;In, Out&gt;]). Row one, the whole object is one blob: a typed object_id beside the doc blob, drawn wide and striped as is, narrower when compressed, narrower and hatched with a lock when sealed. Row two, part of the object is a blob: one Record spans all three columns, with typed object_id, created and owner that the store reads, indexes and filters by, then a thumbnail kept as is, a body kept compressed and a secret kept compressed and encrypted. Under the columns: who can decode a stored blob - any host with the schema, a host with the schema and the decompressor, only the producer and the consumer who hold the key. A band at the bottom: every blob crosses as the same chunked stream, len data len data and a zero terminator, into your sink and out of your source, any size at constant memory, received equal to replayed byte for byte; the store runs no stage and holds no key in any column.</desc>
