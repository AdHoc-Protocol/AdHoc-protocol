<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500" role="img" aria-labelledby="title desc">
<title id="title">AdHoc Observer</title>
<desc id="desc">The AdHoc Observer at work. On the left, the description file MyProtocol.cs with its imports, and the command AdHocAgent .\MyProtocol.cs? with three badges: local, nothing uploaded, no UUID. A double arrow labeled WebSocket - AdHoc packs joins it to a browser window at localhost:4321; an orange arrow from the file to the browser reads save, redraw, and a blue arrow back reads open in your IDE. In the window: a sidebar with a search field, a tree of hosts, packs and connections, and a Save Diagram button; a canvas with the hosts Vehicle (C#), Fleet (Java) and VehicleLegacy (C#) as boxes listing their packs, joined by the connections Telemetry and TelemetryLegacy; a pop-up &quot;right-click a connection: its state machine&quot; showing the state Start with a loop labeled l: Position, Alarm; a pop-up &quot;left-click a pack: its fields&quot; listing Position: double lat, double lon, float speed; and a yellow sticker note. Three callouts below: save the file and the diagram follows, parse errors shown in the page; jump to the source, your IDE opens at line and character, set by show_code_exe and show_code_args; the output folder keeps the layout and the stickers, keyed by entity numbers, so renames keep the layout.</desc>
