<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 452" width="980" height="452" role="img" aria-labelledby="title desc">
<title id="title">One description, every host</title>
<desc id="desc">One description, from left to right. An orange card, MyProtocol.cs - one C# file declaring packs and fields, hosts and languages, connections, actors, states and branches, sessions and guaranteed packs, streams, chains and trims, virtual connections and ports. A grey AdHocAgent box compiles it with Roslyn, checks every AdHoc rule and writes the numbers tables; the first error stops the run and nothing is uploaded. A purple generator box, a cloud service, writes code for every host in each language and tests it. Three yellow host cards - Device in C#, Server in Java, Browser in TypeScript - each with the same Reading class, the same MIN, MAX and STR_LEN_MAX constants and the same state machine, and the same 15 bytes on the wire. A dashed path at the bottom leads from the description to the hosts for every later change: edit MyProtocol.cs, .cs~ names the hosts the edit reaches, regenerate, deploy with smart merge keeping your code.</desc>
