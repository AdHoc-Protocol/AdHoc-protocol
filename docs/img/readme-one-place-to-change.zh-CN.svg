<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
<title id="title">只需改一个地方</title>
<desc id="desc">One protocol change, two ways. Left, by hand: the change becomes edits in three repositories - device firmware in C#, a Java backend, a TypeScript browser client, each with its own encoder, decoder and states; two are edited, the third is missed and marked in red, and older devices already in the field are broken by the edit. Right, with AdHoc: one edit of MyProtocol.cs; AdHocAgent MyProtocol.cs~ reports the hosts that have to be updated - Device and Server - and those not reached - Browser and the frozen DeviceV1 - on a page and as JSON that a CI gate can use to refuse the edit; one regeneration produces code for Device and Server only, DeviceV1 stays untouched, and deployment keeps your code through smart merge after making a backup. Renaming or moving declarations changes nothing on the wire, because identities live in the numbers tables.</desc>
