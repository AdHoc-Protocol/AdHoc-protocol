<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" width="980" height="480" role="img" aria-labelledby="title desc">
<title id="title">One selection language, seven consumers</title>
<desc id="desc">Left: the parts of a Pack Set expression - a pack, a scope with @, a project scope, _&lt;...&gt;, X&lt;...&gt;, a named set, a filter template with KeepName, SkipName, KeepDoc and SkipDoc - combined as union, intersection and difference. Middle: AdHocAgent resolves ActiveOnly&lt;(Order, @Order)&gt; while it reads the description into the list Order, Order.Line, Order.Cancel, leaving out the legacy LineV1. Right: the same kind of expression feeds a branch, an RPC method, HeaderFor, FieldsInjectInto, Resumable, the UDP exclusion list and a host implementation group.</desc>
<rect width="980" height="480" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="24" y="40" width="310" height="400" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="40" y="66" font-size="14" fill="#e8eaed" font-weight="700">a Pack Set expression</text>
<rect x="40" y="81" width="49.8" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="96" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">Order</text>
<text x="101.8" y="96" font-size="12" fill="#e8eaed">a pack</text>
<rect x="40" y="113" width="56.9" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="128" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">@Order</text>
<text x="108.9" y="128" font-size="12" fill="#e8eaed">every pack nested in it</text>
<rect x="40" y="145" width="42.6" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="160" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">Shop</text>
<rect x="88.6" y="145" width="49.8" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="95.6" y="160" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">@Shop</text>
<text x="150.4" y="160" font-size="12" fill="#e8eaed">project: packs outside hosts</text>
<text x="150.4" y="176" font-size="12" fill="#9aa0a6">with @: all of them</text>
<rect x="40" y="193" width="78.4" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="208" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">_&lt;(A, B)&gt;</text>
<text x="130.4" y="208" font-size="12" fill="#e8eaed">a set written in place</text>
<rect x="40" y="225" width="42.6" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="240" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">X&lt;C&gt;</text>
<text x="94.6" y="240" font-size="12" fill="#e8eaed">minus - applied left to right</text>
<rect x="40" y="257" width="64.1" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="272" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">Reports</text>
<text x="116.1" y="272" font-size="12" fill="#e8eaed">a named Pack Set</text>
<rect x="40" y="289" width="121.3" height="22" rx="5" fill="#3d3520" stroke="#f2c14e" stroke-width="1.3"/>
<text x="47" y="304" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">ActiveOnly&lt;...&gt;</text>
<text x="173.3" y="304" font-size="12" fill="#e8eaed">a filter template</text>
<text x="52" y="326" font-size="12" fill="#9aa0a6">KeepName · SkipName: regex on the full path</text>
<text x="52" y="342" font-size="12" fill="#9aa0a6">KeepDoc · SkipDoc: regex on comments and tags</text>
<line x1="40" y1="360" x2="318" y2="360" stroke="#4a4a4a" stroke-width="1"/>
<text x="40" y="380" font-size="12" fill="#9aa0a6">sets combine as</text>
<text x="40" y="400" font-size="12" fill="#e8eaed">union</text>
<text x="132" y="400" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >a tuple  </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">(A, B)</tspan></text>
<text x="40" y="418" font-size="12" fill="#e8eaed">intersection</text>
<text x="132" y="418" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan >nesting  </tspan><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">F&lt;G&lt;@Shop&gt;&gt;</tspan></text>
<text x="40" y="436" font-size="12" fill="#e8eaed">difference</text>
<text x="132" y="436" font-size="12" fill="#9aa0a6" xml:space="preserve"><tspan fill="#f2c14e" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">X&lt;...&gt;</tspan><tspan >  around any part</tspan></text>
<text x="462" y="106" font-size="12" fill="#9aa0a6" text-anchor="middle">for example</text>
<text x="462" y="128" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">ActiveOnly&lt;(Order, @Order)&gt;</text>
