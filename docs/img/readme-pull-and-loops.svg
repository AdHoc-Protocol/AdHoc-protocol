<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 576" width="980" height="576" role="img" aria-labelledby="title desc">
<title id="title">Bytes pulled by the socket, two loops per connection</title>
<desc id="desc">Top: a timeline with lanes for your code, the sending queue, the transmitter, a 1024-byte send buffer and the socket. send(A) and send(B) only queue the packs; each time the socket has room, the transmitter refills the same buffer, stopping mid-field if need be, and each fill leaves as one chunk. Bottom: the receive loop and the transmit loop each handle packs and timeouts one at a time; state touched by both is the one place to coordinate.</desc>
