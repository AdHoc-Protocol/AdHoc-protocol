<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<defs><pattern id="pl-free" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="0" y2="6" stroke="#4a4a4a" stroke-width="2"/></pattern></defs>
<rect x="16" y="16" width="948" height="348" rx="10" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/>
