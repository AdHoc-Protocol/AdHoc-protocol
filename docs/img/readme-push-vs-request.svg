<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
<title id="title">Push versus polling</title>
<desc id="desc">Two timelines. Left, request/response: the client polls the server; the first poll finds nothing new, an event then happens on the server and waits, marked with an hourglass, until the next poll brings it back; the poll after that finds nothing new again. The alternative is a second channel with its own protocol and login. Right, one AdHoc connection between a device and a server: packs flow both ways, interleaved and colored by conversation - Login and Reading in Actor0, Note and Alert pushed by the server and a Flag sent by the device in the Notify function group, Job, Progress and Done of a stateful Work job, and a ping call with its Pong reply - on one socket with one login and no polling.</desc>
<rect width="960" height="420" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="16" y="16" width="448" height="388" rx="8" fill="#262626" stroke="#5a5a5a" stroke-width="1.4"/>
<text x="32" y="44" font-size="14" fill="#e8eaed" font-weight="700">request/response: the client must ask</text>
<rect x="60" y="60" width="80" height="26" rx="6" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1.4"/><text x="100" y="77.7" font-size="13" fill="#e8eaed" text-anchor="middle">client</text>
<rect x="300" y="60" width="80" height="26" rx="6" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1.4"/><text x="340" y="77.7" font-size="13" fill="#e8eaed" text-anchor="middle">server</text>
<line x1="100" y1="88" x2="100" y2="372" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="340" y1="88" x2="340" y2="372" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M101 110 L332 110" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linejoin="round"/><path d="M339 110 L331 114 L331 106 Z" fill="#8a8a8a"/>
<text x="220" y="104" font-size="12" fill="#c9ccd1" text-anchor="middle">poll</text>
<path d="M101 220 L332 220" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linejoin="round"/><path d="M339 220 L331 224 L331 216 Z" fill="#8a8a8a"/>
<text x="220" y="214" font-size="12" fill="#c9ccd1" text-anchor="middle">poll</text>
<path d="M101 330 L332 330" fill="none" stroke="#8a8a8a" stroke-width="1.6" stroke-linejoin="round"/><path d="M339 330 L331 334 L331 326 Z" fill="#8a8a8a"/>
<text x="220" y="324" font-size="12" fill="#c9ccd1" text-anchor="middle">poll</text>
<path d="M339 128 L108 128" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="4 3" stroke-linejoin="round"/><path d="M101 128 L109 124 L109 132 Z" fill="#9aa0a6"/>
<text x="220" y="143" font-size="12" fill="#9aa0a6" text-anchor="middle">nothing new</text>
<path d="M339 348 L108 348" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="4 3" stroke-linejoin="round"/><path d="M101 348 L109 344 L109 352 Z" fill="#9aa0a6"/>
<text x="220" y="363" font-size="12" fill="#9aa0a6" text-anchor="middle">nothing new</text>
<path d="M339 238 L109 238" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M101 238 L110 233.4 L110 242.6 Z" fill="#4fb3ff"/>
<text x="220" y="253" font-size="12" fill="#4fb3ff" text-anchor="middle">the event, at last</text>
<path d="M340 143 L347 150 L340 157 L333 150 Z" fill="#e06c6c"/>
<text x="368" y="154" font-size="12" fill="#e06c6c">event happens</text>
<path d="M349 150 H358 V238 H344" fill="none" stroke="#e06c6c" stroke-width="1.4" stroke-dasharray="4 3" stroke-linejoin="round"/>
<path d="M352 184 H364 L358 192 L364 200 H352 L358 192 Z" fill="#2b2b2b" stroke="#e06c6c" stroke-width="1.6" stroke-linejoin="round"/><path d="M355 198 H361 L358 195 Z" fill="#e06c6c"/>
<text x="370" y="189" font-size="12" fill="#e8eaed">waits for the</text>
<text x="370" y="205" font-size="12" fill="#e8eaed">next poll</text>
<text x="32" y="394" font-size="12" fill="#9aa0a6">the alternative: a second channel, with its own protocol and login</text>
<rect x="480" y="16" width="464" height="388" rx="8" fill="#262626" stroke="#5a5a5a" stroke-width="1.4"/>
<text x="496" y="44" font-size="14" fill="#e8eaed" font-weight="700">one AdHoc connection: both sides, any time</text>
<rect x="520" y="60" width="80" height="26" rx="6" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1.4"/><text x="560" y="77.7" font-size="13" fill="#e8eaed" text-anchor="middle">device</text>
<rect x="840" y="60" width="80" height="26" rx="6" fill="#3a3a3a" stroke="#8a8a8a" stroke-width="1.4"/><text x="880" y="77.7" font-size="13" fill="#e8eaed" text-anchor="middle">server</text>
<line x1="560" y1="88" x2="560" y2="330" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 4"/>
<line x1="880" y1="88" x2="880" y2="330" stroke="#5a5a5a" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M561 104 L872 104" fill="none" stroke="#8c9198" stroke-width="2" stroke-linejoin="round"/><path d="M879 104 L871 108.2 L871 99.8 Z" fill="#8c9198"/>
<text x="720" y="99" font-size="12" fill="#c9ccd1" text-anchor="middle">Login - Actor0</text>
<path d="M879 128 L568 128" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M561 128 L569 123.8 L569 132.2 Z" fill="#4fb3ff"/>
<text x="720" y="123" font-size="12" fill="#4fb3ff" text-anchor="middle">Note (pushed)</text>
<path d="M879 152 L568 152" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M561 152 L569 147.8 L569 156.2 Z" fill="#f2c14e"/>
<text x="720" y="147" font-size="12" fill="#f2c14e" text-anchor="middle">Job #1</text>
<path d="M561 176 L872 176" fill="none" stroke="#8c9198" stroke-width="2" stroke-linejoin="round"/><path d="M879 176 L871 180.2 L871 171.8 Z" fill="#8c9198"/>
<text x="720" y="171" font-size="12" fill="#c9ccd1" text-anchor="middle">Reading</text>
<path d="M561 200 L872 200" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M879 200 L871 204.2 L871 195.8 Z" fill="#f2c14e"/>
<text x="720" y="195" font-size="12" fill="#f2c14e" text-anchor="middle">Progress #1</text>
<path d="M879 224 L568 224" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M561 224 L569 219.8 L569 228.2 Z" fill="#4fb3ff"/>
<text x="720" y="219" font-size="12" fill="#4fb3ff" text-anchor="middle">Alert (pushed)</text>
<path d="M561 248 L872 248" fill="none" stroke="#a06fd0" stroke-width="2" stroke-linejoin="round"/><path d="M879 248 L871 252.2 L871 243.8 Z" fill="#a06fd0"/>
<text x="720" y="243" font-size="12" fill="#b98ae0" text-anchor="middle">ping</text>
<path d="M879 268 L568 268" fill="none" stroke="#a06fd0" stroke-width="2" stroke-linejoin="round"/><path d="M561 268 L569 263.8 L569 272.2 Z" fill="#a06fd0"/>
<text x="720" y="263" font-size="12" fill="#b98ae0" text-anchor="middle">Pong</text>
<path d="M561 292 L872 292" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M879 292 L871 296.2 L871 287.8 Z" fill="#4fb3ff"/>
<text x="720" y="287" font-size="12" fill="#4fb3ff" text-anchor="middle">Flag</text>
<path d="M561 316 L872 316" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M879 316 L871 320.2 L871 311.8 Z" fill="#f2c14e"/>
<text x="720" y="311" font-size="12" fill="#f2c14e" text-anchor="middle">Done #1</text>
<line x1="496" y1="348" x2="518" y2="348" stroke="#8c9198" stroke-width="2.2"/>
<text x="526" y="352" font-size="12" fill="#e8eaed">Actor0 - the connection's own</text>
<line x1="716" y1="348" x2="738" y2="348" stroke="#4fb3ff" stroke-width="2.2"/>
<text x="746" y="352" font-size="12" fill="#e8eaed">Notify - function group</text>
<line x1="496" y1="368" x2="518" y2="368" stroke="#f2c14e" stroke-width="2.2"/>
<text x="526" y="372" font-size="12" fill="#e8eaed">Work - a stateful job</text>
<line x1="716" y1="368" x2="738" y2="368" stroke="#a06fd0" stroke-width="2.2"/>
<text x="746" y="372" font-size="12" fill="#e8eaed">ping - RPC call</text>
<text x="496" y="394" font-size="12" fill="#e8eaed" font-weight="700">one socket, one login, no polling</text>
</g>
</svg>
