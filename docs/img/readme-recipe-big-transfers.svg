<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Files and OTA updates of any size: constant memory, the Update machine, resume after a drop or a reboot</title>
<desc id="desc">Top band: Fleet reads a 100 MB image.bin from disk in blocks into its socket buffer; a train of FirmwareChunk packs, each with an offset and up to 64 KiB of data, crosses the wire; on the vehicle each chunk's data is handed over as a window of the receive buffer and written straight to flash, with no 64 KiB array. A flat gauge on each host: one buffer per direction, whatever the size. Middle band: the Update state machine - FirmwareOffer from Fleet (sha256 32 bytes, signature 64 bytes) moves Start to Offered; Accept with from_offset from the vehicle moves it to Downloading, Decline ends it; FirmwareChunk from Fleet and Progress from the vehicle loop on Downloading, which has a 6-hour Deadline; Installed or Rejected from the vehicle ends it; MaxActiveInstances 1 allows one update at a time. Bottom band: a progress bar, one cell per chunk. At a lightning bolt the socket is lost and the backend parks the session; after reconnect, login and reclaim the vehicle names its position, and the two chunks it had not taken whole are replayed from the journal, once and in order. At a power symbol the vehicle reboots and its session is gone; an orange marker shows Accept with from_offset: the persisted offset continues the download in a new session.</desc>
