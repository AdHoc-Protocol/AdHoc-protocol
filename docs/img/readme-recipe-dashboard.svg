<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">One WebSocket between a TypeScript dashboard and a Java server carries three conversation shapes</title>
<desc id="desc">Notify, a function group: Note and Alert pushed by the server and Flag sent by the browser, served by one shared object on each host - nothing to acquire, track or release. getCpu, an RPC: the browser's caller instance moves Call, Return, End and holds the callback context; the server answers through a pooled context that is not registered; status is the same shape mirrored. Feed, up to 16 stateful subscriptions with Idle 120: each instance pair has its own address; Subscribe opens one, the server pushes Samples, renewals from the browser keep it alive; on the server an hourglass runs out when the browser stops renewing, and the server's own Samples do not count. One WebSocket dispatches by pack id and actor address; a server key seals every record (Noise NK, ChaCha20-Poly1305) and the browser pins it. No type strings, no correlation ids, no switch, no sweeper.</desc>
