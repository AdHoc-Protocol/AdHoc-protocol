<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
<title id="title">Fan-out subscriptions: the subscription instances themselves are the group lists</title>
<desc id="desc">The backend keeps Connection.Groups, a list of three groups - model X region Y, model X region Z, floor 3. Each group is a chain of Subscription instances linked through their own prev and next fields, with a lock at its head: the group is its own lock. A ConfigUpdate v42 enters the first group and walks its chain; from every member one pack goes into that vehicle's send queue, so a slow vehicle holds up nobody, and each vehicle has its own link. Three members leave by themselves: V4 slides out of the first group after its Unsubscribe ends the instance; V3 fades out of the second group when Idle 300 runs out because it stopped renewing; V6 drops out of the third group when its connection is lost. No subscriber map, no sweeper, join and leave in O(1) with no allocation, and Idle counts only what the vehicle sends.</desc>
