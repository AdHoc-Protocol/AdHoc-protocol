<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">Least-knowledge hosts: what a role may not send or parse is not in its generated code</title>
<desc id="desc">Centre: a matrix of hosts and packs. Rows are Guest in TypeScript, Staff in C# and Shop in Java; columns are Item, Price, Margin marked with a padlock, Browse, Login, Welcome and Denied, SetPrice. Filled cells mean the pack is generated in that host, dark cells mean it is not in its code: Guest has only Item, Price and Browse; Staff has everything except Browse; Shop has all of them. A purple funnel, SkipDoc with the padlock, keeps Margin off the guest link and points at the empty Guest Margin cell. Left: the states of StaffLink, Connects of Staff and Shop - Start allows only Login from Staff, Authorizing answers Welcome or Denied from Shop, Denied leads to Close, Welcome to Working, where Staff sends SetPrice and Shop sends the catalogue; a crossed-out SetPrice in Start is refused before it leaves, reported as DISCARDED_BYSTATE. Right: four guard rails - a pack the state does not allow is refused and reported; an unknown pack id drops the channel; one instance over MaxActiveInstances aborts the connection; a conduit above its S(N) cap raises an exception.</desc>
