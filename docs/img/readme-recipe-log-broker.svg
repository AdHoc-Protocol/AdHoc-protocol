<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" role="img" aria-labelledby="title desc">
<title id="title">A log broker that compresses once and fans out without recompressing</title>
<desc id="desc">A producer holds a typed Event with at, topic and body, compresses it once with Zstd and seals it with ChaCha20 for its link, key A. The broker, an endpoint on both legs, runs only the inverse cipher with key A and appends the compressed blob to an append-only log of bricks marked z - Zstd blobs, never an Event; no schema, no compressor, no Event code. On the way out it replays the same bytes, never decoded, sealed with each consumer's own key; four consumers each with their own key run the inverse cipher, then Zstd inverse, and get a typed Event. Below: the chain Zstd, Stream of FromProducer and FromBroker, ChaCha20 drawn as leaf, Zstd, an orange cut marker, ChaCha20, wire - the broker runs only what stands right of the cut, and left of the cut is the stored form, a Zstd blob. A ledger: per event, compress 1 at the producer, recompress 0 in the broker, decompress N at the consumers.</desc>
