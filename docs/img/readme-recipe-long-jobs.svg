<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
<title id="title">Long-running jobs: the Export actor, eight jobs per connection, deadlines and the epoch</title>
<desc id="desc">Left: the Export state machine, declared once and run by both hosts - Call, Return, Running, End. ExportRequest from the client moves Call to Return; ExportAccepted from the server moves Return to Running, ExportRejected moves Return to End; on Running the server reports ExportProgress and the client may send ExportCancel, both staying; ExportResult or ExportCancelled from the server ends it. Running carries Deadline 600. The server leads Running, the client may only ask. Right: one connection holds three job instance pairs, each with its own address and state, under a counter of 3 of 8 (MaxActiveInstances); the two jobs in Running have their own hourglasses at different levels. A ninth Acquire on this side returns null and sends nothing; a peer that opens a ninth has its connection aborted. Bottom: the race the epoch closes - the client's ExportCancel with epoch 2 crosses the server's ExportResult; the server instance is already released, so the cancel arrives for an unknown instance with an epoch other than 0 and is dropped, and the client simply receives the result.</desc>
