<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="title desc">
<title id="title">Regenerate as often as you like</title>
<desc id="desc">The regeneration loop, clockwise in five stations: 1, edit MyProtocol.cs, your description; 2, AdHocAgent .\MyProtocol.cs~ tells locally which hosts the edit reaches; 3, AdHocAgent .\MyProtocol.cs checks, uploads, and the generator generates and tests; 4, deployment: routes from MyProtocol.md, processing steps such as formatters, smart merge into your files, backup and restore scripts; 5, build and run your project, then back to editing. In the middle, an injection point of a generated file - #region&gt; Actor, your code, #endregion&gt; followed by the entity’s number - keyed by the number, so it survives regeneration and renames; an edited generated block is kept, with a todo note if the generator changed it. A red callout: a region with your code is gone, the deployment stops and asks Proceed with the merge? (y/N). A purple callout: the backup folder MyProtocol_5 with restore.bat, restore.ps1, restore.sh and .description, the description the code came from.</desc>
<rect width="960" height="480" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="18" fill="#e8833a" font-weight="600">Regenerate as often as you like - your code stays</text>
<rect x="40" y="64" width="250" height="66" rx="8" fill="#45301f" stroke="#e8833a" stroke-width="1.6"/>
<text x="165" y="92" font-size="14" fill="#e8eaed" text-anchor="middle">edit MyProtocol.cs</text>
<text x="165" y="112" font-size="12" fill="#9aa0a6" text-anchor="middle">your description</text>
<circle cx="42" cy="66" r="11" fill="#2b2b2b" stroke="#e8eaed" stroke-width="1.5"/>
<text data-ok="1" x="42" y="70.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">1</text>
<rect x="355" y="64" width="250" height="66" rx="8" fill="#1f3a2e" stroke="#4cc38a" stroke-width="1.6"/>
<text x="480" y="92" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="middle" xml:space="preserve">AdHocAgent .\MyProtocol.cs~</text>
<text x="480" y="112" font-size="12" fill="#9aa0a6" text-anchor="middle">which hosts the edit reaches · local</text>
<circle cx="357" cy="66" r="11" fill="#2b2b2b" stroke="#e8eaed" stroke-width="1.5"/>
<text data-ok="1" x="357" y="70.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">2</text>
<rect x="670" y="64" width="250" height="66" rx="8" fill="#3a321d" stroke="#f2c14e" stroke-width="1.6"/>
<text x="795" y="92" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" text-anchor="middle" xml:space="preserve">AdHocAgent .\MyProtocol.cs</text>
<text x="795" y="112" font-size="12" fill="#9aa0a6" text-anchor="middle">check · upload · generate · test</text>
<circle cx="672" cy="66" r="11" fill="#2b2b2b" stroke="#e8eaed" stroke-width="1.5"/>
<text data-ok="1" x="672" y="70.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">3</text>
<rect x="40" y="290" width="250" height="66" rx="8" fill="#303236" stroke="#4a4a4a" stroke-width="1.6"/>
<text x="165" y="318" font-size="14" fill="#e8eaed" text-anchor="middle">build and run your project</text>
<text x="165" y="338" font-size="12" fill="#9aa0a6" text-anchor="middle">gen + lib + your code</text>
<circle cx="42" cy="292" r="11" fill="#2b2b2b" stroke="#e8eaed" stroke-width="1.5"/>
<text data-ok="1" x="42" y="296.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">5</text>
<rect x="600" y="204" width="320" height="166" rx="8" fill="#26384d" stroke="#4fb3ff" stroke-width="1.6"/>
<circle cx="602" cy="206" r="11" fill="#2b2b2b" stroke="#e8eaed" stroke-width="1.5"/>
<text data-ok="1" x="602" y="210.3" font-size="12" fill="#e8eaed" text-anchor="middle" font-weight="600">4</text>
