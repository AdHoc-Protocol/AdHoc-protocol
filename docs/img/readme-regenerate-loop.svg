<text x="324" y="194" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve">    …</text>
<text x="324" y="210" font-size="12" fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" xml:space="preserve"><tspan fill="#9aa0a6">#endregion&gt; </tspan><tspan fill="#f2c14e">Āÿÿ</tspan><tspan fill="#9aa0a6">.Actor</tspan></text>
<line x1="322" y1="222" x2="568" y2="222" stroke="#4a4a4a" stroke-width="1"/>
