<text x="324" y="429" font-size="12" fill="#9aa0a6">restore.bat · restore.ps1 · restore.sh</text>
<text x="324" y="446" font-size="12" fill="#e8eaed" xml:space="preserve"><tspan fill="#e8eaed" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">.description/</tspan><tspan fill="#9aa0a6">  the source description</tspan></text>
