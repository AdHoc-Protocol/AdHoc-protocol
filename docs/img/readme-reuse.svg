<rect x="607.1" y="442" width="328.9" height="44" rx="12" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/>
<text x="619.1" y="461" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8833a" xml:space="preserve">Modify&lt;T&gt;</text>
<text x="619.1" y="478" font-size="12" fill="#9aa0a6">edit an imported pack, enum, constant set or host</text>
