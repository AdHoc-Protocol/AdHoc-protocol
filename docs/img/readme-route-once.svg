<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="title desc">
<title id="title">Routing once per socket</title>
<desc id="desc">Top, request/response: a row of requests, each opening with the same grey routing block - method, a path with a version segment, host - before its body; a handler serving v1 and v2 branches on the version. Bottom, AdHoc: a multiplexed port, Port : Multiplex&lt;(Link, LinkV1)&gt; on :443, reads one uid byte per socket and hands the socket to its connection - Device.uid to Link, DeviceV1.uid to the frozen LinkV1 - after which the socket carries packs only: Reading, Note, Job, Progress, Alert, Done on one, Reading after Reading on the other. A new generation is a new host and connection, with no version field and no version branch in any handler.</desc>
