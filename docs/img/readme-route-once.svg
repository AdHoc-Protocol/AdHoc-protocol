<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="16" fill="#e8eaed" font-weight="700">Routing: on every request, or once per socket</text>
<text x="24" y="86" font-size="13" fill="#e8eaed">request/response</text>
