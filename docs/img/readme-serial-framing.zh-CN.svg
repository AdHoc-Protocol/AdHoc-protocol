<path d="M338 349 L352 349" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M360 349 L351 353.6 L351 344.4 Z" fill="#4fb3ff"/>
<rect x="362" y="332" width="170" height="34" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/>
