<text x="472" y="454" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">Transmitter.Framing</text>
<path d="M562 449 L576 449" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M584 449 L575 453.6 L575 444.4 Z" fill="#4fb3ff"/>
<rect x="586" y="432" width="120" height="34" rx="6" fill="#30343a" stroke="#8c9198" stroke-width="1.4"/>
<text x="646" y="454" font-size="12.5" fill="#e8eaed" text-anchor="middle">UART 字节</text>
<text x="24" y="486" font-size="12" fill="#9aa0a6">帧标记、转义和 CRC 都就地写入同一缓冲区</text>
<text x="24" y="520" font-size="12" fill="#9aa0a6">C# 与 Java · 描述、Actor 和 pack 与 TCP 上相同——只有线路上的字节不同</text>
</g>
</svg>
