<path d="M532 349 L546 349" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M554 349 L545 353.6 L545 344.4 Z" fill="#4fb3ff"/>
<rect x="556" y="332" width="100" height="34" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/>
<text x="606" y="354" font-size="12.5" fill="#e8eaed" text-anchor="middle">CRC 闸门</text>
<path d="M656 349 L670 349" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M678 349 L669 353.6 L669 344.4 Z" fill="#4fb3ff"/>
<rect x="680" y="332" width="120" height="34" rx="6" fill="#3a2c20" stroke="#e8833a" stroke-width="1.4"/>
<text x="740" y="354" font-size="12.5" fill="#e8eaed" text-anchor="middle">OnReceived</text>
<text x="24" y="386" font-size="12" fill="#9aa0a6">就地反转义 · 字节到达即逐字段解码 · 仅当 CRC 匹配时才运行处理器</text>
<text x="24" y="420" font-size="12.5" fill="#e8eaed" font-weight="700">发送</text>
