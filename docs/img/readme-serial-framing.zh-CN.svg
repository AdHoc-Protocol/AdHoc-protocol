<text x="37" y="216" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">FF</text>
<rect x="53" y="196" width="171" height="30" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="138.5" y="216" font-size="12.5" fill="#e8eaed" text-anchor="middle">Status</text>
<text x="138.5" y="244" font-size="12" fill="#7cc47c" text-anchor="middle">CRC 通过：已分发</text>
<rect x="236" y="196" width="26" height="30" rx="2" fill="#3d3520" stroke="#f2c14e" stroke-width="1.2"/>
<text x="249" y="216" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">FF</text>
<rect x="265" y="196" width="201" height="30" rx="2" fill="#4a2626" stroke="#e06c6c" stroke-width="1.2"/>
<text x="365.5" y="216" font-size="12.5" fill="#e8eaed" text-anchor="middle">Command</text>
<path d="M356 186 l-8 16 h7 l-6 16 l16 -20 h-8 l6 -12 Z" fill="#e06c6c"/>
<text x="365.5" y="244" font-size="12" fill="#e06c6c" text-anchor="middle">CRC_ERROR：已丢弃</text>
<rect x="498" y="196" width="26" height="30" rx="2" fill="#3d3520" stroke="#f2c14e" stroke-width="1.2"/>
<text x="511" y="216" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">FF</text>
<rect x="527" y="196" width="151" height="30" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="602.5" y="216" font-size="12.5" fill="#e8eaed" text-anchor="middle">Status</text>
<text x="602.5" y="244" font-size="12" fill="#7cc47c" text-anchor="middle">CRC 通过：已分发</text>
<rect x="710" y="196" width="26" height="30" rx="2" fill="#3d3520" stroke="#f2c14e" stroke-width="1.2"/>
<text x="723" y="216" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve">FF</text>
<rect x="739" y="196" width="191" height="30" rx="2" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text x="834.5" y="216" font-size="12.5" fill="#e8eaed" text-anchor="middle">Alarm</text>
<text x="834.5" y="244" font-size="12" fill="#7cc47c" text-anchor="middle">CRC 通过：已分发</text>
<path d="M466 234 C 480 234, 486 234, 498 228" stroke="#e06c6c" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
<text x="478" y="286" font-size="12" fill="#9aa0a6" text-anchor="middle">跳到下一个 FF——下一个 pack 完整到达</text>
<text x="24" y="320" font-size="12.5" fill="#e8eaed" font-weight="700">接收</text>
<rect x="24" y="332" width="120" height="34" rx="6" fill="#30343a" stroke="#8c9198" stroke-width="1.4"/>
<text x="84" y="354" font-size="12.5" fill="#e8eaed" text-anchor="middle">UART 字节</text>
