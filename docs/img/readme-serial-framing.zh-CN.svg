<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540" role="img" aria-labelledby="title desc">
<title id="title">能在损坏字节后自行恢复的串行线路</title>
<desc id="desc">Top: one frame per pack - the mark FF, the pack id and fields as on any connection, an escaped 7F where a byte 0x7F or 0xFF occurred (the escape costs one bit: the top bit moves on), and a 2-byte CRC-16. Middle: on the line, frames Status, Command, Status and Alarm, each starting with FF; a lightning bolt damages a byte of Command: CRC_ERROR, dropped; the receiver skips to the next FF and the next Status arrives intact, CRC ok, dispatched. Bottom: receiving goes UART bytes, Receiver.Framing, the generated receiver, a CRC gate, OnReceived - unescaped in place, decoded field by field as the bytes come, handlers run only when the CRC matches; sending goes send(pack), the generated transmitter, Transmitter.Framing, UART bytes - FF, escaping and CRC written in place in the same buffer. C# and Java; the description, actors and packs are the same as on TCP.</desc>
<rect width="980" height="540" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">能在损坏字节后自行恢复的串行线路</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">生成的连接与 UART、RS-485 或无线电调制解调器之间的 Receiver.Framing 和 Transmitter.Framing</text>
<text x="24" y="84" font-size="12.5" fill="#e8eaed" font-weight="700">每个 pack 一帧</text>
<rect x="24" y="94" width="40" height="32" rx="3" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/>
<text x="44" y="115" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">FF</text>
<text x="44" y="144" font-size="12" fill="#9aa0a6" text-anchor="middle">帧标记</text>
<rect x="67" y="94" width="40" height="32" rx="3" fill="#1f3b52" stroke="#4fb3ff" stroke-width="1.4"/>
<text x="87" y="115" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">id</text>
<rect x="110" y="94" width="200" height="32" rx="3" fill="#26384d" stroke="#4fb3ff" stroke-width="1.4"/>
<text x="210" y="115" font-size="12.5" fill="#e8eaed" text-anchor="middle">字段 …</text>
<text x="210" y="144" font-size="12" fill="#9aa0a6" text-anchor="middle">pack 本体，与任何连接相同</text>
<rect x="313" y="94" width="40" height="32" rx="3" fill="#33261d" stroke="#e8833a" stroke-width="1.4"/>
<text x="333" y="115" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">7F</text>
<rect x="356" y="94" width="150" height="32" rx="3" fill="#26384d" stroke="#4fb3ff" stroke-width="1.4"/>
<text x="431" y="115" font-size="12.5" fill="#e8eaed" text-anchor="middle">字段 …</text>
<rect x="509" y="94" width="90" height="32" rx="3" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/>
<text x="554" y="115" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#e8eaed" text-anchor="middle" xml:space="preserve">CRC-16</text>
<text x="554" y="144" font-size="12" fill="#9aa0a6" text-anchor="middle">2 字节</text>
<text x="616" y="106" font-size="12" fill="#e8833a">内部出现 0x7F 或 0xFF 字节时：写作 7F，</text>
<text x="616" y="124" font-size="12" fill="#e8833a">其最高位顺延——一次转义只耗 1 位</text>
<text x="24" y="182" font-size="12.5" fill="#e8eaed" font-weight="700">在线路上</text>
<path d="M24 254 L948 254" fill="none" stroke="#4a4a4a" stroke-width="1.4" stroke-linejoin="round"/><path d="M956 254 L947 258.6 L947 249.4 Z" fill="#4a4a4a"/>
<text x="952" y="270" font-size="12" fill="#9aa0a6" text-anchor="end">时间</text>
