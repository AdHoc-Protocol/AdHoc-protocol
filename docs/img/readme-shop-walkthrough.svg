<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" role="img" aria-labelledby="title desc">
<title id="title">What the Shop description becomes: three hosts, one state machine, an RPC, and a session that outlives its socket</title>
<desc id="desc">Left: the Shop description, condensed, as an orange code card with seven numbered markers: 1 struct Client : Host, generated in TypeScript and C#; 2 struct Server : Host, generated in Java; 3 class Order with [MinMax(1, 100)] byte quantity; 4 [Resumable(30)] on interface Link : Connects&lt;Client, Server&gt;; 5 the state Start with [L____________&lt;Shopping, Client.Login&gt;] and the state Shopping; 6 the RPC line (L____________, Pong) ping(Ping req); 7 interface Orders : Resumable&lt;Client, Client.Order&gt;. Right, top: three yellow host cards - Client in TypeScript, Client in C#, Server in Java - each with the packs, the Link connection, its state machine and the ping actor. Middle: one state machine, generated into both hosts: from Start, Login sent by the client leads to Shopping; in Shopping, Order from the client and Welcome and Accepted from the server keep the state; anything else is refused before it is sent. Beside it the ping actor, one per call from a pool: Call, Ping, Return, Pong, End; the reply reaches the caller. Below: an Order without a note on the wire - the id, item in 8 bytes, quantity in one byte using 7 bits, one byte of null bits: 10 bytes after the id, no names, no tags; an absent note costs 1 bit. Bottom: a timeline. On socket 1 orders O1 and O2 arrive and O3 is lost in flight; the session is parked for up to 30 minutes with its actors, states, your objects and the journal; on socket 2 the client logs in with its session id, the server calls reclaim, the conversation is in Shopping again, and O3 is replayed once. The server’s code sees O1, O2, O3, once each, in order.</desc>
