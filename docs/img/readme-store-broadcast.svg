<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="title desc">
<title id="title">Receive, store and broadcast in one pass</title>
<desc id="desc">A Source sends packs on a guaranteed leg into the Monitoring host. In one pass over the receive buffer, the decoder calls your setters, which put the values straight into the database command parameters, and the consumed bytes are captured once into a pooled BytesCopy.InMemory holding the pack body with three references. After the insert in OnReceived, Broadcast(receiver) queues the one capture on every subscriber; each subscriber transmitter copies it with its own cursor to Observer 1 to 3; Observer 4 has a full queue: it misses this event, stays subscribed and nobody waits. No subscriber means no capture; the pack is never encoded again. A timeline: pack arrives, decode and capture, OnReceived insert, Broadcast, each subscriber sends, the last one returns the capture to the pool. Store, then forward.</desc>
