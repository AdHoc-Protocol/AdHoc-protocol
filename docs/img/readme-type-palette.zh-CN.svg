<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 576" width="980" height="576" role="img" aria-labelledby="title desc">
<title id="title">字段在线路上的开销</title>
<desc id="desc">Sixteen cards, each a kind of field value with its declaration and its cost on the wire: flag, number in a range, optional value, enum, text, fixed-size raw bytes, list, map and set, nested pack, one of several, event, moment, moment in a range, duration, a stream of any size, and constants and attributes that never travel.</desc>
<rect width="980" height="576" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,Microsoft YaHei,PingFang SC,Noto Sans CJK SC,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="34" font-size="16" fill="#e8eaed" font-weight="700">字段在线路上的开销</text>
<text x="956" y="34" font-size="12" fill="#9aa0a6" text-anchor="end">每种尺寸都有声明的最大值</text>
<rect x="16" y="50" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="30" y="74" font-size="14" fill="#e8eaed" font-weight="700">标志位</text>
<text x="30" y="97" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">bool on;</text>
<text x="30" y="118" font-size="12" fill="#9aa0a6">bool? 占 2 位</text>
<text x="30" y="146" font-size="14" fill="#4fb3ff">1 位</text>
<rect x="256" y="50" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="270" y="74" font-size="14" fill="#e8eaed" font-weight="700">范围内数值</text>
<text x="270" y="97" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[MinMax(-40, 125)] short t;</text>
<text x="270" y="118" font-size="12" fill="#9aa0a6">-40 … 125:166 个值</text>
<text x="270" y="146" font-size="14" fill="#4fb3ff">1 字节</text>
<rect x="496" y="50" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="510" y="74" font-size="14" fill="#e8eaed" font-weight="700">可选值</text>
<text x="510" y="97" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">uint? retries;</text>
<text x="510" y="118" font-size="12" fill="#9aa0a6">存在时：该位 + 4 字节</text>
<text x="510" y="146" font-size="14" fill="#4fb3ff">缺失：1 位</text>
<rect x="736" y="50" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="750" y="74" font-size="14" fill="#e8eaed" font-weight="700">枚举</text>
<text x="750" y="97" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">Payment payment;</text>
<text x="750" y="118" font-size="12" fill="#9aa0a6">Card, Cash, Voucher</text>
<text x="750" y="146" font-size="14" fill="#4fb3ff">2 位编码</text>
<rect x="16" y="172" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="30" y="196" font-size="14" fill="#e8eaed" font-weight="700">文本</text>
<text x="30" y="219" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[D(+64)] string note;</text>
<text x="30" y="240" font-size="12" fill="#9aa0a6">UTF-16 码元</text>
<text x="30" y="268" font-size="14" fill="#4fb3ff">计数 + 每字符 1-3 B</text>
<rect x="164" y="181" width="70" height="20" rx="10" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/><text x="199" y="195.3" font-size="12" fill="#e8833a" text-anchor="middle">≤ 64 字符</text>
<rect x="256" y="172" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="270" y="196" font-size="14" fill="#e8eaed" font-weight="700">定长原始字节</text>
<text x="270" y="219" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[D(32)] Binary[] signature;</text>
<text x="270" y="240" font-size="12" fill="#9aa0a6">固定长度</text>
<text x="270" y="268" font-size="14" fill="#4fb3ff">32 字节，无长度</text>
<rect x="496" y="172" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="510" y="196" font-size="14" fill="#e8eaed" font-weight="700">列表</text>
<text x="510" y="219" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[D(100)] Item[,,] items;</text>
<text x="510" y="240" font-size="12" fill="#9aa0a6">元素是 pack</text>
<text x="510" y="268" font-size="14" fill="#4fb3ff">1 字节长度 + 元素</text>
<rect x="668" y="181" width="46" height="20" rx="10" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/><text x="691" y="195.3" font-size="12" fill="#e8833a" text-anchor="middle">≤ 100</text>
<rect x="736" y="172" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="750" y="196" font-size="14" fill="#e8eaed" font-weight="700">映射、集合</text>
<text x="750" y="219" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[D(+16)] Set&lt;uint&gt; ids;</text>
<text x="750" y="240" font-size="12" fill="#9aa0a6">Map&lt;K, V&gt; 相同</text>
<text x="750" y="268" font-size="14" fill="#4fb3ff">计数 + 元素</text>
<rect x="914" y="181" width="40" height="20" rx="10" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/><text x="934" y="195.3" font-size="12" fill="#e8833a" text-anchor="middle">≤ 16</text>
<rect x="16" y="294" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="30" y="318" font-size="14" fill="#e8eaed" font-weight="700">嵌套 pack</text>
<text x="30" y="341" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">Item item;</text>
<text x="30" y="362" font-size="12" fill="#9aa0a6">pack 作为字段</text>
<text x="30" y="390" font-size="14" fill="#4fb3ff">就地嵌入，无 pack id</text>
<rect x="256" y="294" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="270" y="318" font-size="14" fill="#e8eaed" font-weight="700">多选一</text>
<text x="270" y="341" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">string? text; ulong? amount;</text>
<text x="270" y="362" font-size="12" fill="#9aa0a6">全可选字段的 pack</text>
<text x="270" y="390" font-size="14" fill="#4fb3ff">每个未设的占 1 位</text>
<rect x="496" y="294" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="510" y="318" font-size="14" fill="#e8eaed" font-weight="700">事件</text>
<text x="510" y="341" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">class Shipped { }</text>
<text x="510" y="362" font-size="12" fill="#9aa0a6">分支发出的空 pack</text>
<text x="510" y="390" font-size="14" fill="#4fb3ff">只有 pack id</text>
<rect x="736" y="294" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="750" y="318" font-size="14" fill="#e8eaed" font-weight="700">时刻</text>
<text x="750" y="341" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">DateTime placed;</text>
<text x="750" y="362" font-size="12" fill="#9aa0a6">自 1970 起的毫秒</text>
<text x="750" y="390" font-size="14" fill="#4fb3ff">6 字节</text>
<rect x="16" y="416" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="30" y="440" font-size="14" fill="#e8eaed" font-weight="700">范围内时刻</text>
<text x="30" y="463" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">Seconds50Years joined;</text>
<text x="30" y="484" font-size="12" fill="#9aa0a6">DateTimeDef: 2000-2050, 1 s</text>
<text x="30" y="512" font-size="14" fill="#4fb3ff">4 字节</text>
<rect x="256" y="416" width="228" height="112" rx="8" fill="#333436" stroke="#4a4a4a" stroke-width="1.4"/>
<text x="270" y="440" font-size="14" fill="#e8eaed" font-weight="700">时长</text>
<text x="270" y="463" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">RequestLatency latency;</text>
<text x="270" y="484" font-size="12" fill="#9aa0a6">Duration: ≤ 30 000 × 19 ms</text>
<text x="270" y="512" font-size="14" fill="#4fb3ff">2 字节</text>
<rect x="496" y="416" width="228" height="112" rx="8" fill="#333436" stroke="#a06fd0" stroke-width="1.6"/>
<text x="510" y="440" font-size="14" fill="#e8eaed" font-weight="700">任意大小的字节</text>
<text x="510" y="463" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[S(500_000_000)] Stream v;</text>
<text x="510" y="484" font-size="12" fill="#9aa0a6">分块，随数据源结束</text>
<text x="510" y="512" font-size="14" fill="#4fb3ff">内存恒定</text>
<rect x="624" y="425" width="90" height="20" rx="10" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/><text x="669" y="439.3" font-size="12" fill="#e8833a" text-anchor="middle">两侧都有上限</text>
<rect x="736" y="416" width="228" height="112" rx="8" fill="#2e2f30" stroke="#9aa0a6" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="750" y="440" font-size="14" fill="#e8eaed" font-weight="700">从不上线路</text>
<text x="750" y="463" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">const byte MAX = 100;</text>
<text x="750" y="482" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve">[Retention(30)]</text>
<text x="750" y="512" font-size="14" fill="#9aa0a6">0 字节：编译进代码</text>
<rect x="910" y="425" width="44" height="20" rx="5" fill="#26384d" stroke="#4fb3ff" stroke-width="1.2"/>
<text data-ok="1" x="932" y="439.3" font-size="12" fill="#4fb3ff" text-anchor="middle">线路</text>
<g data-nocheck="1"><line x1="907" y1="442" x2="957" y2="428" stroke="#e8833a" stroke-width="1.8"/></g>
<text x="24" y="556" font-size="12" fill="#4fb3ff">1 字节</text>
<text x="66" y="556" font-size="12" fill="#9aa0a6">实际传输的</text>
<rect x="154" y="545" width="26" height="14" rx="7" fill="#3a2c20" stroke="#e8833a" stroke-width="1.3"/>
<text x="186" y="556" font-size="12" fill="#9aa0a6">声明的最大值</text>
<rect x="311" y="545" width="26" height="14" rx="3" fill="none" stroke="#9aa0a6" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="343" y="556" font-size="12" fill="#9aa0a6">从不传输：编译进每个主机</text>
<rect x="571" y="545" width="26" height="14" rx="3" fill="#333436" stroke="#a06fd0" stroke-width="1.5"/>
<text x="603" y="556" font-size="12" fill="#9aa0a6">管道：字节流过，从不停留</text>
</g>
</svg>
