<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 484" width="960" height="484" role="img" aria-labelledby="title desc">
<title id="title">[UDP&lt;Volatile&gt;(30)]: a lost datagram, replayed</title>
<desc id="desc">UDP with every pack guaranteed except the Volatile ones, as a sequence from a Client to a Server. Datagram 41 carries Input 101 and a Position; datagram 42, with Input 102 and a Position, is lost; datagram 43 carries Input 103. The Inputs are copied into the sender journal, the Positions are not. The receiver sees the gap from the datagram numbers and asks to continue from its position, in the datagram header; the sender replays Input 102 and Input 103 from its journal. The lost Position is not replayed: the next one replaces it. The receiving code sees Input 101, 102 and 103 once, in order. A strip shows the 9-byte datagram header: flags 1 byte, connection id 4, series 1, datagram number 3.</desc>
