<text x="480" y="322" font-size="12" fill="#9aa0a6" text-anchor="middle">携带在数据报头部中</text>
<path d="M146 354 L782 354" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M790 354 L781 358.6 L781 349.4 Z" fill="#f2c14e"/>
<text x="480" y="348" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed" font-weight="600">Input 102</tspan><tspan fill="#f2c14e">——已重放</tspan></text>
<path d="M146 386 L782 386" fill="none" stroke="#f2c14e" stroke-width="2" stroke-linejoin="round"/><path d="M790 386 L781 390.6 L781 381.4 Z" fill="#f2c14e"/>
<text x="480" y="380" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#e8eaed" font-weight="600">Input 103</tspan><tspan fill="#f2c14e">——已重放</tspan></text>
