<rect x="338" y="192" width="64" height="20" rx="4" fill="#2e2e2e" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="3 2"/><text x="370" y="206.5" font-size="12" fill="#9aa0a6" text-anchor="middle">Position</text>
<g data-nocheck="1"><path d="M170 252 L782 252" fill="none" stroke="#4fb3ff" stroke-width="2" stroke-linejoin="round"/><path d="M790 252 L781 256.6 L781 247.4 Z" fill="#4fb3ff"/></g>
<rect x="214" y="237" width="126" height="30" rx="6" fill="#203d56" stroke="#4fb3ff" stroke-width="1.4"/>
<text x="224" y="256.5" font-size="12" fill="#4fb3ff" font-weight="700">#43</text>
<rect x="256" y="242" width="76" height="20" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.3"/><text x="294" y="256.5" font-size="12" fill="#e8eaed" text-anchor="middle">Input 103</text>
<text x="334" y="230" font-size="12" fill="#9aa0a6">不重放——下一个 Position 会取代它</text>
<text x="778" y="280" font-size="12" fill="#a06fd0" text-anchor="end">缺口：#42 缺失——从数据报编号可见</text>
