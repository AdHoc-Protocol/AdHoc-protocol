<text x="426" y="431" font-size="12" fill="#e8eaed" text-anchor="middle">序列 1 B</text>
<rect x="462" y="414" width="134" height="26" rx="0" fill="#203d56" stroke="#4fb3ff" stroke-width="1.3"/>
<text x="529" y="431" font-size="12" fill="#e8eaed" text-anchor="middle">数据报编号 3 B</text>
<rect x="602" y="414" width="150" height="26" rx="4" fill="none" stroke="#9aa0a6" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="677" y="431" font-size="12" fill="#9aa0a6" text-anchor="middle">流数据（pack）</text>
<text x="480" y="466" font-size="13" fill="#9aa0a6" text-anchor="middle">在 TCP 上你选择不能丢失的 pack；在 UDP 上你选择可以丢失的。除 TypeScript 和 Dart 外的所有运行时。</text>
