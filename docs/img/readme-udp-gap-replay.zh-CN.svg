<line x1="134" y1="202" x2="166" y2="202" stroke="#f2c14e" stroke-width="1.1" stroke-dasharray="2 3"/>
<rect x="36" y="242" width="98" height="20" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.3"/><text x="85" y="256.5" font-size="12" fill="#e8eaed" text-anchor="middle">Input 103</text>
<line x1="134" y1="252" x2="166" y2="252" stroke="#f2c14e" stroke-width="1.1" stroke-dasharray="2 3"/>
<text x="36" y="290" font-size="12" fill="#9aa0a6">Position 不记入</text>
