<text x="830" y="156" font-size="12" fill="#9aa0a6">你的代码看到</text>
<rect x="830" y="172" width="98" height="20" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.3"/><text x="879" y="186.5" font-size="12" fill="#e8eaed" text-anchor="middle">Input 101</text>
<rect x="830" y="200" width="98" height="20" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.3"/><text x="879" y="214.5" font-size="12" fill="#e8eaed" text-anchor="middle">Input 102</text>
<rect x="830" y="228" width="98" height="20" rx="4" fill="#46401f" stroke="#f2c14e" stroke-width="1.3"/><text x="879" y="242.5" font-size="12" fill="#e8eaed" text-anchor="middle">Input 103</text>
<text x="830" y="282" font-size="12" fill="#e8eaed">各一次，</text>
<text x="830" y="297" font-size="12" fill="#e8eaed">按序</text>
<line x1="830" y1="311" x2="928" y2="311" stroke="#4a4a4a" stroke-width="1"/>
<text x="830" y="330" font-size="12" fill="#9aa0a6">#41 的 Position，</text>
