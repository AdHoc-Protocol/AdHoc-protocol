<text x="544" y="322" font-size="12" fill="#9aa0a6" text-anchor="middle">the next one replaces it - no replay</text>
<text x="24" y="368" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="14" fill="#e8833a" font-weight="700" xml:space="preserve">[UDP&lt;Volatile&gt;(30)]</text>
<text x="24" y="390" font-size="12" fill="#9aa0a6">on TCP you name the packs that must not be lost; on UDP, the ones that may be</text>
<text x="24" y="420" font-size="12" fill="#e8eaed" xml:space="preserve"><tspan >Position</tspan><tspan fill="#9aa0a6"> is </tspan><tspan font-family="Consolas,DejaVu Sans Mono,Menlo,monospace">PlayerPosition { float x; float y; }</tspan><tspan fill="#9aa0a6"> - 64 bits, one number: a Value Pack</tspan></text>
<rect x="604" y="340" width="352" height="96" rx="6" fill="#242424" stroke="#4a4a4a" stroke-width="1.3"/>
<text x="618" y="361" font-size="12" fill="#e8eaed" font-weight="700">UDP host settings</text>
<text x="618" y="380" font-size="12" fill="#e8eaed">keepalive 15 s (NAT) · idle 30 s · mtu 1200 bytes</text>
<text x="618" y="398" font-size="12" fill="#e8eaed">window 256 KiB · congestion control on</text>
<text x="618" y="416" font-size="12" fill="#e8eaed">X25519 key → every datagram encrypted and</text>
<text x="618" y="432" font-size="12" fill="#e8eaed">authenticated (a 16-byte tag)</text>
