<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="title desc">
<title id="title">A Value Pack is a number, not an object</title>
<desc id="desc">Left: an ordinary pack Point3 with three floats, 96 bits; an array of them holds a reference per item, each pointing to a separate object with a header and the fields x, y, z: allocation, a header and a pointer to chase per item. Right: a Value Pack Position with a float x, a byte layer and a byte flags, 48 bits; an array of them is an array of 64-bit numbers, each holding x, layer and flags in fixed slots with 16 bits unused: no object, no pointer, copied by value. Bottom: the same Value Pack in three languages with the same bytes on the wire, the pack id and 6 bytes: C# partial struct Position over a ulong Value with a property per field; Java @Position long with static get, set and New and no object ever; TypeScript type Position = number, a class only above 53 bits.</desc>
<rect width="960" height="500" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="24" y="36" font-size="16" fill="#e8eaed" font-weight="700">A Value Pack is a number, not an object</text>
<text x="24" y="56" font-size="12" fill="#9aa0a6">a pack whose fields fit in 64 bits - recognized by the generator, no marker to write</text>
<rect x="16" y="76" width="452" height="270" rx="8" fill="#262626" stroke="#4a4a4a" stroke-width="1.2"/>
