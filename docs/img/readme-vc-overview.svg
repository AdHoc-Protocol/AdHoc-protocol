<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520" role="img" aria-labelledby="title desc">
<title id="title">A virtual connection through two relays</title>
<desc id="desc">Four hosts in a row: Viewer, a browser in TypeScript; Edge, a public gateway in Java; Hub, an internal router in Java; Server, private, in Java. Physical legs: WebSocket from Viewer to Edge, TCP from Edge to Hub and from Hub to Server. Edge and Hub each run a generated Relay. A dashed purple arc above joins Viewer and Server: ViewerToServer, one connection end to end, with the same actors, state machines, RPC and sessions as on a direct link; the endpoints hold actors, states, packs and the Zstd plus ChaCha20 chain. Below, every physical leg carries sealed chunks of many tunnels, each chunk led by a tunnel id - one byte for MaxTunnels 256 - followed by bytes the relay never decodes. Facts: the relay holds no schema and no keys, one region of memory for any payload size; a protocol change rebuilds the two endpoints and the relays stay; a chain on the connection runs at its two ends only, ChaCha20 conceals and a MAC adds integrity.</desc>
