<rect x="686.8" y="176" width="28" height="18" rx="4" fill="#3a2f4c" stroke="#a06fd0" stroke-width="1.3"/>
<path d="M698.5 183.6 V181.5 A2.3 2.3 0 0 1 703 181.5 V183.6" stroke="#a06fd0" stroke-width="1.2349999999999999" fill="none"/><rect x="697" y="183.6" width="7.6" height="5.7" rx="1" fill="#a06fd0"/>
<rect x="722.3" y="176" width="28" height="18" rx="4" fill="#3a2f4c" stroke="#a06fd0" stroke-width="1.3"/>
<path d="M734 183.6 V181.5 A2.3 2.3 0 0 1 738.5 181.5 V183.6" stroke="#a06fd0" stroke-width="1.2349999999999999" fill="none"/><rect x="732.5" y="183.6" width="7.6" height="5.7" rx="1" fill="#a06fd0"/>
<text x="109" y="244" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">[Zstd(6), ChaCha20]</text>
<text x="109" y="262" font-size="12" fill="#9aa0a6" text-anchor="middle">compress, then encrypt - once</text>
<text x="851" y="244" font-size="12" fill="#9aa0a6" text-anchor="middle">the inverse chain</text>
<text x="851" y="262" font-size="12" fill="#9aa0a6" text-anchor="middle">decrypt, then decompress</text>
<text x="480" y="274" font-size="12" fill="#a06fd0" text-anchor="middle">forwards sealed chunks it cannot read</text>
<text x="480" y="292" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">frame: [wire id][tunnel_id][len][data]…[0]</text>
<text x="480" y="310" font-size="12" fill="#9aa0a6" text-anchor="middle">up to MaxTunnels (256) tunnels on one link</text>
<text x="480" y="348" font-size="14" fill="#e8eaed" text-anchor="middle">Change the packs - the Hub is not rebuilt. Backpressure runs end to end; ABORT ends one tunnel, not the link.</text>
<text x="480" y="370" font-size="13" fill="#9aa0a6" text-anchor="middle">[ChaCha20] keeps the relay from reading, not from altering - add a MAC stage of your own for integrity.</text>
</g>
</svg>
