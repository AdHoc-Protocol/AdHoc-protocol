<text x="277" y="166" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#9aa0a6">Connects</tspan><tspan fill="#e8eaed"> - ViewerToHub</tspan></text>
<rect x="209.8" y="176" width="28" height="18" rx="4" fill="#3a2f4c" stroke="#a06fd0" stroke-width="1.3"/>
