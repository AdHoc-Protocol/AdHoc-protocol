<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392" role="img" aria-labelledby="title desc">
<title id="title">A virtual connection through a relay</title>
<desc id="desc">A Viewer in the browser, in TypeScript, and a Server in Java joined by a dashed arc, VirtuallyConnects&lt;Viewer, Server, Hub&gt;: they talk as if wired - packs, actors, state machines, RPC. Their bytes ride two physical connections, ViewerToHub and HubToServer, through the Hub, whose generated Relay holds no schema, no keys and one region of memory, the same for 64 bytes or 1 GB. Sealed chunks travel both legs; [Zstd(6), ChaCha20] runs at the Viewer, the inverse chain at the Server. Under the Hub: a frame is the wire id, the tunnel_id and chunks closed by 0; up to MaxTunnels, 256, tunnels on one link.</desc>
<rect width="960" height="392" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<text x="480" y="38" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="14" fill="#f2c14e" text-anchor="middle" font-weight="700" xml:space="preserve">VirtuallyConnects&lt;Viewer, Server, Hub&gt;</text>
<text x="480" y="62" font-size="14" fill="#e8eaed" text-anchor="middle">talk as if wired: packs, actors, state machines, RPC</text>
<path d="M109 150 V84 H851 V150" fill="none" stroke="#f2c14e" stroke-width="2" stroke-dasharray="7 5" stroke-linejoin="round"/>
<rect x="24" y="150" width="170" height="70" rx="8" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/>
<text x="109" y="183.4" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Viewer</text>
<text x="109" y="198.1" font-size="12" fill="#9aa0a6" text-anchor="middle">browser, TypeScript</text>
<rect x="766" y="150" width="170" height="70" rx="8" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/>
<text x="851" y="183.4" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Server</text>
<text x="851" y="198.1" font-size="12" fill="#9aa0a6" text-anchor="middle">Java</text>
<rect x="360" y="112" width="240" height="140" rx="8" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.5"/>
<text x="480" y="134" font-size="16" fill="#e8eaed" text-anchor="middle" font-weight="600">Hub</text>
<rect x="376" y="144" width="208" height="98" rx="6" fill="#46401f" stroke="#f2c14e" stroke-width="1.4"/>
<text x="480" y="165" font-size="14" fill="#f2c14e" text-anchor="middle" font-weight="700">Relay (generated)</text>
<text x="480" y="184" font-size="12" fill="#e8eaed" text-anchor="middle">no schema</text>
<text x="480" y="199" font-size="12" fill="#e8eaed" text-anchor="middle">no keys</text>
<text x="480" y="214" font-size="12" fill="#e8eaed" text-anchor="middle">one region in memory -</text>
<text x="480" y="229" font-size="12" fill="#e8eaed" text-anchor="middle">64 B or 1 GB alike</text>
