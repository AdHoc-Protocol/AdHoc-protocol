<g data-nocheck="1"><line x1="600" y1="185" x2="766" y2="185" stroke="#4fb3ff" stroke-width="2.4"/></g>
<text x="683" y="166" font-size="12" fill="#e8eaed" text-anchor="middle" xml:space="preserve"><tspan fill="#9aa0a6">Connects</tspan><tspan fill="#e8eaed"> - HubToServer</tspan></text>
<rect x="615.8" y="176" width="28" height="18" rx="4" fill="#3a2f4c" stroke="#a06fd0" stroke-width="1.3"/>
