<path d="M698.5 183.6 V181.5 A2.3 2.3 0 0 1 703 181.5 V183.6" stroke="#a06fd0" stroke-width="1.2349999999999999" fill="none"/><rect x="697" y="183.6" width="7.6" height="5.7" rx="1" fill="#a06fd0"/>
<rect x="722.3" y="176" width="28" height="18" rx="4" fill="#3a2f4c" stroke="#a06fd0" stroke-width="1.3"/>
<path d="M734 183.6 V181.5 A2.3 2.3 0 0 1 738.5 181.5 V183.6" stroke="#a06fd0" stroke-width="1.2349999999999999" fill="none"/><rect x="732.5" y="183.6" width="7.6" height="5.7" rx="1" fill="#a06fd0"/>
<text x="109" y="244" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#f2c14e" text-anchor="middle" xml:space="preserve">[Zstd(6), ChaCha20]</text>
<text x="109" y="262" font-size="12" fill="#9aa0a6" text-anchor="middle">先压缩后加密——只一次</text>
<text x="851" y="244" font-size="12" fill="#9aa0a6" text-anchor="middle">逆序的链</text>
<text x="851" y="262" font-size="12" fill="#9aa0a6" text-anchor="middle">先解密后解压</text>
<text x="480" y="274" font-size="12" fill="#a06fd0" text-anchor="middle">转发自己读不了的密封块</text>
<text x="480" y="292" font-family="Consolas,Microsoft YaHei,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" text-anchor="middle" xml:space="preserve">frame: [wire id][tunnel_id][len][data]…[0]</text>
<text x="480" y="310" font-size="12" fill="#9aa0a6" text-anchor="middle">一条链路上最多 MaxTunnels (256) 条隧道</text>
<text x="480" y="348" font-size="14" fill="#e8eaed" text-anchor="middle">改 pack 不用重建 Hub。背压端到端传导;ABORT 只结束一条隧道,而不是整条链路。</text>
<text x="480" y="370" font-size="13" fill="#9aa0a6" text-anchor="middle">[ChaCha20] 防止中继读取,但不防止篡改——自行加一个 MAC 阶段以保证完整性。</text>
</g>
</svg>
