<rect x="36" y="174" width="210" height="40" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="141" y="198.3" font-size="12" fill="#e8eaed" text-anchor="middle">actors: states, dispatch</text>
<rect x="123" y="208" width="36" height="10" rx="2" fill="#e8833a"/>
<rect x="258" y="174" width="210" height="40" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="363" y="198.3" font-size="12" fill="#e8eaed" text-anchor="middle">state guards, epochs, timeouts</text>
