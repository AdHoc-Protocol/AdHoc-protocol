<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
<title id="title">Who writes what</title>
<desc id="desc">One host program as a stacked block. A thin orange slice on top: your code around the generated code - creating transports, connecting, sending, your data structures. A large yellow block, the generated code: packs with serializers and parsers, the connection with transmitter and receiver, actors with states and dispatch, state guards, epochs and timeouts, sessions and guaranteed delivery, constants such as MIN, MAX and STR_LEN_MAX; small orange notches on three of them are the injection points, where your code says what a pack means, what a state starts and what a timeout does. A grey block at the bottom: the runtime library with TCP, WebSocket and UDP transports, buffers, collections, Zstd and ChaCha20. To the right, in orange outlines, what is written by hand without a generator: an encoder and a decoder per message and language, a dispatch switch per connection, a state machine on each side kept in step, reconnect, replay and acknowledgments, length and size checks, constants copied into every host - and a yellow arrow from that list into the generated block: all of this becomes declarations.</desc>
<rect width="960" height="420" rx="10" fill="#2b2b2b"/>
<g font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif">
<rect x="24" y="40" width="456" height="46" rx="6" fill="#2d2823" stroke="#e8833a" stroke-width="1.4"/>
<text x="36" y="58" font-size="13" fill="#e8833a" font-weight="700">your code around it</text>
<text x="36" y="76" font-size="12" fill="#e8eaed">creating transports · connecting · sending · your data structures</text>
