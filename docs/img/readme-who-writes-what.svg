<rect x="36" y="222" width="210" height="40" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="141" y="246.3" font-size="12" fill="#e8eaed" text-anchor="middle">sessions, guaranteed delivery</text>
<rect x="258" y="222" width="210" height="40" rx="6" fill="#3d3520" stroke="#f2c14e" stroke-width="1.4"/><text x="363" y="238.8" font-size="12" fill="#e8eaed" text-anchor="middle">constants</text><text x="363" y="253.8" font-size="12" fill="#e8eaed" text-anchor="middle">MIN, MAX, STR_LEN_MAX</text>
<rect x="36" y="280" width="24" height="8" rx="2" fill="#e8833a"/>
<text x="68" y="288" font-size="12" fill="#e8833a">injection point: your code inside generated files -</text>
<text x="68" y="304" font-size="12" fill="#e8833a">what a pack means, what a state starts, what a timeout does</text>
<rect x="24" y="324" width="456" height="58" rx="6" fill="#2a2a2a" stroke="#8c9198" stroke-width="1.4"/>
<text x="468" y="344" font-size="13" fill="#8c9198" text-anchor="end" font-weight="700">runtime library (lib)</text>
