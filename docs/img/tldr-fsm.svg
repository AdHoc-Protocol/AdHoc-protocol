<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" role="img"><rect width="940" height="430" fill="#2b2b2b"/><title>An actor declared in a few lines of C#: Start, where the client leads and sends Login; Working, where either side sends Data and the server leads with Done; End. The generator emits this state machine on both hosts</title><rect x="20" y="30" width="390" height="300" rx="5" fill="#232323" stroke="#4a4a4a" stroke-width="1.2"/><text x="36" y="52" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="start">the description</text><text x="36" y="82" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve" style="white-space:pre">interface Communication : Connects&lt;Client, Server&gt; {</text><text x="36" y="105" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve" style="white-space:pre">  interface Session : Actor {</text><text x="36" y="128" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" xml:space="preserve" style="white-space:pre">    [L____________&lt;Working, Login&gt;]</text><text x="36" y="151" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" xml:space="preserve" style="white-space:pre">    struct Start { }</text><text x="36" y="197" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" xml:space="preserve" style="white-space:pre">    [_____lr_____&lt;Data&gt;]</text><text x="36" y="220" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" xml:space="preserve" style="white-space:pre">    [____________R&lt;End, Done&gt;]</text><text x="36" y="243" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#e8eaed" xml:space="preserve" style="white-space:pre">    struct Working { }</text><text x="36" y="266" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve" style="white-space:pre">  }</text><text x="36" y="289" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#9aa0a6" xml:space="preserve" style="white-space:pre">}</text><text x="535" y="44" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">what both hosts get</text><rect x="470" y="60" width="130" height="52" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="535" y="85" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Start</text><text x="535" y="102" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">Client leads</text><line x1="535" y1="112" x2="535" y2="180" stroke="#4fb3ff" stroke-width="2"/><path d="M535 180 L530.8 173 L539.2 173 Z" fill="#4fb3ff"/><text x="547" y="150" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#4fb3ff" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Login, sent by Client</text><rect x="470" y="180" width="130" height="52" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="535" y="205" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Working</text><text x="535" y="222" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">Server leads</text><path d="M600 196 L650 196 L650 216 L607 216" fill="none" stroke="#4fb3ff" stroke-width="2"/><path d="M600 216 L607 211.8 L607 220.2 Z" fill="#4fb3ff"/><text x="660" y="204" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#4fb3ff" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Data, sent by either side</text><text x="660" y="220" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">the state stays</text><line x1="535" y1="232" x2="535" y2="300" stroke="#4fb3ff" stroke-width="2"/><path d="M535 300 L530.8 293 L539.2 293 Z" fill="#4fb3ff"/><text x="547" y="270" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#4fb3ff" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Done, sent by Server</text><rect x="470" y="300" width="130" height="40" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6" /><rect x="474" y="304" width="122" height="32" rx="4" fill="none" stroke="#6f9fd8" stroke-width="1" /><text x="535" y="325" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">End</text><text x="610" y="325" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">the instance pair is freed, the connection lives on</text><text x="470" y="380" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">The state decides which packs are valid to send and receive; only the side that leads a state moves it on;</text><text x="470" y="400" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">packs from an old epoch are dropped. [Deadline] and [Idle] end a stuck instance, [Resumable] keeps it across a lost socket.</text></svg>