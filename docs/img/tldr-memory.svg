<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400" role="img"><rect width="940" height="400" fill="#2b2b2b"/><title>Whole-message formats render a pack into a byte array as large as the pack before the first byte leaves; AdHoc pulls bytes field by field through one reusable socket buffer of 256 bytes to a few kilobytes, whatever the size of the pack</title><text x="30" y="44" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="700">Whole-message formats</text><text x="30" y="62" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="start">Protocol Buffers, FlatBuffers, Thrift, MessagePack</text><rect x="30" y="82" width="150" height="56" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="109" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">pack</text><text x="105" y="126" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">object in memory</text><line x1="180" y1="110" x2="220" y2="110" stroke="#9aa0a6" stroke-width="2"/><path d="M220 110 L213 105.8 L213 114.2 Z" fill="#9aa0a6"/><rect x="220" y="82" width="440" height="56" rx="4" fill="#4a2a2a" stroke="#e06c6c" stroke-width="1.6" /><text x="320" y="106" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="13" fill="#e8eaed" xml:space="preserve" style="white-space:pre">byte[] data = pack.toByteArray();</text><text x="440" y="126" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#e06c6c" text-anchor="middle">as large as the whole pack: a 1 GB pack needs a 1 GB array</text><line x1="660" y1="110" x2="700" y2="110" stroke="#9aa0a6" stroke-width="2"/><path d="M700 110 L693 105.8 L693 114.2 Z" fill="#9aa0a6"/><rect x="700" y="82" width="120" height="56" rx="4" fill="#243447" stroke="#e8833a" stroke-width="1.6"/><text x="760" y="115" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">socket</text><text x="760" y="160" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">only then the first byte leaves</text><text x="30" y="214" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="start" font-weight="700">AdHoc</text><text x="30" y="232" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#9aa0a6" text-anchor="start">pull-based: bytes are produced as the socket drains and consumed as it fills</text><rect x="30" y="252" width="150" height="56" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="279" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">pack</text><text x="105" y="296" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">or your own structures</text><line x1="180" y1="280" x2="380" y2="280" stroke="#4fb3ff" stroke-width="2"/><path d="M180 280 L187 275.8 L187 284.2 Z" fill="#4fb3ff"/><path d="M380 280 L373 275.8 L373 284.2 Z" fill="#4fb3ff"/><text x="280" y="270" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#4fb3ff" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">field by field</text><rect x="380" y="252" width="140" height="56" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="2" /><text x="450" y="276" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">socket buffer</text><text x="450" y="295" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#4fb3ff" text-anchor="middle">256 B - 8 KB, reused</text><line x1="520" y1="280" x2="700" y2="280" stroke="#4fb3ff" stroke-width="2"/><path d="M520 280 L527 275.8 L527 284.2 Z" fill="#4fb3ff"/><path d="M700 280 L693 275.8 L693 284.2 Z" fill="#4fb3ff"/><text x="610" y="270" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#4fb3ff" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">chunk after chunk</text><rect x="700" y="252" width="120" height="56" rx="4" fill="#243447" stroke="#e8833a" stroke-width="1.6"/><text x="760" y="285" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">socket</text><text x="470" y="352" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Resident memory is one socket buffer, in either direction: a 64-byte status and a 1 GB archive cost the same.</text><text x="470" y="374" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">This is what makes unbounded streams, blind relays and messages larger than RAM possible.</text></svg>