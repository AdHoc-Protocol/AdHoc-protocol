<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">One model for the whole conversation</title><desc id="desc">A C# protocol description defines data, participants, behaviour and transfer rules. AdHocAgent and the cloud generator produce code for C#, Java and TypeScript hosts. Your application supplies business logic.</desc>
