<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">一个模型，贯穿全部通信</title><desc id="desc">A C# protocol description defines data, participants, behaviour and transfer rules. AdHocAgent and the cloud generator produce the code of every host in its own language - here Java, C# and TypeScript. Your application supplies business logic.</desc>
