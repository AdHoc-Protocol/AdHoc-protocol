="11" fill="#9aa0a6" text-anchor="middle">Java</text><line x1="405" y1="230" x2="405" y2="300" stroke="#9aa0a6" stroke-width="1.6"/><path d="M405 300 L400.8 293 L409.2 293 Z" fill="#9aa0a6"/><rect x="320" y="300" width="170" height="56" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6"/><text x="405" y="327" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Observer</text><text x="405" y="344" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">live diagrams of it all</text><line x1="830" y1="260" x2="830" y2="300" stroke="#9aa0a6" stroke-width="1.6"/><path d="M830 300 L825.8 293 L834.2 293 Z" fill="#9aa0a6"/><rect x="740" y="300" width="180" height="56" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6"/><text x="830" y="327" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Smart merge</text><text x="830" y="344" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">your code in it survives</text><text x="470" y="396" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">One description of the whole system - code for every host, each in its own language.</text></svg>