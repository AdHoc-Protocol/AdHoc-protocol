<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 420" width="940" height="420" role="img"><rect width="940" height="420" fill="#2b2b2b"/><title>One C# description of the whole system goes through AdHocAgent to the cloud generator; code for every host comes back, each in its own language, and is merged into your projects; the Observer draws the description</title><rect x="20" y="30" width="260" height="320" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6" /><text x="40" y="60" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="15" fill="#f2c14e" text-anchor="start" font-weight="700">MyProtocol.cs</text><text x="40" y="79" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="start">plain C# - your IDE checks it</text><rect x="40" y="105" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="114" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">packs and fields</text><rect x="40" y="137" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="146" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">hosts and their languages</text><rect x="40" y="169" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="178" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">connections between hosts</text><rect x="40" y="201" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="210" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">actors, states, branches</text><rect x="40" y="233" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="242" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">sessions and guarantees</text><rect x="40" y="265" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="274" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">streams, compression, ciphers</text><rect x="40" y="297" width="8" height="8" rx="4" fill="#4fb3ff" stroke="#4fb3ff" stroke-width="0" /><text x="58" y="306" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">tunnels and shared ports</text><line x1="280" y1="190" x2="330" y2="190" stroke="#4fb3ff" stroke-width="2"/><path d="M330 190 L323 185.8 L323 194.2 Z" fill="#4fb3ff"/><rect x="330" y="150" width="150" height="80" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="405" y="189" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">AdHocAgent</text><text x="405" y="206" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">command line, CI</text><line x1="480" y1="190" x2="530" y2="190" stroke="#4fb3ff" stroke-width="2"/><path d="M480 190 L487 185.8 L487 194.2 Z" fill="#4fb3ff"/><path d="M530 190 L523 185.8 L523 194.2 Z" fill="#4fb3ff"/><text x="505" y="178" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">send</text><text x="505" y="210" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">code</text><rect x="530" y="150" width="150" height="80" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8" /><text x="605" 