<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" width="940" height="520" role="img"><rect width="940" height="520" fill="#2b2b2b"/><title>Seven layers of a distributed system described by one AdHoc file: packs and fields, hosts, conversations, sessions, streams, topology and delivery; a serialization format such as Protocol Buffers describes only the bottom layer</title><text x="170" y="38" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="16" fill="#e8eaed" text-anchor="start" font-weight="700">One description, seven layers of a system</text><rect x="170" y="60" width="690" height="48" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2" /><text x="186" y="90" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Delivery</text><text x="330" y="90" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">numbers tables, smart merge into your sources, Observer diagrams</text><rect x="170" y="116" width="690" height="48" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2" /><text x="186" y="146" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Topology</text><text x="330" y="146" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">tunnels through relays that cannot read them; many Connections, one port</text><rect x="170" y="172" width="690" height="48" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2" /><text x="186" y="202" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Streams</text><text x="330" y="202" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">payloads of any size; Zstd and ChaCha20 on a field, a pack or a whole link</text><rect x="170" y="228" width="690" height="48" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2" /><text x="186" y="258" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Sessions</text><text x="330" y="258" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">a session outlives its socket; chosen packs arrive once, in order; UDP</text><rect x="170" y="284" width="690" height="48" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2" /><text x="186" y="314" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Conversations</text><text x="330" y="314" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">actors and state machines: who may send what, and when; RPC; deadlines</text><rect x="170" y="340" width="690" height="48" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.2" /><text x="186" y="370" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Hosts</text><text x="330" y="370" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">each host in its own language; generated objects or your own, per pack</text><rect x="170" y="396" width="690" height="48" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="2.2" /><text x="186" y="426" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#f2c14e" text-anchor="start" font-weight="600">Packs and fields</text><text x="330" y="426" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="start">types, nullable primitives, bit-packing, varint by declared distribution</text><path d="M163 396 L155 396 L155 444 L163 444" fill="none" stroke="#4fb3ff" stroke-width="1.6"/><text x="145" y="410" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#4fb3ff" text-anchor="end" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">a serialization</text><text x="145" y="425" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#4fb3ff" text-anchor="end" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">format: protobuf,</text><text x="145" y="440" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#4fb3ff" text-anchor="end" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">FlatBuffers, Thrift</text><path d="M867 60 L878 60 L878 444 L867 444" fill="none" stroke="#f2c14e" stroke-width="1.8"/><text x="902" y="252" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#f2c14e" text-anchor="middle" transform="rotate(90 902 252)">one AdHoc description</text><text x="470" y="486" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">A serialization format describes the bottom layer (with gRPC, a slice of the conversations). AdHoc generates all seven.</text></svg>