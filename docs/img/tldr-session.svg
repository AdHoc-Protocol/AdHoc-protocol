<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="940" height="380" role="img"><rect width="940" height="380" fill="#2b2b2b"/><title>Timeline: the socket is lost, the session is parked with its actors and states for up to the declared minutes; a new socket logs in and reclaims the session, which continues in the same state; guaranteed packs lost in flight are replayed from the sender's journal, once and in order</title><text x="24" y="85" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">socket</text><text x="24" y="155" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">session</text><text x="24" y="227" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">guaranteed</text><text x="24" y="243" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="start">packs</text><rect x="140" y="68" width="280" height="24" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.6" /><text x="280" y="85" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">socket 1</text><line x1="424" y1="72" x2="440" y2="88" stroke="#e06c6c" stroke-width="2.4"/><line x1="440" y1="72" x2="424" y2="88" stroke="#e06c6c" stroke-width="2.4"/><text x="450" y="85" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e06c6c" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">lost</text><rect x="600" y="68" width="300" height="24" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.6" /><text x="750" y="85" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">socket 2 - a new one</text><rect x="140" y="138" width="280" height="24" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6" /><text x="280" y="155" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">actor in state Working</text><rect x="420" y="138" width="180" height="24" rx="4" fill="none" stroke="#6f9fd8" stroke-width="1.4" stroke-dasharray="5 4"/><text x="510" y="155" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">parked</text><text x="510" y="180" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">up to [Resumable(minutes)]</text><rect x="600" y="138" width="300" height="24" rx="4" fill="#26384d" stroke="#6f9fd8" stroke-width="1.6" /><text x="750" y="155" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">same actor, same state</text><line x1="600" y1="56" x2="600" y2="262" stroke="#a06fd0" stroke-width="1.6" stroke-dasharray="4 3"/><text x="606" y="50" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#a06fd0" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">login, then reclaim(session_id)</text><rect x="150" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.4" /><text x="167" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">1</text><rect x="195" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.4" /><text x="212" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">2</text><rect x="240" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.4" /><text x="257" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">3</text><rect x="285" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#e06c6c" stroke-width="1.4" stroke-dasharray="3 2"/><text x="302" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">4</text><rect x="330" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#e06c6c" stroke-width="1.4" stroke-dasharray="3 2"/><text x="347" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">5</text><text x="262" y="268" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">4 and 5 were in flight when the socket died</text><rect x="620" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#f2c14e" stroke-width="1.4" /><text x="637" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">4</text><rect x="665" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#f2c14e" stroke-width="1.4" /><text x="682" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">5</text><rect x="740" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.4" /><text x="757" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">6</text><rect x="785" y="222" width="34" height="22" rx="4" fill="#243447" stroke="#4fb3ff" stroke-width="1.4" /><text x="802" y="238" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11.5" fill="#e8eaed" text-anchor="middle">7</text><text x="659" y="268" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">replayed from the sender's journal</text><text x="470" y="320" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">TCP: guarantee the packs that must not be lost. UDP: every pack is guaranteed - exclude the ones that may be lost.</text><text x="470" y="342" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Your code sees each pack once, in order. Positions, journal and handshake live in the generated code and the runtime.</text></svg>