<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 630" width="980" height="630" role="img"><rect width="980" height="630" fill="#2b2b2b"/><title>A fleet platform from one AdHoc description: two firmware generations of a vehicle and a diagnostic tool share one multiplexed port of a gateway; the gateway keeps resumable sessions to a replicated backend; field sensors talk to it over UDP with guaranteed delivery; operators in a browser reach it through an end-to-end encrypted tunnel across a relay; an archive keeps events compressed and encrypted without the schema or the key</title><rect x="20" y="50" width="170" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="74" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Vehicle</text><text x="105" y="91" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">firmware 3.x - Java</text><rect x="20" y="115" width="170" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="139" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">VehicleLegacy</text><text x="105" y="156" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">firmware 2.x - Java</text><rect x="20" y="180" width="170" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="204" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Service</text><text x="105" y="221" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">diagnostic laptop - C#</text><rect x="20" y="300" width="170" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="324" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Sensor</text><text x="105" y="341" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">field device - C#</text><rect x="20" y="430" width="170" height="50" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="105" y="454" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Operator</text><text x="105" y="471" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">browser - TypeScript</text><rect x="300" y="40" width="190" height="210" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6" /><text x="395" y="64" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Gateway</text><text x="395" y="80" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">C#</text><line x1="190" y1="75" x2="260" y2="75" stroke="#4fb3ff" stroke-width="2"/><line x1="190" y1="140" x2="260" y2="140" stroke="#4fb3ff" stroke-width="2"/><line x1="190" y1="205" x2="260" y2="205" stroke="#4fb3ff" stroke-width="2"/><line x1="260" y1="75" x2="260" y2="205" stroke="#4fb3ff" stroke-width="2"/><line x1="260" y1="130" x2="290" y2="130" stroke="#4fb3ff" stroke-width="3"/><rect x="290" y="110" width="80" height="40" rx="4" fill="#243447" stroke="#e8833a" stroke-width="1.8"/><circle cx="305" cy="130" r="7" fill="none" stroke="#e8833a" stroke-width="1.4"/><path d="M303 126 L308 130 L303 134 Z" fill="#e8833a"/><text x="342" y="135" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">:443</text><line x1="370" y1="130" x2="384" y2="130" stroke="#4fb3ff" stroke-width="2"/><rect x="384" y="112" width="96" height="36" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8"/><text x="432" y="134" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#e8eaed" text-anchor="middle">Multiplex</text><text x="395" y="178" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">Telemetry, TelemetryLegacy,</text><text x="395" y="193" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">Diagnostics: 3 Connections,</text><text x="395" y="208" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">one port, two generations</text><rect x="620" y="60" width="180" height="140" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6" /><text x="710" y="86" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Fleet</text><text x="710" y="103" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">backend - Java</text><text x="710" y="138" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">an actor per vehicle:</text><text x="710" y="153" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">state machine, RPC,</text><text x="710" y="168" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">deadlines</text><rect x="620" y="270" width="180" height="140" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6" /><text x="710" y="296" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Fleet</text><text x="710" y="313" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">backend - Java</text><text x="710" y="348" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">an actor per vehicle:</text><text x="710" y="363" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">state machine, RPC,</text><text x="710" y="378" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">deadlines</text><line x1="680" y1="200" x2="680" y2="270" stroke="#4fb3ff" stroke-width="2"/><path d="M680 200 L675.8 207 L684.2 207 Z" fill="#4fb3ff"/><path d="M680 270 L675.8 263 L684.2 263 Z" fill="#4fb3ff"/><text x="690" y="232" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#f2c14e" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Connects&lt;Fleet, Fleet&gt;</text><text x="690" y="248" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="start" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">replication</text><line x1="490" y1="130" x2="620" y2="130" stroke="#4fb3ff" stroke-width="2.4"/><path d="M490 130 L497 125.8 L497 134.2 Z" fill="#4fb3ff"/><path d="M620 130 L613 125.8 L613 134.2 Z" fill="#4fb3ff"/><text x="555" y="118" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">[Resumable(60)]</text><text x="555" y="150" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">sessions outlive</text><text x="555" y="164" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">sockets; commands</text><text x="555" y="178" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">once, in order</text><line x1="190" y1="325" x2="620" y2="325" stroke="#4fb3ff" stroke-width="2.4"/><path d="M190 325 L197 320.8 L197 329.2 Z" fill="#4fb3ff"/><path d="M620 325 L613 320.8 L613 329.2 Z" fill="#4fb3ff"/><text x="405" y="315" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">[UDP&lt;Samples&gt;(10)]</text><text x="405" y="343" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">over UDP: every pack guaranteed but the samples</text><rect x="300" y="400" width="190" height="100" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6" /><text x="330" y="420" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="start">Edge</text><text x="470" y="420" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="end">C#</text><rect x="318" y="432" width="154" height="52" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8" /><text x="395" y="454" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12.5" fill="#e8eaed" text-anchor="middle">Relay</text><text x="395" y="471" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">sealed bytes only</text><line x1="190" y1="455" x2="300" y2="455" stroke="#4fb3ff" stroke-width="2.4"/><path d="M490 458 L740 458 L740 410" fill="none" stroke="#4fb3ff" stroke-width="2.4"/><rect x="212" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="252" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="512" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="552" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="592" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="632" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="672" y="451" width="24" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><path d="M105 480 L105 540 L770 540 L770 410" fill="none" stroke="#f2c14e" stroke-width="1.8"/><text x="150" y="562" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" xml:space="preserve" style="white-space:pre">VirtuallyConnects&lt;Operator, Fleet, Edge&gt;, [Zstd, ChaCha20] end to end</text><rect x="850" y="95" width="120" height="60" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="910" y="124" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Archive</text><text x="910" y="141" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">Java</text><line x1="800" y1="125" x2="850" y2="125" stroke="#4fb3ff" stroke-width="2.4"/><path d="M850 125 L843 120.8 L843 129.2 Z" fill="#4fb3ff"/><text x="910" y="180" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#f2c14e" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">trimmed chain:</text><text x="910" y="195" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">keeps events</text><text x="910" y="210" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">compressed and</text><text x="910" y="225" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">encrypted - no</text><text x="910" y="240" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">schema, no key</text><text x="490" y="598" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">One C# file: 9 host types, 3 languages, 10 Connections. Every line here is generated code.</text><text x="490" y="619" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Framing, state machines, reconnects, replay, port sharing, relaying and encryption - none of it written by hand.</text></svg>