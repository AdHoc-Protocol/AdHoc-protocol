<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" width="940" height="370" role="img"><rect width="940" height="370" fill="#2b2b2b"/><title>Observer and Server share one virtual connection through Monitoring; the bytes are compressed and encrypted at one end and restored at the other, and the Relay on Monitoring forwards sealed chunks without a schema, without keys, at constant memory</title><text x="470" y="40" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Observer and Server talk as if wired together - packs, actors, RPC</text><text x="290" y="72" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12.5" fill="#f2c14e" xml:space="preserve" style="white-space:pre">VirtuallyConnects&lt;Observer, Server, Monitoring&gt;</text><path d="M115 146 L115 92 L825 92 L825 146" fill="none" stroke="#f2c14e" stroke-width="1.8"/><rect x="30" y="150" width="170" height="70" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="115" y="184" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Observer</text><text x="115" y="201" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">browser, TypeScript</text><rect x="740" y="150" width="170" height="70" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6"/><text x="825" y="184" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Server</text><text x="825" y="201" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle">Java</text><rect x="385" y="126" width="170" height="118" rx="4" fill="#3a5a80" stroke="#6f9fd8" stroke-width="1.6" /><text x="470" y="148" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="14" fill="#e8eaed" text-anchor="middle">Monitoring</text><rect x="400" y="160" width="140" height="70" rx="4" fill="#4a3d1c" stroke="#f2c14e" stroke-width="1.8" /><text x="470" y="184" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13" fill="#e8eaed" text-anchor="middle">Relay</text><text x="470" y="201" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">no schema, no keys</text><text x="470" y="216" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="10.5" fill="#9aa0a6" text-anchor="middle">constant memory</text><line x1="200" y1="185" x2="385" y2="185" stroke="#4fb3ff" stroke-width="3"/><text x="292" y="172" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Connects</text><rect x="222" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="262" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="302" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="342" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><line x1="555" y1="185" x2="740" y2="185" stroke="#4fb3ff" stroke-width="3"/><text x="648" y="172" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Connects</text><rect x="577" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="617" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="657" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><rect x="697" y="178" width="26" height="14" rx="4" fill="#3f2d52" stroke="#a06fd0" stroke-width="1.2" /><text x="48" y="248" font-family="Consolas,DejaVu Sans Mono,Menlo,monospace" font-size="12" fill="#f2c14e" xml:space="preserve" style="white-space:pre">[Zstd, ChaCha20]</text><text x="115" y="266" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">compress, then encrypt</text><text x="825" y="252" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">the inverse chain</text><text x="470" y="266" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="11" fill="#a06fd0" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">forwards sealed chunks it cannot read</text><text x="470" y="314" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="13.5" fill="#e8eaed" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">Per-hop encryption protects the links; a tunnel chain protects the conversation.</text><text x="470" y="336" font-family="Segoe UI,DejaVu Sans,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa0a6" text-anchor="middle" paint-order="stroke" stroke="#2b2b2b" stroke-width="3.5" stroke-linejoin="round">The relay does not depend on the payload's schema: change the packs, the middle tier stays as it is. Backpressure runs end to end.</text></svg>